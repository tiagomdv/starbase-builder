<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Starbase Builder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="geo-land.js"></script>
  <script src="design-docs/countries.js"></script>
  <style>
    :root {
      --bg: #050505; --panel: #0a0a0a; --border: #2a2a2a;
      --text: #f2f2f2; --muted: #9a9a9a; --accent: #e10600;
      --good: #3dd68c; --bad: #e10600;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; touch-action: none; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      background: var(--bg); color: var(--text);
    }
    .resource-bar {
      background: #050505;
      border-bottom: 1px solid #222;
      color: #f2f2f2;
      font-family: ui-monospace, Menlo, monospace;
    }
    #sky-label { font-size: 22px; line-height: 1; font-weight: 650; }
    #wind-label { font-size: 15px; color: #c8c8c8; margin-top: 4px; }
    .stat-k { font-size: 12px; color: #9a9a9a; }
    .day-stat { display: flex; flex-direction: column; align-items: flex-start; }
    .day-row { display: flex; align-items: center; gap: 8px; }
    #day-run { white-space: nowrap; }
    #day-pause {
      min-width: 6.5rem; text-align: center; flex: none; cursor: pointer;
      background: #000; border: 1px solid #333; color: #f2f2f2;
      font: inherit; font-size: 12px; line-height: 1.25; padding: 4px 8px;
    }
    #day-pause:hover, #day-pause:focus { background: #161616; border-color: #666; outline: none; }
    .stat-n { font-size: 32px; line-height: 0.9; font-weight: 650; }
    .resource-bar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: end;
    }
    .bar-left { display: flex; align-items: flex-end; gap: 14px; }
    .bar-mid { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .bar-stats { display: flex; align-items: flex-end; gap: 22px; }
    #ver-label { font-size: 11px; line-height: 1; color: #9a9a9a; }
    .range-lamp {
      width: 14px; height: 14px; border-radius: 50%; flex: none; margin-bottom: 6px;
      background: var(--good); box-shadow: 0 0 8px var(--good); display: inline-block;
    }
    .range-lamp.closed { background: var(--bad); box-shadow: 0 0 8px var(--bad); }
    .ui-panel { background: var(--panel); border: 1px solid var(--border); }
    .ui-panel.hold { box-shadow: inset 3px 0 0 var(--bad); }
    .ui-btn {
      background: #000; border: 1px solid #333; color: #f2f2f2;
      transition: background 0.12s, border-color 0.12s, opacity 0.12s;
    }
    .ui-btn:hover:not(:disabled) { background: #161616; border-color: #666; }
    .ui-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .ui-btn.active { background: #140404; border-color: var(--accent); }
    [class*="text-amber"] { color: #f2f2f2 !important; }
    .ui-btn.good { background: #1a2e14; border-color: #3d6e34; color: var(--good); }
    .ui-btn.danger { background: #2a1414; border-color: #8a4040; color: #e8a0a0; }
    .plot-owned { font-size: 11px; color: #c8c8c8; margin-bottom: 8px; }
    .plot-owned b { display: block; color: #f2f2f2; font-size: 13px; font-weight: 650; }
    .plot-card {
      display: block; width: 100%; text-align: left; cursor: pointer;
      background: #0e0e0e; border: 1px solid #f2f2f2; color: #f2f2f2;
      padding: 10px 10px 12px; margin-bottom: 8px;
    }
    .plot-card:hover { background: #161616; }
    .plot-card .name { font-size: 15px; font-weight: 650; }
    .plot-card .price { font-size: 28px; line-height: 1; font-weight: 650; margin-top: 6px; }
    .plot-card .unit { font-size: 11px; color: #9a9a9a; letter-spacing: 0.08em; text-transform: uppercase; }
    .plot-card .line { font-size: 12px; color: #c8c8c8; margin-top: 8px; }
    .bldg .title { font-size: 16px; font-weight: 650; color: #f2f2f2; }
    .bldg .blurb { font-size: 12px; color: #c8c8c8; margin-top: 4px; }
    .bldg .stat { margin-top: 12px; }
    .bldg .stat .k { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #9a9a9a; }
    .bldg .stat .n { font-size: 32px; line-height: 0.95; font-weight: 650; color: #f2f2f2; }
    .bldg .stat .s { font-size: 12px; color: #c8c8c8; margin-top: 4px; }
    .bldg .wait { font-size: 12px; color: #c8c8c8; margin-top: 8px; }
    .bay-slot {
      display: block; width: 100%; text-align: left; margin-top: 8px; cursor: pointer;
      background: #0e0e0e; border: 1px solid #333; color: #f2f2f2; padding: 8px 10px 10px;
    }
    .bay-slot.sel { border-color: #f2f2f2; }
    .bay-slot.empty { cursor: default; }
    .bay-slot.empty .n { color: #444; }
    .bay-slot .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .bay-slot .name { font-size: 14px; font-weight: 650; }
    .bay-slot .where { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: #9a9a9a; }
    .bay-slot .n { font-size: 26px; line-height: 1; font-weight: 650; margin-top: 6px; }
    .bay-slot .meter { height: 3px; background: #2a2a2a; margin-top: 8px; }
    .bay-slot .meter i { display: block; height: 100%; background: #f2f2f2; }
    .act {
      display: block; width: 100%; text-align: left; cursor: pointer; margin-top: 10px;
      background: #0e0e0e; border: 1px solid #f2f2f2; color: #f2f2f2; padding: 10px;
    }
    .act:hover:not(:disabled) { background: #161616; }
    .act:disabled { opacity: 0.4; cursor: not-allowed; }
    .act.quiet { border-color: #444; }
    .act.stop { border-color: #444; border-left: 3px solid #e10600; }
    .act.build { border-color: #6a8ab0; background: #101418; }
    .act.up { border-color: #c4a15a; background: #16140e; }
    .act.fire { border-color: #e07030; background: #160e0a; }
    .act.roll { border-color: #6a9a8a; background: #0e1412; }
    .sec { margin-top: 16px; }
    .sec .k { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #9a9a9a; }
    .facts { display: flex; gap: 16px; margin-top: 8px; }
    .facts b { display: block; font-size: 22px; line-height: 1; font-weight: 650; color: #f2f2f2; }
    .facts span { font-size: 11px; color: #9a9a9a; }
    .act .name { font-size: 14px; font-weight: 650; }
    .act .price { font-size: 26px; line-height: 1; font-weight: 650; margin-top: 6px; }
    .act .unit { font-size: 11px; color: #9a9a9a; letter-spacing: 0.08em; text-transform: uppercase; }
    .act .line { font-size: 12px; color: #c8c8c8; margin-top: 8px; }
    #rocket-sheet {
      position: fixed; inset: 0; z-index: 40; display: none;
      background: rgba(0, 0, 0, 0.72); align-items: center; justify-content: center; padding: 16px;
    }
    #rocket-sheet.open { display: flex; }
    .rocket-panel { width: min(640px, 100%); background: #0a0a0a; border: 1px solid #333; color: #f2f2f2; padding: 16px; }
    .rocket-panel .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
    .rocket-panel .top b { font-size: 18px; }
    .rocket-panel .place { font-size: 12px; color: #9a9a9a; margin-top: 4px; }
    .rocket-sheet { display: grid; grid-template-columns: 1fr 72px 1fr; gap: 12px; align-items: center; margin-top: 14px; }
    .rocket-sheet .side { font-size: 12px; color: #c8c8c8; }
    .rocket-sheet .side b { display: block; color: #f2f2f2; font-size: 22px; line-height: 1.1; font-weight: 650; margin-bottom: 10px; }
    .rocket-body {
      height: 220px; width: 36px; margin: 0 auto;
      background: linear-gradient(#f2f2f2, #c8c8c8 70%, #8a3e24);
      clip-path: polygon(50% 0, 100% 18%, 100% 100%, 0 100%, 0 18%);
    }
    #map-wrap { position: relative; min-width: 0; min-height: 0; background: #07141c; }
    #map { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
    #map-chips, #map-zoom { position: absolute; z-index: 2; display: flex; gap: 6px; }
    #map-corner { position: absolute; left: 10px; top: 10px; z-index: 2; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
    #map-chips { position: static; }
    #job-note { pointer-events: none; display: flex; flex-direction: column; gap: 4px; }
    #job-note:empty { display: none; }
    #job-note span { font-size: 12px; color: #f2f2f2; background: rgba(0,0,0,0.55); padding: 4px 8px; }
    #next-goal, #fleet-open, #wiki-open {
      background: #0e0e0e; border: 1px solid #8a8a8a; color: #e6e6e6; cursor: pointer;
      font-size: 15px; font-weight: 650; letter-spacing: 0.22em; text-transform: uppercase;
    }
    #next-goal, #fleet-open {
      display: block; width: calc(100% - 16px); margin: auto 8px 8px; padding: 12px 14px; text-align: center;
    }
    #wiki-open { align-self: center; margin: 8px; padding: 8px 14px; }
    #next-goal:hover, #next-goal:focus,
    #fleet-open:hover, #fleet-open:focus,
    #wiki-open:hover, #wiki-open:focus {
      color: #f2f2f2; background: #161616; border-color: #f2f2f2; outline: none;
    }
    #wiki-sheet {
      position: fixed; inset: 0; z-index: 40; display: none;
      background: rgba(0, 0, 0, 0.72); align-items: center; justify-content: center; padding: 16px;
    }
    #wiki-sheet.open { display: flex; }
    .wiki-panel {
      width: min(920px, 100%); height: min(640px, calc(100vh - 32px)); max-height: calc(100vh - 32px);
      overflow: hidden; display: flex; flex-direction: column;
      background: #0a0a0a; color: #f2f2f2; padding: 16px 18px 12px;
    }
    .wiki-panel .top { display: flex; justify-content: space-between; align-items: center; }
    .wiki-panel .left { font-size: 22px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 650; }
    #wiki-close { background: transparent; border: 0; color: #9a9a9a; cursor: pointer; letter-spacing: 0.16em; text-transform: uppercase; font-size: 11px; }
    .wiki-split { display: flex; min-height: 0; flex: 1; margin-top: 12px; border-top: 1px solid #2a2a2a; }
    .wiki-nav { width: 210px; flex: 0 0 210px; overflow-y: auto; border-right: 1px solid #2a2a2a; padding: 6px 0; }
    .wiki-topic {
      display: block; width: 100%; text-align: left; background: transparent; color: #f2f2f2;
      cursor: pointer; border: 0; border-left: 2px solid transparent; padding: 8px 12px; font-size: 14px;
    }
    .wiki-topic.on, .wiki-topic:hover { border-left-color: #e10600; background: #161616; }
    .wiki-group {
      padding: 12px 12px 2px; font-size: 11px; letter-spacing: 0.14em;
      text-transform: uppercase; color: #9a9a9a;
    }
    .wiki-read { flex: 1; overflow-y: auto; padding: 4px 4px 12px 18px; }
    .wiki-read h2 { font-size: 22px; font-weight: 650; margin: 8px 0 12px; }
    .wiki-read p { font-size: 15px; line-height: 1.45; color: #d8d8d8; margin: 0 0 10px; }
    .wiki-read a, .wiki-link {
      background: none; border: 0; padding: 0; color: #f2f2f2; text-decoration: underline;
      cursor: pointer; font: inherit;
    }
    .wiki-facts {
      display: flex; flex-wrap: wrap; gap: 12px 18px; margin: 4px 0 14px; padding: 10px 12px;
      background: #141414; border: 1px solid #2a2a2a;
    }
    .wiki-facts div { flex: 1 1 120px; }
    .wiki-facts b { display: block; font-size: 18px; font-weight: 650; color: #f2f2f2; }
    .wiki-facts span { display: block; font-size: 12px; color: #9a9a9a; margin-top: 2px; }
    .wiki-real { margin-top: 8px; padding: 10px 12px; border-left: 3px solid #e10600; background: #120a0a; }
    .wiki-real h3 { font-size: 13px; font-weight: 650; color: #f2f2f2; margin: 0 0 6px; }
    @media (max-width: 700px) {
      .wiki-split { flex-direction: column; }
      .wiki-nav { width: auto; flex: 0 0 auto; max-height: 140px; border-right: 0; border-bottom: 1px solid #2a2a2a; }
    }
    #fleet-sheet {
      position: fixed; inset: 0; z-index: 40; display: none;
      background: rgba(0, 0, 0, 0.72); align-items: center; justify-content: center; padding: 16px;
    }
    #fleet-sheet.open { display: flex; }
    .fleet-panel { width: min(440px, 100%); max-height: min(70vh, 560px); overflow-y: auto; background: #0a0a0a; color: #f2f2f2; padding: 28px 28px 22px; }
    .fleet-panel .top { display: flex; justify-content: space-between; align-items: flex-start; }
    .fleet-panel .left { font-size: 42px; line-height: 0.9; font-weight: 650; }
    .fleet-panel .left span { display: block; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #9a9a9a; font-weight: 500; margin-top: 6px; }
    #fleet-close { background: transparent; border: 0; color: #9a9a9a; cursor: pointer; letter-spacing: 0.16em; text-transform: uppercase; font-size: 11px; }
    #fleet-close:hover { color: #f2f2f2; }
    .fleet-row { display: block; width: 100%; text-align: left; background: transparent; border: 1px solid rgba(242, 242, 242, 0.55); color: #f2f2f2; cursor: pointer; margin-top: 10px; padding: 10px 12px; }
    .fleet-row .name { font-size: 18px; font-weight: 650; }
    .fleet-row .meta { font-size: 12px; color: #9a9a9a; margin-top: 2px; }
    .fleet-row.sel { border-color: #f2f2f2; }
    .fleet-row.sel .name { color: #f2f2f2; }
    .fleet-empty { margin-top: 18px; font-size: 14px; color: #c8c8c8; }
    #goal-sheet {
      position: fixed; inset: 0; z-index: 40; display: none;
      background: rgba(0, 0, 0, 0.72); align-items: center; justify-content: center; padding: 16px;
    }
    #goal-sheet.open { display: flex; }
    .goal-panel { width: min(440px, 100%); background: #0a0a0a; border: 0; color: #f2f2f2; padding: 28px 28px 22px; }
    .goal-panel .top { display: flex; justify-content: space-between; align-items: flex-start; }
    .goal-panel .left { font-size: 42px; line-height: 0.9; font-weight: 650; }
    .goal-panel .left span { display: block; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #9a9a9a; font-weight: 500; margin-top: 6px; }
    #goal-close { background: transparent; border: 0; color: #9a9a9a; cursor: pointer; letter-spacing: 0.16em; text-transform: uppercase; font-size: 11px; }
    #goal-close:hover { color: #f2f2f2; }
    .goal-row { display: flex; gap: 14px; align-items: baseline; margin-top: 10px; padding: 10px 12px; border: 1px solid rgba(242, 242, 242, 0.55); }
    .goal-row .idx { font-size: 12px; color: #9a9a9a; width: 22px; }
    .goal-row .name { font-size: 14px; color: #c8c8c8; }
    .goal-row .line { font-size: 11px; color: #9a9a9a; letter-spacing: 0.08em; text-transform: uppercase; margin-top: 2px; }
    .goal-row.now { border-color: #f2f2f2; }
    .goal-row.now .name { font-size: 22px; font-weight: 650; color: #f2f2f2; }
    .goal-row.done { opacity: 0.4; }
    .goal-row.done .name { text-decoration: line-through; }
    #map-zoom { right: 10px; top: 10px; }
    #map-scale {
      position: absolute; left: 12px; bottom: 72px; z-index: 2; display: none;
      align-items: flex-end; gap: 8px; pointer-events: none;
      font: 12px ui-monospace, monospace; color: #f4ead8;
    }
    #map-scale .bar {
      height: 8px;
      border-left: 2px solid #f4ead8;
      border-right: 2px solid #f4ead8;
      border-bottom: 2px solid #f4ead8;
    }
    #map.placing { cursor: crosshair; }
    #map.panning { cursor: grabbing; }
    #log { font-family: ui-monospace, Menlo, monospace; font-size: 11px; line-height: 1.35; }
    #log .good { color: var(--good); }
    #log .warn { color: var(--accent); }
    #log .bad { color: var(--bad); }
    #log .info { color: var(--muted); }
    #log .log-roll { background: transparent; border: 1px solid currentColor; color: #f2f2f2; font: inherit; padding: 0 6px; margin-left: 6px; cursor: pointer; }
    .swatch {
      width: 0.85rem; height: 0.85rem; border-radius: 2px;
      border: 1px solid rgba(0,0,0,0.35); display: inline-block;
    }
    .obj-done { color: var(--good); text-decoration: line-through; opacity: 0.85; }
    .bar-track {
      height: 6px; background: #1a1510; border-radius: 3px; overflow: hidden; margin-top: 4px;
    }
    .bar-track > i { display: block; height: 100%; background: linear-gradient(90deg, #6a8a40, #a8c86a); }
    .bar-track.bad > i { background: linear-gradient(90deg, #8a4040, #d07060); }
    #event-stage {
      position: fixed; inset: 0; z-index: 80; display: none; flex-direction: column;
      background: rgba(8, 10, 12, 0.9); backdrop-filter: blur(4px);
    }
    #event-stage.open { display: flex; }
    #event-stage .event-head {
      flex-shrink: 0; display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;
      padding: 0.65rem 1rem; border-bottom: 1px solid var(--border);
      background: #050505;
    }
    #event-stage .event-head h2 {
      margin: 0; font-size: 0.95rem; letter-spacing: 0.08em;
      text-transform: uppercase; color: #f5edd8;
    }
    #event-stage .event-phase {
      font-family: ui-monospace, Menlo, monospace; font-size: 0.8rem; color: var(--accent);
    }
    #event-stage .event-phase.fail { color: var(--bad); }
    #event-stage .event-body {
      flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 0.5rem;
    }
    #event-canvas {
      width: min(920px, 96vw); height: min(520px, 70vh); max-width: 100%;
      border: 1px solid var(--border); border-radius: 8px; background: #0a0e14;
      box-shadow: 0 12px 48px rgba(0,0,0,0.55);
    }
    #event-stage .event-foot {
      flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; gap: 0.75rem;
      padding: 0.55rem 1rem 0.75rem; border-top: 1px solid var(--border);
      background: #050505; font-size: 0.78rem; color: var(--muted);
    }
  </style>
</head>
<body class="flex flex-col h-full">

  <header class="resource-bar px-3 py-3 shrink-0 z-20">
    <div class="bar-left">
      <span id="range-lamp" class="range-lamp" title="Green when the sky is inside the pad limit."></span>
      <div>
        <div id="sky-label">Range open</div>
        <div id="wind-label">clear 8 kn</div>
      </div>
    </div>
    <div class="bar-mid">
      <div class="bar-stats">
        <div><div class="stat-k">Steel</div><div id="res-steel" class="stat-n tabular-nums">150</div></div>
        <div><div class="stat-k">Propellant</div><div id="res-prop" class="stat-n tabular-nums">40</div></div>
        <div><div class="stat-k">Fleet</div><div id="res-fleet" class="stat-n tabular-nums">0</div></div>
        <div class="day-stat"><div class="stat-k" id="day-run">Day</div><div class="day-row"><div id="day-label" class="stat-n tabular-nums">1</div><button type="button" id="day-pause">Pause</button></div></div>
      </div>
      <div id="ver-label">0.6.0-motion</div>
    </div>
  </header>

  <div class="flex flex-1 min-h-0">
    <aside class="w-44 ui-panel flex flex-col shrink-0 border-y-0 border-l-0">
      <div class="p-2.5 border-b border-amber-900/40">
        <div class="text-[10px] uppercase tracking-wider text-amber-600 mb-2">Land</div>
        <div class="grid grid-cols-1 gap-1.5" id="build-palette"></div>
      </div>
      <button type="button" id="next-goal">Goals</button>
    </aside>

    <div id="map-wrap" class="flex-1">
      <canvas id="map"></canvas>
      <div id="map-corner">
        <div id="map-chips">
          <button type="button" class="ui-btn rounded px-2 py-1 text-xs" data-band="World" data-mpp="18000">World</button>
          <button type="button" class="ui-btn rounded px-2 py-1 text-xs" data-band="Region" data-mpp="1600">Region</button>
          <button type="button" class="ui-btn rounded px-2 py-1 text-xs" data-band="Site" data-mpp="100">Site</button>
          <button type="button" class="ui-btn rounded px-2 py-1 text-xs" data-band="Work" data-mpp="1.25">Work</button>
        </div>
        <div id="job-note"></div>
      </div>
      <div id="map-zoom">
        <button type="button" class="ui-btn rounded px-2 py-1 text-xs" id="zoom-in">Zoom in</button>
        <button type="button" class="ui-btn rounded px-2 py-1 text-xs" id="zoom-out">Zoom out</button>
      </div>
      <div id="map-scale"><span class="bar" id="map-scale-bar"></span><span id="map-scale-label"></span></div>
    </div>

    <aside id="readout" class="w-64 ui-panel flex flex-col shrink-0 border-y-0 border-r-0 min-h-0">
      <div class="p-2.5 flex-1 overflow-y-auto min-h-0">
        <div class="text-[10px] uppercase tracking-wider text-amber-600 mb-1">Inspector</div>
        <div id="inspector" class="text-xs text-amber-100/85 space-y-2"></div>
      </div>
      <button type="button" id="fleet-open">Fleet</button>
    </aside>
  </div>

(() => {

  const TUNING = {

  // Real Falcon 1 figures for the wiki notes. Article numbers read TUNING and ROCKET_DEFS.
  const REAL_REFS = {

    unpublished: { n: null, text: "Not printed in the 2008 user's guide.", source: "guide" },

  /**
   * SpaceX-ish roadmap. Static fire can fail (RUD / engine anomaly).
   * Post-fire vehicles need hangar/bay inspection & refurb — not left “hot” on the pad.
   */
  const ROCKET_DEFS = {
    falcon1: {
      id: "falcon1",
      name: "Falcon 1",
      short: "F1",
      era: "2006–2009",
      steelCost: 28,
      buildDays: 8,

      sfStyle: "merlin_single",
      mapScale: 0.82,
      color: "#c8d0d8",
      /** Base P(success) on a green pad with fresh vehicle */
      sfSuccess: 0.72,
      refurbDaysOk: 2,
      refurbDaysFail: 4,
      scrapOnFailChance: 0.35,
      blurb: "One Merlin. The fire follows thrust, the pad, the tanks, and the sky.",
      sfPhases: { approach: 1.0, chill: 1.0, ignition: 0.85, burn: 1.9, shutdown: 0.75, debrief: 1.0 },

    },
    falcon9: {
      id: "falcon9",
      name: "Falcon 9",
      short: "F9",
      era: "2010+",
      steelCost: 52,
      buildDays: 1,
      sfProp: 16,
      engines: 9,
      sfStyle: "merlin_nine",
      mapScale: 1.12,
      color: "#e8eef4",
      sfSuccess: 0.82,
      refurbDaysOk: 1,
      refurbDaysFail: 1,
      scrapOnFailChance: 0.22,
      blurb: "Nine-engine first stage. Heavier fire, higher base reliability.",
      sfPhases: { approach: 1.15, chill: 1.4, ignition: 1.2, burn: 3.2, shutdown: 1.0, debrief: 1.2 },
      unlocked: false,
    },
    falcon_heavy: { id: "falcon_heavy", name: "Falcon Heavy", short: "FH", unlocked: false, blurb: "Later." },
    starship: { id: "starship", name: "Starship", short: "SS", unlocked: false, blurb: "Later." },
  };

  const BUILDING_DEFS = {
    starfactory: {
      id: "starfactory",
      name: "Starfactory",
      short: "Factory",
      cost: 40,
      footprint: { w: 4, h: 3 },
      maxCount: 1,
      zoneHint: "production",
      blurb: "Builds one vehicle from steel. It stays here until you roll it to Mega Bay.",
    },
    mega_bay: {
      id: "mega_bay",
      name: "Mega Bay",
      short: "Bay",
      cost: 50,
      footprint: { w: 4, h: 3 },
      maxCount: 1,
      zoneHint: "production",
      blurb: "Houses the fleet. A vehicle comes back here after a fire.",
    },
    pad_orbital: {
      id: "pad_orbital",
      name: "Orbital Pad",
      short: "Pad",
      cost: 40,
      footprint: { w: 3, h: 3 },
      maxCount: 1,
      zoneHint: "launch",
      maxLevel: 2,
      upgradeVisual: { 2: "Widen flame trench and raise the mount" },
      blurb: "Holds one vehicle for a static fire.",
    },
  };

  const BUILD_ORDER = ["starfactory", "mega_bay", "pad_orbital"];

  // ── State ──
  // vehicle: { id, name, rocketId, buildingId|null, status, condition, refurbLeft, wx, wy, baySlot }
  // status: at_factory | in_bay | rolling | on_pad | refurb | destroyed
  const G = {
    day: 1, dayAcc: 0, paused: false,
    merlinTier: 1,
    steel: TEST ? 2000 : TUNING.START_STEEL,
    prop: TUNING.START_PROP,
    buildings: [],
    fleet: [],
    factoryJob: null,
    // kind roll | raise | lower. A roll clears buildingId. A raise or a lower keeps the pad.
    rollout: null,
    event: null,
    nextId: 1,
    selectedId: null,
    selectedVehicleId: null,
    rocketSheet: null,
    goalSheet: false,
    fleetSheet: false,
    wikiSheet: false,
    wikiPage: "launch",
    placeType: null,
    cam: { x: 80, y: 40, zoom: 1 },
    lon: -97.178, lat: 26.002, span: 0.12,
    plots: { starfactory: false, mega_bay: false, pad_orbital: false },
    drag: null,
    log: [],
    objectives: {
      place_all: false,
      build_rocket: false,
      multi_bay: false,
      static_fire: false,
      refurb: false,
      pad_l2: false,
    },
  };

  const canvas = document.getElementById("map");
  const ctx = canvas.getContext("2d");
  const el = {
    steel: document.getElementById("res-steel"),
    prop: document.getElementById("res-prop"),
    fleet: document.getElementById("res-fleet"),
    day: document.getElementById("day-label"),
    log: document.getElementById("log"),
    inspector: document.getElementById("inspector"),
    objectives: document.getElementById("next-goal"),
    palette: document.getElementById("build-palette"),
    fleetList: null,
  };

  function log(msg, kind = "info", opts = {}) {
    G.log.unshift({ msg, kind, roll: opts.roll || null });
    if (G.log.length > 45) G.log.pop();
    el.log.innerHTML = G.log.slice(0, 12).map((e) => {
      const v = e.roll ? vehicleById(e.roll) : null;
      // The button shows only while that rocket still waits in the factory, so an old line cannot roll it twice.
      const btn = v && v.status === "at_factory"
        ? ` <button type="button" class="log-roll" data-roll="${v.id}">Roll ${esc(v.name)} to Mega Bay</button>` : "";
      return `<div class="${e.kind}">${esc(e.msg)}${btn}</div>`;
    }).join("");
  }
  // A count of one reads "1 day", so the player never sees "1 days".
  function dayCount(n) { return n === 1 ? "1 day" : `${n} days`; }
  function daySpan(min, max) { return min === max ? dayCount(min) : `${min} to ${max} days`; }
  function spanDays(min, max) { return min + Math.floor(Math.random() * (max - min + 1)); }
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function defOf(t) { return BUILDING_DEFS[t]; }
  function rocketOf(id) { return ROCKET_DEFS[id] || ROCKET_DEFS.falcon1; }
  function buildingById(id) { return G.buildings.find((b) => b.id === id) || null; }
  function buildingOfType(t) { return G.buildings.find((b) => b.type === t) || null; }
  function countType(t) { return G.buildings.filter((b) => b.type === t).length; }
  function vehicleById(id) { return G.fleet.find((v) => v.id === id) || null; }
  function selectedVehicle() { return vehicleById(G.selectedVehicleId); }
  function liveFleet() { return G.fleet.filter((v) => v.status !== "destroyed"); }
  function vehiclesAt(buildingId) { return liveFleet().filter((v) => v.buildingId === buildingId); }
  function bayCount() {
    const bay = buildingOfType("mega_bay");
    return bay ? vehiclesAt(bay.id).length : 0;
  }
  function bayCapacity(bay) {
    const b = bay || buildingOfType("mega_bay");
    return Math.max(1, Math.min(TUNING.BAY_MAX, (b && b.level) || 1));
  }
  function factoryHold() {
    const f = buildingOfType("starfactory");
    return f ? vehiclesAt(f.id)[0] || null : null;
  }
  function padHold() {
    const p = buildingOfType("pad_orbital");
    return p ? vehiclesAt(p.id)[0] || null : null;
  }
  function cellZone(gx, gy) {
    if (gx >= 28 && gy >= 20) return "water";
    if (gy < 12) return "production";
    if (gy < 16) return "corridor";
    if (gx < 22) return "launch";
    return "propellant";
  }
  function isWater() { return false; }
  function buildingAnchor(b, slot = 0) {
    const d = defOf(b.type);
    const baseX = (b.gx + d.footprint.w / 2) * CELL;
    const baseY = (b.gy + d.footprint.h * 0.42) * CELL;
    if (b.type === "mega_bay") {
      const spread = 22;
      const n = bayCapacity(b);
      const i = slot % n;
      return { x: baseX + (i - (n - 1) / 2) * spread, y: baseY };
    }
    return { x: baseX, y: baseY };
  }

  function canPlace(type, gx, gy) {
    const def = defOf(type);
    if (!def) return { ok: false, why: "Unknown" };
    if (countType(type) >= def.maxCount) return { ok: false, why: `Only one ${def.name}` };
    const { w, h } = def.footprint;
    if (gx < 0 || gy < 0 || gx + w > MAP_W || gy + h > MAP_H) return { ok: false, why: "Off map" };
    for (let y = gy; y < gy + h; y++)
      for (let x = gx; x < gx + w; x++)
        if (isWater(x, y)) return { ok: false, why: "Water" };
    for (const b of G.buildings) {
      const d = defOf(b.type);
      if (b.gx < gx + w && b.gx + d.footprint.w > gx && b.gy < gy + h && b.gy + d.footprint.h > gy)
        return { ok: false, why: "Overlap" };
    }
    if (G.steel < def.cost) return { ok: false, why: `Need ${def.cost} steel` };
    return { ok: true };
  }

  function buyPlot(id) {
    const plot = PLOTS[id];
    if (!plot || G.plots[id]) return;
    if (G.steel < plot.cost) { log(`Need ${plot.cost} steel.`, "bad"); return; }
    for (const b of plot.buildings) {
      const check = canPlace(b.type, b.gx, b.gy);
      if (!check.ok && check.why !== `Need ${defOf(b.type).cost} steel`) {
        log(check.why, "bad"); return;
      }
    }
    G.steel -= plot.cost;
    G.plots[id] = true;
    for (const b of plot.buildings) {
      G.buildings.push({ id: G.nextId++, type: b.type, gx: b.gx, gy: b.gy, level: 1 });
      G.selectedId = G.buildings[G.buildings.length - 1].id;
    }
    log(`${plot.name} bought.`, "good");
    updateObjectives();
    renderChrome();
  }

  function placeBuilding(type, gx, gy) {
    const check = canPlace(type, gx, gy);
    if (!check.ok) { log(check.why, "bad"); return; }
    const def = defOf(type);
    G.steel -= def.cost;
    G.buildings.push({ id: G.nextId++, type, gx, gy, level: 1 });
    G.selectedId = G.buildings[G.buildings.length - 1].id;
    G.placeType = null;
    canvas.classList.remove("placing");
    log(`Built ${def.name} (−${def.cost} steel)`, "good");
    updateObjectives();
    renderChrome();
  }

  function dayTick() {
    G.day++;
    G.steel += TUNING.ENV_STEEL_PER_DAY;
    G.prop = Math.min(TUNING.PROP_CAP, G.prop + TUNING.ENV_PROP_PER_DAY);

    if (G.factoryJob) {
      G.factoryJob.daysLeft--;
      if (G.factoryJob.daysLeft <= 0) finishFactoryJob();
      else if (G.factoryJob.kind === "merlin") log(`Merlin thrust · ${dayCount(G.factoryJob.daysLeft)} left`, "info");
      else if (G.factoryJob.kind === "structure") log(`Stage dry mass · ${dayCount(G.factoryJob.daysLeft)} left`, "info");
      else log(`Starfactory · building ${rocketOf(G.factoryJob.rocketId).name} · ${dayCount(G.factoryJob.daysLeft)} left`, "info");
    }

    for (const v of liveFleet()) {
      if (v.status === "refurb" && v.refurbLeft > 0) {
        v.refurbLeft--;
        if (v.refurbLeft <= 0) {
          v.status = "in_bay";
          v.condition = Math.min(100, v.condition + 25);
          v.wearFires = 0;
          log(`${v.name} refurb complete in Mega Bay. Thrust is ${merlinNowKn(v)} kN.`, "good");
          G.objectives.refurb = true;
        }
      }
    }
    renderChrome();
  }

  function finishFactoryJob() {
    const job = G.factoryJob;
    const factory = buildingOfType("starfactory");
    G.factoryJob = null;
    if (!job || !factory) return;
    if (job.kind === "merlin") {
      const v = vehicleById(job.vehicleId);
      if (v) {
        v.merlinTier = 2;
        log(`Merlin thrust on ${v.name} is now ${TUNING.MERLIN_1C_KN} kN.`, "good");
      }
      renderChrome();
      return;
    }
    if (job.kind === "structure") {
      const v = vehicleById(job.vehicleId);
      if (v) {
        v.structureTier = 2;
        log(`Stage dry mass on ${v.name} is now ${stageDryKg(v)} kg. One-stage payload is ${payloadKg(v)} kg.`, "good");
      }
      renderChrome();
      return;
    }
    if (factoryHold()) {
      log("Factory hold full — job lost (should not happen)", "bad");
      return;
    }
    const r = rocketOf(job.rocketId);
    const n = liveFleet().filter((v) => v.rocketId === r.id).length + 1;
    const a = buildingAnchor(factory);
    const v = {
      id: G.nextId++,
      name: `${r.short}-${n}`,
      rocketId: r.id,
      buildingId: factory.id,
      status: "at_factory",
      condition: 100,
      merlinTier: 1,
      structureTier: 1,
      fires: 0,
      wearFires: 0,
      refurbLeft: 0,
      baySlot: 0,
      wx: a.x, wy: a.y,
    };
    G.fleet.push(v);
    G.selectedVehicleId = v.id;
    log(`${v.name} complete at Starfactory.`, "good", { roll: v.id });
    G.objectives.build_rocket = true;
    updateObjectives();
    renderChrome();
  }

  function startBuildRocket(rocketId) {
    const r = rocketOf(rocketId);
    if (!r.unlocked) { log("Not on roadmap yet", "warn"); return; }
    const factory = buildingById(G.selectedId);
    if (!factory || factory.type !== "starfactory") { log("Select Starfactory", "warn"); return; }
    if (G.factoryJob) { log("Factory already building", "warn"); return; }
    if (factoryHold()) { log("Move finished vehicle to Mega Bay first (factory hold is 1)", "warn"); return; }
    if (G.event || G.rollout) { log("Ops busy", "warn"); return; }
    if (G.steel < r.steelCost) { log(`Need ${r.steelCost} steel`, "bad"); return; }
    G.steel -= r.steelCost;
    const buildDays = spanDays(TUNING.BUILD_DAYS_MIN, TUNING.BUILD_DAYS_MAX);
    G.factoryJob = { kind: "rocket", rocketId: r.id, daysLeft: buildDays, totalDays: buildDays };
    log(`Starfactory · building ${r.name} · −${r.steelCost} steel · ${dayCount(buildDays)}`, "good");
    renderChrome();
  }

  function stageToBay(vehicleId) {
    const bay = buildingOfType("mega_bay");
    if (!bay) { log("Need Mega Bay", "bad"); return; }
    const v = vehicleById(vehicleId || G.selectedVehicleId);
    if (!v || v.status !== "at_factory") { log("Select a finished vehicle at the factory", "warn"); return; }
    const cap = bayCapacity(bay);
    if (bayCount() >= cap) {
      log(`Mega Bay is full. It holds ${cap}.`, "bad");
      return;
    }
    if (G.event || G.rollout) { log("Ops busy", "warn"); return; }
    const factory = buildingById(v.buildingId) || buildingOfType("starfactory");
    if (!factory) { log("Need Starfactory", "bad"); return; }
    const used = new Set(vehiclesAt(bay.id).map((x) => x.baySlot));
    let slot = 0;
    while (used.has(slot) && slot < cap) slot++;
    const dur = beginRoad(v, factory, bay, "bay", "in_bay", TUNING.ROLLOUT_PX_PER_SEC, slot);
    G.selectedVehicleId = v.id;
    log(`${v.name} rolls to Mega Bay · ${dur.toFixed(1)}s`, "info");
    renderChrome();
  }

  function pathMetrics(pts) {
    const segLens = [];
    let total = 0;
    for (let i = 0; i < pts.length - 1; i++) {
      const len = Math.hypot(pts[i + 1].x - pts[i].x, pts[i + 1].y - pts[i].y);
      segLens.push(len); total += len;
    }
    return { segLens, totalLen: Math.max(total, 1) };
  }
  function pointAlong(pts, segLens, totalLen, u) {
    let dist = clamp(u, 0, 1) * totalLen;
    for (let i = 0; i < segLens.length; i++) {
      if (dist <= segLens[i] || i === segLens.length - 1) {
        const t = segLens[i] < 1e-6 ? 1 : dist / segLens[i];
        return {
          x: pts[i].x + (pts[i + 1].x - pts[i].x) * t,
          y: pts[i].y + (pts[i + 1].y - pts[i].y) * t,
        };
      }
      dist -= segLens[i];
    }
    return pts[pts.length - 1];
  }
  function roadPath(from, to, fromB, toB) {
    const road = fromB && toB ? yardSegment(fromB, toB) : [];
    const pts = [{ x: from.x, y: from.y }].concat(road, [{ x: to.x, y: to.y }]);
    const clean = [pts[0]];
    for (let i = 1; i < pts.length; i++) {
      const p = pts[i], q = clean[clean.length - 1];
      if (Math.hypot(p.x - q.x, p.y - q.y) > 1) clean.push(p);
    }
    return clean;
  }

  // The factory trip uses this too. It does not ask for the pad.
  function beginRoad(v, fromB, toB, destKind, destStatus, speed, slot) {
    const fromA = { x: v.wx, y: v.wy };
    const toA = buildingAnchor(toB, slot || 0);
    const pts = roadPath(fromA, toA, fromB, toB);
    const metrics = pathMetrics(pts);
    const duration = clamp(metrics.totalLen / speed, TUNING.ROLLOUT_MIN_SEC, TUNING.ROLLOUT_MAX_SEC);
    v.buildingId = null;
    v.status = "rolling";
    v.baySlot = slot || 0;
    v.wx = pts[0].x;
    v.wy = pts[0].y;
    G.rollout = {
      kind: "roll",
      vehicleId: v.id,
      pts,
      segLens: metrics.segLens,
      totalLen: metrics.totalLen,
      t: 0,
      duration,
      destKind,
      destId: toB.id,
      destStatus,
      baySlot: slot || 0,
    };
    return duration;
  }

  function parkVehicle(v, buildingId, slot) {
    v.buildingId = buildingId;
    v.baySlot = slot || 0;
    const b = buildingById(buildingId);
    if (!b) return;
    const a = buildingAnchor(b, v.baySlot);
    v.wx = a.x;
    v.wy = a.y;
  }

  function startRoll(vehicleId, destKind) {
    const v = vehicleById(vehicleId || G.selectedVehicleId);
    if (!v) { log("Select a vehicle", "warn"); return; }
    if (G.rollout || G.event) { log("Transport busy", "warn"); return; }
    const pad = buildingOfType("pad_orbital");
    const bay = buildingOfType("mega_bay");
    if (!pad || !bay) { log("Need bay and pad", "bad"); return; }

    if (destKind === "pad") {
      if (v.status !== "in_bay") { log("Only bay-ready vehicles roll to pad", "warn"); return; }
      if (padHold()) { log("Pad occupied — one stack on OLM", "warn"); return; }
      const dur = beginRoad(v, bay, pad, "pad", "on_pad", TUNING.ROLLOUT_PX_PER_SEC, 0);
      log(`${v.name} rollout to pad · ${dur.toFixed(1)}s`, "info");
      renderChrome();
      return;
    }
    if (destKind !== "bay") return;
    if (v.status !== "on_pad" && v.status !== "needs_return") {
      log("Return to bay from pad after fire", "warn"); return;
    }
    if (bayCount() >= bayCapacity(bay) && v.buildingId !== bay.id) {
      log("Mega Bay is full.", "bad"); return;
    }
    const used = new Set(vehiclesAt(bay.id).filter((x) => x.id !== v.id).map((x) => x.baySlot));
    let slot = 0;
    while (used.has(slot) && slot < bayCapacity(bay)) slot++;
    v.baySlot = slot;
    // The pad keeps the rocket until the lower finishes, then the road clears the building.
    v.status = "rolling";
    const back = roadPath({ x: v.wx, y: v.wy }, buildingAnchor(bay, slot), pad, bay);
    G.rollout = {
      kind: "lower",
      vehicleId: v.id,
      t: 0,
      duration: LIFT_SEC,
      destKind: "bay",
      destId: bay.id,
      destStatus: "refurb",
      baySlot: slot,
      flatHeading: pathHeading(back),
    };
    log(`${v.name} lowers onto the transporter · ${LIFT_SEC.toFixed(1)}s`, "info");
    renderChrome();
  }

  function finishRaise(v, r) {
    parkVehicle(v, r.destId, 0);
    v.status = "on_pad";
    G.rollout = null;
    log(`${v.name} on pad — static fire when ready`, "good");
    updateObjectives();
    renderChrome();
  }

  function finishLower(v, r) {
    const pad = buildingOfType("pad_orbital");
    const bay = buildingById(r.destId);
    if (!pad || !bay) { G.rollout = null; return; }
    const dur = beginRoad(v, pad, bay, "bay", "refurb", TUNING.RETURN_PX_PER_SEC, r.baySlot || 0);
    log(`${v.name} return to bay · ${dur.toFixed(1)}s`, "info");
    renderChrome();
  }

  function arriveRoll(v, r) {
    parkVehicle(v, r.destId, r.baySlot || 0);
    if (r.destStatus === "on_pad") {
      v.status = "rolling";
      G.rollout = {
        kind: "raise",
        vehicleId: v.id,
        t: 0,
        duration: LIFT_SEC,
        destKind: "pad",
        destId: r.destId,
        destStatus: "on_pad",
        baySlot: 0,
        flatHeading: segmentHeading(r),
      };
      renderChrome();
      return;
    }
    v.status = r.destStatus;
    if (r.destStatus === "refurb") {
      // refurb days were written on the pad. They start now, when the rocket is in the bay.
      if (v.refurbLeft <= 0) v.status = "in_bay";
      log(`${v.name} in Mega Bay for post-fire refurb · ${dayCount(v.refurbLeft)} left`, "warn");
    } else if (r.destStatus === "in_bay") {
      const bay = buildingById(r.destId);
      const cap = bayCapacity(bay);
      log(`${v.name} is in Mega Bay, slot ${(r.baySlot || 0) + 1} of ${cap}.`, "good");
      if (bayCount() >= 2) G.objectives.multi_bay = true;
    }
    G.rollout = null;
    updateObjectives();
    renderChrome();
  }

  function updateRollout(dt) {
    if (!G.rollout) return;
    const r = G.rollout;
    const v = vehicleById(r.vehicleId);
    if (!v) { G.rollout = null; return; }
    if (r.kind === "fire") {
      updateFire(r, dt);
      return;
    }
    r.t += dt;
    if (r.kind === "raise" || r.kind === "lower") {
      if (r.t < r.duration) return;
      if (r.kind === "raise") finishRaise(v, r);
      else finishLower(v, r);
      return;
    }
    const u = clamp(r.t / r.duration, 0, 1);
    const p = pointAlong(r.pts, r.segLens, r.totalLen, u);
    v.wx = p.x;
    v.wy = p.y;
    if (u >= 1) arriveRoll(v, r);
  }

  function weatherOn(day) {
    const table = [
      { sky: "Clear", wind: 8, storm: false },
      { sky: "Clear", wind: 12, storm: false },
      { sky: "Wind", wind: 24, storm: false },
      { sky: "Clear", wind: 10, storm: false },
      { sky: "Storm", wind: 36, storm: true },
      { sky: "Wind", wind: 22, storm: false },
      { sky: "Clear", wind: 6, storm: false },
      { sky: "Clear", wind: 14, storm: false },
      { sky: "Wind", wind: 26, storm: false },
      { sky: "Storm", wind: 32, storm: true },
    ];
    return table[((day - 1) % table.length + table.length) % table.length];
  }

  function stageDryKg(v) {
    const cut = v && v.structureTier >= 2 ? TUNING.STAGE_LIGHTEN_KG : 0;
    return TUNING.STAGE_DRY_KG - cut;
  }

  // Shared with the wiki example so the two sums cannot drift.
  const G0 = 9.80665;

  // One stage. Thrust sets the burn time, and that time is spent against gravity.
  function payloadToLeo(stageDryKg, engineMassKg, ispS, thrustKn) {
    const prop = TUNING.STAGE_PROP_KG;
    const g0 = G0;
    const dry = stageDryKg + engineMassKg;
    const thrustN = thrustKn * 1000;
    if (dry <= 0 || thrustN <= 0 || prop <= 0) return 0;
    const ve = ispS * g0;
    const gate = TUNING.LEO_DV_MS + g0 * ((prop * ve) / thrustN);
    let lo = 0;
    let hi = 20000;
    let best = 0;
    while (lo <= hi) {
      const p = (lo + hi) >> 1;
      const mf = dry + p;
      const dv = ve * Math.log((mf + prop) / mf);
      if (dv >= gate) { best = p; lo = p + 1; }
      else hi = p - 1;
    }
    return best;
  }

  // The sheet says how much payload the dry-mass cut returns. Same thrust on both sides.
  function payloadWhyLine(v) {
    const cut = TUNING.STAGE_LIGHTEN_KG;
    const thrust = merlinNowKn(v);
    const full = payloadToLeo(TUNING.STAGE_DRY_KG, TUNING.MERLIN_MASS_KG, TUNING.MERLIN_ISP_S, thrust);
    const lit = payloadToLeo(TUNING.STAGE_DRY_KG - cut, TUNING.MERLIN_MASS_KG, TUNING.MERLIN_ISP_S, thrust);
    const gain = lit - full;
    if ((v.structureTier || 1) >= 2) {
      return `Payload rose by ${gain} kg when the stage lost ${cut} kg. One stage gives that dry mass back as payload.`;
    }
    return `Lighten the stage adds ${gain} kg of payload when the stage loses ${cut} kg. One stage gives that dry mass back as payload.`;
  }

  function payloadKg(v) {
    return payloadToLeo(stageDryKg(v), TUNING.MERLIN_MASS_KG, TUNING.MERLIN_ISP_S, merlinNowKn(v));
  }

  function merlinFreshKn(v) {
    return v && v.merlinTier >= 2 ? TUNING.MERLIN_1C_KN : TUNING.MERLIN_THRUST_KN;
  }

  function merlinNowKn(v) {
    const fires = v && v.wearFires ? v.wearFires : 0;
    return Math.max(0, Math.round(merlinFreshKn(v) * (1 - TUNING.SF_WEAR_PER_FIRE * fires)));
  }

  function padLimits(pad) {
    const l2 = pad && pad.level >= 2;
    return {
      thrust: l2 ? TUNING.PAD_THRUST_L2 : TUNING.PAD_THRUST_L1,
      wind: l2 ? TUNING.WIND_LIMIT_L2 : TUNING.WIND_LIMIT_L1,
    };
  }

  // The range lamp and the fire share this check so the two cannot drift.
  function rangeShut(storm, wind, windLimit) {
    return !!(storm || wind > windLimit);
  }

  // Numbers in, one word out. Same inputs always return the same word.
  // fireVerdict(318, 400, 80, 8, 12, 20, false) is "hold".
  // fireVerdict(318, 400, 80, 8, 24, 20, false) is "weather".
  function fireVerdict(thrust, padThrust, prop, need, wind, windLimit, storm) {
    if (rangeShut(storm, wind, windLimit)) return "weather";
    if (prop < need) return "propellant";
    if (thrust > padThrust) return "pad";
    if (thrust < TUNING.SF_THRUST_BAR_KN) return "engine";
    return "hold";
  }

  // Condition and refurb days after a fire. The caller writes the vehicle.
  function sfNext(success, condition, refurbDaysOk, refurbDaysFail, padLevel) {
    if (success) {
      const cut = padLevel >= 2 ? 1 : 0;
      return {
        scrap: false,
        status: "needs_return",
        condition: Math.max(0, condition - TUNING.SF_OK_CONDITION),
        refurbLeft: Math.max(1, refurbDaysOk - cut),
      };
    }
    const next = condition - TUNING.SF_MISS_CONDITION;
    if (next < TUNING.SCRAP_FLOOR) {
      return { scrap: true, status: "destroyed", condition: 0, refurbLeft: 0 };
    }
    return {
      scrap: false,
      status: "needs_return",
      condition: next,
      refurbLeft: refurbDaysFail,
    };
  }

  function fireCheck(v, pad) {
    const sky = weatherOn(G.day);
    const limits = padLimits(pad);
    const thrust = merlinNowKn(v);
    const need = rocketOf(v.rocketId).sfProp;
    const word = fireVerdict(thrust, limits.thrust, G.prop, need, sky.wind, limits.wind, sky.storm);
    const lines = [
      `Thrust is ${thrust} kN. The fire needs ${TUNING.SF_THRUST_BAR_KN} kN.`,
      `The thrust limit is ${limits.thrust} kN. The wind limit is ${limits.wind} knots.`,
      `Propellant is ${Math.floor(G.prop)}. This fire draws ${need}.`,
      `${sky.sky[0].toUpperCase()}${sky.sky.slice(1)}, ${sky.wind} knots.`,
    ];
    return {
      ok: word === "hold",
      limiter: word === "hold" ? null : word,
      lines, thrust, need, sky, limits,
    };
  }

  function staticFire() {
    if (G.paused) { log("The day is paused.", "warn"); return; }
    const pad = buildingOfType("pad_orbital");
    if (!pad) { log("Need pad", "bad"); return; }
    const v = padHold();
    if (!v || v.status !== "on_pad") { log("Need a vehicle on the pad", "bad"); return; }
    if (G.event || G.rollout) { log("Busy", "warn"); return; }
    const r = rocketOf(v.rocketId);
    const check = fireCheck(v, pad);
    check.lines.forEach((line) => log(line, "info"));
    if (!check.ok && (check.limiter === "weather" || check.limiter === "propellant")) {
      log(check.limiter === "weather"
        ? "Range is closed. Wait for a calmer day."
        : `Need ${check.need} propellant.`, "bad");
      renderChrome();
      return;
    }
    G.prop -= check.need;
    log(check.ok
      ? `${v.name} holds the static fire. The fire draws ${check.need} propellant.`
      : `${v.name} misses the static fire because the ${check.limiter} is short. The fire draws ${check.need} propellant.`, check.ok ? "good" : "bad");
    startEventSF(v, pad, r, check.need, check.ok, check);
    renderChrome();
  }

  // ── Close-up event ──
  const eventStage = document.getElementById("event-stage");
  const eventCanvas = document.getElementById("event-canvas");
  const ectx = eventCanvas.getContext("2d");
  const elEvent = {
    title: document.getElementById("event-title"),
    phase: document.getElementById("event-phase"),
    caption: document.getElementById("event-caption"),
    skip: document.getElementById("event-skip"),
  };

  function startEventSF(v, pad, r, spent, success, check) {
    const ph = r.sfPhases;
    const phases = success
      ? [
          { id: "approach", label: "Camera · approach", dur: ph.approach },
          { id: "chill", label: "Engine chill", dur: ph.chill },
          { id: "ignition", label: r.engines === 9 ? "9-engine ignition" : "Ignition", dur: ph.ignition },
          { id: "burn", label: "Full burn", dur: ph.burn },
          { id: "shutdown", label: "Shutdown", dur: ph.shutdown },
          { id: "debrief", label: "Stable · hold-downs OK", dur: ph.debrief },
        ]
      : [
          { id: "approach", label: "Camera · approach", dur: ph.approach * 0.9 },
          { id: "chill", label: "Engine chill", dur: ph.chill * 0.85 },
          { id: "ignition", label: "Ignition", dur: ph.ignition },
          { id: "anomaly", label: check.limiter === "pad" ? "Pad" : "Engine", dur: 1.6 },
          { id: "fail", label: "Range safe · vehicle compromised", dur: 1.4 },
        ];
    // One motion object. The rollout clock advances this burn, and the stage stays closed.
    G.rollout = {
      kind: "fire",
      vehicleId: v.id,
      rocketId: r.id,
      sfStyle: r.sfStyle,
      padLevel: pad.level,
      success,
      limiter: success ? null : check.limiter,
      spent,
      t: 0, phaseIdx: 0, phaseT: 0,
      phases,
      done: false,
      applied: false,
      closeLeft: null,
    };
    elEvent.phase.classList.remove("fail");
    // The footer names the real outcome, because the result is known before the animation starts.
    document.getElementById("event-outcome").textContent = success
      ? "Held · return to Mega Bay for refurb"
      : `The ${check.limiter} was short · return to Mega Bay for refurb or scrap`;
    openEvent(
      `Static fire · ${v.name}`,
      phases[0].label,
      success
        ? `${r.name} · thrust ${check.thrust} kN holds · ${check.sky.sky}`
        : `${r.name} · the ${check.limiter} is short`
    );
  }

  function openEvent(title, phase, cap) {
    elEvent.title.textContent = title;
    elEvent.phase.textContent = phase;
    elEvent.caption.textContent = cap;
    // The burn plays on the map. This stage stays closed.
    eventStage.classList.remove("open");
    eventStage.setAttribute("aria-hidden", "true");
  }
  function closeEvent() {
    eventStage.classList.remove("open");
    eventStage.setAttribute("aria-hidden", "true");
  }

  function applySfOutcome() {
    const ev = G.rollout && G.rollout.kind === "fire" ? G.rollout : null;
    if (!ev) return;
    const v = vehicleById(ev.vehicleId);
    if (!v) return;
    G.objectives.static_fire = true;
    v.fires = (v.fires || 0) + 1;
    v.wearFires = (v.wearFires || 0) + 1;
    const pad = buildingOfType("pad_orbital");
    const failDays = spanDays(TUNING.REFURB_FAIL_MIN, TUNING.REFURB_FAIL_MAX);
    const next = sfNext(ev.success, v.condition, TUNING.REFURB_OK_DAYS, failDays, pad ? pad.level : 1);
    v.status = next.status;
    v.condition = next.condition;
    if (next.scrap) {
      v.buildingId = null;
      log(`${v.name} is below the condition floor of ${TUNING.SCRAP_FLOOR}. The first stage is scrap. The ${ev.limiter} was short.`, "bad");
    } else if (ev.success) {
      v.refurbLeft = next.refurbLeft;
      log(`${v.name} held. Return it to the Mega Bay for ${dayCount(v.refurbLeft)} of refurb. Thrust next fire ${merlinNowKn(v)} kN.`, "good");
    } else {
      v.refurbLeft = next.refurbLeft;
      log(`${v.name} failed because the ${ev.limiter} was short. Condition ${v.condition}. Refurb ${dayCount(v.refurbLeft)}. Scrap floor is ${TUNING.SCRAP_FLOOR}.`, "bad");
    }
  }

  function finishFire() {
    const r = G.rollout;
    if (!r || r.kind !== "fire" || r.applied) return;
    r.applied = true;
    applySfOutcome();
    G.rollout = null;
    G.event = null;
    closeEvent();
    updateObjectives();
    renderChrome();
  }

  function skipEvent() {
    if (G.rollout && G.rollout.kind === "fire") { finishFire(); return; }
    closeEvent();
  }

  function updateFire(r, dt) {
    if (r.applied) return;
    if (r.closeLeft != null) {
      r.closeLeft -= dt;
      if (r.closeLeft <= 0) finishFire();
      return;
    }
    r.t += dt;
    r.phaseT += dt;
    const phase = r.phases[r.phaseIdx];
    if (!r.done && phase && r.phaseT >= phase.dur) {
      r.phaseT = 0;
      r.phaseIdx++;
      if (r.phaseIdx >= r.phases.length) {
        r.done = true;
        r.phaseIdx = r.phases.length - 1;
        r.closeLeft = 0.45;
      }
    }
  }
  elEvent.skip.addEventListener("click", skipEvent);

  function resizeEventCanvas() {
    const d = Math.min(window.devicePixelRatio || 1, 2);
    const rect = eventCanvas.getBoundingClientRect();
    const w = Math.max(320, Math.floor(rect.width));
    const h = Math.max(200, Math.floor(rect.height));
    eventCanvas.width = w * d; eventCanvas.height = h * d;
    ectx.setTransform(d, 0, 0, d, 0, 0);
    G._ew = w; G._eh = h;
  }

  function updateEvent() {
    // The burn advances on the rollout clock. This stage does not keep one.
  }

  function drawEvent() {
    const ev = G.event;
    if (!ev) return;
    const W = G._ew || 900, H = G._eh || 500;
    const r = rocketOf(ev.rocketId);
    ectx.clearRect(0, 0, W, H);
    const g = ectx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#152030"); g.addColorStop(0.55, "#2a3848"); g.addColorStop(1, "#3a4840");
    ectx.fillStyle = g; ectx.fillRect(0, 0, W, H);

    const cx = W * 0.5, groundY = H * 0.78;
    const phase = ev.phases[ev.phaseIdx];
    const pid = phase ? phase.id : "debrief";
    const zoom = pid === "approach" ? 0.85 + 0.15 * clamp(ev.phaseT / 1, 0, 1) : 1;

    ectx.fillStyle = "#4a453c"; ectx.fillRect(0, groundY, W, H - groundY);
    const trenchW = (ev.padLevel >= 2 ? 150 : 95) * zoom;
    ectx.fillStyle = "#1a1a20";
    ectx.fillRect(cx - trenchW / 2, groundY + 6, trenchW, 28 * zoom);
    const olmH = (ev.padLevel >= 2 ? 70 : 48) * zoom;
    ectx.fillStyle = "#9aa0a8";
    ectx.fillRect(cx - 18 * zoom, groundY - olmH, 36 * zoom, olmH);

    const base = groundY - olmH;
    const broken = pid === "anomaly" || pid === "fail" || (!ev.success && ev.done);
    drawCloseupRocket(ectx, cx, base, zoom, r, pid, broken, ev);

    if (pid === "chill" || pid === "ignition" || pid === "burn" || pid === "shutdown") {
      drawPlume(ectx, cx, base + 4, zoom, r, pid, ev, 1);
    }
    if (pid === "anomaly") {
      drawPlume(ectx, cx, base + 4, zoom, r, pid, ev, 1.4);
      // fireball
      ectx.fillStyle = "rgba(255,120,40,0.55)";
      ectx.beginPath();
      ectx.arc(cx + Math.sin(ev.t * 20) * 8, base - 40, 50 + Math.sin(ev.t * 15) * 10, 0, Math.PI * 2);
      ectx.fill();
      ectx.fillStyle = "rgba(255,200,80,0.4)";
      ectx.beginPath();
      ectx.arc(cx, base - 55, 28, 0, Math.PI * 2);
      ectx.fill();
    }

    for (const p of ev.particles) {
      ectx.globalAlpha = clamp(p.life * 2, 0, 1);
      ectx.fillStyle = p.hot ? "#ff9a3a" : "#ffcc66";
      ectx.beginPath();
      ectx.arc(cx + p.x, base + 10 + p.y, p.r, 0, Math.PI * 2);
      ectx.fill();
      ectx.globalAlpha = 1;
    }

    ectx.fillStyle = "rgba(0,0,0,0.5)";
    ectx.fillRect(12, 12, 260, 58);
    ectx.fillStyle = "#e8d9b0";
    ectx.font = "600 13px system-ui";
    ectx.fillText(rocketOf(ev.rocketId).name.toUpperCase(), 22, 32);
    ectx.font = "11px ui-monospace, monospace";
    ectx.fillStyle = ev.success || pid === "approach" || pid === "chill" ? "#d4a84b" : "#e08070";
    ectx.fillText(ev.success ? `Thrust holds · ${pid.toUpperCase()}` : `${ev.limiter || "short"} · ${pid.toUpperCase()}`, 22, 50);

    ectx.fillStyle = "rgba(0,0,0,0.5)";
    ectx.fillRect(W - 160, 12, 148, 40);
    ectx.fillStyle = "#8fbc6a";
    ectx.font = "11px ui-monospace, monospace";
    ectx.fillText(`PROP −${ev.spent}`, W - 148, 36);

    if (pid === "debrief" && ev.success) {
      ectx.fillStyle = "rgba(20,40,24,0.8)";
      ectx.fillRect(W / 2 - 120, 22, 240, 36);
      ectx.fillStyle = "#8fbc6a"; ectx.font = "600 14px system-ui"; ectx.textAlign = "center";
      ectx.fillText("ENGINES STABLE", W / 2, 46); ectx.textAlign = "left";
    }
    if (pid === "fail" || (broken && pid === "anomaly" && ev.phaseT > 0.8)) {
      ectx.fillStyle = "rgba(50,16,16,0.85)";
      ectx.fillRect(W / 2 - 130, 22, 260, 36);
      ectx.fillStyle = "#e07070"; ectx.font = "600 14px system-ui"; ectx.textAlign = "center";

  function drawEventRange(W, H) {
    const x = 16, y = H - 78, w = 220, h = 62;
    ectx.fillStyle = "rgba(0,0,0,0.72)";
    ectx.fillRect(x, y, w, h);
    ectx.strokeStyle = "#e10600";
    ectx.strokeRect(x, y, w, h);
    ectx.beginPath();
    ectx.moveTo(x + 18, y + 48);
    ectx.quadraticCurveTo(x + 90, y + 36, x + 190, y + 14);
    ectx.stroke();
    const pitch = 90;
    const endLon = PAD_LON + 50 / (111.32 * Math.cos(PAD_LAT * Math.PI / 180));
    ectx.fillStyle = "#f2f2f2";
    ectx.font = "11px ui-monospace, monospace";
    ectx.fillText(`${PAD_LAT.toFixed(3)}° N  heading 90°  pitch ${pitch.toFixed(0)}°`, x + 8, y + 14);
    ectx.fillText(`Gulf track to ${Math.abs(endLon).toFixed(2)}° W`, x + 8, y + 28);
  }

  function drawCloseupRocket(c, cx, baseY, zoom, r, pid, broken, ev) {
    const nine = r.sfStyle === "merlin_nine";
    const scale = (nine ? 1.18 : 0.95) * zoom;
    const bw = (nine ? 32 : 22) * scale;
    const bh = (nine ? 120 : 85) * scale;
    const shipH = (nine ? 95 : 68) * scale;
    const tilt = broken ? Math.sin(ev.t * 8) * 0.15 + 0.2 : 0;
    c.save();
    c.translate(cx, baseY);
    c.rotate(tilt);
    c.translate(-cx, -baseY);
    const x = cx - bw / 2;
    const yBoost = baseY - bh;
    const yShip = yBoost - shipH;
    if (broken && pid === "fail") {
      // debris-ish short stack
      c.fillStyle = "#666";
      c.fillRect(x + 4, yBoost + bh * 0.4, bw - 8, bh * 0.35);
    } else {
      c.fillStyle = r.color;
      c.fillRect(x + 3, yShip, bw - 6, shipH);
      c.beginPath();
      c.moveTo(cx, yShip - 20 * scale);
      c.lineTo(x + 3, yShip); c.lineTo(x + bw - 3, yShip); c.closePath();
      c.fill();
      c.fillStyle = nine ? "#e4eaf0" : "#c5ccd4";
      c.fillRect(x, yBoost, bw, bh);
      c.fillStyle = "#3a4048";
      if (nine) {
        for (let row = 0; row < 3; row++)
          for (let col = 0; col < 3; col++) {
            c.beginPath();
            c.arc(cx + (col - 1) * 11 * scale, baseY - 2, 4 * scale, 0, Math.PI * 2);
            c.fill();
          }
      } else {
        c.beginPath(); c.arc(cx, baseY - 2, 6 * scale, 0, Math.PI * 2); c.fill();
      }
    }
    c.restore();
  }

  function drawPlume(c, cx, baseY, zoom, r, pid, ev, mult) {
    const nine = r.sfStyle === "merlin_nine";
    const intensity = pid === "chill" ? 0.2 : pid === "ignition" ? 0.7 : pid === "shutdown" ? 0.3 : 1;
    const n = Math.floor((nine ? 14 : 7) * intensity * mult) + 2;
    for (let i = 0; i < n; i++) {
      const ox = Math.sin(ev.t * 11 + i) * (nine ? 26 : 12) * zoom * intensity;
      const h = (18 + (i % 5) * 10) * zoom * intensity * mult;
      const grad = c.createLinearGradient(cx, baseY, cx, baseY + h + 40);
      grad.addColorStop(0, `rgba(255,220,120,${0.9 * intensity})`);
      grad.addColorStop(0.4, `rgba(255,100,30,${0.75 * intensity})`);
      grad.addColorStop(1, "rgba(40,40,40,0)");
      c.fillStyle = grad;
      c.beginPath();
      c.moveTo(cx + ox - 7 * zoom, baseY);
      c.lineTo(cx + ox, baseY + h + 20);
      c.lineTo(cx + ox + 7 * zoom, baseY);
      c.fill();
    }
  }

  function upgradePad() {
    const pad = buildingById(G.selectedId);
    if (!pad || pad.type !== "pad_orbital") return;
    if (pad.level >= 2) { log("Pad already L2", "info"); return; }
    if (G.steel < TUNING.PAD_L2_COST) { log(`Need ${TUNING.PAD_L2_COST} steel`, "bad"); return; }
    G.steel -= TUNING.PAD_L2_COST;
    pad.level = 2;
    log("Pad level 2. The trench is wider.", "good");
    updateObjectives();
    renderChrome();
  }

  function upgradeBay() {
    const bay = buildingById(G.selectedId);
    if (!bay || bay.type !== "mega_bay") return;
    if (bay.level >= TUNING.BAY_MAX) return;
    if (G.steel < TUNING.BAY_SLOT_COST) { log(`Need ${TUNING.BAY_SLOT_COST} steel.`, "bad"); return; }
    G.steel -= TUNING.BAY_SLOT_COST;
    bay.level += 1;
    log(`Mega Bay holds ${bay.level} vehicles.`, "good");
    updateObjectives();
    renderChrome();
  }

  function updateObjectives() {
    G.objectives.place_all = BUILD_ORDER.every((t) => countType(t) >= 1);
    if (liveFleet().length) G.objectives.build_rocket = true;
    if (bayCount() >= 2) G.objectives.multi_bay = true;
    const pad = buildingOfType("pad_orbital");
    G.objectives.pad_l2 = !!(pad && pad.level >= 2);
    renderObjectives();
  }

  function wikiNum(n, digits) {
    const text = (Math.round(n * 10 ** digits) / 10 ** digits).toFixed(digits);

    const left = wikiNum(min, 0);

  // A matching real figure leaves the reality note off.
  function wikiDiffers(gameN, refKey) {
    const ref = REAL_REFS[refKey];

    return Math.abs(Number(gameN) - Number(ref.n)) >= 0.5;

  function wikiBurn() {
    const prop = TUNING.STAGE_PROP_KG;
    const dry = TUNING.STAGE_DRY_KG + TUNING.MERLIN_MASS_KG;
    const payload = payloadToLeo(TUNING.STAGE_DRY_KG, TUNING.MERLIN_MASS_KG, TUNING.MERLIN_ISP_S, TUNING.MERLIN_THRUST_KN);
    const lighter = payloadToLeo(TUNING.STAGE_DRY_KG - TUNING.STAGE_LIGHTEN_KG, TUNING.MERLIN_MASS_KG, TUNING.MERLIN_ISP_S, TUNING.MERLIN_THRUST_KN);
    const ve = TUNING.MERLIN_ISP_S * G0;
    const thrustN = TUNING.MERLIN_THRUST_KN * 1000;
    const gate = TUNING.LEO_DV_MS + G0 * ((prop * ve) / thrustN);
    const mf = dry + payload;
    const m0 = mf + prop;
    const dv = ve * Math.log(m0 / mf);
    return { prop, dry, payload, lighter, gain: lighter - payload, ve, gate, mf, m0, dv };
  }

  function wikiImpulse() {
    const upper = wikiUpperOn();
    const merlinVe = TUNING.MERLIN_ISP_S * G0;
    const facts = [

    const vacuum = upper
      ? `The Kestrel is the vacuum engine on the upper stage. Its specific impulse is ${TUNING.KESTREL_ISP_S} seconds, above the Merlin at ${TUNING.MERLIN_ISP_S} seconds.`
      : `This rocket uses the Merlin at sea level. The upper stage is not in the game, so its vacuum engine is not listed here.`;
    if (upper) {
      facts.push({ value: `${TUNING.KESTREL_ISP_S} seconds`, label: "Kestrel specific impulse" });
      facts.push({ value: `${wikiNum(TUNING.KESTREL_ISP_S * G0, 0)} meters per second`, label: "Kestrel exhaust speed" });

    }
    return {
      id: "isp",
      title: "Specific impulse",
      body: wikiParas([

        `Multiply the seconds by gravity and you get the exhaust speed. The Merlin figure is the sea-level number.`,
