        `The ${wikiSource("plant")} records the move from El Segundo. The ${wikiSource("guide")} places Falcon 1 production in Hawthorne.`,
      ]),
    };
  }

  function wikiBay() {
    const roll = wikiSpan(TUNING.ROLLOUT_MIN_SEC, TUNING.ROLLOUT_MAX_SEC, "second", "seconds");
    return {
      id: "mega_bay",
      group: "Buildings",
      title: "Mega Bay",
      body: wikiParas([
        `Mega Bay houses the rockets between ${wikiPlace("starfactory", "Starfactory")} and the ${wikiPlace("pad_orbital", "Orbital Pad")}. A rocket comes back here after a fire.`,
        `Roll to the ${wikiPlace("pad_orbital", "Orbital Pad")} follows the yard road. The trip takes ${roll}. It spends no steel and no propellant.`,
        `A refurbishment puts the ${wikiPageLink("engines", "engine")} back to work. A clean fire takes ${dayCount(TUNING.REFURB_OK_DAYS)}. A miss takes ${daySpan(TUNING.REFURB_FAIL_MIN, TUNING.REFURB_FAIL_MAX)}. The refurb spends no steel and no propellant.`,
        `Another slot costs ${TUNING.BAY_SLOT_COST} steel and takes no days. It adds a place in the bay, up to ${TUNING.BAY_MAX === 1 ? "1 vehicle" : `${TUNING.BAY_MAX} vehicles`}.`,
        `The next step is a static fire on the ${wikiPlace("pad_orbital", "Orbital Pad")}. That fire checks ${wikiPageLink("thrust", "thrust")}, ${wikiPageLink("propellant", "propellant")}, and the wind.`,
      ]) + wikiFacts([
        { value: `${TUNING.BAY_SLOT_COST} steel`, label: "Another slot" },
        { value: String(TUNING.BAY_MAX), label: "Vehicles the bay can hold" },
        { value: dayCount(TUNING.REFURB_OK_DAYS), label: "Clean refurb" },
        { value: roll, label: "Roll to the pad" },
      ]) + wikiReal([
        `Real stages were tested at McGregor, Texas, and integrated at the launch site, not in one bay at the pad.`,
        `The ${wikiSource("guide")} names that test site. The ${wikiSource("assembly")} says the final integration happens at the launch site.`,
      ]),
    };
  }

  function wikiPad() {
    const rocket = ROCKET_DEFS.falcon1;
    const roll = wikiSpan(TUNING.ROLLOUT_MIN_SEC, TUNING.ROLLOUT_MAX_SEC, "second", "seconds");
    // The day cut matches sfNext. The sentence appears only when that cut changes the wait.
    const clean = TUNING.REFURB_OK_DAYS;
    const shortens = Math.max(1, clean - 1) < clean;
    const shorten = shortens
      ? ` A level 2 pad also shortens a clean refurb in ${wikiPlace("mega_bay", "Mega Bay")}.`
      : "";
    return {
      id: "pad_orbital",
      group: "Buildings",
      title: "Orbital Pad",
      body: wikiParas([
        `The Orbital Pad holds the rocket for a static fire. The rocket rolls here from ${wikiPlace("mega_bay", "Mega Bay")}.`,
        `Static fire draws ${rocket.sfProp} propellant. It spends no steel, and it takes no days. The fire holds when ${wikiPageLink("thrust", "thrust")}, the pad, ${wikiPageLink("propellant", "propellant")}, and the wind are inside the limits.`,
        `Return to ${wikiPlace("mega_bay", "Mega Bay")} rolls the rocket back along the yard road. That trip takes ${roll}. It spends no steel and no propellant.`,
        `Pad level 2 costs ${TUNING.PAD_L2_COST} steel and takes no days. The thrust limit rises from ${TUNING.PAD_THRUST_L1} kilonewtons (kN) to ${TUNING.PAD_THRUST_L2} kN. The wind limit rises from ${TUNING.WIND_LIMIT_L1} knots to ${TUNING.WIND_LIMIT_L2} knots.${shorten}`,
        `After the fire, the rocket waits in ${wikiPlace("mega_bay", "Mega Bay")}. ${wikiPageLink("engines", "Engines and wear")} explains the life that burn takes off the Merlin.`,
      ]) + wikiFacts([
        { value: `${rocket.sfProp} propellant`, label: "Drawn by a static fire" },
        { value: `${TUNING.PAD_L2_COST} steel`, label: "Pad level 2" },
        { value: `${TUNING.PAD_THRUST_L1} kN`, label: "Thrust limit before the upgrade" },
        { value: `${TUNING.PAD_THRUST_L2} kN`, label: "Thrust limit after the upgrade" },
      ]) + wikiReal([
        `The real Falcon 1 flew from Omelek Island in Kwajalein. This pad stands at Starbase.`,
        `The ${wikiSource("page")} names that island.`,
      ]),
    };
  }

  function wikiArticles() {
    const falcon = wikiFalconOn();
    const pages = [
      falcon ? wikiLaunch() : null,
      falcon ? wikiThrust() : null,
      falcon ? wikiImpulse() : null,
      falcon ? wikiEquation() : null,
      falcon ? wikiPropellant() : null,
      falcon ? wikiEngines() : null,
      wikiTime(),
    ].filter(Boolean);
    if (buildingOfType("starfactory")) pages.push(wikiStarfactory());
    if (buildingOfType("mega_bay")) pages.push(wikiBay());
    if (buildingOfType("pad_orbital")) pages.push(wikiPad());
    return pages;
  }

  function renderWiki() {
    const panel = document.getElementById("wiki-panel");
    const sheet = document.getElementById("wiki-sheet");
    if (!panel || !sheet) return;
    const pages = wikiArticles();
    const page = pages.find((p) => p.id === G.wikiPage) || pages[0];
    let nav = "";
    let group = "";
    pages.forEach((p) => {
      if (p.group && p.group !== group) {
        group = p.group;
        nav += `<div class="wiki-group">${esc(group)}</div>`;
      }
      nav += `<button type="button" class="wiki-topic${page && p.id === page.id ? " on" : ""}" data-wiki="${esc(p.id)}">${esc(p.title)}</button>`;
    });
    const article = page
      ? `<h2>${esc(page.title)}</h2>${page.body}`
      : `<p>Nothing on this list is unlocked yet.</p>`;
    const placed = ["starfactory", "mega_bay", "pad_orbital"].map((t) => (buildingOfType(t) ? "1" : "0")).join("");
    const sig = `${page ? page.id : ""}|${wikiUpperOn()}|${wikiFalconOn()}|${placed}|${MS_PER_DAY}|${JSON.stringify(TUNING)}|${ROCKET_DEFS.falcon1.steelCost}|${ROCKET_DEFS.falcon1.sfProp}`;
    if (panel.dataset.sig !== sig) {
      panel.dataset.sig = sig;
      panel.innerHTML = `<div class="top"><div class="left">Wiki</div><button type="button" id="wiki-close">Close</button></div>
        <div class="wiki-split"><div class="wiki-nav">${nav}</div><div class="wiki-read">${article}</div></div>`;
      const close = panel.querySelector("#wiki-close");
      if (close) close.onclick = () => { G.wikiSheet = false; renderWiki(); };
      panel.querySelectorAll("[data-wiki]").forEach((btn) => {
        btn.onclick = () => { G.wikiPage = btn.getAttribute("data-wiki"); renderWiki(); };
      });
    }
    sheet.classList.toggle("open", G.wikiSheet);
    sheet.setAttribute("aria-hidden", G.wikiSheet ? "false" : "true");
  }

  function renderFleetList() {
    const panel = document.getElementById("fleet-panel");
    const sheet = document.getElementById("fleet-sheet");
    if (!panel || !sheet) return;
    const list = liveFleet();
    const rows = list.length
      ? list.map((v) => {
        const sel = v.id === G.selectedVehicleId ? " sel" : "";
        return `<button type="button" class="fleet-row${sel}" data-vid="${v.id}">
          <div class="name">${esc(v.name)}</div>
          <div class="meta">${esc(placeLabel(v))} · condition ${Math.round(v.condition)}</div>
        </button>`;
      }).join("")
      : `<p class="fleet-empty">No vehicles yet. Build one at Starfactory.</p>`;
    panel.innerHTML = `<div class="top"><div class="left">${list.length}<span>${list.length === 1 ? "vehicle" : "vehicles"}</span></div>
      <button type="button" id="fleet-close">Close</button></div>${rows}`;
    sheet.classList.toggle("open", G.fleetSheet);
    sheet.setAttribute("aria-hidden", G.fleetSheet ? "false" : "true");
    const close = panel.querySelector("#fleet-close");
    if (close) close.onclick = () => { G.fleetSheet = false; renderFleetList(); };
    panel.querySelectorAll("[data-vid]").forEach((row) => {
      row.onclick = () => {
        G.selectedVehicleId = +row.getAttribute("data-vid");
        G.fleetSheet = false;
        G.rocketSheet = G.selectedVehicleId;
        const v = selectedVehicle();
        if (v && v.buildingId) G.selectedId = v.buildingId;
        renderChrome();
      };
    });
  }

  function placeLabel(v) {
    const m = G.rollout && G.rollout.vehicleId === v.id ? G.rollout : null;
    if (m && m.kind === "raise") return "Raising onto the mount";
    if (m && m.kind === "lower") return "Lowering onto the transporter";
    if (v.status === "in_bay") return `Bay slot ${(v.baySlot || 0) + 1}`;
    if (v.status === "at_factory") return "At the factory";
    if (v.status === "on_pad" || v.status === "needs_return") return "On the pad";
    if (v.status === "refurb") return `Refurb · ${dayCount(v.refurbLeft)} left`;
    if (v.status === "rolling") return "On the road";
    return v.status;
  }

  function motionLine(m, v) {
    const name = v ? v.name : "Vehicle";
    const left = Math.max(0, m.duration - m.t).toFixed(0);
    if (m.kind === "raise") return `${name} is raising onto the mount · ${left} s left`;
    if (m.kind === "lower") return `${name} is lowering onto the transporter · ${left} s left`;
    const dest = m.destKind === "pad" ? "the Orbital Pad" : "Mega Bay";
    return `${name} is rolling to ${dest} · ${left} s left`;
  }

  function actCard(cls, id, extra, name, price, unit, line) {
    const idAttr = id ? ` id="${id}"` : "";
    const priceHtml = price == null ? "" : `<div class="price">${price}</div><div class="unit">${unit}</div>`;
    const lineHtml = line ? `<div class="line">${line}</div>` : "";
    return `<button type="button" class="act ${cls}"${idAttr}${extra || ""}>
      <div class="name">${name}</div>${priceHtml}${lineHtml}
    </button>`;
  }

  function renderInspector() {
    const box = el.inspector;
    if (G.placeType) {
      const d = defOf(G.placeType);
      box.innerHTML = `<div class="text-amber-200 font-semibold">Placing: ${esc(d.name)}</div>
        <p class="text-amber-200/60">${esc(d.blurb)}</p>
        <button type="button" class="ui-btn rounded px-2 py-1 text-[11px]" id="btn-x">Cancel</button>`;
      box.querySelector("#btn-x").onclick = () => {
        G.placeType = null; canvas.classList.remove("placing"); renderPalette(); renderInspector();
      };
      return;
    }

    const b = buildingById(G.selectedId);
    if (!b) {
      box.innerHTML = `<p class="text-amber-200/55">Select Starfactory, Mega Bay, or the Orbital Pad.</p>`;
      return;
    }
    const d = defOf(b.type);
    let html = `<div class="bldg"><div class="title">${esc(d.name)}</div><p class="blurb">${esc(d.blurb)}</p>`;

    if (b.type === "starfactory") {
      const hold = factoryHold();
      html += `<div class="stat"><div class="k">Holding</div><div class="n">${hold ? 1 : 0}</div><div class="s">of 1 finished vehicle</div></div>`;
      if (G.factoryJob) {
        const pct = 1 - G.factoryJob.daysLeft / G.factoryJob.totalDays;
        const label = G.factoryJob.kind === "merlin" ? "Merlin thrust" : rocketOf(G.factoryJob.rocketId).name;
        html += `<p class="wait">${esc(label)} · ${dayCount(G.factoryJob.daysLeft)} left</p>
          <div class="bar-track"><i style="width:${Math.round(pct * 100)}%"></i></div>`;
      } else {
        const r = rocketOf("falcon1");
        const busy = !!(factoryHold() || G.event || G.rollout);
        html += actCard("build", "", ` data-rocket="falcon1"${busy || G.steel < r.steelCost ? " disabled" : ""}`,
          "Build Falcon 1", r.steelCost, "steel", `${daySpan(TUNING.BUILD_DAYS_MIN, TUNING.BUILD_DAYS_MAX)}. A static fire draws ${r.sfProp} propellant.`);
        html += `<p class="wait">Falcon 9, Falcon Heavy, and Starship come later.</p>`;
      }
      if (hold) {
        html += `<p class="wait">${esc(hold.name)} is ready.</p>`;
        html += actCard("roll", "btn-stage", "", "Roll to Mega Bay", null, "", "The vehicle leaves the factory.");
      }
    }

    if (b.type === "mega_bay") {
      const n = bayCount();
      const cap = bayCapacity(b);
      html += `<div class="stat"><div class="k">Housed</div><div class="n">${n}</div><div class="s">of ${cap} ${cap === 1 ? "vehicle" : "vehicles"}</div></div>`;
      const here = vehiclesAt(b.id);
      for (let slot = 0; slot < cap; slot++) {
        const v = here.find((item) => (item.baySlot || 0) === slot);
        if (!v) {
          html += `<div class="bay-slot empty"><div class="top"><span class="name">Bay ${slot + 1}</span></div><div class="n">—</div></div>`;
          continue;
        }
        const refurb = v.status === "refurb";
        const sel = v.id === G.selectedVehicleId ? " sel" : "";
        const cond = Math.round(v.condition);
        html += `<button type="button" class="bay-slot${sel}" data-bay="${v.id}">
          <div class="top"><span class="name">${esc(v.name)}</span><span class="where">${refurb ? "Refurb" : "In the bay"}</span></div>
          <div class="n">${refurb ? v.refurbLeft : cond}</div>
          <div class="where">${refurb ? (v.refurbLeft === 1 ? "day left" : "days left") : "condition"}</div>
          <div class="meter"><i style="width:${cond}%"></i></div>
        </button>`;
      }
      const v = selectedVehicle();
      if (v && v.status === "in_bay") {
        html += actCard("roll", "btn-topad", "", `Roll ${esc(v.name)} to the pad`, null, "", "The vehicle leaves the bay.");
      } else {
        html += `<p class="wait">Select a vehicle in the bay to roll it out.</p>`;
      }
      html += `<div class="sec"><div class="k">Upgrade</div>`;
      if (cap < TUNING.BAY_MAX) {
        html += actCard("up", "btn-bay", "", "Another slot", TUNING.BAY_SLOT_COST, "steel", `The bay then holds ${cap + 1} vehicles.`);
      } else {
        html += `<p class="wait">The bay holds ${TUNING.BAY_MAX} vehicles.</p>`;
      }
      html += `</div>`;
    }

    if (b.type === "pad_orbital") {
      const limits = padLimits(b);
      html += `<div class="stat"><div class="k">Thrust limit</div><div class="n">${limits.thrust}</div><div class="s">kN</div></div>`;
      html += `<div class="sec"><div class="k">Fire</div>`;
      const on = padHold();
      const moving = G.rollout && on && G.rollout.vehicleId === on.id ? G.rollout : null;
      if (moving && (moving.kind === "raise" || moving.kind === "lower")) {
        html += `<p class="wait">${esc(motionLine(moving, on))}</p>`;
      } else if (G.rollout && G.rollout.kind === "fire" && on && G.rollout.vehicleId === on.id) {
        html += `<p class="wait">The static fire is burning.</p>`;
      } else if (on && on.status === "on_pad") {
        const r = rocketOf(on.rocketId);
        const check = fireCheck(on, b);
        html += `<div class="facts"><div><b>${esc(on.name)}</b><span>condition ${Math.round(on.condition)} · ${on.fires || 0} fires</span></div><div><b>${check.thrust}</b><span>kN · needs ${TUNING.SF_THRUST_BAR_KN}</span></div></div>`;
        html += `<p class="wait">Condition under ${TUNING.SCRAP_FLOOR} scraps the vehicle. A miss takes ${TUNING.SF_MISS_CONDITION} condition.</p>`;
        const fireLine = check.ok ? "Thrust holds." : check.limiter === "weather" ? "The range is closed." : "A check is short.";
        html += actCard("fire", "btn-sf", "", check.ok ? "Static fire" : "Try static fire", r.sfProp, "propellant", fireLine);
      } else if (on && on.status === "needs_return") {
        html += `<div class="facts"><div><b>${esc(on.name)}</b><span>condition ${Math.round(on.condition)} · ${on.fires || 0} fires</span></div></div>`;
        html += actCard("roll", "btn-return", "", "Return to Mega Bay", null, "", "Refurb happens in the bay.");
      } else if (G.rollout && G.rollout.kind === "roll" && G.rollout.destKind === "pad") {
        html += `<p class="wait">${esc(motionLine(G.rollout, vehicleById(G.rollout.vehicleId)))}</p>`;
      } else {
        html += `<p class="wait">The pad is empty. Roll a vehicle here from the bay.</p>`;
      }
      html += `</div>`;
      html += `<div class="sec"><div class="k">Upgrade</div>`;
      if (b.level < 2) {
        html += actCard("up", "btn-up", "", "Pad level 2", TUNING.PAD_L2_COST, "steel", `The trench widens. The thrust limit becomes ${TUNING.PAD_THRUST_L2} kN.`);
      } else {
        html += `<p class="wait">The trench is wide. The thrust limit is ${TUNING.PAD_THRUST_L2} kN.</p>`;
      }
      html += `</div>`;
    }
    const padMotion = b.type === "pad_orbital" && G.rollout && (G.rollout.kind === "raise" || G.rollout.kind === "lower" || G.rollout.kind === "fire" || G.rollout.destKind === "pad");
    if (G.rollout && G.rollout.kind !== "fire" && !padMotion) {
      html += `<p class="wait">${esc(motionLine(G.rollout, vehicleById(G.rollout.vehicleId)))}</p>`;
    }
    html += `</div>`;

    box.innerHTML = html;
    box.querySelectorAll("[data-rocket]").forEach((btn) => {
      btn.onclick = () => startBuildRocket(btn.getAttribute("data-rocket"));
    });
    const st = box.querySelector("#btn-stage");
    if (st) st.onclick = () => stageToBay(factoryHold() && factoryHold().id);
    box.querySelectorAll("[data-bay]").forEach((btn) => {
      btn.onclick = () => {
        G.selectedVehicleId = +btn.getAttribute("data-bay");
        G.rocketSheet = G.selectedVehicleId;
        renderChrome();
      };
    });
    const tp = box.querySelector("#btn-topad");
    if (tp) tp.onclick = () => startRoll(G.selectedVehicleId, "pad");
    const sf = box.querySelector("#btn-sf");
    if (sf) sf.onclick = staticFire;
    const ret = box.querySelector("#btn-return");
    if (ret) ret.onclick = () => startRoll(padHold() && padHold().id, "bay");
    const up = box.querySelector("#btn-up");
    if (up) up.onclick = upgradePad;
    const bayUp = box.querySelector("#btn-bay");
    if (bayUp) bayUp.onclick = upgradeBay;
  }

  function renderObjectives() {
    const items = [
      ["place_all", "Buy both sites"],
      ["build_rocket", "Build a rocket at Starfactory"],
      ["multi_bay", "House 2 vehicles in Mega Bay"],
      ["static_fire", "Finish a static fire"],
      ["refurb", "Finish a refurb in the bay"],
      ["pad_l2", "Raise the pad to level 2"],
    ];
    const open = items.filter(([k]) => !G.objectives[k]).length;
    const panel = document.getElementById("goal-panel");
    const sheet = document.getElementById("goal-sheet");
    if (!panel || !sheet) return;
    const next = items.find(([k]) => !G.objectives[k]);
    const rows = items.map(([k, label], i) => {
      const done = G.objectives[k];
      const now = next && next[0] === k;
      const cls = done ? "done" : now ? "now" : "";
      const mark = done ? "Done" : now ? "Next" : "";
      return `<div class="goal-row ${cls}"><div class="idx">${String(i + 1).padStart(2, "0")}</div><div><div class="name">${esc(label)}</div>${mark ? `<div class="line">${mark}</div>` : ""}</div></div>`;
    }).join("");
    panel.innerHTML = `<div class="top"><div class="left">${open}<span>${open ? "still open" : "all done"}</span></div>
      <button type="button" id="goal-close">Close</button></div>${rows}`;
    sheet.classList.toggle("open", G.goalSheet);
    sheet.setAttribute("aria-hidden", G.goalSheet ? "false" : "true");
    const close = panel.querySelector("#goal-close");
    if (close) close.onclick = () => { G.goalSheet = false; renderObjectives(); };
  }

  function renderJobNote() {
    const note = document.getElementById("job-note");
    if (!note) return;
    const lines = [];
    const days = (n) => `${dayCount(n)} left`;
    if (G.factoryJob) {
      const job = G.factoryJob;
      if (job.kind === "merlin") {
        const v = vehicleById(job.vehicleId);
        lines.push(`${v ? v.name : "Rocket"} · Merlin thrust to ${TUNING.MERLIN_1C_KN} kN · ${days(job.daysLeft)}`);
      } else if (job.kind === "structure") {
        const v = vehicleById(job.vehicleId);
        lines.push(`${v ? v.name : "Rocket"} · lightening the stage · ${days(job.daysLeft)}`);
      } else {
        lines.push(`Starfactory · building ${rocketOf(job.rocketId).name} · ${days(job.daysLeft)}`);
      }
    }
    if (G.rollout) {
      lines.push(motionLine(G.rollout, vehicleById(G.rollout.vehicleId)));
    }
    if (G.rollout && G.rollout.kind === "fire") {
      const ev = G.rollout;
      const v = vehicleById(ev.vehicleId);
      const phase = ev.phases[ev.phaseIdx];
      const left = phase ? Math.max(0, phase.dur - ev.phaseT) : 0;
      lines.push(`${v ? v.name : "Rocket"} · static fire · ${left.toFixed(0)} s left`);
    }
    for (const v of liveFleet()) {
      if (v.status === "refurb" && v.refurbLeft > 0) {
        lines.push(`${v.name} · refurb in Mega Bay · ${days(v.refurbLeft)}`);
      }
    }
    note.innerHTML = lines.map((line) => `<span>${esc(line)}</span>`).join("");
  }

  function rangeClosed() {
    const sky = weatherOn(G.day);
    const lim = padLimits(buildingOfType("pad_orbital"));
    return rangeShut(sky.storm, sky.wind, lim.wind);
  }

  function renderWeather() {
    const sky = document.getElementById("sky-label");
    const lamp = document.getElementById("range-lamp");
    if (!sky) return;
    const now = weatherOn(G.day);
    const closed = rangeClosed();
    if (lamp) lamp.classList.toggle("closed", closed);
    sky.textContent = closed ? "Range closed" : "Range open";
    const wind = document.getElementById("wind-label");
    if (wind) wind.textContent = `${now.sky} ${now.wind} kn`;
    const readout = document.getElementById("readout");
    if (readout) {
      const pad = buildingOfType("pad_orbital");
      const v = pad && padHold();
      const hold = !!(v && v.status === "on_pad" && !fireCheck(v, pad).ok);
      readout.classList.toggle("hold", closed || hold);
    }
  }

  function startMerlinUpgrade(vehicleId) {
    const v = vehicleById(vehicleId);
    if (!v || v.merlinTier >= 2) return;
    if (G.factoryJob) { log("The factory is already busy.", "warn"); return; }
    if (G.steel < TUNING.MERLIN_UP_COST) { log(`Need ${TUNING.MERLIN_UP_COST} steel.`, "bad"); return; }
    G.steel -= TUNING.MERLIN_UP_COST;
    const upDays = spanDays(TUNING.MERLIN_UP_DAYS_MIN, TUNING.MERLIN_UP_DAYS_MAX);
    G.factoryJob = { kind: "merlin", vehicleId: v.id, daysLeft: upDays, totalDays: upDays };
    log(`Merlin thrust on ${v.name} rises to ${TUNING.MERLIN_1C_KN} kN in ${dayCount(upDays)}.`, "good");
    renderChrome();
  }

  function startStructureLighten(vehicleId) {
    const v = vehicleById(vehicleId);
    if (!v || v.structureTier >= 2) return;
    if (G.factoryJob) { log("The factory is already busy.", "warn"); return; }
    if (G.steel < TUNING.STAGE_LIGHTEN_COST) { log(`Need ${TUNING.STAGE_LIGHTEN_COST} steel.`, "bad"); return; }
    G.steel -= TUNING.STAGE_LIGHTEN_COST;
    const cutDays = spanDays(TUNING.STAGE_LIGHTEN_DAYS_MIN, TUNING.STAGE_LIGHTEN_DAYS_MAX);
    G.factoryJob = { kind: "structure", vehicleId: v.id, daysLeft: cutDays, totalDays: cutDays };
    log(`Stage dry mass on ${v.name} falls in ${dayCount(cutDays)}.`, "good");
    renderChrome();
  }

  function renderRocketSheet() {
    const sheet = document.getElementById("rocket-sheet");
    const panel = document.getElementById("rocket-panel");
    const v = G.rocketSheet ? vehicleById(G.rocketSheet) : null;
    if (!sheet || !panel || !v) {
      if (sheet) { sheet.classList.remove("open"); sheet.setAttribute("aria-hidden", "true"); }
      G.rocketSheet = null;
      return;
    }
    const merlinJob = G.factoryJob && G.factoryJob.kind === "merlin" && G.factoryJob.vehicleId === v.id ? G.factoryJob : null;
    const structureJob = G.factoryJob && G.factoryJob.kind === "structure" && G.factoryJob.vehicleId === v.id ? G.factoryJob : null;
    const dry = stageDryKg(v);
    let action = "";
    if (merlinJob) action += `<p class="wait">Merlin thrust · ${dayCount(merlinJob.daysLeft)} left</p>`;
    else if ((v.merlinTier || 1) < 2) {
      action += actCard("up", "btn-merlin", G.steel < TUNING.MERLIN_UP_COST ? " disabled" : "",
        "Raise Merlin thrust", TUNING.MERLIN_UP_COST, "steel", `${daySpan(TUNING.MERLIN_UP_DAYS_MIN, TUNING.MERLIN_UP_DAYS_MAX)}. Merlin 1A at ${TUNING.MERLIN_THRUST_KN} kN becomes Merlin 1C at ${TUNING.MERLIN_1C_KN} kN.`);
    }
    if (structureJob) action += `<p class="wait">Stage dry mass · ${dayCount(structureJob.daysLeft)} left</p>`;
    else if ((v.structureTier || 1) < 2) {
      action += actCard("up", "btn-structure", G.steel < TUNING.STAGE_LIGHTEN_COST ? " disabled" : "",
        "Lighten the stage", TUNING.STAGE_LIGHTEN_COST, "steel", `${daySpan(TUNING.STAGE_LIGHTEN_DAYS_MIN, TUNING.STAGE_LIGHTEN_DAYS_MAX)}. Stage dry mass on this rocket falls by ${TUNING.STAGE_LIGHTEN_KG} kg.`);
    } else {
      // The used card stays so the player sees the upgrade happened and cannot repeat it.
      action += actCard("up", "btn-structure-done", " disabled", "Stage lightened. One cut per rocket.", null, "",
        `Dry mass on this rocket is ${TUNING.STAGE_LIGHTEN_KG} kg lower.`);
    }

      <p class="wait">${payloadWhyLine(v)}</p>${action}`;

  function syncCamFromGeo() {
    if (!W) return;
    const MW = MAP_W * CELL, MH = MAP_H * CELL;
    const cx = (G.lon - GEO_W) / (GEO_E - GEO_W) * MW;
    const cy = (GEO_N - G.lat) / (GEO_N - GEO_S) * MH;
    const worldW = G.span / (GEO_E - GEO_W) * MW;
    G.cam.zoom = W / worldW;
    G.cam.x = cx - (W * 0.5) / G.cam.zoom;
    G.cam.y = cy - (H * 0.5) / G.cam.zoom;
  }

  function draw() {
    if (!W) return;
    syncCamFromGeo();
    ctx.clearRect(0, 0, W, H);
    const band = viewBand();
    if (band === "World") {
      drawGlobe();
      drawCountryBorders("globe");
      drawCountryNames("globe");
      drawSiteDots("globe");
      drawGeoReadout();
      updateFieldChrome(band);
      return;
    }
    drawFlatLand();
    if (band === "Region") {
      drawCountryBorders("flat");
      drawCountryNames("flat");
      drawSiteDots("flat");
    }
    ctx.save();
    ctx.scale(G.cam.zoom, G.cam.zoom);
    ctx.translate(-G.cam.x, -G.cam.y);

    if (band !== "Region") drawSiteRoad();

    if (G.placeType && G._hover) {
      const def = defOf(G.placeType);
      const ok = canPlace(G.placeType, G._hover.gx, G._hover.gy).ok;
      drawBldg(G._hover.gx, G._hover.gy, def, 1, ok ? "ok" : "bad", false);
    }

    for (const b of G.buildings) {
      drawBldg(b.gx, b.gy, defOf(b.type), b.level, b.id === G.selectedId ? "sel" : "n", true);
    }

    // vehicles
    for (const v of liveFleet()) {
      const m = G.rollout && G.rollout.vehicleId === v.id ? G.rollout : null;
      if (m && m.kind === "roll") {
        ctx.strokeStyle = "rgba(232,200,100,0.4)";
        ctx.lineWidth = 2; ctx.setLineDash([6, 6]);
        ctx.beginPath();
        m.pts.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
        ctx.stroke(); ctx.setLineDash([]);
        drawVeh(v.wx, v.wy, v);
      } else if (v.buildingId || m) {
        drawVeh(v.wx, v.wy, v);
      }
    }
    if (G.rollout && G.rollout.kind === "fire") {
      const ev = G.rollout;
      const v = vehicleById(ev.vehicleId);
      if (v) {
        const phase = ev.phases[ev.phaseIdx];
        const pid = phase ? phase.id : "";
        if (pid === "ignition" || pid === "burn" || pid === "shutdown" || pid === "anomaly") {
          drawFlame(v.wx, v.wy, ev.t, pid);
        }
        drawFireWord(v.wx, v.wy, ev);
      }
    }

    ctx.restore();
    if (band === "Site" || band === "Work") drawTractLines();
    drawGeoReadout();
    updateFieldChrome(band);
  }

  function lonToX(lon) {
    return (lon - GEO_W) / (GEO_E - GEO_W) * MAP_W * CELL;
  }
  function latToY(lat) {
    return (GEO_N - lat) / (GEO_N - GEO_S) * MAP_H * CELL;
  }
  function traceRing(ring, move) {
    let started = false;
    for (const p of ring) {
      const x = lonToX(p[0]), y = latToY(p[1]);
      if (!started) { move(true, x, y); started = true; }
      else move(false, x, y);
    }
  }
  function fillRings(rings, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    for (const ring of rings) traceRing(ring, (start, x, y) => start ? ctx.moveTo(x, y) : ctx.lineTo(x, y));
    ctx.fill();
  }
  function strokeRings(rings, color, width) {
    ctx.strokeStyle = color;

    const φ0 = G.lat * Math.PI / 180;
    const λ0 = G.lon * Math.PI / 180;
    const sinφ = Math.sin(φ0), cosφ = Math.cos(φ0);
    for (let py = 0; py < S; py++) {
      for (let px = 0; px < S; px++) {
        const dx = (px + 0.5) / S * 2 - 1;
        const dy = 1 - (py + 0.5) / S * 2;
        const r2 = dx * dx + dy * dy;
        const i = (py * S + px) * 4;
        if (r2 > 1) continue;
        const z = Math.sqrt(1 - r2);
        const lat = Math.asin(Math.max(-1, Math.min(1, z * sinφ + dy * cosφ))) * 180 / Math.PI;
        const lon = (λ0 + Math.atan2(dx, z * cosφ - dy * sinφ)) * 180 / Math.PI;
        const land = maskLand(lon, lat);
        d[i] = land ? 47 : 11;
        d[i + 1] = land ? 106 : 58;
        d[i + 2] = land ? 60 : 74;
        d[i + 3] = 255;
      }
    }
    g.putImageData(img, 0, 0);
    ctx.drawImage(c, W * 0.5 - R, H * 0.5 - R, R * 2, R * 2);
  }

  function toScreen(lon, lat) {
    if (viewBand() === "World") return projectGlobe(lon, lat);
    return projectFlat(lon, lat);
  }

  function drawGeoReadout() {
    const heading = 90;
    // The burn holds the rocket down, so the map pitch stays at 90.
    const pitch = 90;
    const dLon = 50 / (111.32 * Math.cos(PAD_LAT * Math.PI / 180));
    const endLon = PAD_LON + dLon;
    ctx.save();
    const ns = G.lat >= 0 ? "N" : "S";
    const ew = G.lon >= 0 ? "E" : "W";
    ctx.fillStyle = "#f2f2f2";
    ctx.font = "12px ui-monospace, monospace";
    ctx.fillText(`View ${Math.abs(G.lat).toFixed(3)}° ${ns}  ${Math.abs(G.lon).toFixed(3)}° ${ew}`, 12, H - 52);
    ctx.fillText(`Pad ${PAD_LAT.toFixed(3)}° N  ${Math.abs(PAD_LON).toFixed(3)}° W`, 12, H - 34);
    ctx.fillText(`Heading ${heading}°  pitch ${pitch.toFixed(0)}°  50 km to ${Math.abs(endLon).toFixed(2)}° W`, 12, H - 16);
    ctx.restore();
  }

  function drawBldg(gx, gy, def, level, mode, label) {
    const x = gx * CELL, y = gy * CELL;
    const w = def.footprint.w * CELL, h = def.footprint.h * CELL;
    const depth = 10 + (level > 1 ? 4 : 0);
    const onScreen = w * G.cam.zoom;
    ctx.fillStyle = "rgba(90, 70, 48, 0.35)";
    ctx.beginPath();
    ctx.ellipse(x + w * 0.5, y + h * 0.62, w * 0.62, h * 0.28, 0, 0, Math.PI * 2);
    ctx.fill();
    let top = "#8c4536", front = "#6d382c";
    if (def.id === "mega_bay") { top = "#3e5560"; front = "#2c3e46"; }
    if (def.id === "pad_orbital") { top = "#8a8680"; front = "#5c5148"; }
    if (mode === "ok") { top = "rgba(140,180,100,0.45)"; front = "rgba(100,140,70,0.45)"; }
    if (mode === "bad") { top = "rgba(180,80,70,0.45)"; front = "rgba(140,50,45,0.45)"; }
    ctx.fillStyle = top; ctx.fillRect(x, y, w, h - depth);
    ctx.fillStyle = front; ctx.fillRect(x, y + h - depth, w, depth);
    if (onScreen > 36 && def.id === "pad_orbital") {
      const tw = level >= 2 ? w * 0.72 : w * 0.42;
      const th = level >= 2 ? 14 : 10;
      ctx.fillStyle = "#2a2a30";
      ctx.fillRect(x + (w - tw) / 2, y + h - depth - th - 4, tw, th);
      const oh = level >= 2 ? 22 : 14;
      ctx.fillStyle = "#c0c0c8";
      ctx.fillRect(x + w / 2 - 7, y + h - depth - th - 4 - oh, 14, oh);
    } else if (onScreen > 36 && def.id === "mega_bay") {
      // multi-bay doors for housing visual
      ctx.fillStyle = "#3a3028";
      const doors = bayCapacity();
      for (let i = 0; i < doors; i++) {
        ctx.fillRect(x + 12 + i * (w / (doors + 0.4)), y + h - depth - 30, w / (doors + 1.5), 28);
      }
      const n = bayCount();
      for (let i = 0; i < doors; i++) {
        ctx.fillStyle = i < n ? "#8fbc6a" : "#3a3028";
        ctx.fillRect(x + 8 + i * 14, y + 8, 10, 6);
      }
    } else if (onScreen > 36 && def.id === "starfactory") {
      ctx.fillStyle = "#4a6a8a";
      ctx.fillRect(x + w * 0.28, y + h - depth - 22, w * 0.44, 18);
      const job = G.factoryJob;
      if (job && job.kind === "rocket") {
        const pct = clamp(1 - job.daysLeft / Math.max(1, job.totalDays), 0.12, 1);
        const rk = rocketOf(job.rocketId);
        drawRocketBody(x + w / 2, y + h * 0.42, rk.color || "#c8d0d8", rk.engines || 1, rk.mapScale || 1, 0, pct);
      } else if (job) {
        ctx.fillStyle = "#d4a84b";
        ctx.fillRect(x + 8, y + 8, w - 16, 5);
      }
    }
    if (mode === "sel") {
      ctx.strokeStyle = "#d4a84b"; ctx.lineWidth = 2;
      ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
    }
    if (label && mode !== "ok" && mode !== "bad" && metersPerPx() < 600 && onScreen > 22) {
      let tag = def.short + (level > 1 ? " L" + level : "");
      if (def.id === "mega_bay") tag += ` ${bayCount()}/${bayCapacity()}`;
      ctx.font = "bold 11px system-ui";
      const tw = ctx.measureText(tag).width;
      ctx.fillStyle = "rgba(255,248,220,0.92)";
      ctx.strokeStyle = "#8a7848";
      ctx.fillRect(x + 4, y - 16, tw + 8, 14);
      ctx.strokeRect(x + 4, y - 16, tw + 8, 14);
      ctx.fillStyle = "#1f1a12";
      ctx.fillText(tag, x + 8, y - 5);
    }
  }

  // 0 lies flat. 1 stands on the mount. The raise is the only climb from flat to vertical.
  const NOSE_UP = -Math.PI / 2;
  function vehPose(v) {
    const m = G.rollout && G.rollout.vehicleId === v.id ? G.rollout : null;
    if (m && m.kind === "raise") return clamp(m.t / m.duration, 0, 1);
    if (m && m.kind === "lower") return 1 - clamp(m.t / m.duration, 0, 1);
    if (m && m.kind === "fire") return 1;
    if (v.status === "on_pad" || v.status === "needs_return") return 1;
    return 0;
  }
  function angleDelta(from, to) {
    let d = to - from;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    return d;
  }
  function pathHeading(pts) {
    for (let i = 0; i < pts.length - 1; i++) {
      const dx = pts[i + 1].x - pts[i].x;
      const dy = pts[i + 1].y - pts[i].y;
      if (dx * dx + dy * dy > 16) return Math.atan2(dy, dx);
    }
    return 0;
  }
  function segmentHeading(r) {
    if (!r.pts || r.pts.length < 2 || !r.segLens) return r.flatHeading || 0;
    let dist = clamp((r.t || 0) / (r.duration || 1), 0, 1) * (r.totalLen || 0);
    let i = 0;
    for (; i < r.segLens.length; i++) {
      if (dist <= r.segLens[i] || i === r.segLens.length - 1) break;
      dist -= r.segLens[i];
    }
    while (i < r.segLens.length - 1 && r.segLens[i] < 4) i++;
    const a = r.pts[i], b = r.pts[i + 1];
    return Math.atan2(b.y - a.y, b.x - a.x);
  }
  function vehAngle(v) {
    const m = G.rollout && G.rollout.vehicleId === v.id ? G.rollout : null;
    if (m && m.kind === "roll") return segmentHeading(m);
    if (m && m.kind === "raise") {
      const pose = clamp(m.t / m.duration, 0, 1);
      const flat = m.flatHeading || 0;
      return flat + angleDelta(flat, NOSE_UP) * pose;
    }
    if (m && m.kind === "lower") {
      const pose = clamp(m.t / m.duration, 0, 1);
      const flat = m.flatHeading == null ? Math.PI : m.flatHeading;
      return NOSE_UP + angleDelta(NOSE_UP, flat) * pose;
    }
    if ((m && m.kind === "fire") || v.status === "on_pad" || v.status === "needs_return") return NOSE_UP;
    return 0;
  }

  function drawRocketBody(x, y, color, engines, scale, angle, lengthScale) {
    const s = scale || 1;
    const grow = lengthScale == null ? 1 : lengthScale;
    const len = 32 * s * grow;
    const thick = (engines === 9 ? 11 : 8) * s;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.fillStyle = color;
    ctx.fillRect(0, -thick / 2, Math.max(4, len), thick);
    if (grow > 0.35) {
      ctx.beginPath();
      ctx.moveTo(len, -thick / 2);
      ctx.lineTo(len + 8 * s, 0);
      ctx.lineTo(len, thick / 2);
      ctx.closePath();
      ctx.fill();
    }
    ctx.fillStyle = "#3a4048";
    ctx.fillRect(-3 * s, -thick * 0.28, 3 * s, thick * 0.56);
    ctx.restore();
  }

  function drawVeh(x, y, v) {
    const r = rocketOf(v.rocketId);
    const s = r.mapScale || 1;
    const pose = vehPose(v);
    const m = G.rollout && G.rollout.vehicleId === v.id ? G.rollout : null;
    const onTransporter = (m && m.kind === "roll") || (m && m.kind === "lower") || (m && m.kind === "raise" && pose < 0.9);
    const len = 32 * s;
    const thick = (r.engines === 9 ? 11 : 8) * s;
    const ang = vehAngle(v);
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(ang);
    if (onTransporter) {
      ctx.globalAlpha = m && m.kind === "raise" ? Math.max(0, 1 - pose) : 1;
      ctx.fillStyle = "#3a342c";
      ctx.fillRect(-4, thick * 0.45, len + 14, 8 * s);
      ctx.globalAlpha = 1;
    }
    if (v.status === "refurb") {
      ctx.strokeStyle = "#d4a84b";
      ctx.strokeRect(-4, -thick / 2 - 4, len + 14, thick + 8);
    }
    if (v.id === G.selectedVehicleId) {
      ctx.strokeStyle = "#d4a84b";
      ctx.lineWidth = 1.5;
      ctx.strokeRect(-5, -thick / 2 - 4, len + 16, thick + 8);
    }
    ctx.restore();
    drawRocketBody(x, y, r.color, r.engines, s, ang, 1);
    ctx.font = "bold 9px system-ui";
    ctx.fillStyle = "rgba(255,248,220,0.92)";
    ctx.fillText(v.name, x - 10, y - (16 + pose * (len - 6)));
  }

  // The flame leaves the base and runs east. The clock is the fire's own time, so Pause holds it.
  function drawFlame(x, y, t, pid) {
    const n = pid === "shutdown" ? 4 : pid === "ignition" ? 7 : 11;
    const reach = pid === "shutdown" ? 18 : pid === "ignition" ? 28 : pid === "anomaly" ? 52 : 40;
    for (let i = 0; i < n; i++) {
      const oy = Math.sin(t * 11 + i * 1.7) * 4;
      const len = reach * (0.45 + (i % 5) * 0.14);
      ctx.fillStyle = i % 2 ? "rgba(255,120,30,0.9)" : "rgba(255,210,90,0.8)";
      ctx.beginPath();
      ctx.moveTo(x, y + oy - 3);
      ctx.lineTo(x + len, y + oy);
      ctx.lineTo(x, y + oy + 3);
      ctx.fill();
    }
  }

  function burnStarted(ev) {
    const phase = ev.phases && ev.phases[ev.phaseIdx];
    const pid = phase ? phase.id : "";
    return pid === "ignition" || pid === "burn" || pid === "shutdown" || pid === "anomaly" || pid === "debrief" || pid === "fail";
  }
  function drawFireWord(x, y, ev) {
    if (!burnStarted(ev)) return;
    const word = ev.success ? "Held" : (ev.limiter === "pad" ? "Pad" : "Engine");
    ctx.font = "bold 12px system-ui";
    ctx.fillStyle = ev.success ? "#c8e2a8" : "#e09080";
    ctx.fillText(word, x - 8, y - 54);
  }

  // ── Input ──
  function canvasPos(ev) {
    const r = canvas.getBoundingClientRect();
    return { x: ev.clientX - r.left, y: ev.clientY - r.top };
  }
  function hitBldg(wx, wy) {
    for (let i = G.buildings.length - 1; i >= 0; i--) {
      const b = G.buildings[i], d = defOf(b.type);
      const x0 = b.gx * CELL, y0 = b.gy * CELL;
      if (wx >= x0 && wx < x0 + d.footprint.w * CELL && wy >= y0 && wy < y0 + d.footprint.h * CELL) return b;
    }
    return null;
  }
  function hitVeh(wx, wy) {
    for (let i = liveFleet().length - 1; i >= 0; i--) {
      const v = liveFleet()[i];
      if (Math.hypot(wx - v.wx, wy - v.wy) < 18) return v;
    }
    return null;
  }

  const pointers = new Map();
  let pinch = null;
  function setSpan(next) {
    G.span = clamp(next, 0.008, 1200);
    G.lat = clamp(G.lat, -70, 78);
    if (G.lon > 180) G.lon -= 360;
    if (G.lon < -180) G.lon += 360;
    syncCamFromGeo();
  }
  canvas.addEventListener("pointerdown", (ev) => {
    canvas.setPointerCapture(ev.pointerId);
    const p = canvasPos(ev);
    pointers.set(ev.pointerId, p);
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      pinch = { dist: Math.max(12, Math.hypot(a.x - b.x, a.y - b.y)), span: G.span };
      G.drag = null;
      return;
    }
    syncCamFromGeo();
    const w = screenToWorld(p.x, p.y);
    if (G.span < 1.2 && G.placeType) {
      placeBuilding(G.placeType, Math.floor(w.x / CELL), Math.floor(w.y / CELL));
      return;
    }
    if (G.span < 1.2) {
      const hv = hitVeh(w.x, w.y);
      if (hv) {
        G.selectedVehicleId = hv.id;
        if (hv.buildingId) G.selectedId = hv.buildingId;
        renderChrome();
        return;
      }
      const hb = hitBldg(w.x, w.y);
      if (hb) {
        G.selectedId = hb.id;
        renderChrome();
        return;
      }
    }
    G.selectedId = null;
    renderInspector();
    G.drag = { sx: p.x, sy: p.y, lon: G.lon, lat: G.lat };
    canvas.classList.add("panning");
  });
  canvas.addEventListener("pointermove", (ev) => {
    const p = canvasPos(ev);
    if (pointers.has(ev.pointerId)) pointers.set(ev.pointerId, p);
    if (pointers.size >= 2 && pinch) {
      const [a, b] = [...pointers.values()];
      const dist = Math.max(12, Math.hypot(a.x - b.x, a.y - b.y));
      setSpan(pinch.span * (pinch.dist / dist));
      return;
    }
    syncCamFromGeo();
    const w = screenToWorld(p.x, p.y);
    if (G.placeType) G._hover = { gx: Math.floor(w.x / CELL), gy: Math.floor(w.y / CELL) };
    if (G.drag) {
      G.lon = G.drag.lon - (p.x - G.drag.sx) / W * G.span;
      G.lat = G.drag.lat + (p.y - G.drag.sy) / W * G.span;
      setSpan(G.span);
    }
  });
  function endPointer(ev) {
    pointers.delete(ev.pointerId);
    if (pointers.size < 2) pinch = null;
    if (pointers.size === 0) {
      G.drag = null;
      canvas.classList.remove("panning");
    }
  }
  canvas.addEventListener("pointerup", endPointer);
  canvas.addEventListener("pointercancel", endPointer);
  canvas.addEventListener("wheel", (ev) => {
    if (ev.ctrlKey) return;
    ev.preventDefault();
    setSpan(G.span * (ev.deltaY > 0 ? 1.25 : 0.8));
  }, { passive: false });
  window.addEventListener("wheel", (ev) => {
    if (!ev.ctrlKey) return;
    ev.preventDefault();
    setSpan(G.span * Math.exp(ev.deltaY * 0.01));
  }, { passive: false });

  window.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape") {
      if (G.rollout && G.rollout.kind === "fire") { skipEvent(); return; }
      if (G.wikiSheet) { G.wikiSheet = false; renderWiki(); return; }
      if (G.fleetSheet) { G.fleetSheet = false; renderFleetList(); return; }
      if (G.goalSheet) { G.goalSheet = false; renderObjectives(); return; }
      if (G.rocketSheet) { G.rocketSheet = null; renderRocketSheet(); return; }
      G.placeType = null; canvas.classList.remove("placing");
      renderPalette(); renderInspector();
    }
  });
  document.getElementById("wiki-open").addEventListener("click", () => {
    G.wikiSheet = !G.wikiSheet;
    renderWiki();
  });
  document.getElementById("wiki-sheet").addEventListener("click", (ev) => {
    if (ev.target.id !== "wiki-sheet") return;
    G.wikiSheet = false;
    renderWiki();
  });
  el.log.addEventListener("click", (ev) => {
    const btn = ev.target.closest(".log-roll");
    if (btn) stageToBay(Number(btn.getAttribute("data-roll")));
  });
  document.getElementById("day-pause").addEventListener("click", () => {
    G.paused = !G.paused;
    renderResources();
  });
  document.getElementById("fleet-open").addEventListener("click", () => {
    G.fleetSheet = !G.fleetSheet;
    renderFleetList();
  });
  document.getElementById("fleet-sheet").addEventListener("click", (ev) => {
    if (ev.target.id !== "fleet-sheet") return;
    G.fleetSheet = false;
    renderFleetList();
  });
  document.getElementById("next-goal").addEventListener("click", () => {
    G.goalSheet = !G.goalSheet;
    renderObjectives();
  });
  document.getElementById("goal-sheet").addEventListener("click", (ev) => {
    if (ev.target.id !== "goal-sheet") return;
    G.goalSheet = false;
    renderObjectives();
  });
  document.getElementById("rocket-sheet").addEventListener("click", (ev) => {
    if (ev.target.id !== "rocket-sheet") return;
    G.rocketSheet = null;
    renderRocketSheet();
  });
  document.querySelectorAll("#map-chips button").forEach((b) => {
    b.addEventListener("click", () => {
      G.lon = -97.178;
      G.lat = 26.002;
      setSpan(spanForMpp(Number(b.dataset.mpp)));
    });
  });
  document.getElementById("zoom-in").addEventListener("click", () => setSpan(G.span / 1.25));
  document.getElementById("zoom-out").addEventListener("click", () => setSpan(G.span * 1.25));

  let last = performance.now(), inspAcc = 0;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!G.paused) {
      // The burn holds the day. The same clock moves the roll, the raise, the lower, and the flame.
      if (!(G.rollout && G.rollout.kind === "fire")) {
        G.dayAcc += dt * 1000;
        while (G.dayAcc >= MS_PER_DAY) { G.dayAcc -= MS_PER_DAY; dayTick(); }
      }
      updateRollout(dt);
    }
    if (!G.paused && (G.rollout || G.factoryJob)) {
      inspAcc += dt;
      if (inspAcc > 0.3) { inspAcc = 0; renderInspector(); renderResources(); renderFleetList(); renderJobNote(); }
    }
    draw();
    requestAnimationFrame(frame);
  }

  window.addEventListener("resize", () => { resize(); });
  document.getElementById("ver-label").textContent = TEST ? `${VERSION}. Test start.` : VERSION;
  resize();
  G.cam.x = (MAP_W * CELL) / 2 - W / 2;
  G.cam.y = (MAP_H * CELL) / 2 - H / 2;
  renderChrome();
  log("The site starts with a factory, a Mega Bay, and a pad. Steel and propellant come from the yard.", "info");
  log("The bay can hold more than one vehicle. It refurbs a rocket after a static fire. A static fire can fail.", "info");
  requestAnimationFrame(frame);
})();
  </script>
</body>
</html>
