  ctx.fillRect(0, 0, canvas.width, canvas.height);
  for (let i = 0; i < 18; i++) {
    const mx = (hash(i + 3) - 0.4) * 1800000;
    const my = (hash(i + 19) - 0.5) * 1400000;
    const rx = 80000 + hash(i + 40) * 260000;
    const ry = 60000 + hash(i + 60) * 180000;
    ctx.fillStyle = i % 2 ? "rgba(8, 60, 74, 0.45)" : "rgba(40, 130, 140, 0.18)";
    ctx.beginPath();
    ctx.ellipse(X(mx), Y(my), rx / cam.mpp, ry / cam.mpp, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  traceLand();
  ctx.fillStyle = "#e0c99a";
  ctx.fill();
  ctx.save();
  traceLand();
  ctx.clip();
  const patches = [
    ["#c9a56a", 0.35],
    ["#edd7a8", 0.4],
    ["#b98a55", 0.22],
    ["#8ea36a", 0.16]
  ];
  for (let i = 0; i < 70; i++) {
    const mx = (hash(i + 2) - 0.72) * 900000;
    const my = (hash(i + 80) - 0.45) * 700000;
    const rx = 6000 + hash(i + 11) * 42000;
    const ry = 2000 + hash(i + 21) * 9000;
    ctx.fillStyle = patches[i % patches.length][0];
    ctx.globalAlpha = patches[i % patches.length][1];
    ctx.beginPath();
    ctx.ellipse(X(mx), Y(my), Math.max(8, rx / cam.mpp), Math.max(3, ry / cam.mpp), hash(i) * 2.2, 0, Math.PI * 2);
    ctx.fill();
  }
  if (cam.mpp < 400) {
    ctx.globalAlpha = 0.55;
    ctx.strokeStyle = "#6d5a38";
    ctx.lineWidth = 1;
    for (let i = 0; i < 80; i++) {
      const mx = (hash(i + 200) - 0.7) * 40000;
      const my = (hash(i + 260) - 0.4) * 30000;
      const len = 12 + hash(i + 9) * 28;
      ctx.beginPath();
      ctx.moveTo(X(mx), Y(my));
      ctx.lineTo(X(mx + len), Y(my + len * 0.3));
      ctx.stroke();
    }
  }
  ctx.restore();
  ctx.globalAlpha = 1;
  traceLand();
  ctx.strokeStyle = "#f4e7c8";
  ctx.lineWidth = Math.max(1.5, Math.min(10, 80 / cam.mpp));
  ctx.stroke();
}

/* Survey line around the three mains. No fill. Corner pins show up close. */
const OWNED = [[-7200, -1900], [-6900, 1200], [-6400, 4300], [-2600, 4700], [-900, 2600], [550, 500], [350, -1700], [-3000, -2300]];
function traceOwned() {
  ctx.beginPath();
  OWNED.forEach(([x, y], i) => (i ? ctx.lineTo(X(x), Y(y)) : ctx.moveTo(X(x), Y(y))));
  ctx.closePath();
}
function drawOwned() {
  traceOwned();
  ctx.strokeStyle = "rgba(244, 234, 216, 0.9)";
  ctx.lineWidth = 5;
  ctx.stroke();
  traceOwned();
  ctx.strokeStyle = "#8a3e24";
  ctx.lineWidth = 1.75;
  ctx.stroke();
  if (cam.mpp >= 600) return;
  OWNED.forEach(([x, y]) => {
    ctx.beginPath();
    ctx.arc(X(x), Y(y), 3.5, 0, Math.PI * 2);
    ctx.fillStyle = "#f4ead8";
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = "#8a3e24";
    ctx.stroke();
  });
}

function drawCountryBorders(mode) {
  ctx.lineWidth = 1;
  ctx.strokeStyle = mode === "globe" ? "rgba(20, 36, 24, 0.55)" : "rgba(90, 62, 36, 0.55)";
  for (const country of COUNTRIES) {
    for (const ring of country.r) {
      ctx.beginPath();
      let pen = false;
      for (const pair of ring) {
        let p = null;
        if (mode === "globe") p = globePoint(pair[0], pair[1]);
        else {
          const m = toMeter(pair[0], pair[1]);
          p = [X(m[0]), Y(m[1])];
        }
        if (!p) { pen = false; continue; }
        if (!pen) { ctx.moveTo(p[0], p[1]); pen = true; }
        else ctx.lineTo(p[0], p[1]);
      }
      ctx.stroke();
    }
  }
}
function drawCountryNames(mode) {
  ctx.fillStyle = "rgba(36, 24, 15, 0.82)";
  ctx.font = "13px Georgia, serif";
  ctx.textAlign = "center";
  for (const country of COUNTRIES) {
    const big = country.r.some(ring => ring.length > 18);
    if (!big) continue;
    let p = null;
    if (mode === "globe") p = globePoint(country.lon, country.lat);
    else {
      const m = toMeter(country.lon, country.lat);
      p = [X(m[0]), Y(m[1])];
      if (p[0] < 24 || p[1] < 24 || p[0] > canvas.width - 24 || p[1] > canvas.height - 24) continue;
    }
    if (!p) continue;
    ctx.fillText(country.n, p[0], p[1]);
  }
}
function drawDots() {
  SITES.forEach(s => {
    const r = s.open ? 5 : 3.5;
    ctx.beginPath();
    ctx.arc(X(s.x), Y(s.y), r, 0, Math.PI * 2);
    ctx.fillStyle = s.open ? "#c46a3a" : "rgba(196,106,58,0.45)";
    ctx.fill();
  });
}

function box(m) {
  return {
    x: X(m.x),
    y: Y(m.y),
    w: m.w / cam.mpp,
    h: m.h / cam.mpp
  };
}

function strokeBox(x, y, w, h) {
  ctx.strokeStyle = "#24180f";
  ctx.lineWidth = 1.5;
  ctx.strokeRect(x, y, w, h);
}

function drawMains(dimOthers) {
  MAINS.forEach(m => {
    const b = box(m);
    ctx.fillStyle = "rgba(120, 96, 64, 0.35)";
    ctx.beginPath();
    ctx.ellipse(b.x, b.y + b.h * 0.35, b.w * 0.85, b.h * 0.55, 0, 0, Math.PI * 2);
    ctx.fill();
  });
  MAINS.forEach(m => {
    const b = box(m);
    const dim = dimOthers && m.id !== "pad";
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.globalAlpha = dim ? 0.28 : 1;
    if (m.id === "factory") {
      ctx.fillStyle = "#8c4536";
      ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
      strokeBox(-b.w / 2, -b.h / 2, b.w, b.h);
      if (b.w > 28) {
        ctx.fillStyle = "#d7c4a2";
        for (let i = 0; i < 5; i++) ctx.fillRect(-b.w / 2 + 6 + i * (b.w / 6), -2, 4, 3);
        ctx.fillStyle = "#6d5438";
        ctx.fillRect(b.w / 2, -b.h / 4, b.w * 0.22, b.h / 2);
      }
    } else if (m.id === "bay") {
      ctx.fillStyle = "#3e5560";
      ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
      strokeBox(-b.w / 2, -b.h / 2, b.w, b.h);
      if (b.h > 16) {
        ctx.strokeStyle = "#24180f";
        ctx.beginPath();
        ctx.moveTo(-b.w / 2, -b.h / 2 + Math.min(6, b.h * 0.25));
        ctx.lineTo(b.w / 2, -b.h / 2 + Math.min(6, b.h * 0.25));
        ctx.stroke();
      }
    } else {
      ctx.fillStyle = "#8a8680";
      ctx.fillRect(-b.w / 2, -b.h / 2, b.w * 0.62, b.h);
      strokeBox(-b.w / 2, -b.h / 2, b.w * 0.62, b.h);
      ctx.beginPath();
      ctx.moveTo(b.w * 0.12, -b.h * 0.28);
      ctx.lineTo(b.w * 0.55, 0);
      ctx.lineTo(b.w * 0.12, b.h * 0.28);
      ctx.closePath();
      ctx.fillStyle = "#5c5148";
      ctx.fill();
      ctx.stroke();
    }
    ctx.restore();
    if (m.id === selected && !dim && bandAt(cam.mpp) !== "Region" && bandAt(cam.mpp) !== "World") {
      ctx.fillStyle = "#24180f";
      ctx.font = "13px system-ui, sans-serif";
      ctx.fillText(m.name, b.x - b.w / 2, b.y - b.h / 2 - 8);
    }
  });
}

function smoothRoad(pts) {
  let cur = pts;
  for (let pass = 0; pass < 3; pass++) {
    const next = [cur[0]];
    for (let i = 0; i < cur.length - 1; i++) {
      const a = cur[i];
      const b = cur[i + 1];
      next.push([a[0] * 0.75 + b[0] * 0.25, a[1] * 0.75 + b[1] * 0.25]);
      next.push([a[0] * 0.25 + b[0] * 0.75, a[1] * 0.25 + b[1] * 0.75]);
    }
    next.push(cur[cur.length - 1]);
    cur = next;
  }
  return cur;
}
function strokeRoad(pts, widthM, color) {
  ctx.strokeStyle = color;
  ctx.lineWidth = widthM / cam.mpp;
  ctx.lineCap = "butt";
  ctx.lineJoin = "round";
  ctx.beginPath();
  pts.forEach((p, i) => i ? ctx.lineTo(X(p[0]), Y(p[1])) : ctx.moveTo(X(p[0]), Y(p[1])));
  ctx.stroke();
}
/* One inland road. Ends meet a building edge. Nothing runs east of the pad. */
const JUNCTION = [-3600, 1400];
const ROADS = [
  smoothRoad([[-6110, -800], [-5200, -360], [-4500, 400], JUNCTION]),
  smoothRoad([JUNCTION, [-3100, 2100], [-2860, 2800], [-2800, 3155]]),
  smoothRoad([JUNCTION, [-2600, 900], [-1400, 360], [-400, 80], [-55, 0]])
];
function drawRoad() {
  ROADS.forEach(pts => strokeRoad(pts, 16, "#c4a06a"));
  ROADS.forEach(pts => strokeRoad(pts, 9, "#8d7a62"));
}

function drawPadWork() {
  const parts = [
    { kind: "trench", x: 22, y: 0, w: 44, h: 14 },
    { kind: "mount", x: 0, y: 0, w: 16, h: 16 },
    { kind: "plate", x: 6, y: -14, w: 14, h: 10 },
    { kind: "pump", x: -28, y: -16, w: 10, h: 8 },
    { kind: "tank", x: -46, y: 4, r: 8 }
  ];
  parts.forEach(p => {
    const x = X(p.x);
    const y = Y(p.y);
    ctx.fillStyle = p.kind === "tank" ? "#8aa4b0" : p.kind === "trench" ? "#5c5144" : p.kind === "mount" ? "#3d4a44" : "#7f8c86";
    ctx.strokeStyle = "#24180f";
    ctx.lineWidth = 1.5;
    if (p.kind === "tank") {
      ctx.beginPath();
      ctx.arc(x, y, p.r / cam.mpp, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    } else if (p.kind === "trench") {
      const hw = p.w / cam.mpp / 2;
      const hh = p.h / cam.mpp / 2;
      ctx.beginPath();
      ctx.moveTo(x - hw, y - hh);
      ctx.lineTo(x + hw, y - hh * 0.45);
      ctx.lineTo(x + hw, y + hh * 0.45);
      ctx.lineTo(x - hw, y + hh);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    } else {
      const w = p.w / cam.mpp;
      const h = p.h / cam.mpp;
      ctx.fillRect(x - w / 2, y - h / 2, w, h);
      ctx.strokeRect(x - w / 2, y - h / 2, w, h);
    }
  });
  ctx.fillStyle = "#24180f";
  ctx.font = "13px system-ui, sans-serif";
  ctx.fillText("Orbital pad", X(-46), Y(20));
}

function draw() {
  const band = bandAt(cam.mpp);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#c4b48a";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (band === "World") {
    drawGlobe();
    GLOBE_SITES.forEach(s => {
      const p = globePoint(s.lon, s.lat);
      if (!p) return;
      ctx.beginPath();
      ctx.arc(p[0], p[1], s.open ? 5 : 3.5, 0, Math.PI * 2);
      ctx.fillStyle = s.open ? "#c46a3a" : "rgba(196,106,58,0.55)";
      ctx.fill();
    });
    drawCountryBorders("globe");
    drawCountryNames("globe");
  } else if (band === "Region") {
    drawFlatLand();
    drawCountryBorders("flat");
    drawCountryNames("flat");
    drawOwned();
    GLOBE_SITES.forEach(s => {
      const m = toMeter(s.lon, s.lat);
      ctx.beginPath();
      ctx.arc(X(m[0]), Y(m[1]), s.open ? 5 : 3.5, 0, Math.PI * 2);
      ctx.fillStyle = s.open ? "#c46a3a" : "rgba(196,106,58,0.55)";
      ctx.fill();
    });
  } else if (band === "Site") {
    drawFlatLand();
    drawOwned();
    drawRoad();
    drawMains(false);
  } else {
    drawFlatLand();
    drawRoad();
    drawMains(true);
    drawPadWork();
  }
  corner.textContent = band + " · " + fmt(cam.mpp);
  const scale = document.getElementById("scale");
  if (band === "World") scale.style.display = "none";
  else {
    const steps = [100, 200, 500, 1000, 2000, 5000, 10000, 20000, 50000, 100000, 200000, 500000];
    const aim = 110 * cam.mpp;
    let meters = steps[0];
    for (const step of steps) if (step <= aim) meters = step;
    scale.style.display = "flex";
    document.getElementById("scale-bar").style.width = (meters / cam.mpp) + "px";
    document.getElementById("scale-label").textContent = meters >= 1000 ? (meters / 1000) + " km" : meters + " m";
  }
  [...chipRow.children].forEach(b => b.classList.toggle("on", b.textContent === band));
}

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  draw();
}

let drag = null;
let pinching = false;
function touchSpan(touches) {
  return Math.hypot(touches[0].clientX - touches[1].clientX, touches[0].clientY - touches[1].clientY);
}
canvas.addEventListener("pointerdown", e => {
  if (pinching) return;
  drag = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y, lat: globe.lat, lon: globe.lon };
  canvas.classList.add("drag");
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove", e => {
  if (!drag || pinching) return;
  if (bandAt(cam.mpp) === "World") {
    globe.lon = drag.lon - (e.clientX - drag.x) * 0.25;
    globe.lat = Math.max(-85, Math.min(85, drag.lat + (e.clientY - drag.y) * 0.25));
  } else {
    cam.x = drag.cx - (e.clientX - drag.x) * cam.mpp;
    cam.y = drag.cy + (e.clientY - drag.y) * cam.mpp;
  }
  draw();
});
canvas.addEventListener("pointerup", () => {
  drag = null;
  canvas.classList.remove("drag");
});
function zoomBy(factor) {
  cam.mpp = Math.min(40000, Math.max(1.25, cam.mpp * factor));
  draw();
}
document.getElementById("zoom-in").onclick = () => zoomBy(1 / 1.25);
document.getElementById("zoom-out").onclick = () => zoomBy(1.25);
canvas.addEventListener("wheel", e => {
  if (e.ctrlKey) return;
  e.preventDefault();
  zoomBy(e.deltaY > 0 ? 1.25 : 1 / 1.25);
}, { passive: false });
window.addEventListener("wheel", e => {
  if (!e.ctrlKey) return;
  e.preventDefault();
  zoomBy(Math.exp(e.deltaY * 0.01));
}, { passive: false });
let pinch = null;
canvas.addEventListener("touchstart", e => {
  if (e.touches.length !== 2) return;
  e.preventDefault();
  pinching = true;
  drag = null;
  canvas.classList.remove("drag");
  pinch = { span: touchSpan(e.touches), mpp: cam.mpp };
}, { passive: false });
canvas.addEventListener("touchmove", e => {
  if (!pinch || e.touches.length !== 2) return;
  e.preventDefault();
  const span = touchSpan(e.touches);
  cam.mpp = Math.min(40000, Math.max(1.25, pinch.mpp * (pinch.span / span)));
  draw();
}, { passive: false });
canvas.addEventListener("touchend", e => {
  if (e.touches.length >= 2) return;
  pinch = null;
  pinching = false;
});
canvas.addEventListener("click", e => {
  const band = bandAt(cam.mpp);
  if (band !== "Site" && band !== "Work") return;
  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX - rect.left;
  const sy = e.clientY - rect.top;
  let best = null;
  MAINS.forEach(m => {
    const b = box(m);
    const d = Math.hypot(b.x - sx, b.y - sy);
    const reach = Math.max(b.w, b.h) / 2 + 8;
    if (d < reach && (!best || d < best.d)) best = { id: m.id, d };
  });
  if (best) { selected = best.id; draw(); }
});

window.addEventListener("resize", resize);
resize();
</script>
</body>
</html>
