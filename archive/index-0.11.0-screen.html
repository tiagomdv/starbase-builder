<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Starbase Builder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="geo-land.js"></script>
  <script src="design-docs/countries.js"></script>
  <style>
    :root {
      --bg: #050505; --panel: #0a0a0a; --border: #2a2a2a;
      --text: #f2f2f2; --muted: #9a9a9a; --accent: #e10600;
      --good: #3dd68c; --bad: #e10600;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; touch-action: none; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      background: var(--bg); color: var(--text);
    }
    .resource-bar {
      background: #050505;
      border-bottom: 1px solid #222;
      color: #f2f2f2;
      font-family: ui-monospace, Menlo, monospace;
      min-height: 84px;
      padding: 10px 12px;
      box-sizing: border-box;
    }
    #sky-label { font-size: 20px; line-height: 1; font-weight: 650; }
    #wind-label { font-size: 13px; color: #c8c8c8; margin-top: 4px; }
    .stat-k { font-size: 12px; color: #9a9a9a; }
    .day-stat { display: flex; flex-direction: column; align-items: flex-start; }
    .day-row { display: flex; align-items: center; gap: 8px; }
    #day-run { white-space: nowrap; }
    #day-pause {
      min-width: 6.5rem; text-align: center; flex: none; cursor: pointer;
      background: #000; border: 1px solid #333; color: #f2f2f2;
      font: inherit; font-size: 12px; line-height: 1.25; padding: 4px 8px;
    }
    #day-pause:hover, #day-pause:focus { background: #161616; border-color: #666; outline: none; }
    /* Locked design-docs/0.11.0-screen-design.html mock .n / .bs */
    .stat-n { font-size: 40px; line-height: 0.9; font-weight: 650; }
    .resource-bar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: end;
    }
    .bar-left { display: flex; align-items: flex-end; gap: 12px; }
    .bar-mid { display: flex; flex-direction: column; align-items: center; gap: 5px; }
    .bar-stats { display: flex; align-items: flex-end; gap: 18px; }
    .act .pair { display: flex; gap: 14px; margin-top: 6px; }
    .act .pair .price { margin-top: 0; }
    #ver-label { font-size: 11px; line-height: 1; color: #9a9a9a; }
    .range-lamp {
      width: 14px; height: 14px; border-radius: 50%; flex: none; margin-bottom: 6px;
      background: var(--good); box-shadow: 0 0 8px var(--good); display: inline-block;
    }
    .range-lamp.closed { background: var(--bad); box-shadow: 0 0 8px var(--bad); }
    .ui-panel { background: var(--panel); border: 1px solid var(--border); }
    .ui-panel.hold { box-shadow: inset 3px 0 0 var(--bad); }
    .ui-btn {
      background: #000; border: 1px solid #333; color: #f2f2f2;
      transition: background 0.12s, border-color 0.12s, opacity 0.12s;
    }
    .ui-btn:hover:not(:disabled) { background: #161616; border-color: #666; }
    .ui-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .ui-btn.active { background: #140404; border-color: var(--accent); }
    [class*="text-amber"] { color: #f2f2f2 !important; }
    .ui-btn.good { background: #1a2e14; border-color: #3d6e34; color: var(--good); }
    .ui-btn.danger { background: #2a1414; border-color: #8a4040; color: #e8a0a0; }
    .plot-owned { font-size: 11px; color: #c8c8c8; margin-bottom: 8px; }
    .plot-owned b { display: block; color: #f2f2f2; font-size: 13px; font-weight: 650; }
    .plot-card {
      display: block; width: 100%; text-align: left; cursor: pointer;
      background: #0e0e0e; border: 1px solid #f2f2f2; color: #f2f2f2;
      padding: 10px 10px 12px; margin-bottom: 8px;
    }
    .plot-card:hover:not(:disabled) { background: #161616; }
    .plot-card:disabled { opacity: 0.4; cursor: not-allowed; }
    .plot-card .name { font-size: 15px; font-weight: 650; }
    .plot-card .price { font-size: 28px; line-height: 1; font-weight: 650; margin-top: 6px; }
    .plot-card .unit { font-size: 11px; color: #9a9a9a; letter-spacing: 0.08em; text-transform: uppercase; }
    .plot-card .line { font-size: 12px; color: #c8c8c8; margin-top: 8px; }
    .steel-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .steel-buy {
      display: block; text-align: left; cursor: pointer;
      background: #0e0e0e; border: 1px solid #f2f2f2; color: #f2f2f2;
      padding: 6px 7px 7px;
    }
    .steel-buy:hover:not(:disabled) { background: #161616; }
    .steel-buy:disabled { opacity: 0.4; cursor: not-allowed; }
    .steel-buy .name { font-size: 12px; font-weight: 650; }
    .steel-buy .price { font-size: 18px; line-height: 1; font-weight: 650; margin-top: 4px; }
    .steel-buy .unit { font-size: 10px; color: #9a9a9a; letter-spacing: 0.08em; text-transform: uppercase; }
    .steel-rate { font-size: 11px; color: #9a9a9a; margin: 6px 0 8px; }
    .bldg .title { font-size: 16px; font-weight: 650; color: #f2f2f2; }
    .bldg .blurb { font-size: 12px; color: #c8c8c8; margin-top: 4px; }
    .bldg .stat { margin-top: 12px; }
    .bldg .stat .k { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #9a9a9a; }
    .bldg .stat .n { font-size: 32px; line-height: 0.95; font-weight: 650; color: #f2f2f2; }
    .bldg .stat .s { font-size: 12px; color: #c8c8c8; margin-top: 4px; }
    .bldg .wait { font-size: 12px; color: #c8c8c8; margin-top: 8px; }
    .bay-slot {
      display: block; width: 100%; text-align: left; margin-top: 8px; cursor: pointer;
      background: #0e0e0e; border: 1px solid #333; color: #f2f2f2; padding: 8px 10px 10px;
    }
    .bay-slot.sel { border-color: #f2f2f2; }
    .bay-slot.empty { cursor: default; }
    .bay-slot.empty .n { color: #444; }
    .bay-slot .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .bay-slot .name { font-size: 14px; font-weight: 650; }
    .bay-slot .where { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: #9a9a9a; }
    .bay-slot .n { font-size: 26px; line-height: 1; font-weight: 650; margin-top: 6px; }
    .bay-slot .meter { height: 3px; background: #2a2a2a; margin-top: 8px; }
    .bay-slot .meter i { display: block; height: 100%; background: #f2f2f2; }
    .act {
      display: block; width: 100%; text-align: left; cursor: pointer; margin-top: 10px;
      background: #0e0e0e; border: 1px solid #f2f2f2; color: #f2f2f2; padding: 10px;
    }
    .act:hover:not(:disabled) { background: #161616; }
    .act:disabled { opacity: 0.4; cursor: not-allowed; }
    .act.quiet { border-color: #444; }
    .act.stop { border-color: #444; border-left: 3px solid #e10600; }
    .act.build { border-color: #6a8ab0; background: #101418; }
    .act.up { border-color: #c4a15a; background: #16140e; }
    .act.fire { border-color: #e07030; background: #160e0a; }
    .act.roll { border-color: #6a9a8a; background: #0e1412; }
    .sec { margin-top: 16px; }
    .sec .k { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #9a9a9a; }
    .facts { display: flex; gap: 16px; margin-top: 8px; }
    .facts b { display: block; font-size: 22px; line-height: 1; font-weight: 650; color: #f2f2f2; }
    .facts span { font-size: 11px; color: #9a9a9a; }
    .act .name { font-size: 14px; font-weight: 650; }
    .act .price { font-size: 26px; line-height: 1; font-weight: 650; margin-top: 6px; }
    .act .unit { font-size: 11px; color: #9a9a9a; letter-spacing: 0.08em; text-transform: uppercase; }
    .act .line { font-size: 12px; color: #c8c8c8; margin-top: 8px; }
    #rocket-sheet {
      position: fixed; inset: 0; z-index: 40; display: none;
      background: rgba(0, 0, 0, 0.72); align-items: center; justify-content: center; padding: 16px;
    }
    #rocket-sheet.open { display: flex; }
    .rocket-panel {
      width: min(820px, 100%); max-height: calc(100vh - 32px);
      display: flex; flex-direction: column; overflow: hidden;
      background: #0a0a0a; border: 1px solid #333; color: #f2f2f2;
    }
    .rocket-panel .top {
      display: flex; align-items: flex-start; gap: 16px;
      padding: 18px 18px 14px; border-bottom: 1px solid #2a2a2a; flex: 0 0 auto;
    }
    .rocket-panel .total b { display: block; font-size: 48px; line-height: 0.85; font-weight: 650; }
    .rocket-panel .total span {
      display: block; margin-top: 6px; font-size: 11px; letter-spacing: 0.14em;
      text-transform: uppercase; color: #9a9a9a; font-weight: 500;
    }
    .rocket-panel .total em { display: block; margin-top: 4px; font-style: normal; font-size: 12px; color: #c8c8c8; }
    .rocket-panel .total.low b { color: #e10600; }
    .rocket-panel .total.mid b { color: #c4a15a; }
    .rocket-panel .who { flex: 1; min-width: 0; padding-top: 8px; }
    .rocket-panel .who b { font-size: 20px; }
    .rocket-panel .place { font-size: 12px; color: #9a9a9a; margin-top: 4px; }
    #rocket-close {
      background: transparent; border: 0; color: #9a9a9a; cursor: pointer;
      letter-spacing: 0.16em; text-transform: uppercase; font-size: 11px; padding-top: 8px;
    }
    #rocket-close:hover { color: #f2f2f2; }
    .sheet-body { overflow-y: auto; padding: 12px 22px 22px; }
    .plate {
      display: grid; grid-template-columns: minmax(150px, 200px) 1fr;
      gap: 8px 28px; align-items: center;
    }
    .ship { width: 100%; height: min(460px, 54vh); min-height: 320px; display: block; }
    .ship .tag { font: 650 14px system-ui, sans-serif; fill: #f2f2f2; }
    .ship .tag.low { fill: #e10600; }
    .ship .tag.mid { fill: #c4a15a; }
    .ship .hit { cursor: pointer; }
    .plate.look .hit { pointer-events: none; }
    .calls {
      height: min(460px, 54vh); min-height: 320px;
      display: grid; grid-template-rows: 2.4fr 0.95fr 1.15fr; align-items: center;
    }
    .call {
      position: relative; display: block; width: 100%; text-align: left;
      background: transparent; border: 0; color: inherit; font: inherit;
      padding: 0 0 0 18px; cursor: pointer; appearance: none;
    }
    .call::before {
      content: ""; position: absolute; left: 0; top: 50%; width: 12px; height: 1px; background: #444;
    }
    div.call { cursor: default; }
    button.call:disabled { cursor: default; }
    button.call:disabled .job { opacity: 0.4; }
    button.call:hover:not(:disabled) b { color: #ffffff; }
    .call b { display: block; font-size: 16px; font-weight: 650; }
    .call em { display: block; margin-top: 3px; font-style: normal; font-size: 13px; color: #c8c8c8; }
    .call.low em { color: #e10600; }
    .call.mid em { color: #c4a15a; }
    .call .job { margin-top: 4px; font-size: 12px; color: #9a9a9a; }
    .call.hot::before { background: #e10600; width: 22px; }
    .call.hot .job { color: #f2f2f2; }
    .spec {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px 14px;
      margin-top: 18px; padding-top: 14px; border-top: 1px solid #2a2a2a;
    }
    .spec b { display: block; font-size: 15px; font-weight: 650; color: #f2f2f2; }
    .spec span { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: #9a9a9a; }
    .sheet-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
    .sheet-actions .act { margin-top: 0; padding: 8px 10px; }
    .sheet-actions .act .name { font-size: 13px; }
    .sheet-actions .act .price { font-size: 18px; margin-top: 4px; }
    .sheet-actions .act.wide { grid-column: 1 / -1; }
    @media (max-width: 640px) {
      .plate { grid-template-columns: 1fr; }
      .ship, .calls { height: auto; min-height: 0; }
      .ship { height: 300px; }
      .calls { grid-template-rows: auto; gap: 12px; }
      .spec { grid-template-columns: 1fr 1fr; }
      .sheet-actions { grid-template-columns: 1fr; }
    }
    #map-wrap { position: relative; min-width: 0; min-height: 0; background: #07141c; }
    #map { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
    #map-chips, #map-zoom { position: absolute; z-index: 2; display: flex; gap: 6px; }
    #map-corner { position: absolute; left: 10px; top: 10px; z-index: 2; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
    #map-chips { position: static; }
    #job-note { pointer-events: none; display: flex; flex-direction: column; gap: 4px; }
    #job-note:empty { display: none; }
    #job-note span { font-size: 12px; color: #f2f2f2; background: rgba(0,0,0,0.55); padding: 4px 8px; }
    #next-goal, #fleet-open, #wiki-open {
      background: #0e0e0e; border: 1px solid #8a8a8a; color: #e6e6e6; cursor: pointer;
      font-size: 15px; font-weight: 650; letter-spacing: 0.22em; text-transform: uppercase;
    }
    #next-goal, #fleet-open {
      display: block; width: calc(100% - 16px); margin: auto 8px 8px; padding: 12px 14px; text-align: center;
    }
    #wiki-open { align-self: center; margin: 8px; padding: 8px 14px; }
    #next-goal:hover, #next-goal:focus,
    #fleet-open:hover, #fleet-open:focus,
    #wiki-open:hover, #wiki-open:focus {
      color: #f2f2f2; background: #161616; border-color: #f2f2f2; outline: none;
    }
    #wiki-sheet {
      position: fixed; inset: 0; z-index: 40; display: none;
      background: rgba(0, 0, 0, 0.72); align-items: center; justify-content: center; padding: 16px;
    }
    #wiki-sheet.open { display: flex; }
    .wiki-panel {
      width: min(920px, 100%); height: min(640px, calc(100vh - 32px)); max-height: calc(100vh - 32px);
      overflow: hidden; display: flex; flex-direction: column;
      background: #0a0a0a; color: #f2f2f2; padding: 16px 18px 12px;
    }
    .wiki-panel .top { display: flex; justify-content: space-between; align-items: center; }
    .wiki-panel .left { font-size: 22px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 650; }
    #wiki-close { background: transparent; border: 0; color: #9a9a9a; cursor: pointer; letter-spacing: 0.16em; text-transform: uppercase; font-size: 11px; }
    .wiki-split { display: flex; min-height: 0; flex: 1; margin-top: 12px; border-top: 1px solid #2a2a2a; }
    .wiki-nav { width: 210px; flex: 0 0 210px; overflow-y: auto; border-right: 1px solid #2a2a2a; padding: 6px 0; }
    .wiki-topic {
      display: block; width: 100%; text-align: left; background: transparent; color: #f2f2f2;
      cursor: pointer; border: 0; border-left: 2px solid transparent; padding: 8px 12px; font-size: 14px;
    }
    .wiki-topic.on, .wiki-topic:hover { border-left-color: #e10600; background: #161616; }
    .wiki-group {
      padding: 12px 12px 2px; font-size: 11px; letter-spacing: 0.14em;
      text-transform: uppercase; color: #9a9a9a;
    }
    .wiki-read { flex: 1; overflow-y: auto; padding: 4px 4px 12px 18px; }
    .wiki-read h2 { font-size: 22px; font-weight: 650; margin: 8px 0 12px; }
    .wiki-read p { font-size: 15px; line-height: 1.45; color: #d8d8d8; margin: 0 0 10px; }
    .wiki-read a, .wiki-link {
      background: none; border: 0; padding: 0; color: #f2f2f2; text-decoration: underline;
      cursor: pointer; font: inherit;
    }
    .wiki-facts {
      display: flex; flex-wrap: wrap; gap: 12px 18px; margin: 4px 0 14px; padding: 10px 12px;
      background: #141414; border: 1px solid #2a2a2a;
    }
    .wiki-facts div { flex: 1 1 120px; }
    .wiki-facts b { display: block; font-size: 18px; font-weight: 650; color: #f2f2f2; }
    .wiki-facts span { display: block; font-size: 12px; color: #9a9a9a; margin-top: 2px; }
    .wiki-real { margin-top: 8px; padding: 10px 12px; border-left: 3px solid #e10600; background: #120a0a; }
    .wiki-real h3 { font-size: 13px; font-weight: 650; color: #f2f2f2; margin: 0 0 6px; }
    @media (max-width: 700px) {
      .wiki-split { flex-direction: column; }
      .wiki-nav { width: auto; flex: 0 0 auto; max-height: 140px; border-right: 0; border-bottom: 1px solid #2a2a2a; }
    }
    #fleet-sheet {
      position: fixed; inset: 0; z-index: 40; display: none;
      background: rgba(0, 0, 0, 0.72); align-items: center; justify-content: center; padding: 16px;
    }
    #fleet-sheet.open { display: flex; }
    .fleet-panel { width: min(440px, 100%); max-height: min(70vh, 560px); overflow-y: auto; background: #0a0a0a; color: #f2f2f2; padding: 28px 28px 22px; }
    .fleet-panel .top { display: flex; justify-content: space-between; align-items: flex-start; }
    .fleet-panel .left { font-size: 42px; line-height: 0.9; font-weight: 650; }
    .fleet-panel .left span { display: block; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #9a9a9a; font-weight: 500; margin-top: 6px; }
    #fleet-close { background: transparent; border: 0; color: #9a9a9a; cursor: pointer; letter-spacing: 0.16em; text-transform: uppercase; font-size: 11px; }
    #fleet-close:hover { color: #f2f2f2; }
    .fleet-row { display: block; width: 100%; text-align: left; background: transparent; border: 1px solid rgba(242, 242, 242, 0.55); color: #f2f2f2; cursor: pointer; margin-top: 10px; padding: 10px 12px; }
    .fleet-row .name { font-size: 18px; font-weight: 650; }
    .fleet-row .meta { font-size: 12px; color: #9a9a9a; margin-top: 2px; }
    .fleet-row.sel { border-color: #f2f2f2; }
    .fleet-row.sel .name { color: #f2f2f2; }
    .fleet-empty { margin-top: 18px; font-size: 14px; color: #c8c8c8; }
    #goal-sheet {
      position: fixed; inset: 0; z-index: 40; display: none;
      background: rgba(0, 0, 0, 0.72); align-items: center; justify-content: center; padding: 16px;
    }
    #goal-sheet.open { display: flex; }
    .goal-panel { width: min(440px, 100%); background: #0a0a0a; border: 0; color: #f2f2f2; padding: 28px 28px 22px; }
    .goal-panel .top { display: flex; justify-content: space-between; align-items: flex-start; }
    .goal-panel .left { font-size: 42px; line-height: 0.9; font-weight: 650; }
    .goal-panel .left span { display: block; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #9a9a9a; font-weight: 500; margin-top: 6px; }
    #goal-close { background: transparent; border: 0; color: #9a9a9a; cursor: pointer; letter-spacing: 0.16em; text-transform: uppercase; font-size: 11px; }
    #goal-close:hover { color: #f2f2f2; }
    .goal-row { display: flex; gap: 14px; align-items: baseline; margin-top: 10px; padding: 10px 12px; border: 1px solid rgba(242, 242, 242, 0.55); }
    .goal-row .idx { font-size: 12px; color: #9a9a9a; width: 22px; }
    .goal-row .name { font-size: 14px; color: #c8c8c8; }
    .goal-row .line { font-size: 11px; color: #9a9a9a; letter-spacing: 0.08em; text-transform: uppercase; margin-top: 2px; }
    .goal-row.now { border-color: #f2f2f2; }
    .goal-row.now .name { font-size: 22px; font-weight: 650; color: #f2f2f2; }
    .goal-row.done { opacity: 0.4; }
    .goal-row.done .name { text-decoration: line-through; }
    #map-zoom { right: 10px; top: 10px; }
    #flight-panel {
      position: absolute; left: 10px; top: 78px; z-index: 2; display: none;
      min-width: 220px; pointer-events: none;
      background: rgba(0, 0, 0, 0.72); border: 1px solid #2a2a2a;
      color: #f2f2f2; padding: 10px 12px;
      font: 12px ui-monospace, Menlo, monospace;
    }
    #flight-panel.open { display: block; }
    #flight-panel .row { margin-top: 7px; }
    #flight-panel .k { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: #9a9a9a; }
    #flight-panel .n { font-size: 18px; line-height: 1.1; font-weight: 650; color: #f2f2f2; }
    #flight-panel .peak { margin-top: 10px; font-size: 11px; color: #c8c8c8; }
    #map-scale {
      position: absolute; left: 12px; bottom: 72px; z-index: 2; display: none;
      align-items: flex-end; gap: 8px; pointer-events: none;
      font: 12px ui-monospace, monospace; color: #f4ead8;
    }
    #map-scale .bar {
      height: 8px;
      border-left: 2px solid #f4ead8;
      border-right: 2px solid #f4ead8;
      border-bottom: 2px solid #f4ead8;
    }
    #map.placing { cursor: crosshair; }
    #map.panning { cursor: grabbing; }
    #log { font-family: ui-monospace, Menlo, monospace; font-size: 11px; line-height: 1.35; }
    #log .good { color: var(--good); }
    #log .warn { color: var(--accent); }
    #log .bad { color: var(--bad); }
    #log .info { color: var(--muted); }
    #log .log-roll { background: transparent; border: 1px solid currentColor; color: #f2f2f2; font: inherit; padding: 0 6px; margin-left: 6px; cursor: pointer; }
    .swatch {

  function log(msg, kind = "info", opts = {}) {
    G.log.unshift({ msg, kind, roll: opts.roll || null });
    if (G.log.length > 45) G.log.pop();
    el.log.innerHTML = G.log.slice(0, 12).map((e) => {
      const v = e.roll ? vehicleById(e.roll) : null;
      // The button shows only while that rocket still waits in the factory, so an old line cannot roll it twice.
      const btn = v && v.status === "at_factory"
        ? ` <button type="button" class="log-roll" data-roll="${v.id}">Roll ${esc(v.name)} to Mega Bay</button>` : "";
      return `<div class="${e.kind}">${esc(e.msg)}${btn}</div>`;
    }).join("");
  }
  // A count of one reads "1 day", so the player never sees "1 days".
  function dayCount(n) { return n === 1 ? "1 day" : `${n} days`; }
  function daySpan(min, max) { return min === max ? dayCount(min) : `${min} to ${max} days`; }
  function spanDays(min, max) { return min + Math.floor(Math.random() * (max - min + 1)); }
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function defOf(t) { return BUILDING_DEFS[t]; }
  function rocketOf(id) { return ROCKET_DEFS[id] || ROCKET_DEFS.falcon1; }
  function buildingById(id) { return G.buildings.find((b) => b.id === id) || null; }
  function buildingOfType(t) { return G.buildings.find((b) => b.type === t) || null; }
  function countType(t) { return G.buildings.filter((b) => b.type === t).length; }
  function vehicleById(id) { return G.fleet.find((v) => v.id === id) || null; }
  function selectedVehicle() { return vehicleById(G.selectedVehicleId); }
  function liveFleet() { return G.fleet.filter((v) => v.status !== "destroyed"); }
  function vehiclesAt(buildingId) { return liveFleet().filter((v) => v.buildingId === buildingId); }
  function bayCount() {
    const bay = buildingOfType("mega_bay");
    return bay ? vehiclesAt(bay.id).length : 0;
  }
  function bayCapacity(bay) {
    const b = bay || buildingOfType("mega_bay");
    return Math.max(1, Math.min(TUNING.BAY_MAX, (b && b.level) || 1));
  }
  function factoryHold() {
    const f = buildingOfType("starfactory");
    return f ? vehiclesAt(f.id)[0] || null : null;
  }
  function padHold() {
    const p = buildingOfType("pad_orbital");
    return p ? vehiclesAt(p.id)[0] || null : null;
  }
  function motionFor(id) {
    return G.rollouts.find((r) => r.vehicleId === id) || null;
  }
  function motionKind(kind) {
    return G.rollouts.find((r) => r.kind === kind) || null;
  }
  function setMotion(m) {
    const i = G.rollouts.findIndex((r) => r.vehicleId === m.vehicleId);
    if (i >= 0) G.rollouts[i] = m;
    else G.rollouts.push(m);
  }
  function clearMotion(id) {
    G.rollouts = G.rollouts.filter((r) => r.vehicleId !== id);
  }
  // An inbound rocket already owns the slot it will park in.
  function baySlotTaken(bay, slot, ignoreId) {
    if (vehiclesAt(bay.id).some((x) => x.id !== ignoreId && (x.baySlot || 0) === slot)) return true;
    return G.rollouts.some((r) => r.destKind === "bay" && r.destId === bay.id && r.vehicleId !== ignoreId && (r.baySlot || 0) === slot);
  }
  function freeBaySlot(bay, ignoreId) {
    const cap = bayCapacity(bay);
    for (let slot = 0; slot < cap; slot++) {
      if (!baySlotTaken(bay, slot, ignoreId)) return slot;
    }
    return -1;
  }
  function bayLoad(bay) {
    const b = bay || buildingOfType("mega_bay");
    if (!b) return 0;
    const inbound = G.rollouts.filter((r) => r.destKind === "bay" && r.destId === b.id).length;
    return vehiclesAt(b.id).length + inbound;
  }
  // A rocket on the pad, or on the way there, still needs a slot to come home.
  function returnClaim(bay) {
    let n = 0;
    for (const v of liveFleet()) {
      if (v.buildingId === bay.id) continue;
      const m = motionFor(v.id);
      if (m && m.destKind === "bay" && m.destId === bay.id) continue;
      if (v.status === "at_factory") continue;
      if (m && (m.destKind === "pad" || m.kind === "raise" || m.kind === "fill" || m.kind === "fire" || m.kind === "fly")) n++;
      else if (v.status === "on_pad" || v.status === "inspect" || v.status === "ready" || v.status === "flying" || v.status === "needs_return") n++;
    }
    return n;
  }
  function bayHasRoom(bay) {
    return bayLoad(bay) + returnClaim(bay) < bayCapacity(bay);
  }
  // The pad is busy while a rocket is coming in, or while one is rising, lowering, loading, burning, or flying.
  function padBusy() {
    return G.rollouts.some((r) => r.kind === "raise" || r.kind === "lower" || r.kind === "fill" || r.kind === "fire" || r.kind === "fly" || (r.kind === "roll" && r.destKind === "pad"));
  }
  function fluidsMoving() {
    return G.rollouts.some((r) => r.kind === "fill" || r.kind === "fire" || r.kind === "fly");
  }
  // Left in place. The day no longer refills the tanks, so this check no longer gates a refill.
  function farmHeld() {
    return G.rollouts.some((r) => r.kind === "fill" || r.kind === "fire");
  }
  function launchFarmReady() {
    return G.rp1Level >= 2 && G.loxLevel >= 2;
  }
  function countFireDay() {
    G.fireDays.push(G.day);
  }
  function firedLine(v) {
    const left = Math.max(0, Math.round(v && v.merlinLifeS != null ? v.merlinLifeS : 0));
    return `Merlin ${left} of ${TUNING.MERLIN_FIRE_LIMIT_S} seconds.`;
  }
  function partName(key) {
    if (key === "merlin") return "Engine (Merlin)";
    if (key === "fitting") return "Fuel lines";
    return "Structure";
  }
  function partLifeValue(v, key) {
    if (!v) return 0;
    if (key === "merlin") return Math.max(0, v.merlinLifeS || 0);
    if (key === "fitting") return Math.max(0, v.fittingLifeS || 0);
    return Math.max(0, v.stageLife || 0);
  }
  function partLives(v) {
    return {
      merlin: partLifeValue(v, "merlin") / TUNING.MERLIN_FIRE_LIMIT_S,
      fitting: partLifeValue(v, "fitting") / TUNING.FITTING_BURN_S,
      stage: partLifeValue(v, "stage") / 100,
    };
  }
  function lifePct(v, key) {
    const raw = partLives(v)[key] || 0;
    return Math.round(Math.max(0, Math.min(1, raw)) * 100);
  }
  function lifeTone(pct) {
    if (pct < 40) return "low";
    if (pct < 70) return "mid";
    return "";
  }
  function worstPart(v) {
    const lives = partLives(v);

    if (lives.fitting < lives[key]) key = "fitting";
    if (lives.stage < lives[key]) key = "stage";
    return key;
  }
  function rocketPct(v) {
    return lifePct(v, worstPart(v));
  }
  function worstLifeLine(v) {
    const key = worstPart(v);
    return `${lifePct(v, key)}% · ${partName(key)}`;
  }
  function partLifeLabel(v, key) {
    const n = Math.round(partLifeValue(v, key));
    if (key === "merlin") return `${n} of ${TUNING.MERLIN_FIRE_LIMIT_S} s`;
    if (key === "fitting") return `${n} of ${TUNING.FITTING_BURN_S} s`;
    return `${n} of 100`;
  }
  function merlinRefurbDays() {
    const pad = buildingOfType("pad_orbital");
    const cut = pad && pad.level >= 2 ? 1 : 0;
    return Math.max(1, TUNING.REFURB_OK_DAYS - cut);

  function bayPartBusy(exceptId) {
    return liveFleet().some((v) => v.refurbPart && v.id !== exceptId);

  function cellZone(gx, gy) {
    if (gx >= 28 && gy >= 20) return "water";
    if (gy < 12) return "production";
    if (gy < 16) return "corridor";
    if (gx < 22) return "launch";
    return "propellant";
  }
  function isWater() { return false; }
  function buildingAnchor(b, slot = 0) {
    const d = defOf(b.type);
    const baseX = (b.gx + d.footprint.w / 2) * CELL;
    const baseY = (b.gy + d.footprint.h * 0.42) * CELL;
    if (b.type === "mega_bay") {
      const spread = 22;
      const n = bayCapacity(b);
      const i = slot % n;
      return { x: baseX + (i - (n - 1) / 2) * spread, y: baseY };
    }
    return { x: baseX, y: baseY };
  }

  function canPlace(type, gx, gy) {
    const def = defOf(type);
    if (!def) return { ok: false, why: "Unknown" };
    if (countType(type) >= def.maxCount) return { ok: false, why: `Only one ${def.name}` };
    const { w, h } = def.footprint;
    if (gx < 0 || gy < 0 || gx + w > MAP_W || gy + h > MAP_H) return { ok: false, why: "Off map" };
    for (let y = gy; y < gy + h; y++)
      for (let x = gx; x < gx + w; x++)
        if (isWater(x, y)) return { ok: false, why: "Water" };
    for (const b of G.buildings) {
      const d = defOf(b.type);
      if (b.gx < gx + w && b.gx + d.footprint.w > gx && b.gy < gy + h && b.gy + d.footprint.h > gy)
        return { ok: false, why: "Overlap" };
    }
    if (G.steel < def.cost) return { ok: false, why: `Need ${def.cost} steel` };
    return { ok: true };
  }

  function buyPlot(id) {
    const plot = PLOTS[id];
    if (!plot || G.plots[id]) return;
    if (G.steel < plot.cost) { log(`Need ${plot.cost} steel.`, "bad"); return; }
    for (const b of plot.buildings) {
      const check = canPlace(b.type, b.gx, b.gy);
      if (!check.ok && check.why !== `Need ${defOf(b.type).cost} steel`) {
        log(check.why, "bad"); return;
      }
    }
    G.steel -= plot.cost;
    G.plots[id] = true;
    for (const b of plot.buildings) {
      G.buildings.push({ id: G.nextId++, type: b.type, gx: b.gx, gy: b.gy, level: 1 });
      G.selectedId = G.buildings[G.buildings.length - 1].id;
    }
    log(`${plot.name} bought.`, "good");
    updateObjectives();
    renderChrome();
  }

  function placeBuilding(type, gx, gy) {
    const check = canPlace(type, gx, gy);
    if (!check.ok) { log(check.why, "bad"); return; }
    const def = defOf(type);
    G.steel -= def.cost;
    G.buildings.push({ id: G.nextId++, type, gx, gy, level: 1 });
    G.selectedId = G.buildings[G.buildings.length - 1].id;

  function fundGoal(key) {

  function dayTick() {
    G.day++;

      else if (G.factoryJob.kind === "merlin") log(`Merlin thrust · ${dayCount(G.factoryJob.daysLeft)} left`, "info");
      else if (G.factoryJob.kind === "structure") log(`Stage dry mass · ${dayCount(G.factoryJob.daysLeft)} left`, "info");
      else log(`Starfactory · building ${rocketOf(G.factoryJob.rocketId).name} · ${dayCount(G.factoryJob.daysLeft)} left`, "info");

      if (v.status === "inspect" && v.inspectLeft > 0) {

  function startBuildRocket(rocketId) {

    if (!v || v.status !== "at_factory") { log("Select a finished vehicle at the factory", "warn"); return; }
    const cap = bayCapacity(bay);

    if (G.event) { log("Ops busy", "warn"); return; }
    if (!bayHasRoom(bay)) {
      if (returnClaim(bay) > 0 && bayLoad(bay) < cap) {
        log("Leave a bay slot open. A rocket outside the bay still has to come home.", "bad");
      } else {
        log(`Mega Bay is full. It holds ${cap}.`, "bad");
      }
      return;
    }
    const factory = buildingById(v.buildingId) || buildingOfType("starfactory");
    if (!factory) { log("Need Starfactory", "bad"); return; }
    const slot = freeBaySlot(bay, v.id);
    if (slot < 0) {
      log(`Mega Bay is full. It holds ${cap}.`, "bad");
      return;
    }
    const dur = beginRoad(v, factory, bay, "bay", "in_bay", TUNING.ROLLOUT_PX_PER_SEC, slot);
    G.selectedVehicleId = v.id;
    log(`${v.name} rolls to Mega Bay · ${dur.toFixed(1)}s`, "info");
    renderChrome();
  }

  function pathMetrics(pts) {
    const segLens = [];
    let total = 0;
    for (let i = 0; i < pts.length - 1; i++) {
      const len = Math.hypot(pts[i + 1].x - pts[i].x, pts[i + 1].y - pts[i].y);
      segLens.push(len); total += len;
    }
    return { segLens, totalLen: Math.max(total, 1) };
  }
  function pointAlong(pts, segLens, totalLen, u) {
    let dist = clamp(u, 0, 1) * totalLen;
    for (let i = 0; i < segLens.length; i++) {
      if (dist <= segLens[i] || i === segLens.length - 1) {
        const t = segLens[i] < 1e-6 ? 1 : dist / segLens[i];
        return {
          x: pts[i].x + (pts[i + 1].x - pts[i].x) * t,
          y: pts[i].y + (pts[i + 1].y - pts[i].y) * t,
        };
      }
      dist -= segLens[i];
    }
    return pts[pts.length - 1];
  }
  function roadPath(from, to, fromB, toB) {
    const road = fromB && toB ? yardSegment(fromB, toB) : [];
    const pts = [{ x: from.x, y: from.y }].concat(road, [{ x: to.x, y: to.y }]);
    const clean = [pts[0]];
    for (let i = 1; i < pts.length; i++) {
      const p = pts[i], q = clean[clean.length - 1];
      if (Math.hypot(p.x - q.x, p.y - q.y) > 1) clean.push(p);
    }
    return clean;
  }

  // The factory trip uses this too. It does not ask for the pad.
  function beginRoad(v, fromB, toB, destKind, destStatus, speed, slot) {
    const fromA = { x: v.wx, y: v.wy };
    const toA = buildingAnchor(toB, slot || 0);
    const pts = roadPath(fromA, toA, fromB, toB);
    const metrics = pathMetrics(pts);
    const duration = clamp(metrics.totalLen / speed, TUNING.ROLLOUT_MIN_SEC, TUNING.ROLLOUT_MAX_SEC);
    v.buildingId = null;
    v.status = "rolling";
    v.baySlot = slot || 0;
    v.wx = pts[0].x;
    v.wy = pts[0].y;
    setMotion({
      kind: "roll",
      vehicleId: v.id,
      pts,
      segLens: metrics.segLens,
      totalLen: metrics.totalLen,
      t: 0,
      duration,
      destKind,
      destId: toB.id,
      destStatus,
      baySlot: slot || 0,
    });
    return duration;
  }

  function parkVehicle(v, buildingId, slot) {
    v.buildingId = buildingId;
    v.baySlot = slot || 0;
    const b = buildingById(buildingId);
    if (!b) return;
    const a = buildingAnchor(b, v.baySlot);
    v.wx = a.x;
    v.wy = a.y;
  }

  function startRoll(vehicleId, destKind) {
    const v = vehicleById(vehicleId || G.selectedVehicleId);
    if (!v) { log("Select a vehicle", "warn"); return; }
    if (motionFor(v.id)) { log("That rocket is already moving.", "warn"); return; }
    if (G.event) { log("Ops busy", "warn"); return; }
    const pad = buildingOfType("pad_orbital");
    const bay = buildingOfType("mega_bay");
    if (!pad || !bay) { log("Need bay and pad", "bad"); return; }

    if (destKind === "pad") {
      if (v.status !== "in_bay") { log("Only bay-ready vehicles roll to pad", "warn"); return; }
      if (padHold() || padBusy()) { log("Pad occupied — one stack on OLM", "warn"); return; }
      const dur = beginRoad(v, bay, pad, "pad", "on_pad", TUNING.ROLLOUT_PX_PER_SEC, 0);
      log(`${v.name} rollout to pad · ${dur.toFixed(1)}s`, "info");
      renderChrome();
      return;
    }
    if (destKind !== "bay") return;
    if (v.status !== "on_pad" && v.status !== "needs_return" && v.status !== "ready") {
      log("Return to bay from pad after fire", "warn"); return;
    }
    if (bayLoad(bay) >= bayCapacity(bay) && v.buildingId !== bay.id) {
      log("Mega Bay is full.", "bad"); return;
    }
    const slot = freeBaySlot(bay, v.id);
    if (slot < 0) { log("Mega Bay is full.", "bad"); return; }
    v.baySlot = slot;
    // The pad keeps the rocket until the lower finishes, then the road clears the building.
    v.status = "rolling";
    const back = roadPath({ x: v.wx, y: v.wy }, buildingAnchor(bay, slot), pad, bay);
    setMotion({
      kind: "lower",
      vehicleId: v.id,
      t: 0,
      duration: LIFT_SEC,
      destKind: "bay",
      destId: bay.id,
      destStatus: "in_bay",
      baySlot: slot,
      flatHeading: pathHeading(back),
    });
    log(`${v.name} lowers onto the transporter · ${LIFT_SEC.toFixed(1)}s`, "info");
    renderChrome();
  }

  function finishRaise(v, r) {
    parkVehicle(v, r.destId, 0);
    v.status = "on_pad";
    clearMotion(v.id);
    log(`${v.name} on pad — static fire when ready`, "good");
    updateObjectives();
    renderChrome();
  }

  function finishLower(v, r) {
    const pad = buildingOfType("pad_orbital");
    const bay = buildingById(r.destId);
    if (!pad || !bay) { clearMotion(v.id); return; }
    const dur = beginRoad(v, pad, bay, "bay", r.destStatus, TUNING.RETURN_PX_PER_SEC, r.baySlot || 0);
    log(`${v.name} return to bay · ${dur.toFixed(1)}s`, "info");
    renderChrome();
  }

  function arriveRoll(v, r) {
    parkVehicle(v, r.destId, r.baySlot || 0);
    if (r.destStatus === "on_pad") {
      v.status = "rolling";
      setMotion({
        kind: "raise",
        vehicleId: v.id,
        t: 0,
        duration: LIFT_SEC,
        destKind: "pad",
        destId: r.destId,
        destStatus: "on_pad",
        baySlot: 0,
        flatHeading: segmentHeading(r),
      });
      renderChrome();
      return;
    }
    v.status = r.destStatus === "refurb" ? "in_bay" : r.destStatus;
    if (v.status === "in_bay") {
      const bay = buildingById(r.destId);
      const cap = bayCapacity(bay);
      log(`${v.name} is in Mega Bay, slot ${(r.baySlot || 0) + 1} of ${cap}.`, "good");
    }
    clearMotion(v.id);
    updateObjectives();
    renderChrome();
  }

  function updateRollout(dt) {
    // A copy, so one arrival can replace its own motion without skipping the next rocket.
    const list = G.rollouts.slice();
    for (const r of list) {
      if (!G.rollouts.includes(r)) continue;
      const v = vehicleById(r.vehicleId);
      if (!v) { clearMotion(r.vehicleId); continue; }
      if (r.kind === "fire") {
        updateFire(r, dt);
        continue;
      }
      if (r.kind === "fly") {
        updateFly(r, dt);
        continue;
      }
      if (r.kind === "fill") {
        updateFill(r, dt);
        continue;
      }
      r.t += dt;
      if (r.kind === "raise" || r.kind === "lower") {
        if (r.t < r.duration) continue;
        if (r.kind === "raise") finishRaise(v, r);
        else finishLower(v, r);
        continue;
      }
      const u = clamp(r.t / r.duration, 0, 1);
      const p = pointAlong(r.pts, r.segLens, r.totalLen, u);
      v.wx = p.x;
      v.wy = p.y;
      if (u >= 1) arriveRoll(v, r);
    }
  }

  function weatherOn(day) {
    if (TEST && G.skyLock) return G.skyLock;
    const table = [
      { sky: "Clear", wind: 8, storm: false },
      { sky: "Clear", wind: 12, storm: false },
      { sky: "Wind", wind: 24, storm: false },
      { sky: "Clear", wind: 10, storm: false },
      { sky: "Storm", wind: 36, storm: true },
      { sky: "Wind", wind: 22, storm: false },
      { sky: "Clear", wind: 6, storm: false },
      { sky: "Clear", wind: 14, storm: false },
      { sky: "Wind", wind: 26, storm: false },
      { sky: "Storm", wind: 32, storm: true },
    ];
    return table[((day - 1) % table.length + table.length) % table.length];
  }

  function stageDryKg(v) {
    const cut = v && v.structureTier >= 2 ? TUNING.STAGE_LIGHTEN_KG : 0;
    return TUNING.STAGE_DRY_KG - cut;
  }

  // Shared with the wiki example so the two sums cannot drift.
  const G0 = 9.80665;

  // One stage. Thrust sets the burn time, and that time is spent against gravity.
  function payloadToLeo(stageDryKg, engineMassKg, ispS, thrustKn) {
    const prop = TUNING.STAGE_PROP_KG;
    const g0 = G0;
    const dry = stageDryKg + engineMassKg;
    const thrustN = thrustKn * 1000;
    if (dry <= 0 || thrustN <= 0 || prop <= 0) return 0;
    const ve = ispS * g0;
    const gate = TUNING.LEO_DV_MS + g0 * ((prop * ve) / thrustN);
    let lo = 0;
    let hi = 20000;
    let best = 0;
    while (lo <= hi) {
      const p = (lo + hi) >> 1;
      const mf = dry + p;
      const dv = ve * Math.log((mf + prop) / mf);
      if (dv >= gate) { best = p; lo = p + 1; }
      else hi = p - 1;
    }
    return best;
  }

  // The sheet says how much payload the dry-mass cut returns. Same thrust on both sides.
  function payloadWhyLine(v) {
    const cut = TUNING.STAGE_LIGHTEN_KG;
    const thrust = merlinNowKn(v);
    const full = payloadToLeo(TUNING.STAGE_DRY_KG, TUNING.MERLIN_MASS_KG, TUNING.MERLIN_ISP_S, thrust);
    const lit = payloadToLeo(TUNING.STAGE_DRY_KG - cut, TUNING.MERLIN_MASS_KG, TUNING.MERLIN_ISP_S, thrust);
    const gain = lit - full;
    if ((v.structureTier || 1) >= 2) {
      return `Payload rose by ${gain} kg when the stage lost ${cut} kg. One stage gives that dry mass back as payload.`;
    }
    return `Lighten the stage adds ${gain} kg of payload when the stage loses ${cut} kg. One stage gives that dry mass back as payload.`;
  }

  function payloadKg(v) {
    return payloadToLeo(stageDryKg(v), TUNING.MERLIN_MASS_KG, TUNING.MERLIN_ISP_S, merlinNowKn(v));
  }

  function merlinFreshKn(v) {
    return v && v.merlinTier >= 2 ? TUNING.MERLIN_1C_KN : TUNING.MERLIN_THRUST_KN;
  }

  function merlinNowKn(v) {
    return merlinFreshKn(v);
  }

  function padLimits(pad) {
    const l2 = pad && pad.level >= 2;
    return {
      thrust: l2 ? TUNING.PAD_THRUST_L2 : TUNING.PAD_THRUST_L1,
      wind: l2 ? TUNING.WIND_LIMIT_L2 : TUNING.WIND_LIMIT_L1,
    };
  }

  // The range lamp and the fire share this check so the two cannot drift.
  function rangeShut(storm, wind, windLimit) {
    return !!(storm || wind > windLimit);
  }

  // Every short part, in the order a pad would see them.
  function fireShorts(thrust, padThrust, rp1, lox, needRp1, needLox, wind, windLimit, storm) {
    const shorts = [];
    if (rangeShut(storm, wind, windLimit)) shorts.push("weather");
    if (rp1 < needRp1) shorts.push("rp1");
    if (lox < needLox) shorts.push("lox");
    if (thrust > padThrust) shorts.push("pad");
    if (thrust < TUNING.SF_THRUST_BAR_KN) shorts.push("engine");
    return shorts;
  }

  // A scrub cannot light a burn. Weather and a short tank are scrubs. The engine and the pad are burns.
  function isScrub(check) {
    const shorts = check && check.shorts ? check.shorts : [];
    return shorts.some((word) => word === "weather" || word === "rp1" || word === "lox");
  }

  function reasonText(check) {
    const shorts = check && check.shorts && check.shorts.length ? check.shorts : (check && check.limiter ? [check.limiter] : []);
    if (!shorts.length) return "Thrust holds";
    return shorts.map(shortReason).join(". ");
  }

  // Status after a lit fire. The caller writes part life. This does not start a refurb.
  function sfNext(success, merlinLifeS, stageLife) {
    if (success) {
      if ((merlinLifeS || 0) <= 0) return { scrap: false, status: "needs_return", inspectLeft: 0 };
      return { scrap: false, status: "inspect", inspectLeft: TUNING.INSPECT_DAYS };
    }
    if ((stageLife || 0) < TUNING.SCRAP_FLOOR) return { scrap: true, status: "destroyed", inspectLeft: 0 };
    return { scrap: false, status: "needs_return", inspectLeft: 0 };
  }

  // A lit fire spends the 5 second hold on the Merlin. The fuel lines stay put.
  function afterFireLives(v, success, limiter) {
    let merlin = Math.max(0, (v.merlinLifeS || 0) - 5);
    let stage = v.stageLife || 0;
    if (!success && limiter === "engine") merlin = 0;
    if (!success) stage = Math.max(0, stage - TUNING.SF_MISS_CONDITION);
    return { merlin, stage };
  }

  function fireCheck(v, pad) {
    const sky = weatherOn(G.day);
    const limits = padLimits(pad);
    const thrust = merlinNowKn(v);
    const needRp1 = TUNING.SF_RP1_KG;
    const needLox = TUNING.SF_LOX_KG;
    const shorts = fireShorts(thrust, limits.thrust, G.rp1, G.lox, needRp1, needLox, sky.wind, limits.wind, sky.storm);
    const word = shorts[0] || "hold";
    return {
      ok: word === "hold",
      limiter: word === "hold" ? null : word,
      shorts,
      thrust, needRp1, needLox, sky, limits,
    };
  }

  function shortFluidLine(word, kind) {
    const rp1 = kind === "launch" ? TUNING.FLIGHT_RP1_KG : TUNING.SF_RP1_KG;
    const lox = kind === "launch" ? TUNING.FLIGHT_LOX_KG : TUNING.SF_LOX_KG;
    if (word === "lox") return `Liquid oxygen is short. This ${kind === "launch" ? "launch" : "fire"} needs ${lox} kg.`;
    return `RP-1 is short. This ${kind === "launch" ? "launch" : "fire"} needs ${rp1} kg.`;
  }

  function launchCheck(v, pad) {
    const sky = weatherOn(G.day);
    const limits = padLimits(pad);
    const thrust = merlinNowKn(v);
    if (!v || v.status !== "ready") {
      return { ok: false, limiter: "fire", thrust, sky, limits };
    }
    if (!launchFarmReady()) {
      return { ok: false, limiter: "farm", thrust, sky, limits };
    }
    const shorts = fireShorts(thrust, limits.thrust, G.rp1, G.lox, TUNING.FLIGHT_RP1_KG, TUNING.FLIGHT_LOX_KG, sky.wind, limits.wind, sky.storm);
    if ((v.fittingLifeS || 0) < TUNING.FITTING_BURN_S) shorts.push("fitting");
    const word = shorts[0] || "hold";
    return {
      ok: word === "hold",
      limiter: word === "hold" ? null : word,
      shorts,
      thrust, sky, limits,
      needRp1: TUNING.FLIGHT_RP1_KG,
      needLox: TUNING.FLIGHT_LOX_KG,
    };
  }

  function launchNeedLine(word) {
    if (word === "fire") return "Launch needs a clean static fire first";
    if (word === "farm") return "Launch needs the launch farm.";
    if (word === "weather") return "The range is closed.";
    if (word === "rp1") return "RP-1 is short.";
    if (word === "lox") return "Liquid oxygen is short.";
    return "The first stage burns until the Merlin runs dry.";
  }

  function fittingCardLine(v) {
    if (!v || (v.fittingLifeS || 0) >= TUNING.FITTING_BURN_S) return "";
    const have = Math.max(0, Math.round(v.fittingLifeS || 0));
    return `The fuel lines have ${have} seconds. Launch needs ${TUNING.FITTING_BURN_S} seconds.`;
  }

  function launchCardLine(v, check) {
    if (!check || check.ok) return launchNeedLine(null);
    if (check.limiter === "fire" || check.limiter === "farm") return launchNeedLine(check.limiter);
    const fit = fittingCardLine(v);
    const shorts = (check.shorts || []).filter((word) => word !== "fitting");
    if (fit && !shorts.length) return fit;
    if (fit) return `${shorts.map(shortReason).join(". ")}. ${fit}`;
    return `${reasonText(check)}.`;
  }

  function shortReason(word) {
    if (word === "weather") return "The range is closed";
    if (word === "rp1") return "RP-1 is short";
    if (word === "lox") return "Liquid oxygen is short";
    if (word === "pad") return "The pad is short";
    if (word === "fitting") return "The fuel lines are short";
    if (word === "engine") return "The Merlin is short";
    return "The Merlin is short";
  }

  function finishScrub(v, check, kind) {
    const loaded = G.rp1 > 0 || G.lox > 0;
    v.needsDetank = loaded;
    const tail = loaded ? " Open the rocket and empty the tanks." : " The rocket is not damaged.";
    log(`${v.name} aborts the ${kind}. ${reasonText(check)}.${tail}`, "bad");
  }

  function emptyTanks(vehicleId) {
    const v = vehicleById(vehicleId);
    if (!v || !v.needsDetank) return;
    G.rp1 = 0;
    G.lox = 0;
    v.needsDetank = false;
    log(`${v.name} tanks are empty.`, "info");
    renderChrome();
  }

  function staticFire() {
    if (G.paused) { log("The day is paused.", "warn"); return; }
    const pad = buildingOfType("pad_orbital");
    if (!pad) { log("Need pad", "bad"); return; }
    const v = padHold();
    if (!v || v.status !== "on_pad") { log("Need a vehicle on the pad", "bad"); return; }
    if (v.needsDetank) { log("Empty the tanks on the rocket sheet.", "warn"); return; }
    if (G.event || motionFor(v.id) || padBusy()) { log("Busy", "warn"); return; }
    const check = fireCheck(v, pad);
    startFill(v, pad, check, "fire");
    renderChrome();
  }

  function startLaunch() {
    if (G.paused) { log("The day is paused.", "warn"); return; }
    const pad = buildingOfType("pad_orbital");
    if (!pad) { log("Need pad", "bad"); return; }
    const v = padHold();
    if (!v || v.status !== "ready") { log("Launch needs a clean static fire first", "warn"); return; }
    if (v.needsDetank) { log("Empty the tanks on the rocket sheet.", "warn"); return; }
    if (G.event || motionFor(v.id) || padBusy()) { log("Busy", "warn"); return; }
    const check = launchCheck(v, pad);
    if (check.limiter === "farm") {
      log("Launch needs the launch farm.", "warn");
      renderChrome();
      return;
    }
    startFill(v, pad, check, "launch");
    renderChrome();
  }

  // The header falls as the bars rise. The burn starts when the load is aboard.
  function startFill(v, pad, check, purpose) {
    const launch = purpose === "launch";
    const needRp1 = launch ? TUNING.FLIGHT_RP1_KG : TUNING.SF_RP1_KG;
    const needLox = launch ? TUNING.FLIGHT_LOX_KG : TUNING.SF_LOX_KG;
    setMotion({
      kind: "fill",
      vehicleId: v.id,
      destId: pad.id,
      t: 0,
      duration: FILL_SEC,
      startRp1: G.rp1,
      startLox: G.lox,
      needRp1,
      needLox,
      takeRp1: check && isScrub(check) ? 0 : Math.min(G.rp1, needRp1),
      takeLox: check && isScrub(check) ? 0 : Math.min(G.lox, needLox),
      check,
      purpose: launch ? "launch" : "fire",
    });
    if (check && !check.ok) log(`${v.name} tries the ${launch ? "launch" : "static fire"}. ${reasonText(check)}.`, "bad");
    else log(`${v.name} loads ${needRp1} kg of RP-1 and ${needLox} kg of liquid oxygen.`, "info");
  }

  function updateFill(r, dt) {
    r.t += dt;
    const u = clamp(r.t / r.duration, 0, 1);
    const takeRp1 = r.takeRp1 != null ? r.takeRp1 : r.needRp1;
    const takeLox = r.takeLox != null ? r.takeLox : r.needLox;
    G.rp1 = r.startRp1 - takeRp1 * u;
    G.lox = r.startLox - takeLox * u;
    renderResources();
    if (u < 1) return;
    G.rp1 = r.startRp1 - takeRp1;
    G.lox = r.startLox - takeLox;
    const v = vehicleById(r.vehicleId);
    const pad = buildingById(r.destId) || buildingOfType("pad_orbital");
    const check = r.check;
    if (!v || !pad || !check) { clearMotion(r.vehicleId); renderChrome(); return; }
    if (r.purpose === "launch") {
      if (isScrub(check)) {
        finishScrub(v, check, "launch");
        clearMotion(v.id);
        renderChrome();
        return;
      }
      startFly(v, pad, check);
      renderChrome();
      return;
    }
    if (isScrub(check)) {
      finishScrub(v, check, "static fire");
      clearMotion(v.id);
      renderChrome();
      return;
    }
    log(check.ok
      ? `${v.name} holds the static fire.`
      : `${v.name} misses the static fire. ${reasonText(check)}.`, check.ok ? "good" : "bad");
    startEventSF(v, pad, rocketOf(v.rocketId), check.ok, check);
    renderChrome();
  }

  // ── Close-up event ──
  const eventStage = document.getElementById("event-stage");
  const eventCanvas = document.getElementById("event-canvas");
  const ectx = eventCanvas.getContext("2d");
  const elEvent = {
    title: document.getElementById("event-title"),
    phase: document.getElementById("event-phase"),
    caption: document.getElementById("event-caption"),
    skip: document.getElementById("event-skip"),
  };

  function startEventSF(v, pad, r, success, check) {
    const ph = r.sfPhases;
    const phases = success
      ? [
          { id: "approach", label: "Camera · approach", dur: ph.approach },
          { id: "chill", label: "Engine chill", dur: ph.chill },
          { id: "ignition", label: r.engines === 9 ? "9-engine ignition" : "Ignition", dur: ph.ignition },
          { id: "burn", label: "Full burn", dur: ph.burn },
          { id: "shutdown", label: "Shutdown", dur: ph.shutdown },
          { id: "debrief", label: "Stable · hold-downs OK", dur: ph.debrief },
        ]
      : [
          { id: "approach", label: "Camera · approach", dur: ph.approach * 0.9 },
          { id: "chill", label: "Engine chill", dur: ph.chill * 0.85 },
          { id: "ignition", label: "Ignition", dur: ph.ignition },
          { id: "anomaly", label: check.limiter === "pad" ? "Pad" : "Engine", dur: 1.6 },
          { id: "fail", label: "Range safe · vehicle compromised", dur: 1.4 },
        ];
    // The rollout clock advances this burn, and the stage stays closed.
    setMotion({
      kind: "fire",
      vehicleId: v.id,
      rocketId: r.id,
      sfStyle: r.sfStyle,
      padLevel: pad.level,
      success,
      limiter: success ? null : check.limiter,
      t: 0, phaseIdx: 0, phaseT: 0,
      phases,
      done: false,
      applied: false,
      closeLeft: null,
    });
    elEvent.phase.classList.remove("fail");
    // The footer names the real outcome, because the result is known before the animation starts.
    const preview = afterFireLives(v, success, success ? null : check.limiter);
    const next = sfNext(success, preview.merlin, preview.stage);
    document.getElementById("event-outcome").textContent = next.scrap
      ? `${shortReason(check.limiter)}. The first stage is scrap.`
      : success && next.status === "needs_return"
        ? "Held. The Merlin is worn. Return to Mega Bay."
        : success
          ? "Held. Inspection starts on the mount."
          : `${shortReason(check.limiter)}. Return to Mega Bay.`;
    openEvent(
      `Static fire · ${v.name}`,
      phases[0].label,
      success
        ? `${r.name} · thrust ${check.thrust} kN holds · ${check.sky.sky}`
        : `${r.name} · ${shortReason(check.limiter)}`
    );
  }

  function openEvent(title, phase, cap) {
    elEvent.title.textContent = title;
    elEvent.phase.textContent = phase;
    elEvent.caption.textContent = cap;
    // The burn plays on the map. This stage stays closed.
    eventStage.classList.remove("open");
    eventStage.setAttribute("aria-hidden", "true");
  }
  function closeEvent() {
    eventStage.classList.remove("open");
    eventStage.setAttribute("aria-hidden", "true");
  }

  function applySfOutcome() {
    const ev = motionKind("fire");
    if (!ev) return;
    const v = vehicleById(ev.vehicleId);
    if (!v) return;
    fundGoal("static_fire");
    countFireDay();
    v.fires = (v.fires || 0) + 1;
    const lives = afterFireLives(v, ev.success, ev.limiter);
    v.merlinLifeS = lives.merlin;
    v.stageLife = lives.stage;
    const next = sfNext(ev.success, lives.merlin, lives.stage);
    v.status = next.status;
    v.inspectLeft = next.inspectLeft || 0;
    v.refurbLeft = 0;
    v.refurbPart = null;
    if (next.scrap) {
      v.buildingId = null;
      log(`${v.name} is scrap. ${shortReason(ev.limiter)}. Structure is under ${TUNING.SCRAP_FLOOR}.`, "bad");
    } else if (ev.success && next.status === "inspect") {
      log(`${v.name} held. Inspection starts on the mount. ${firedLine(v)}`, "good");
    } else if (ev.success) {
      log(`${v.name} held. The Merlin is worn. Return it to Mega Bay. ${firedLine(v)}`, "good");
    } else {
      log(`${v.name} failed. ${shortReason(ev.limiter)}. Structure ${Math.round(v.stageLife)}.`, "bad");
    }
  }

  function finishFire() {
    const r = motionKind("fire");
    if (!r || r.applied) return;
    r.applied = true;
    applySfOutcome();
    clearMotion(r.vehicleId);
    G.event = null;
    closeEvent();
    updateObjectives();
    renderChrome();
  }

  function skipEvent() {
    if (motionKind("fire")) { finishFire(); return; }
    closeEvent();
  }

  function updateFire(r, dt) {
    if (r.applied) return;
    if (r.closeLeft != null) {
      r.closeLeft -= dt;
      if (r.closeLeft <= 0) finishFire();
      return;
    }
    r.t += dt;
    r.phaseT += dt;
    const phase = r.phases[r.phaseIdx];
    if (!r.done && phase && r.phaseT >= phase.dur) {
      r.phaseT = 0;
      r.phaseIdx++;
      if (r.phaseIdx >= r.phases.length) {
        r.done = true;
        r.phaseIdx = r.phases.length - 1;
        r.closeLeft = 0.45;
      }
    }
  }
  elEvent.skip.addEventListener("click", skipEvent);

  const FLIGHT_G = 9.81;

  function flightPitchDeg(simT) {
    if (simT <= TUNING.PITCH_START_S) return 90;
    const tipped = TUNING.PITCH_RATE_DEG_S * (simT - TUNING.PITCH_START_S);
    return Math.max(90 - TUNING.PITCH_MAX_DEG_FROM_VERTICAL, 90 - tipped);
  }

  function loadedPropKg(takeRp1, takeLox) {
    const paired = Math.min(Math.max(0, takeRp1), Math.max(0, takeLox) / TUNING.LOX_PER_RP1);
    return paired * (1 + TUNING.LOX_PER_RP1);
  }

  function startFly(v, pad, check) {
    // A closed range after liftoff does not stop a climb that already left.
    const fill = motionFor(v.id);
    const takeRp1 = fill && fill.takeRp1 != null ? fill.takeRp1 : TUNING.FLIGHT_RP1_KG;
    const takeLox = fill && fill.takeLox != null ? fill.takeLox : TUNING.FLIGHT_LOX_KG;
    const shortFuel = takeRp1 + 0.5 < TUNING.FLIGHT_RP1_KG || takeLox + 0.5 < TUNING.FLIGHT_LOX_KG;
    const shorts = (check && check.shorts) || [];
    const fittingShort = shorts.includes("fitting");
    const early = !!(check && !check.ok && !fittingShort && check.limiter !== "rp1" && check.limiter !== "lox");
    const failed = fittingShort || early || shortFuel;
    const why = fittingShort ? "fitting" : (check ? check.limiter : null);
    const thrustN = merlinNowKn(v) * 1000;
    const ve = TUNING.MERLIN_ISP_S * FLIGHT_G;
    v.status = "flying";
    countFireDay();
    v.fires = (v.fires || 0) + 1;
    setMotion({
      kind: "fly",
      vehicleId: v.id,
      destId: pad.id,
      t: 0,
      simT: 0,
      originX: v.wx,
      originY: v.wy,
      h: 0,
      downrange: 0,
      vx: 0,
      vy: 0,
      mass: TUNING.STRUCT_LIMIT_KG,
      prop: shortFuel || early ? loadedPropKg(takeRp1, takeLox) : TUNING.STAGE_PROP_KG,
      thrustN,
      ve,
      pitchDeg: 90,
      speed: 0,
      q: 0,
      twr: thrustN / (TUNING.STRUCT_LIMIT_KG * FLIGHT_G),
      maxQ: 0,
      maxQTime: 0,
      maxH: 0,
      maxSpeed: 0,
      abortAt: fittingShort ? TUNING.FITTING_ABORT_S : (early ? TUNING.LAUNCH_ABORT_S : null),
      failWord: failed ? why : null,
    });
    log(failed ? `${v.name} lifts off. ${shortReason(why)}.` : `${v.name} lifts off.`, failed ? "bad" : "good");
    renderFlightPanel();
  }

  function stepFlight(r, dt) {
    const pitchDeg = flightPitchDeg(r.simT);
    const pitch = pitchDeg * Math.PI / 180;
    const rho = TUNING.RHO0_KG_M3 * Math.exp(-Math.max(0, r.h) / TUNING.SCALE_HEIGHT_M);
    const speed = Math.hypot(r.vx, r.vy);
    const q = 0.5 * rho * speed * speed;
    const drag = q * TUNING.DRAG_CD * TUNING.FRONT_AREA_M2;
    const mdot = r.thrustN / r.ve;
    const burn = Math.min(r.prop, mdot * dt);
    const thrust = burn <= 0 ? 0 : (burn < mdot * dt ? r.thrustN * (burn / (mdot * dt)) : r.thrustN);
    const tx = Math.cos(pitch) * thrust;
    const ty = Math.sin(pitch) * thrust;
    let dx = 0;
    let dy = 0;
    if (speed > 1e-6) {
      dx = -drag * r.vx / speed;
      dy = -drag * r.vy / speed;
    }
    const ax = (tx + dx) / r.mass;
    const ay = (ty + dy) / r.mass - FLIGHT_G;
    r.vx += ax * dt;
    r.vy += ay * dt;
    r.h += r.vy * dt;
    r.downrange += r.vx * dt;
    if (r.h < 0) {
      r.h = 0;
      if (r.vy < 0) r.vy = 0;
    }
    r.prop -= burn;
    r.mass -= burn;
    r.simT += dt;
    r.pitchDeg = pitchDeg;
    r.speed = Math.hypot(r.vx, r.vy);
    r.q = q;
    r.twr = r.mass > 0 ? thrust / (r.mass * FLIGHT_G) : 0;
    if (r.q > r.maxQ) {
      r.maxQ = r.q;
      r.maxQTime = r.simT;
    }
    if (r.h > r.maxH) r.maxH = r.h;
    if (r.speed > r.maxSpeed) r.maxSpeed = r.speed;
  }

  function updateFly(r, dt) {
    let left = dt * TUNING.FLIGHT_TIME_SCALE;
    const step = 0.02;
    while (left > 0 && r.prop > 0) {
      if (r.abortAt != null && r.simT >= r.abortAt) {
        r.prop = 0;
        break;
      }
      const ds = Math.min(step, left, r.prop > 0 ? 1 : 0);
      if (ds <= 0) break;
      stepFlight(r, ds);
      left -= ds;
    }
    r.t += dt;
    const v = vehicleById(r.vehicleId);
    if (v) {
      v.wx = r.originX + r.downrange * 0.05;
      v.wy = r.originY - r.h * 0.14;
    }
    renderFlightPanel();
    if (r.prop <= 0) finishFly(r);
  }

  function finishFly(r) {
    const v = vehicleById(r.vehicleId);
    const name = v ? v.name : "Rocket";
    if (v) {
      const spent = Math.max(0, Math.round(r.simT));
      v.merlinLifeS = Math.max(0, (v.merlinLifeS || 0) - spent);
      v.status = "destroyed";
      v.buildingId = null;
    }
    clearMotion(r.vehicleId);
    const hKm = wikiNum(r.maxH / 1000, 1);
    const spd = wikiNum(r.maxSpeed, 0);
    const qkPa = wikiNum(r.maxQ / 1000, 1);
    const qt = wikiNum(r.maxQTime, 0);
    const reached = r.maxH / 1000 >= TUNING.LAUNCH_OK_KM && r.maxSpeed >= TUNING.LAUNCH_OK_MS && !r.failWord;
    const why = r.failWord ? shortReason(r.failWord) : "The burn fell short";
    if (reached) {
      log(`${name} reaches ${hKm} km and ${spd} m/s. The first stage is lost at sea.`, "good");
      fundGoal("launch");
    } else if (r.maxH < 100) {
      log(`${name} does not lift off. ${why}. The first stage is lost.`, "bad");
    } else {
      log(`${name} falls short of ${TUNING.LAUNCH_OK_KM} km and ${TUNING.LAUNCH_OK_MS} m/s. ${why}. Top height ${hKm} km. Top speed ${spd} m/s. The first stage is lost at sea.`, "bad");
    }
    renderFlightPanel();
    renderChrome();
  }

  function renderFlightPanel() {
    const panel = document.getElementById("flight-panel");
    if (!panel) return;
    const r = motionKind("fly");
    if (!r) {
      panel.classList.remove("open");
      panel.innerHTML = "";
      return;
    }
    const alt = r.h >= 1000 ? `${wikiNum(r.h / 1000, 1)} km` : `${wikiNum(r.h, 0)} m`;
    const spd = r.speed >= 1000 ? `${wikiNum(r.speed / 1000, 2)} km/s` : `${wikiNum(r.speed, 0)} m/s`;
    const q = `${wikiNum(r.q / 1000, 1)} kPa`;
    const peak = r.maxQ > 0
      ? `Max-Q ${wikiNum(r.maxQ / 1000, 1)} kPa at ${wikiNum(r.maxQTime, 0)} s`
      : "Max-Q is still ahead.";
    panel.classList.add("open");
    panel.innerHTML = `<div class="row"><div class="k">Altitude</div><div class="n">${alt}</div></div>
      <div class="row"><div class="k">Speed</div><div class="n">${spd}</div></div>
      <div class="row"><div class="k">Mass</div><div class="n">${wikiNum(r.mass, 0)} kg</div></div>
      <div class="row"><div class="k">Thrust against weight</div><div class="n">${wikiNum(r.twr, 2)}</div></div>
      <div class="row"><div class="k">Dynamic pressure</div><div class="n">${q}</div></div>
      <div class="peak">${esc(peak)}</div>`;
  }

  function resizeEventCanvas() {
    const d = Math.min(window.devicePixelRatio || 1, 2);
    const rect = eventCanvas.getBoundingClientRect();
    const w = Math.max(320, Math.floor(rect.width));
    const h = Math.max(200, Math.floor(rect.height));
    eventCanvas.width = w * d; eventCanvas.height = h * d;
    ectx.setTransform(d, 0, 0, d, 0, 0);
    G._ew = w; G._eh = h;
  }

  function updateEvent() {
    // The burn advances on the rollout clock. This stage does not keep one.
  }

  function drawEvent() {
    const ev = G.event;
    if (!ev) return;
    const W = G._ew || 900, H = G._eh || 500;
    const r = rocketOf(ev.rocketId);
    ectx.clearRect(0, 0, W, H);
    const g = ectx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#152030"); g.addColorStop(0.55, "#2a3848"); g.addColorStop(1, "#3a4840");
    ectx.fillStyle = g; ectx.fillRect(0, 0, W, H);

    const cx = W * 0.5, groundY = H * 0.78;
    const phase = ev.phases[ev.phaseIdx];
    const pid = phase ? phase.id : "debrief";
    const zoom = pid === "approach" ? 0.85 + 0.15 * clamp(ev.phaseT / 1, 0, 1) : 1;

    ectx.fillStyle = "#4a453c"; ectx.fillRect(0, groundY, W, H - groundY);
    const trenchW = (ev.padLevel >= 2 ? 150 : 95) * zoom;
    ectx.fillStyle = "#1a1a20";
    ectx.fillRect(cx - trenchW / 2, groundY + 6, trenchW, 28 * zoom);
    const olmH = (ev.padLevel >= 2 ? 70 : 48) * zoom;
    ectx.fillStyle = "#9aa0a8";
    ectx.fillRect(cx - 18 * zoom, groundY - olmH, 36 * zoom, olmH);

    const base = groundY - olmH;
    const broken = pid === "anomaly" || pid === "fail" || (!ev.success && ev.done);
    drawCloseupRocket(ectx, cx, base, zoom, r, pid, broken, ev);

    if (pid === "chill" || pid === "ignition" || pid === "burn" || pid === "shutdown") {
      drawPlume(ectx, cx, base + 4, zoom, r, pid, ev, 1);
    }
    if (pid === "anomaly") {
      drawPlume(ectx, cx, base + 4, zoom, r, pid, ev, 1.4);
      // fireball
      ectx.fillStyle = "rgba(255,120,40,0.55)";
      ectx.beginPath();
      ectx.arc(cx + Math.sin(ev.t * 20) * 8, base - 40, 50 + Math.sin(ev.t * 15) * 10, 0, Math.PI * 2);
      ectx.fill();
      ectx.fillStyle = "rgba(255,200,80,0.4)";
      ectx.beginPath();
      ectx.arc(cx, base - 55, 28, 0, Math.PI * 2);
      ectx.fill();
    }

    for (const p of ev.particles) {
      ectx.globalAlpha = clamp(p.life * 2, 0, 1);
      ectx.fillStyle = p.hot ? "#ff9a3a" : "#ffcc66";
      ectx.beginPath();
      ectx.arc(cx + p.x, base + 10 + p.y, p.r, 0, Math.PI * 2);
      ectx.fill();
      ectx.globalAlpha = 1;
    }

    ectx.fillStyle = "rgba(0,0,0,0.5)";
    ectx.fillRect(12, 12, 260, 58);
    ectx.fillStyle = "#e8d9b0";
    ectx.font = "600 13px system-ui";
    ectx.fillText(rocketOf(ev.rocketId).name.toUpperCase(), 22, 32);
    ectx.font = "11px ui-monospace, monospace";
    ectx.fillStyle = ev.success || pid === "approach" || pid === "chill" ? "#d4a84b" : "#e08070";
    ectx.fillText(ev.success ? `Thrust holds · ${pid.toUpperCase()}` : `${ev.limiter || "short"} · ${pid.toUpperCase()}`, 22, 50);

    ectx.fillStyle = "rgba(0,0,0,0.5)";
    ectx.fillRect(W - 160, 12, 148, 40);
    ectx.fillStyle = "#8fbc6a";
    ectx.font = "11px ui-monospace, monospace";
    ectx.fillText(`PROP −${ev.spent}`, W - 148, 36);

    if (pid === "debrief" && ev.success) {
      ectx.fillStyle = "rgba(20,40,24,0.8)";
      ectx.fillRect(W / 2 - 120, 22, 240, 36);
      ectx.fillStyle = "#8fbc6a"; ectx.font = "600 14px system-ui"; ectx.textAlign = "center";
      ectx.fillText("ENGINES STABLE", W / 2, 46); ectx.textAlign = "left";
    }
    if (pid === "fail" || (broken && pid === "anomaly" && ev.phaseT > 0.8)) {
      ectx.fillStyle = "rgba(50,16,16,0.85)";
      ectx.fillRect(W / 2 - 130, 22, 260, 36);
      ectx.fillStyle = "#e07070"; ectx.font = "600 14px system-ui"; ectx.textAlign = "center";
      ectx.fillText("STATIC FIRE FAILURE", W / 2, 46); ectx.textAlign = "left";
    }
    drawEventRange(W, H);
  }

  function drawEventRange(W, H) {
    const x = 16, y = H - 78, w = 220, h = 62;
    ectx.fillStyle = "rgba(0,0,0,0.72)";
    ectx.fillRect(x, y, w, h);
    ectx.strokeStyle = "#e10600";
    ectx.strokeRect(x, y, w, h);
    ectx.beginPath();
    ectx.moveTo(x + 18, y + 48);
    ectx.quadraticCurveTo(x + 90, y + 36, x + 190, y + 14);
    ectx.stroke();
    const pitch = 90;
    const endLon = PAD_LON + 50 / (111.32 * Math.cos(PAD_LAT * Math.PI / 180));
    ectx.fillStyle = "#f2f2f2";
    ectx.font = "11px ui-monospace, monospace";
    ectx.fillText(`${PAD_LAT.toFixed(3)}° N  heading 90°  pitch ${pitch.toFixed(0)}°`, x + 8, y + 14);
    ectx.fillText(`Gulf track to ${Math.abs(endLon).toFixed(2)}° W`, x + 8, y + 28);
  }

  function drawCloseupRocket(c, cx, baseY, zoom, r, pid, broken, ev) {
    const nine = r.sfStyle === "merlin_nine";
    const scale = (nine ? 1.18 : 0.95) * zoom;
    const bw = (nine ? 32 : 22) * scale;
    const bh = (nine ? 120 : 85) * scale;
    const shipH = (nine ? 95 : 68) * scale;
    const tilt = broken ? Math.sin(ev.t * 8) * 0.15 + 0.2 : 0;
    c.save();
    c.translate(cx, baseY);
    c.rotate(tilt);
    c.translate(-cx, -baseY);
    const x = cx - bw / 2;
    const yBoost = baseY - bh;
    const yShip = yBoost - shipH;
    if (broken && pid === "fail") {
      // debris-ish short stack
      c.fillStyle = "#666";
      c.fillRect(x + 4, yBoost + bh * 0.4, bw - 8, bh * 0.35);
    } else {
      c.fillStyle = r.color;
      c.fillRect(x + 3, yShip, bw - 6, shipH);
      c.beginPath();
      c.moveTo(cx, yShip - 20 * scale);
      c.lineTo(x + 3, yShip); c.lineTo(x + bw - 3, yShip); c.closePath();
      c.fill();
      c.fillStyle = nine ? "#e4eaf0" : "#c5ccd4";
      c.fillRect(x, yBoost, bw, bh);
      c.fillStyle = "#3a4048";
      if (nine) {
        for (let row = 0; row < 3; row++)
          for (let col = 0; col < 3; col++) {
            c.beginPath();
            c.arc(cx + (col - 1) * 11 * scale, baseY - 2, 4 * scale, 0, Math.PI * 2);
            c.fill();
          }
      } else {
        c.beginPath(); c.arc(cx, baseY - 2, 6 * scale, 0, Math.PI * 2); c.fill();
      }
    }
    c.restore();
  }

  function drawPlume(c, cx, baseY, zoom, r, pid, ev, mult) {
    const nine = r.sfStyle === "merlin_nine";
    const intensity = pid === "chill" ? 0.2 : pid === "ignition" ? 0.7 : pid === "shutdown" ? 0.3 : 1;
    const n = Math.floor((nine ? 14 : 7) * intensity * mult) + 2;
    for (let i = 0; i < n; i++) {
      const ox = Math.sin(ev.t * 11 + i) * (nine ? 26 : 12) * zoom * intensity;
      const h = (18 + (i % 5) * 10) * zoom * intensity * mult;
      const grad = c.createLinearGradient(cx, baseY, cx, baseY + h + 40);
      grad.addColorStop(0, `rgba(255,220,120,${0.9 * intensity})`);
      grad.addColorStop(0.4, `rgba(255,100,30,${0.75 * intensity})`);
      grad.addColorStop(1, "rgba(40,40,40,0)");
      c.fillStyle = grad;
      c.beginPath();
      c.moveTo(cx + ox - 7 * zoom, baseY);
      c.lineTo(cx + ox, baseY + h + 20);
      c.lineTo(cx + ox + 7 * zoom, baseY);
      c.fill();
    }
  }

  function upgradePad() {
    const pad = buildingById(G.selectedId);
    if (!pad || pad.type !== "pad_orbital") return;
    if (pad.level >= 2) { log("Pad already L2", "info"); return; }
    if (G.steel < TUNING.PAD_L2_COST) { log(`Need ${TUNING.PAD_L2_COST} steel.`, "bad"); return; }
    G.steel -= TUNING.PAD_L2_COST;
    pad.level = 2;
    log("Pad level 2. The trench is wider.", "good");
    updateObjectives();
    renderChrome();
  }

  function upgradeBay() {
    const bay = buildingById(G.selectedId);
    if (!bay || bay.type !== "mega_bay") return;
    if (bay.level >= TUNING.BAY_MAX) return;
    if (G.steel < TUNING.BAY_SLOT_COST) { log(`Need ${TUNING.BAY_SLOT_COST} steel.`, "bad"); return; }
    G.steel -= TUNING.BAY_SLOT_COST;
    bay.level += 1;
    log(`Mega Bay holds ${bay.level} vehicles.`, "good");
    updateObjectives();
    renderChrome();
  }

  function updateObjectives() {
    if (BUILD_ORDER.every((t) => countType(t) >= 1)) fundGoal("place_all");
    if (liveFleet().length) fundGoal("build_rocket");
    if (bayCount() >= 2) fundGoal("multi_bay");
    const pad = buildingOfType("pad_orbital");
    if (pad && pad.level >= 2) fundGoal("pad_l2");
    renderResources();
    renderObjectives();
  }

  // ── Chrome ──
  function renderResources() {
    el.money.textContent = Math.floor(G.money);
    el.steel.textContent = Math.floor(G.steel);
    el.rp1.textContent = Math.floor(G.rp1);
    el.lox.textContent = Math.floor(G.lox);
    el.fleet.textContent = liveFleet().length;
    el.day.textContent = String(G.day);
    const run = document.getElementById("day-run");
    const pauseBtn = document.getElementById("day-pause");
    if (run) run.textContent = G.paused ? "Paused" : "Day";
    if (pauseBtn) pauseBtn.textContent = G.paused ? "Resume" : "Pause";
  }

  function ownedLine(b) {
    if (b.type === "starfactory") {
      if (G.factoryJob) return `Busy · ${dayCount(G.factoryJob.daysLeft)} left`;
      return factoryHold() ? "Holds a finished rocket" : "Builds Falcon 1";
    }
    if (b.type === "mega_bay") {
      const cap = bayCapacity(b);
      return `${bayLoad(b)} of ${cap} ${cap === 1 ? "slot" : "slots"} used`;
    }
    if (b.type === "pad_orbital") return `Pad level ${b.level || 1}`;
    return "";
  }

  function renderPalette() {
    const land = document.getElementById("land-scroll");
    const keep = land ? land.scrollTop : 0;
    const offers = Object.keys(PLOTS).filter((id) => !G.plots[id]).map((id) => {
      const plot = PLOTS[id];
      return `<button type="button" class="plot-card" data-plot="${id}">
        <div class="name">${esc(plot.name)}</div>
        <div class="price">${plot.cost}</div>
        <div class="unit">steel</div>
        <div class="line">${esc(plot.line)}</div>
      </button>`;
    }).join("");
    const typeOrder = { starfactory: 0, mega_bay: 1, pad_orbital: 2 };
    const owned = G.buildings.slice().sort((a, b) => (typeOrder[a.type] ?? 9) - (typeOrder[b.type] ?? 9)).map((b) => {
      const sel = b.id === G.selectedId ? " sel" : "";
      return `<button type="button" class="own-card${sel}" data-own="${b.id}">
        <div class="name">${esc(defOf(b.type).name)}</div>
        <div class="line">${esc(ownedLine(b))}</div>
      </button>`;
    }).join("");
    const packs = [
      [TUNING.STEEL_PACK, TUNING.STEEL_PACK_COST],
      [TUNING.STEEL_LOT, TUNING.STEEL_LOT_COST],
    ];
    const steelRow = packs.map(([steel, cost]) => {
      const off = G.money < cost ? " disabled" : "";
      return `<button type="button" class="steel-buy" data-steel="${steel}" data-cost="${cost}"${off}>
        <div class="name">Buy ${steel}</div>
        <div class="price">${cost}</div>
        <div class="unit">money</div>
      </button>`;
    }).join("");
    // Land order is locked: steel buys, then owned buildings, then free plots last.
    el.palette.innerHTML = `<div class="steel-row">${steelRow}</div><p class="steel-rate">1 money buys 1 steel.</p>`
      + `<div class="land-owned"><div class="sh sub">Buildings</div>${owned || `<p class="steel-rate">No building yet. Buy a plot below.</p>`}</div>`
      + `<div class="land-free">${offers ? `<div class="sh sub">Free plots</div>${offers}` : ""}</div>`;
    el.palette.querySelectorAll(".steel-buy").forEach((btn) => {
      btn.addEventListener("click", () => buySteel(Number(btn.dataset.steel), Number(btn.dataset.cost)));
    });
    el.palette.querySelectorAll("[data-plot]").forEach((btn) => {
      btn.addEventListener("click", () => buyPlot(btn.getAttribute("data-plot")));
    });
    el.palette.querySelectorAll("[data-own]").forEach((btn) => {
      btn.addEventListener("click", () => { G.selectedId = +btn.getAttribute("data-own"); renderChrome(); });
    });
    // A day tick redraws the list. The list keeps its place.
    if (land) land.scrollTop = keep;
  }

  function wikiLink(href, label) {
    return `<a href="${href}" target="_blank" rel="noopener">${esc(label)}</a>`;
  }

  function wikiNum(n, digits) {
    const text = (Math.round(n * 10 ** digits) / 10 ** digits).toFixed(digits);
    return text.replace(/(\.\d*?)0+$/, "$1").replace(/\.$/, "");
  }

  function wikiSpan(min, max, one, many) {
    const left = wikiNum(min, 0);
    const right = wikiNum(max, 0);
    if (left === right) return left === "1" ? `1 ${one}` : `${left} ${many}`;
    return `${left} to ${right} ${many}`;
  }

  function wikiGo(id, label) {
    return `<button type="button" class="wiki-link" data-wiki="${esc(id)}">${esc(label)}</button>`;
  }

  // A building name links only after that building is on the map.
  function wikiPlace(type, label) {
    if (!buildingOfType(type)) return label;
    return wikiGo(type, label);
  }

  // Thrust, propellant, and the engine pages stay hidden until Falcon 1 is on.
  function wikiPageLink(id, label) {
    if (id !== "time" && !wikiFalconOn()) return label;
    return wikiGo(id, label);
  }

  function wikiSource(key) {
    const src = REAL_REFS.sources[key];
    return wikiLink(src.href, src.label);
  }

  // A matching real figure leaves the reality note off.
  function wikiDiffers(gameN, refKey) {
    const ref = REAL_REFS[refKey];
    if (!ref || ref.n == null || gameN == null) return true;
    return Math.abs(Number(gameN) - Number(ref.n)) >= 0.5;
  }

  function wikiParas(list) {
    return list.filter(Boolean).map((p) => `<p>${p}</p>`).join("");
  }

  function wikiFacts(items) {
    const shown = (items || []).filter(Boolean);
    if (shown.length < 2) return "";
    return `<aside class="wiki-facts">${shown.map((it) => `<div><b>${esc(it.value)}</b><span>${it.labelHtml || esc(it.label)}</span></div>`).join("")}</aside>`;
  }

  function wikiReal(parts) {
    const shown = (parts || []).filter(Boolean);
    if (!shown.length) return "";
    return `<aside class="wiki-real"><h3>In real life</h3>${shown.map((p) => `<p>${p}</p>`).join("")}</aside>`;
  }

  function wikiUpperOn() { return !!ROCKET_DEFS.falcon1.upperStage; }

  function wikiFalconOn() { return !!ROCKET_DEFS.falcon1.unlocked; }

  function wikiBurn() {
    const prop = TUNING.STAGE_PROP_KG;
    const dry = TUNING.STAGE_DRY_KG + TUNING.MERLIN_MASS_KG;
    const payload = payloadToLeo(TUNING.STAGE_DRY_KG, TUNING.MERLIN_MASS_KG, TUNING.MERLIN_ISP_S, TUNING.MERLIN_THRUST_KN);
    const lighter = payloadToLeo(TUNING.STAGE_DRY_KG - TUNING.STAGE_LIGHTEN_KG, TUNING.MERLIN_MASS_KG, TUNING.MERLIN_ISP_S, TUNING.MERLIN_THRUST_KN);
    const ve = TUNING.MERLIN_ISP_S * G0;
    const thrustN = TUNING.MERLIN_THRUST_KN * 1000;
    const gate = TUNING.LEO_DV_MS + G0 * ((prop * ve) / thrustN);
    const mf = dry + payload;
    const m0 = mf + prop;
    const dv = ve * Math.log(m0 / mf);
    return { prop, dry, payload, lighter, gain: lighter - payload, ve, gate, mf, m0, dv };
  }
