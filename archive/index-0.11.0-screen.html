  function wikiThrust() {
    const weightKn = TUNING.STRUCT_LIMIT_KG * G0 / 1000;
    const twr = TUNING.MERLIN_THRUST_KN / weightKn;
    const thrustDiff = wikiDiffers(TUNING.MERLIN_THRUST_KN, "merlin1aKn");
    const massDiff = wikiDiffers(TUNING.STRUCT_LIMIT_KG, "liftoffKg");
    const notes = [];
    if (thrustDiff || massDiff) {
      const realBits = [];
      const gameBits = [];
      if (thrustDiff) {
        realBits.push(`${REAL_REFS.merlin1cKn.n} kN at liftoff`);
        gameBits.push(`this Merlin starts at ${TUNING.MERLIN_THRUST_KN} kN`);
      }
      if (massDiff) {
        realBits.push(`a liftoff mass of ${REAL_REFS.liftoffKg.n} kg`);
        gameBits.push(`this sheet uses ${TUNING.STRUCT_LIMIT_KG} kg`);
      }
      notes.push(`In the ${wikiSource("sheet")}, the figures are ${realBits.join(" and ")}. ${gameBits[0].charAt(0).toUpperCase()}${gameBits[0].slice(1)}${gameBits[1] ? `, and ${gameBits[1]}` : ""}.`);
    }
    return {
      id: "thrust",
      title: "Thrust",
      body: wikiParas([
        `Thrust is the push of the engine. The game measures that push in kilonewtons (kN).`,
        `Liftoff mass is how much rocket sits on the pad. The game writes that amount in kilograms (kg).`,
        `Weight at liftoff is gravity pulling down on that mass. The game writes that pull in kilonewtons (kN), the same unit as thrust.`,
        `Thrust has to beat the weight, not the mass. Thrust-to-weight is thrust divided by the weight.`,
        `Above 1, the engine can lift the rocket. Near 1, the climb is slow.`,
        `A new Merlin produces ${TUNING.MERLIN_THRUST_KN} kN. The liftoff mass is ${TUNING.STRUCT_LIMIT_KG} kg. The weight at liftoff is ${wikiNum(weightKn, 1)} kN. Thrust-to-weight is ${wikiNum(twr, 2)}.`,
      ]) + wikiFacts([
        { value: `${TUNING.MERLIN_THRUST_KN} kN`, label: "Merlin thrust" },
        { value: `${TUNING.STRUCT_LIMIT_KG} kg`, label: "Liftoff mass" },
        { value: `${wikiNum(weightKn, 1)} kN`, label: "Weight at liftoff" },
        { value: wikiNum(twr, 2), label: "Thrust-to-weight" },
      ]) + wikiReal(notes),
    };
  }

  function wikiImpulse() {
    const upper = wikiUpperOn();
    const merlinVe = TUNING.MERLIN_ISP_S * G0;
    const facts = [
      { value: `${TUNING.MERLIN_ISP_S} seconds`, label: "Merlin specific impulse" },
      { value: `${wikiNum(merlinVe, 0)} meters per second`, label: "Merlin exhaust speed" },
    ];
    const vacuum = upper
      ? `The Kestrel is the vacuum engine on the upper stage. Its specific impulse is ${TUNING.KESTREL_ISP_S} seconds, above the Merlin at ${TUNING.MERLIN_ISP_S} seconds.`
      : `This rocket uses the Merlin at sea level. The upper stage is not in the game, so its vacuum engine is not listed here.`;
    if (upper) {
      facts.push({ value: `${TUNING.KESTREL_ISP_S} seconds`, label: "Kestrel specific impulse" });
      facts.push({ value: `${wikiNum(TUNING.KESTREL_ISP_S * G0, 0)} meters per second`, label: "Kestrel exhaust speed" });
    }
    const notes = [];
    if (wikiDiffers(TUNING.MERLIN_ISP_S, "merlinIspS")) {
      notes.push(`In the ${wikiSource("guide")}, the Merlin is ${REAL_REFS.merlinIspS.n} seconds in vacuum. This game uses ${TUNING.MERLIN_ISP_S} seconds at sea level.`);
    }
    if (upper && wikiDiffers(TUNING.KESTREL_ISP_S, "kestrelIspS")) {
      notes.push(`That guide lists ${REAL_REFS.kestrelIspS.n} seconds for the Kestrel. This game uses ${TUNING.KESTREL_ISP_S} seconds.`);
    }
    return {
      id: "isp",
      title: "Specific impulse",
      body: wikiParas([
        `Specific impulse (Isp) is how much push each kilogram of propellant gives. The game writes it in seconds.`,
        `A higher number means the same propellant changes the rocket's speed more. The ${wikiGo("equation", "rocket equation")} uses that number.`,
        `Multiply the seconds by gravity and you get the exhaust speed. The Merlin figure is the sea-level number.`,
        `A sea-level engine pushes against the air. A vacuum engine fires where the air is gone, so each kilogram gives more push.`,
        vacuum,
      ]) + wikiFacts(facts) + wikiReal(notes),
    };
  }

  function wikiEquation() {
    const burn = wikiBurn();
    const r = (n) => Math.round(n);
    // wikiBurn follows the first stage only, even after the upper stage is unlocked.
    const notes = [
      `In the ${wikiSource("guide")}, the rocket has two stages. This sum uses the first stage only.`,
    ];
    if (wikiDiffers(burn.payload, "payloadKg")) {
      notes.push(`In the ${wikiSource("sheet")}, payload is ${REAL_REFS.payloadKg.n} kg from two burns. This example shows ${burn.payload} kg.`);
    }
    return {
      id: "equation",
      title: "The rocket equation",
      body: wikiParas([
        `The rocket equation ties the change in speed to the exhaust speed and to how much of the rocket is propellant.`,
        `Most of this Falcon 1 is propellant. The dry stage plus the Merlin is the smaller share. The rocket gets lighter as it burns.`,
        `A lighter stage carries more payload. Lighten the stage cuts ${TUNING.STAGE_LIGHTEN_KG} kg, and the payload rises by ${burn.gain} kg.`,
        `This example uses the Merlin ${wikiGo("thrust", "thrust")} and the Merlin ${wikiGo("isp", "specific impulse")}. Exhaust speed is ${r(burn.ve)} meters per second.`,
        `The stage starts at ${r(burn.m0)} kg and finishes at ${r(burn.mf)} kg. The burn reaches ${r(burn.dv)} meters per second.`,
        `The payload is ${burn.payload} kg. That is the load where the burn meets the climb.`,
      ]) + wikiFacts([
        { value: `${burn.prop} kg`, label: "Propellant in the sum" },
        { value: `${burn.dry} kg`, label: "Dry stage plus engine" },
        { value: `${burn.payload} kg`, label: "Payload from this burn" },
        { value: `${r(burn.m0)} kg`, label: "Mass at ignition" },
      ]) + wikiReal(notes),
    };
  }

        `The rocket sheet paints Structure, Fuel lines, and Engine (Merlin) on the rocket, top to bottom. Each part shows a percent. The big number is the lowest part. The engine part also shows the seconds still left, out of ${TUNING.MERLIN_FIRE_LIMIT_S}. A lit static fire spends 5 seconds. A launch spends the seconds that burn runs. Life stops at 0.`,

  function wikiTime() {
    const seconds = MS_PER_DAY / 1000;
    const notes = [];
    if (wikiDiffers(seconds, "dayLengthS")) {
      notes.push(`A calendar day is ${wikiNum(REAL_REFS.dayLengthS.n / 3600, 0)} hours. A day here lasts ${wikiNum(seconds, 1)} seconds. This wait is not defined in the ${wikiSource("guide")}.`);
    }
    return {
      id: "time",
      title: "Time at Starbase",
      body: wikiParas([
        `One game day lasts ${wikiNum(seconds, 1)} seconds. Builds, refurbs, and upgrades wait in those days.`,
        `${wikiPlace("starfactory", "Starfactory")} builds a Falcon 1 in ${daySpan(TUNING.BUILD_DAYS_MIN, TUNING.BUILD_DAYS_MAX)}.`,
        `Raise Merlin thrust takes ${daySpan(TUNING.MERLIN_UP_DAYS_MIN, TUNING.MERLIN_UP_DAYS_MAX)}. Lighten the stage takes ${daySpan(TUNING.STAGE_LIGHTEN_DAYS_MIN, TUNING.STAGE_LIGHTEN_DAYS_MAX)}.`,
        `After a clean fire the rocket stays on the mount for ${dayCount(TUNING.INSPECT_DAYS)} of inspection. Refurb the engine takes ${dayCount(TUNING.REFURB_OK_DAYS)}. Inspect the fuel lines takes ${dayCount(TUNING.INSPECT_DAYS)}. Refurb the structure takes ${daySpan(TUNING.REFURB_FAIL_MIN, TUNING.REFURB_FAIL_MAX)}.`,
        `Days keep moving while the tanks load, the engine burns, or the rocket ${wikiGo("flight", "flies")}. The purse does not grow on the day. Investors pay when a goal is finished. Pause stops the day and the burn. A roll, a raise, and a lower leave the day running.`,
        `The rollout along the yard road is counted in seconds. That is the short wait on the road between ${wikiPlace("mega_bay", "Mega Bay")} and the ${wikiPlace("pad_orbital", "Orbital Pad")}.`,
      ]) + wikiFacts([
        { value: `${wikiNum(seconds, 1)} seconds`, label: "One game day" },
        { value: daySpan(TUNING.BUILD_DAYS_MIN, TUNING.BUILD_DAYS_MAX), labelHtml: `Build at ${wikiPlace("starfactory", "Starfactory")}` },
        { value: dayCount(TUNING.INSPECT_DAYS), label: "Inspection on the mount" },
        { value: wikiSpan(TUNING.ROLLOUT_MIN_SEC, TUNING.ROLLOUT_MAX_SEC, "second", "seconds"), label: "Rollout on the road" },
      ]) + wikiReal(notes),
    };
  }

  function wikiStarfactory() {
    const rocket = ROCKET_DEFS.falcon1;
    return {
      id: "starfactory",
      group: "Buildings",
      title: "Starfactory",
      body: wikiParas([

        `Build ${rocket.name} costs ${rocket.steelCost} steel and takes ${daySpan(TUNING.BUILD_DAYS_MIN, TUNING.BUILD_DAYS_MAX)}. Roll to ${wikiPlace("mega_bay", "Mega Bay")} spends no steel and no propellant, and it takes no days.`,
        `Raise Merlin thrust costs ${TUNING.MERLIN_UP_COST} steel and takes ${daySpan(TUNING.MERLIN_UP_DAYS_MIN, TUNING.MERLIN_UP_DAYS_MAX)}. Lighten the stage costs ${TUNING.STAGE_LIGHTEN_COST} steel and takes ${daySpan(TUNING.STAGE_LIGHTEN_DAYS_MIN, TUNING.STAGE_LIGHTEN_DAYS_MAX)}. Both run here, in the same slot as a build.`,
        `Starfactory cannot be upgraded.`,
        `The next building is ${wikiPlace("mega_bay", "Mega Bay")}. ${wikiPageLink("thrust", "Thrust")} and the stage change while this factory is busy.`,

        { value: `${rocket.steelCost} steel`, label: `Steel for a ${rocket.name}` },

        { value: `${TUNING.MERLIN_UP_COST} steel`, label: "Raise Merlin thrust" },
        { value: `${TUNING.STAGE_LIGHTEN_COST} steel`, label: "Lighten the stage" },
      ]) + wikiReal([
        `The real Falcon 1 was built at SpaceX's factory in El Segundo and later Hawthorne, California. This game builds it at Starbase.`,
        `The ${wikiSource("plant")} records the move from El Segundo. The ${wikiSource("guide")} places Falcon 1 production in Hawthorne.`,

    return {
      id: "mega_bay",
      group: "Buildings",
      title: "Mega Bay",

        `Mega Bay houses the rockets between ${wikiPlace("starfactory", "Starfactory")} and the ${wikiPlace("pad_orbital", "Orbital Pad")}. Open the rocket here to refurb one part.`,

        `Refurb the engine costs ${TUNING.MERLIN_REFURB_COST} steel and takes ${dayCount(TUNING.REFURB_OK_DAYS)}. Inspect the fuel lines takes ${dayCount(TUNING.INSPECT_DAYS)} and no steel. Refurb the structure takes ${daySpan(TUNING.REFURB_FAIL_MIN, TUNING.REFURB_FAIL_MAX)} and no steel. The bay runs one of those jobs.`,
        `Another slot costs ${TUNING.BAY_SLOT_COST} steel and takes no days. It adds a place in the bay, up to ${TUNING.BAY_MAX === 1 ? "1 vehicle" : `${TUNING.BAY_MAX} vehicles`}.`,
        `The next step is a static fire on the ${wikiPlace("pad_orbital", "Orbital Pad")}. That fire checks ${wikiPageLink("thrust", "thrust")}, ${wikiPageLink("propellant", "propellant")}, and the wind.`,
      ]) + wikiFacts([
        { value: `${TUNING.BAY_SLOT_COST} steel`, label: "Another slot" },
        { value: String(TUNING.BAY_MAX), label: "Vehicles the bay can hold" },
        { value: `${TUNING.MERLIN_REFURB_COST} steel`, label: "Refurb the Merlin" },
        { value: roll, label: "Roll to the pad" },
      ]) + wikiReal([
        `Real stages were tested at McGregor, Texas, and integrated at the launch site, not in one bay at the pad.`,
        `The ${wikiSource("guide")} names that test site. The ${wikiSource("assembly")} says the final integration happens at the launch site.`,
      ]),
    };
  }

  function wikiPad() {
    const roll = wikiSpan(TUNING.ROLLOUT_MIN_SEC, TUNING.ROLLOUT_MAX_SEC, "second", "seconds");
    // The day cut matches merlinRefurbDays. The sentence appears only when that cut changes the wait.
    const clean = TUNING.REFURB_OK_DAYS;
    const shortens = Math.max(1, clean - 1) < clean;
    const shorten = shortens
      ? ` A level 2 pad cuts one day from the Merlin refurb in ${wikiPlace("mega_bay", "Mega Bay")}.`
      : "";
    return {
      id: "pad_orbital",
      group: "Buildings",
      title: "Orbital Pad",
      body: wikiParas([
        `The Orbital Pad holds the rocket for a static fire and a ${wikiPageLink("flight", "launch")}. The rocket rolls here from ${wikiPlace("mega_bay", "Mega Bay")}.`,
        `The pad fills the RP-1 tank or the liquid oxygen tank for ${TUNING.FLUID_FILL_COST} money. One press fills that tank.`,
        `Static fire loads ${TUNING.SF_RP1_KG} kg of RP-1 and ${TUNING.SF_LOX_KG} kg of liquid oxygen. A short tank does not start that load. A pad miss or an engine miss still spends both fluids.`,

        `Pad level 2 costs ${TUNING.PAD_L2_COST} steel and takes no days. The thrust limit rises from ${TUNING.PAD_THRUST_L1} kilonewtons (kN) to ${TUNING.PAD_THRUST_L2} kN. The wind limit rises from ${TUNING.WIND_LIMIT_L1} knots to ${TUNING.WIND_LIMIT_L2} knots.${shorten}`,
      ]) + wikiFacts([
        { value: `${TUNING.SF_RP1_KG} kg`, label: "RP-1 for a static fire" },
        { value: `${TUNING.FLIGHT_RP1_KG} kg`, label: "RP-1 for a launch" },
        { value: dayCount(TUNING.INSPECT_DAYS), label: "Inspection on the mount" },
        { value: `${TUNING.PAD_L2_COST} steel`, label: "Pad level 2" },
        { value: `${TUNING.PAD_THRUST_L1} kN`, label: "Thrust limit before the upgrade" },
        { value: `${TUNING.PAD_THRUST_L2} kN`, label: "Thrust limit after the upgrade" },

        `The real Falcon 1 flew from Omelek Island in Kwajalein. This pad stands at Starbase.`,

      ]),
    };

  function wikiArticles() {
    const falcon = wikiFalconOn();
    const pages = [
      falcon ? wikiLaunch() : null,
      falcon ? wikiFlight() : null,
      falcon ? wikiThrust() : null,
      falcon ? wikiImpulse() : null,
      falcon ? wikiEquation() : null,
      falcon ? wikiPropellant() : null,
      falcon ? wikiNumbers() : null,
      falcon ? wikiEngines() : null,
      wikiTime(),
    ].filter(Boolean);
    if (buildingOfType("starfactory")) pages.push(wikiStarfactory());
    if (buildingOfType("mega_bay")) pages.push(wikiBay());
    if (buildingOfType("pad_orbital")) pages.push(wikiPad());
    return pages;
  }

  function renderWiki() {
    const panel = document.getElementById("wiki-panel");
    const sheet = document.getElementById("wiki-sheet");
    if (!panel || !sheet) return;
    const pages = wikiArticles();
    const page = pages.find((p) => p.id === G.wikiPage) || pages[0];
    let nav = "";
    let group = "";
    pages.forEach((p) => {
      if (p.group && p.group !== group) {
        group = p.group;
        nav += `<div class="wiki-group">${esc(group)}</div>`;
      }
      nav += `<button type="button" class="wiki-topic${page && p.id === page.id ? " on" : ""}" data-wiki="${esc(p.id)}">${esc(p.title)}</button>`;
    });
    const article = page
      ? `<h2>${esc(page.title)}</h2>${page.body}`
      : `<p>Nothing on this list is unlocked yet.</p>`;
    const placed = ["starfactory", "mega_bay", "pad_orbital"].map((t) => (buildingOfType(t) ? "1" : "0")).join("");
    const sig = `${page ? page.id : ""}|${wikiUpperOn()}|${wikiFalconOn()}|${placed}|${MS_PER_DAY}|${JSON.stringify(TUNING)}|${ROCKET_DEFS.falcon1.steelCost}|${TUNING.SF_RP1_KG}|${TUNING.SF_LOX_KG}`;
    if (panel.dataset.sig !== sig) {
      panel.dataset.sig = sig;
      panel.innerHTML = `<div class="top"><div class="left">Wiki</div><button type="button" id="wiki-close">Close</button></div>
        <div class="wiki-split"><div class="wiki-nav">${nav}</div><div class="wiki-read">${article}</div></div>`;
      const close = panel.querySelector("#wiki-close");
      if (close) close.onclick = () => { G.wikiSheet = false; renderWiki(); };
      panel.querySelectorAll("[data-wiki]").forEach((btn) => {
        btn.onclick = () => { G.wikiPage = btn.getAttribute("data-wiki"); renderWiki(); };
      });
    }
    sheet.classList.toggle("open", G.wikiSheet);
    sheet.setAttribute("aria-hidden", G.wikiSheet ? "false" : "true");
  }

  function renderFleetList() {
    const panel = document.getElementById("fleet-panel");
    const sheet = document.getElementById("fleet-sheet");
    if (!panel || !sheet) return;
    const list = liveFleet();
    const rows = list.length
      ? list.map((v) => {
        const sel = v.id === G.selectedVehicleId ? " sel" : "";
        return `<button type="button" class="fleet-row${sel}" data-vid="${v.id}">
          <div class="name">${esc(v.name)}</div>
          <div class="meta">${esc(placeLabel(v))} · ${esc(worstLifeLine(v))}${v.needsDetank ? " · empty the tanks" : ""}</div>
        </button>`;
      }).join("")
      : `<p class="fleet-empty">No vehicles yet. Build one at Starfactory.</p>`;
    panel.innerHTML = `<div class="top"><div class="left">${list.length}<span>${list.length === 1 ? "vehicle" : "vehicles"}</span></div>
      <button type="button" id="fleet-close">Close</button></div>${rows}`;
    sheet.classList.toggle("open", G.fleetSheet);
    sheet.setAttribute("aria-hidden", G.fleetSheet ? "false" : "true");
    const close = panel.querySelector("#fleet-close");
    if (close) close.onclick = () => { G.fleetSheet = false; renderFleetList(); };
    panel.querySelectorAll("[data-vid]").forEach((row) => {
      row.onclick = () => {
        G.selectedVehicleId = +row.getAttribute("data-vid");
        G.fleetSheet = false;
        G.rocketSheet = G.selectedVehicleId;
        const v = selectedVehicle();
        if (v && v.buildingId) G.selectedId = v.buildingId;
        renderChrome();
      };
    });
  }

  function placeLabel(v) {
    const m = motionFor(v.id);
    if (m && m.kind === "raise") return "Raising onto the mount";
    if (m && m.kind === "lower") return "Lowering onto the transporter";
    if (m && m.kind === "fill") return "Loading RP-1 and liquid oxygen";
    if (m && m.kind === "fly") return "In flight";
    if (v.status === "in_bay") return `Bay slot ${(v.baySlot || 0) + 1}`;
    if (v.status === "at_factory") return "At the factory";
    if (v.status === "inspect") return `Inspection · ${dayCount(v.inspectLeft)} left`;
    if (v.status === "ready") return "Ready on the mount";
    if (v.status === "flying") return "In flight";
    if (v.status === "on_pad" || v.status === "needs_return") return "On the pad";
    if (v.status === "refurb") return `Refurb · ${partName(v.refurbPart)} · ${dayCount(v.refurbLeft)} left`;
    if (v.status === "rolling") return "On the road";
    return v.status;
  }

  function motionLine(m, v) {
    const name = v ? v.name : "Vehicle";
    const left = Math.max(0, m.duration - m.t).toFixed(0);
    if (m.kind === "raise") return `${name} is raising onto the mount · ${left} s left`;
    if (m.kind === "lower") return `${name} is lowering onto the transporter · ${left} s left`;
    if (m.kind === "fill") return `${name} is loading RP-1 and liquid oxygen · ${left} s left`;
    if (m.kind === "fly") return `${name} is in flight`;
    const dest = m.destKind === "pad" ? "the Orbital Pad" : "Mega Bay";
    return `${name} is rolling to ${dest} · ${left} s left`;
  }

  function actCard(cls, id, extra, name, price, unit, line, price2, unit2) {
    const idAttr = id ? ` id="${id}"` : "";
    let priceHtml = "";
    if (price != null && price2 != null) {
      priceHtml = `<div class="pair"><div><div class="price">${price}</div><div class="unit">${unit}</div></div><div><div class="price">${price2}</div><div class="unit">${unit2}</div></div></div>`;
    } else if (price != null) {
      priceHtml = `<div class="price">${price}</div><div class="unit">${unit}</div>`;
    }
    const lineHtml = line ? `<div class="line">${line}</div>` : "";
    return `<button type="button" class="act ${cls}"${idAttr}${extra || ""}>
      <div class="name">${name}</div>${priceHtml}${lineHtml}
    </button>`;
  }

  function slotRow(v, extra) {
    const pct = rocketPct(v);
    const tone = lifeTone(pct);
    const sel = v.id === G.selectedVehicleId ? " sel" : "";
    return `<button type="button" class="slot${sel}" data-slot="${v.id}"${extra || ""}>
      <span>${esc(v.name)}</span><span class="pc${tone ? ` ${tone}` : ""}">${pct}%</span><span class="pl">${esc(placeLabel(v))}</span>
    </button>`;
  }

  function inspRow(k, n) {
    return `<div class="row"><span>${k}</span><b>${n}</b></div>`;
  }

  // Compact Upgrade row (locked mock .u) — label · cost + Build, not a gold actCard.
  function upgradeRow(id, label, cost, disabled) {
    const dis = disabled ? " disabled" : "";
    return `<div class="u"><span>${esc(label)} · ${cost} steel</span><button type="button" class="u-btn" id="${id}"${dis}>Build</button></div>`;
  }

  // Description, data, and Upgrade scroll. Do-now actions sit pinned under them.
  function renderInspector() {
    const box = el.inspector;
    const actsBox = document.getElementById("insp-acts");
    const scrollBox = document.getElementById("insp-scroll");
    const keep = scrollBox ? scrollBox.scrollTop : 0;
    let acts = "";
    const finish = (html) => {
      box.innerHTML = html;
      if (actsBox) actsBox.innerHTML = acts;
      if (scrollBox) scrollBox.scrollTop = keep;
    };
    if (G.placeType) {
      const d = defOf(G.placeType);
      finish(`<div class="bldg"><div class="desc"><div class="title">Placing ${esc(d.name)}</div><p class="blurb">${esc(d.blurb)}</p></div></div>`);
      if (actsBox) actsBox.innerHTML = actCard("quiet", "btn-x", "", "Cancel", null, "", "");
      const x = document.getElementById("btn-x");
      if (x) x.onclick = () => {
        G.placeType = null; canvas.classList.remove("placing"); renderPalette(); renderInspector();
      };
      return;
    }

    const b = buildingById(G.selectedId);
    if (!b) {
      finish(`<p class="note">Select Starfactory, Mega Bay, or the Orbital Pad on Land or on the map.</p>`);
      return;
    }
    const d = defOf(b.type);
    let html = `<div class="bldg"><div class="desc"><div class="title">${esc(d.name)}</div><p class="blurb">${esc(d.blurb)}</p></div>`;
    let upgrade = "";
    const openCard = (v) => actCard("open quiet", "btn-open", ` data-open="${v.id}"`, `Open ${esc(v.name)}`, null, "", "");

    if (b.type === "starfactory") {
      const hold = factoryHold();
      html += `<div class="sh sub">Data</div>`;
      html += inspRow("Holding", `${hold ? 1 : 0} of 1`);
      if (G.factoryJob) {
        const pct = 1 - G.factoryJob.daysLeft / G.factoryJob.totalDays;
        const label = G.factoryJob.kind === "merlin" ? "Merlin thrust" : G.factoryJob.kind === "structure" ? "Stage dry mass" : rocketOf(G.factoryJob.rocketId).name;
        html += `<p class="wait">${esc(label)} · ${dayCount(G.factoryJob.daysLeft)} left</p>
          <div class="bar-track"><i style="width:${Math.round(pct * 100)}%"></i></div>`;
      } else {
        const r = rocketOf("falcon1");
        const busy = !!(factoryHold() || G.event);
        acts += actCard("build", "", ` data-rocket="falcon1"${busy ? " disabled" : ""}`,
          "Build Falcon 1", r.steelCost, "steel", `${daySpan(TUNING.BUILD_DAYS_MIN, TUNING.BUILD_DAYS_MAX)}. A static fire loads ${TUNING.SF_RP1_KG} kg of RP-1 and ${TUNING.SF_LOX_KG} kg of liquid oxygen.`);
        html += `<p class="wait">Falcon 9, Falcon Heavy, and Starship come later.</p>`;
      }
      if (hold) {
        html += slotRow(hold);
        const bay = buildingOfType("mega_bay");
        if (bay && !bayHasRoom(bay)) {
          const held = returnClaim(bay) > 0 && bayLoad(bay) < bayCapacity(bay);
          html += `<p class="wait">${held ? "Leave a bay slot open. A rocket outside the bay still has to come home." : "Mega Bay is full."}</p>`;
        } else {
          acts += actCard("roll", "btn-stage", "", "Roll to Mega Bay", null, "", "The vehicle leaves the factory.");
        }
        acts += openCard(hold);
      }
      html += `<p class="wait">Raise Merlin thrust and Lighten the stage run here. Open a rocket to start one.</p>`;
    }

    if (b.type === "mega_bay") {
      const n = bayLoad(b);
      const cap = bayCapacity(b);
      html += `<div class="sh sub">Data</div>`;
      html += inspRow("Housed", `${n} of ${cap}`);
      const here = vehiclesAt(b.id);
      for (let slot = 0; slot < cap; slot++) {
        const v = here.find((item) => (item.baySlot || 0) === slot);
        const coming = G.rollouts.find((r) => r.destKind === "bay" && r.destId === b.id && (r.baySlot || 0) === slot);
        if (!v && coming) {
          const iv = vehicleById(coming.vehicleId);
          html += `<div class="slot empty"><span>${esc(iv ? iv.name : "Vehicle")}</span><span class="pc">—</span><span class="pl">On the road</span></div>`;
          continue;
        }
        if (!v) {
          html += `<div class="slot empty"><span>Bay slot ${slot + 1}</span><span class="pc">—</span><span class="pl">Empty</span></div>`;
          continue;
        }
        html += slotRow(v, ` data-bay="${v.id}"`);
      }
      const v = selectedVehicle();
      if (v && v.status === "in_bay" && v.buildingId === b.id) {
        if (padHold() || padBusy()) {
          html += `<p class="wait">The pad holds one rocket.</p>`;
        } else {
          acts += actCard("roll", "btn-topad", "", `Roll ${esc(v.name)} to the pad`, null, "", "The vehicle leaves the bay.");
        }
        acts += openCard(v);
      } else if (v && v.status === "refurb" && v.buildingId === b.id) {
        html += `<p class="wait">${esc(v.name)} · ${esc(partName(v.refurbPart))} · ${dayCount(v.refurbLeft)} left</p>`;
        acts += openCard(v);
      } else {
        html += `<p class="wait">Select a vehicle in the bay to roll it out.</p>`;
      }
      if (cap < TUNING.BAY_MAX) {
        upgrade += upgradeRow("btn-bay", "Add bay slot", TUNING.BAY_SLOT_COST, G.steel < TUNING.BAY_SLOT_COST);
      } else {
        upgrade += `<p class="wait">The bay holds ${TUNING.BAY_MAX} vehicles.</p>`;
      }
    }

    if (b.type === "pad_orbital") {
      const limits = padLimits(b);
      const on = padHold();
      // Short Data only: level, tanks, Mount. No Merlin essay on the pad.
      html += `<div class="sh sub">Data</div>`;
      html += inspRow("Pad level", b.level || 1);
      html += inspRow("Thrust limit", `${limits.thrust} kN`);
      html += inspRow("RP-1 / LOX", `${Math.floor(G.rp1)} / ${Math.floor(G.lox)} kg`);
      html += on ? slotRow(on) : `<div class="slot empty"><span>Mount</span><span class="pc">—</span><span class="pl">Empty</span></div>`;
      const moving = on ? motionFor(on.id) : null;
      const inbound = G.rollouts.find((r) => r.kind === "roll" && r.destKind === "pad");
      if (moving && (moving.kind === "raise" || moving.kind === "lower" || moving.kind === "fill")) {
        html += `<p class="wait">${esc(motionLine(moving, on))}</p>`;
      } else if (moving && moving.kind === "fire") {
        html += `<p class="wait">The static fire is burning.</p>`;
      } else if (moving && moving.kind === "fly") {
        html += `<p class="wait">${esc(on.name)} is in flight.</p>`;
      } else if (on && on.status === "on_pad") {
        const check = fireCheck(on, b);
        const fireLine = check.ok ? "Thrust holds." : `${reasonText(check)}.`;
        if (on.needsDetank) html += `<p class="wait">Open the rocket and empty the tanks.</p>`;
        if (check.ok) {
          acts += actCard("fire", "btn-sf", "", "Static fire", TUNING.SF_RP1_KG, "kg RP-1", fireLine, TUNING.SF_LOX_KG, "kg LOX");
        } else {
          acts += actCard("quiet", "btn-sf", " disabled", "Try static fire", null, "", fireLine);
        }
      } else if (on && on.status === "inspect") {
        html += `<p class="wait">Inspection, ${dayCount(on.inspectLeft)} left.</p>`;
      } else if (on && on.status === "ready") {
        const check = launchCheck(on, b);
        if (on.needsDetank) html += `<p class="wait">Open the rocket and empty the tanks.</p>`;
        if (check.ok) {
          acts += actCard("fire", "btn-launch", "", "Launch", TUNING.FLIGHT_RP1_KG, "kg RP-1", launchCardLine(on, check), TUNING.FLIGHT_LOX_KG, "kg LOX");
        } else {
          const softTry = check.limiter === "weather" || check.limiter === "rp1" || check.limiter === "lox" || check.limiter === "pad" || check.limiter === "engine" || check.limiter === "fitting";
          acts += actCard("quiet", "btn-launch", " disabled", softTry ? "Try launch" : "Launch", null, "", launchCardLine(on, check));
        }
        acts += actCard("quiet roll", "btn-return", "", "Return to Mega Bay", null, "", "The rocket leaves the mount.");
      } else if (on && on.status === "needs_return") {
        acts += actCard("quiet roll", "btn-return", "", "Return to Mega Bay", null, "", "The rocket parks in the bay.");
      } else if (inbound) {
        html += `<p class="wait">${esc(motionLine(inbound, vehicleById(inbound.vehicleId)))}</p>`;
      } else {
        html += `<p class="wait">The pad is empty. Roll a vehicle here from the bay.</p>`;
      }
      cadenceLines().forEach((line) => { html += `<p class="wait">${esc(line)}</p>`; });
      {
        const rp1Full = G.rp1 >= rp1Cap();
        const loxFull = G.lox >= loxCap();
        acts += `<div class="duo">${actCard("quiet", "btn-buy-rp1", rp1Full ? " disabled" : "", "Load RP-1", rp1Full ? null : TUNING.FLUID_FILL_COST, rp1Full ? "" : "money", rp1Full ? "Tank is full." : `Fills to ${rp1Cap()} kg.`)}${actCard("quiet", "btn-buy-lox", loxFull ? " disabled" : "", "Load LOX", loxFull ? null : TUNING.FLUID_FILL_COST, loxFull ? "" : "money", loxFull ? "Tank is full." : `Fills to ${loxCap()} kg.`)}</div>`;
      }
      if (on) acts += openCard(on);
      const tankBusy = !!(G.event || fluidsMoving());
      if (b.level < 2) {
        upgrade += upgradeRow("btn-up", "Pad level 2", TUNING.PAD_L2_COST, G.steel < TUNING.PAD_L2_COST);
      } else {
        upgrade += `<p class="wait">The trench is wide. The thrust limit is ${TUNING.PAD_THRUST_L2} kN.</p>`;
      }
      if (G.rp1Level < 2) {
        upgrade += upgradeRow("btn-rp1", "RP-1 tank", TUNING.RP1_TANK_COST, tankBusy || G.steel < TUNING.RP1_TANK_COST);
      } else {
        upgrade += `<p class="wait">The RP-1 tank holds ${TUNING.RP1_CAP_L2} kg.</p>`;
      }
      if (G.loxLevel < 2) {
        upgrade += upgradeRow("btn-lox", "LOX tank", TUNING.LOX_TANK_COST, tankBusy || G.steel < TUNING.LOX_TANK_COST);
      } else {
        upgrade += `<p class="wait">The LOX tank holds ${TUNING.LOX_CAP_L2} kg.</p>`;
      }
    }
    for (const m of G.rollouts) {
      if (m.kind === "fire" || m.kind === "fly") continue;
      const onPadCard = b.type === "pad_orbital" && (m.kind === "raise" || m.kind === "lower" || m.kind === "fill" || m.kind === "fly" || (m.kind === "roll" && m.destKind === "pad"));
      const onBayCard = b.type === "mega_bay" && m.destKind === "bay" && m.destId === b.id;
      if (onPadCard || onBayCard) continue;
      html += `<p class="wait">${esc(motionLine(m, vehicleById(m.vehicleId)))}</p>`;
    }
    if (upgrade) html += `<div class="upg"><div class="sh">Upgrade</div>${upgrade}</div>`;
    html += `</div>`;

    finish(html);
    const root = document.getElementById("readout");
    root.querySelectorAll("[data-rocket]").forEach((btn) => {
      btn.onclick = () => startBuildRocket(btn.getAttribute("data-rocket"));
    });
    const on = (id, fn) => { const n = root.querySelector(id); if (n) n.onclick = fn; };
    on("#btn-stage", () => stageToBay(factoryHold() && factoryHold().id));
    root.querySelectorAll("[data-slot]").forEach((btn) => {
      btn.onclick = () => {
        G.selectedVehicleId = +btn.getAttribute("data-slot");
        G.rocketSheet = G.selectedVehicleId;
        renderChrome();
      };
    });
    root.querySelectorAll("[data-open]").forEach((btn) => {
      btn.onclick = () => {
        G.selectedVehicleId = +btn.getAttribute("data-open");
        G.rocketSheet = G.selectedVehicleId;
        renderChrome();
      };
    });
    on("#btn-topad", () => startRoll(G.selectedVehicleId, "pad"));
    on("#btn-sf", staticFire);
    on("#btn-launch", startLaunch);
    on("#btn-return", () => startRoll(padHold() && padHold().id, "bay"));
    on("#btn-up", upgradePad);
    on("#btn-bay", upgradeBay);
    on("#btn-rp1", buyRp1Tank);
    on("#btn-lox", buyLoxTank);
    on("#btn-buy-rp1", buyRp1);
    on("#btn-buy-lox", buyLox);
  }

  function cadenceLines() {
    const n = G.fireDays.filter((d) => G.day - d < 30).length;
    const fires = n === 1 ? "1 fire in the last 30 days." : `${n} fires in the last 30 days.`;
    if (!G.fireDays.length) return [fires, "No fire yet."];
    const ago = G.day - G.fireDays[G.fireDays.length - 1];
    const since = ago === 1 ? "1 day since the last fire." : `${ago} days since the last fire.`;
    return [fires, since];
  }

  function buyRp1Tank() {
    if (G.rp1Level >= 2) return;
    if (G.event || fluidsMoving()) { log("Ops busy", "warn"); return; }
    if (G.steel < TUNING.RP1_TANK_COST) { log(`Need ${TUNING.RP1_TANK_COST} steel.`, "bad"); return; }
    G.steel -= TUNING.RP1_TANK_COST;
    G.rp1Level = 2;
    log(`The RP-1 tank now holds ${TUNING.RP1_CAP_L2} kg.`, "good");
    renderChrome();
  }

  function buyLoxTank() {
    if (G.loxLevel >= 2) return;
    if (G.event || fluidsMoving()) { log("Ops busy", "warn"); return; }
    if (G.steel < TUNING.LOX_TANK_COST) { log(`Need ${TUNING.LOX_TANK_COST} steel.`, "bad"); return; }
    G.steel -= TUNING.LOX_TANK_COST;
    G.loxLevel = 2;
    log(`The liquid oxygen tank now holds ${TUNING.LOX_CAP_L2} kg.`, "good");
    renderChrome();
  }

  function renderObjectives() {
    const items = [
      ["place_all", "Buy both sites"],
      ["build_rocket", "Build a rocket at Starfactory"],
      ["multi_bay", "House 2 vehicles in Mega Bay"],
      ["static_fire", "Finish a static fire"],
      ["launch", "Launch a Falcon 1"],
      ["refurb", "Finish a refurb in the bay"],
      ["pad_l2", "Raise the pad to level 2"],
    ];
    const open = items.filter(([k]) => !G.objectives[k]).length;
    const panel = document.getElementById("goal-panel");
    const sheet = document.getElementById("goal-sheet");
    if (!panel || !sheet) return;
    const next = items.find(([k]) => !G.objectives[k]);
    const rows = items.map(([k, label], i) => {
      const done = G.objectives[k];
      const now = next && next[0] === k;
      const cls = done ? "done" : now ? "now" : "";
      const mark = done ? "Done" : `Investors pay ${TUNING.GOAL_PAY[k]}`;
      return `<div class="goal-row ${cls}"><div class="idx">${String(i + 1).padStart(2, "0")}</div><div><div class="name">${esc(label)}</div><div class="line">${mark}</div></div></div>`;
    }).join("");
    panel.innerHTML = `<div class="top"><div class="left">${open}<span>${open ? "still open" : "all done"}</span></div>
      <button type="button" id="goal-close">Close</button></div>${rows}`;
    sheet.classList.toggle("open", G.goalSheet);
    sheet.setAttribute("aria-hidden", G.goalSheet ? "false" : "true");
    const close = panel.querySelector("#goal-close");
    if (close) close.onclick = () => { G.goalSheet = false; renderObjectives(); };
  }

  function renderJobNote() {
    const note = document.getElementById("job-note");
    if (!note) return;
    const lines = [];
    const days = (n) => `${dayCount(n)} left`;
    if (G.factoryJob) {
      const job = G.factoryJob;
      if (job.kind === "merlin") {
        const v = vehicleById(job.vehicleId);
        lines.push(`${v ? v.name : "Rocket"} · Merlin thrust to ${TUNING.MERLIN_1C_KN} kN · ${days(job.daysLeft)}`);
      } else if (job.kind === "structure") {
        const v = vehicleById(job.vehicleId);
        lines.push(`${v ? v.name : "Rocket"} · lightening the stage · ${days(job.daysLeft)}`);
      } else {
        lines.push(`Starfactory · building ${rocketOf(job.rocketId).name} · ${days(job.daysLeft)}`);
      }
    }
    for (const m of G.rollouts) {
      if (m.kind === "fire") {
        const v = vehicleById(m.vehicleId);
        const phase = m.phases[m.phaseIdx];
        const left = phase ? Math.max(0, phase.dur - m.phaseT) : 0;
        lines.push(`${v ? v.name : "Rocket"} · static fire · ${left.toFixed(0)} s left`);
      } else if (m.kind === "fly") {
        const v = vehicleById(m.vehicleId);
        lines.push(`${v ? v.name : "Rocket"} · in flight · ${wikiNum(m.h / 1000, 1)} km`);
      } else {
        lines.push(motionLine(m, vehicleById(m.vehicleId)));
      }
    }
    for (const v of liveFleet()) {
      if (v.refurbPart && v.refurbLeft > 0) {
        lines.push(`${v.name} · ${partName(v.refurbPart)} · refurb in Mega Bay · ${days(v.refurbLeft)}`);
      }
    }
    note.innerHTML = lines.map((line) => `<span>${esc(line)}</span>`).join("");
  }

  function rangeClosed() {
    const sky = weatherOn(G.day);
    const lim = padLimits(buildingOfType("pad_orbital"));
    return rangeShut(sky.storm, sky.wind, lim.wind);
  }

  function renderWeather() {
    const sky = document.getElementById("sky-label");
    const lamp = document.getElementById("range-lamp");
    if (!sky) return;
    const now = weatherOn(G.day);
    const closed = rangeClosed();
    if (lamp) lamp.classList.toggle("closed", closed);
    sky.textContent = closed ? "Range closed" : "Range open";
    const wind = document.getElementById("wind-label");
    if (wind) wind.textContent = `${now.sky} ${now.wind} kn`;
    const readout = document.getElementById("readout");
    if (readout) {
      const pad = buildingOfType("pad_orbital");
      const v = pad && padHold();
      const loading = fluidsMoving();
      const hold = !!(v && !loading && (
        (v.status === "on_pad" && !fireCheck(v, pad).ok) ||
        (v.status === "ready" && !launchCheck(v, pad).ok)
      ));
      readout.classList.toggle("hold", closed || hold);
    }
  }

  function startMerlinUpgrade(vehicleId) {
    const v = vehicleById(vehicleId);
    if (!v || v.merlinTier >= 2) return;
    if (G.factoryJob) { log("The factory is already busy.", "warn"); return; }
    if (G.steel < TUNING.MERLIN_UP_COST) { log(`Need ${TUNING.MERLIN_UP_COST} steel.`, "bad"); return; }
    G.steel -= TUNING.MERLIN_UP_COST;
    const upDays = spanDays(TUNING.MERLIN_UP_DAYS_MIN, TUNING.MERLIN_UP_DAYS_MAX);
    G.factoryJob = { kind: "merlin", vehicleId: v.id, daysLeft: upDays, totalDays: upDays };
    log(`Merlin thrust on ${v.name} rises to ${TUNING.MERLIN_1C_KN} kN in ${dayCount(upDays)}.`, "good");
    renderChrome();
  }

  function startStructureLighten(vehicleId) {
    const v = vehicleById(vehicleId);
    if (!v || v.structureTier >= 2) return;
    if (G.factoryJob) { log("The factory is already busy.", "warn"); return; }
    if (G.steel < TUNING.STAGE_LIGHTEN_COST) { log(`Need ${TUNING.STAGE_LIGHTEN_COST} steel.`, "bad"); return; }
    G.steel -= TUNING.STAGE_LIGHTEN_COST;
    const cutDays = spanDays(TUNING.STAGE_LIGHTEN_DAYS_MIN, TUNING.STAGE_LIGHTEN_DAYS_MAX);
    G.factoryJob = { kind: "structure", vehicleId: v.id, daysLeft: cutDays, totalDays: cutDays };
    log(`Stage dry mass on ${v.name} falls in ${dayCount(cutDays)}.`, "good");
    renderChrome();
  }

  function startPartRefurb(vehicleId, part) {
    const v = vehicleById(vehicleId);
    if (!v) return;
    if (v.refurbPart || bayPartBusy(v.id)) { log("The bay is already on one part.", "warn"); return; }
    if (v.status !== "in_bay") { log("Refurb a part in Mega Bay.", "warn"); return; }
    if (part !== "merlin" && part !== "fitting" && part !== "stage") return;
    let days = TUNING.INSPECT_DAYS;
    if (part === "merlin") {
      if (G.steel < TUNING.MERLIN_REFURB_COST) { log(`Need ${TUNING.MERLIN_REFURB_COST} steel.`, "bad"); return; }
      G.steel -= TUNING.MERLIN_REFURB_COST;
      days = merlinRefurbDays();
    } else if (part === "stage") {
      days = spanDays(TUNING.REFURB_FAIL_MIN, TUNING.REFURB_FAIL_MAX);
    }
    v.refurbPart = part;
    v.refurbLeft = days;
    v.status = "refurb";
    const cost = part === "merlin" ? ` ${TUNING.MERLIN_REFURB_COST} steel.` : " No steel.";
    log(`${v.name} · ${partName(part)} · ${dayCount(days)}.${cost}`, "info");
    renderChrome();
  }

  function partJobLine(v, key) {
    if (v.refurbPart === key) return `${partName(key)} · ${dayCount(v.refurbLeft)} left`;
    if (key === "merlin") return `Refurb the engine · ${dayCount(merlinRefurbDays())} · ${TUNING.MERLIN_REFURB_COST} steel`;
    if (key === "fitting") return `Inspect the fuel lines · ${dayCount(TUNING.INSPECT_DAYS)} · no steel`;
    return `Refurb the structure · ${daySpan(TUNING.REFURB_FAIL_MIN, TUNING.REFURB_FAIL_MAX)} · no steel`;
  }

  function lifeFill(pct) {
    if (pct < 40) return "#e10600";
    if (pct < 70) return "#c4a15a";
    return "#f2f2f2";
  }

  function inkOn(pct, labelY, y0, y1) {
    const fillTop = y1 - (y1 - y0) * pct / 100;
    return labelY >= fillTop ? "#141414" : "#f2f2f2";
  }

  function lifeBox(y0, y1, pct) {
    const span = y1 - y0;
    const h = Math.max(0, span * pct / 100);
    return { y: (y1 - h).toFixed(1), h: h.toFixed(1) };
  }

  // Cutaway, top to bottom: Structure holds the liquid oxygen tank over the RP-1 tank.
  // Fuel lines run from both tanks through the turbopump. The Merlin bell sits under them.
  function rocketCutaway(v) {
    const stage = lifePct(v, "stage");
    const fitting = lifePct(v, "fitting");
    const merlin = lifePct(v, "merlin");
    const stageBox = lifeBox(14, 262, stage);
    const fitBox = lifeBox(262, 316, fitting);
    const merlinBox = lifeBox(316, 408, merlin);
    const tone = (pct) => lifeTone(pct);
    const stroke = (key) => {
      const hot = v.refurbPart === key || (!v.refurbPart && key === worstPart(v) && rocketPct(v) < 100);
      return hot ? "#e10600" : "#f2f2f2";
    };
    const hull = "80,14 104,92 104,262 56,262 56,92";
    const thrust = "56,262 104,262 100,316 60,316";
    const bell = "70,316 90,316 116,408 44,408";
    return `<svg class="ship" viewBox="0 0 160 420" role="img" aria-label="${esc(v.name)}">
      <defs>
        <linearGradient id="hull-shade" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#8a8a8a"/><stop offset="0.38" stop-color="#f7f7f7"/>
          <stop offset="0.7" stop-color="#cfcfcf"/><stop offset="1" stop-color="#6e6e6e"/>
        </linearGradient>
        <clipPath id="clip-stage"><polygon points="${hull}"/></clipPath>
        <clipPath id="clip-fitting"><polygon points="${thrust}"/></clipPath>
        <clipPath id="clip-merlin"><polygon points="${bell}"/></clipPath>
      </defs>
      <polygon points="${hull}" fill="#141414"/>
      <polygon points="${thrust}" fill="#0c0c0c"/>
      <polygon points="${bell}" fill="#120e0c"/>
      <g clip-path="url(#clip-stage)"><rect class="life ${tone(stage)}" x="56" y="${stageBox.y}" width="48" height="${stageBox.h}" fill="${lifeFill(stage)}" fill-opacity="0.55"/></g>
      <g clip-path="url(#clip-fitting)"><rect class="life ${tone(fitting)}" x="56" y="${fitBox.y}" width="48" height="${fitBox.h}" fill="${lifeFill(fitting)}" fill-opacity="0.35"/></g>
      <g clip-path="url(#clip-merlin)"><rect class="life ${tone(merlin)}" x="44" y="${merlinBox.y}" width="72" height="${merlinBox.h}" fill="${lifeFill(merlin)}"/></g>
      <polygon points="56,200 24,276 56,262" fill="url(#hull-shade)" stroke="#0a0a0a" stroke-width="1"/>
      <polygon points="104,200 136,276 104,262" fill="url(#hull-shade)" stroke="#0a0a0a" stroke-width="1"/>
      <rect x="61" y="100" width="38" height="66" rx="9" fill="none" stroke="#f2f2f2" stroke-opacity="0.55"/>
      <text class="tag sm" text-anchor="middle" x="80" y="137" fill="#f2f2f2" fill-opacity="0.7">LOX</text>
      <rect x="61" y="176" width="38" height="72" rx="9" fill="none" stroke="#f2f2f2" stroke-opacity="0.55"/>
      <polygon points="${hull}" fill="none" stroke="${stroke("stage")}" stroke-width="1.6"/>
      <path d="M74 30 L66 88" fill="none" stroke="#ffffff" stroke-opacity="0.4"/>
      <path d="M68 166 C66 220 64 250 72 286 M80 248 V286" fill="none" stroke="#e10600" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="76" cy="292" r="7" fill="#0a0a0a" stroke="${stroke("fitting")}" stroke-width="1.4"/>
      <path d="M76 299 V316" stroke="#e10600" stroke-width="2.4"/>
      <polygon points="${thrust}" fill="none" stroke="${stroke("fitting")}" stroke-width="1.6"/>
      <polygon points="${bell}" fill="none" stroke="${stroke("merlin")}" stroke-width="1.6"/>
      <path d="M60 352 H100 M54 382 H106" fill="none" stroke="#f2f2f2" stroke-opacity="0.22"/>
      <text class="tag" text-anchor="middle" x="80" y="214" fill="${inkOn(stage, 210, 14, 262)}">${stage}%</text>
      <text class="tag" text-anchor="middle" x="94" y="296" fill="#f2f2f2">${fitting}%</text>
      <text class="tag" text-anchor="middle" x="80" y="372" fill="${inkOn(merlin, 368, 316, 408)}">${merlin}%</text>
      <rect class="hit" data-part="stage" x="20" y="12" width="120" height="250" fill="transparent"/>
      <rect class="hit" data-part="fitting" x="18" y="262" width="122" height="54" fill="transparent"/>
      <rect class="hit" data-part="merlin" x="18" y="316" width="124" height="96" fill="transparent"/>
    </svg>`;
  }

  function rocketCalls(v) {
    const inBay = v.status === "in_bay" || v.status === "refurb";
    const worst = worstPart(v);
    const otherBusy = bayPartBusy(v.id);
    return ["stage", "fitting", "merlin"].map((key) => {
      const pct = lifePct(v, key);
      const tone = lifeTone(pct);
      const hot = v.refurbPart === key || (!v.refurbPart && key === worst && rocketPct(v) < 100);
      const wait = otherBusy || (v.refurbPart && v.refurbPart !== key);
      const cls = ["call", key, tone, hot ? "hot" : ""].filter(Boolean).join(" ");
      const job = inBay ? `<div class="job">${esc(partJobLine(v, key))}</div>` : "";
      const body = `<b>${esc(partName(key))}</b><em>${pct}% · ${esc(partLifeLabel(v, key))}</em>${job}`;
      if (!inBay) return `<div class="${cls}">${body}</div>`;
      return `<button type="button" class="${cls}" id="btn-part-${key}"${wait ? " disabled" : ""}>${body}</button>`;
    }).join("");
  }

  let rocketSheetDraw = "";

  function renderRocketSheet() {
    const sheet = document.getElementById("rocket-sheet");
    const panel = document.getElementById("rocket-panel");
    const v = G.rocketSheet ? vehicleById(G.rocketSheet) : null;
    if (!sheet || !panel || !v) {
      if (sheet) { sheet.classList.remove("open"); sheet.setAttribute("aria-hidden", "true"); }
      rocketSheetDraw = "";
      G.rocketSheet = null;
      return;
    }
    const merlinJob = G.factoryJob && G.factoryJob.kind === "merlin" && G.factoryJob.vehicleId === v.id ? G.factoryJob : null;
    const structureJob = G.factoryJob && G.factoryJob.kind === "structure" && G.factoryJob.vehicleId === v.id ? G.factoryJob : null;
    const dry = stageDryKg(v);
    let action = "";
    if (v.needsDetank) {
      action += actCard("up wide", "btn-empty", "", "Empty the tanks", Math.floor(G.rp1), "kg RP-1",
        "The scrubbed load leaves the tanks.", Math.floor(G.lox), "kg LOX");
    }
    if (merlinJob) action += `<p class="wait">Merlin thrust · ${dayCount(merlinJob.daysLeft)} left</p>`;
    else if ((v.merlinTier || 1) < 2) {
      action += actCard("up", "btn-merlin", G.steel < TUNING.MERLIN_UP_COST ? " disabled" : "",

  function syncCamFromGeo() {
    if (!W) return;
    const MW = MAP_W * CELL, MH = MAP_H * CELL;
    const cx = (G.lon - GEO_W) / (GEO_E - GEO_W) * MW;
    const cy = (GEO_N - G.lat) / (GEO_N - GEO_S) * MH;
    const worldW = G.span / (GEO_E - GEO_W) * MW;
    G.cam.zoom = W / worldW;
    G.cam.x = cx - (W * 0.5) / G.cam.zoom;
    G.cam.y = cy - (H * 0.5) / G.cam.zoom;
  }

  function draw() {
    if (!W) return;
    syncCamFromGeo();
    ctx.clearRect(0, 0, W, H);
    const band = viewBand();
    if (band === "World") {
      drawGlobe();
      drawCountryBorders("globe");
      drawCountryNames("globe");
      drawSiteDots("globe");
      drawGeoReadout();
      updateFieldChrome(band);
      return;
    }
    drawFlatLand();
    if (band === "Region") {
      drawCountryBorders("flat");
      drawCountryNames("flat");
      drawSiteDots("flat");
    }
    ctx.save();
    ctx.scale(G.cam.zoom, G.cam.zoom);
    ctx.translate(-G.cam.x, -G.cam.y);

    if (band !== "Region") drawSiteRoad();

    if (G.placeType && G._hover) {
      const def = defOf(G.placeType);
      const ok = canPlace(G.placeType, G._hover.gx, G._hover.gy).ok;
      drawBldg(G._hover.gx, G._hover.gy, def, 1, ok ? "ok" : "bad", false);
    }

    for (const b of G.buildings) {
      drawBldg(b.gx, b.gy, defOf(b.type), b.level, b.id === G.selectedId ? "sel" : "n", true);
    }

    // vehicles
    for (const v of liveFleet()) {
      const m = motionFor(v.id);
      if (m && m.kind === "roll") {
        ctx.strokeStyle = "rgba(232,200,100,0.4)";
        ctx.lineWidth = 2; ctx.setLineDash([6, 6]);
        ctx.beginPath();
        m.pts.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
        ctx.stroke(); ctx.setLineDash([]);
        drawVeh(v.wx, v.wy, v);
      } else if (v.buildingId || m) {
        drawVeh(v.wx, v.wy, v);
      }
    }
    for (const ev of G.rollouts) {
      if (ev.kind === "fly") {
        const v = vehicleById(ev.vehicleId);
        if (v) drawFlyFlame(v.wx, v.wy, ev.t, ev.pitchDeg);
        continue;
      }
      if (ev.kind !== "fire") continue;
      const v = vehicleById(ev.vehicleId);
      if (v) {
        const phase = ev.phases[ev.phaseIdx];
        const pid = phase ? phase.id : "";
        if (pid === "ignition" || pid === "burn" || pid === "shutdown" || pid === "anomaly") {
          drawFlame(v.wx, v.wy, ev.t, pid);
        }
        drawFireWord(v.wx, v.wy, ev);
      }
    }

    ctx.restore();
    for (const fill of G.rollouts) {
      if (fill.kind !== "fill") continue;
      const v = vehicleById(fill.vehicleId);
      if (!v) continue;
      const s = worldToScreen(v.wx, v.wy);

    const c = document.createElement("canvas");
    c.width = mw; c.height = mh;
    const g = c.getContext("2d");
    g.beginPath();
    for (const ring of GEO_RINGS.world) {
      let prev = null;
      let open = false;
      for (const p of ring) {
        if (prev && Math.abs(p[0] - prev[0]) > 180) open = false;
        const x = ((p[0] + 180) / 360) * mw;
        const y = ((90 - p[1]) / 180) * mh;
        if (!open) { g.moveTo(x, y); open = true; }
        else g.lineTo(x, y);
        prev = p;
      }
      g.closePath();
    }
    g.fillStyle = "#000";
    g.fill();
    landMask = { data: g.getImageData(0, 0, mw, mh).data, mw, mh };
  }
  function maskLand(lon, lat) {
    if (!landMask) buildLandMask();
    let x = Math.floor(((lon + 180) % 360) / 360 * landMask.mw);
    if (x < 0) x += landMask.mw;
    const y = Math.floor((90 - lat) / 180 * landMask.mh);
    if (y < 0 || y >= landMask.mh || x >= landMask.mw) return false;
    return landMask.data[(y * landMask.mw + x) * 4 + 3] > 10;
  }

  function drawGlobe() {
    ctx.fillStyle = "#071018";
    ctx.fillRect(0, 0, W, H);
    const R = Math.min(W, H) * 0.42;
    const S = Math.max(160, Math.floor(R * 2));
    const c = document.createElement("canvas");
    c.width = S; c.height = S;
    const g = c.getContext("2d");
    const img = g.createImageData(S, S);
    const d = img.data;
    const φ0 = G.lat * Math.PI / 180;
    const λ0 = G.lon * Math.PI / 180;
    const sinφ = Math.sin(φ0), cosφ = Math.cos(φ0);
    for (let py = 0; py < S; py++) {
      for (let px = 0; px < S; px++) {
        const dx = (px + 0.5) / S * 2 - 1;
        const dy = 1 - (py + 0.5) / S * 2;
        const r2 = dx * dx + dy * dy;
        const i = (py * S + px) * 4;
        if (r2 > 1) continue;
        const z = Math.sqrt(1 - r2);
        const lat = Math.asin(Math.max(-1, Math.min(1, z * sinφ + dy * cosφ))) * 180 / Math.PI;
        const lon = (λ0 + Math.atan2(dx, z * cosφ - dy * sinφ)) * 180 / Math.PI;
        const land = maskLand(lon, lat);
        d[i] = land ? 47 : 11;
        d[i + 1] = land ? 106 : 58;
        d[i + 2] = land ? 60 : 74;
        d[i + 3] = 255;
      }
    }
    g.putImageData(img, 0, 0);
    ctx.drawImage(c, W * 0.5 - R, H * 0.5 - R, R * 2, R * 2);
  }

  function toScreen(lon, lat) {
    if (viewBand() === "World") return projectGlobe(lon, lat);
    return projectFlat(lon, lat);
  }

  function drawGeoReadout() {
    const heading = 90;
    // The burn holds the rocket down, so the map pitch stays at 90.
    const pitch = 90;
    const dLon = 50 / (111.32 * Math.cos(PAD_LAT * Math.PI / 180));
    const endLon = PAD_LON + dLon;
    ctx.save();
    const ns = G.lat >= 0 ? "N" : "S";
    const ew = G.lon >= 0 ? "E" : "W";
    ctx.fillStyle = "#f2f2f2";
    ctx.font = "12px ui-monospace, monospace";
    ctx.fillText(`View ${Math.abs(G.lat).toFixed(3)}° ${ns}  ${Math.abs(G.lon).toFixed(3)}° ${ew}`, 12, H - 52);
    ctx.fillText(`Pad ${PAD_LAT.toFixed(3)}° N  ${Math.abs(PAD_LON).toFixed(3)}° W`, 12, H - 34);
    ctx.fillText(`Heading ${heading}°  pitch ${pitch.toFixed(0)}°  50 km to ${Math.abs(endLon).toFixed(2)}° W`, 12, H - 16);
    ctx.restore();
  }

  function drawBldg(gx, gy, def, level, mode, label) {
    const x = gx * CELL, y = gy * CELL;
    const w = def.footprint.w * CELL, h = def.footprint.h * CELL;
    const depth = 10 + (level > 1 ? 4 : 0);
    const onScreen = w * G.cam.zoom;
    ctx.fillStyle = "rgba(90, 70, 48, 0.35)";
    ctx.beginPath();
    ctx.ellipse(x + w * 0.5, y + h * 0.62, w * 0.62, h * 0.28, 0, 0, Math.PI * 2);
    ctx.fill();
    let top = "#8c4536", front = "#6d382c";
    if (def.id === "mega_bay") { top = "#3e5560"; front = "#2c3e46"; }
    if (def.id === "pad_orbital") { top = "#8a8680"; front = "#5c5148"; }
    if (mode === "ok") { top = "rgba(140,180,100,0.45)"; front = "rgba(100,140,70,0.45)"; }
    if (mode === "bad") { top = "rgba(180,80,70,0.45)"; front = "rgba(140,50,45,0.45)"; }
    ctx.fillStyle = top; ctx.fillRect(x, y, w, h - depth);
    ctx.fillStyle = front; ctx.fillRect(x, y + h - depth, w, depth);
    if (onScreen > 36 && def.id === "pad_orbital") {
      const tw = level >= 2 ? w * 0.72 : w * 0.42;
      const th = level >= 2 ? 14 : 10;
      ctx.fillStyle = "#2a2a30";
      ctx.fillRect(x + (w - tw) / 2, y + h - depth - th - 4, tw, th);
      const oh = level >= 2 ? 22 : 14;
      ctx.fillStyle = "#c0c0c8";
      ctx.fillRect(x + w / 2 - 7, y + h - depth - th - 4 - oh, 14, oh);
    } else if (onScreen > 36 && def.id === "mega_bay") {
      // multi-bay doors for housing visual
      ctx.fillStyle = "#3a3028";
      const doors = bayCapacity();
      for (let i = 0; i < doors; i++) {
        ctx.fillRect(x + 12 + i * (w / (doors + 0.4)), y + h - depth - 30, w / (doors + 1.5), 28);
      }
      const n = bayLoad();
      for (let i = 0; i < doors; i++) {
        ctx.fillStyle = i < n ? "#8fbc6a" : "#3a3028";
        ctx.fillRect(x + 8 + i * 14, y + 8, 10, 6);
      }
    } else if (onScreen > 36 && def.id === "starfactory") {
      ctx.fillStyle = "#4a6a8a";
      ctx.fillRect(x + w * 0.28, y + h - depth - 22, w * 0.44, 18);
      const job = G.factoryJob;
      if (job && job.kind === "rocket") {
        const pct = clamp(1 - job.daysLeft / Math.max(1, job.totalDays), 0.12, 1);
        const rk = rocketOf(job.rocketId);
        drawRocketBody(x + w / 2, y + h * 0.42, rk.color || "#c8d0d8", rk.engines || 1, rk.mapScale || 1, 0, pct);
      } else if (job) {
        ctx.fillStyle = "#d4a84b";
        ctx.fillRect(x + 8, y + 8, w - 16, 5);
      }
    }
    if (mode === "sel") {
      ctx.strokeStyle = "#d4a84b"; ctx.lineWidth = 2;
      ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
    }
    if (label && mode !== "ok" && mode !== "bad" && metersPerPx() < 600 && onScreen > 22) {
      let tag = def.short + (level > 1 ? " L" + level : "");
      if (def.id === "mega_bay") tag += ` ${bayLoad()}/${bayCapacity()}`;
      ctx.font = "bold 11px system-ui";
      const tw = ctx.measureText(tag).width;
      ctx.fillStyle = "rgba(255,248,220,0.92)";
      ctx.strokeStyle = "#8a7848";
      ctx.fillRect(x + 4, y - 16, tw + 8, 14);
      ctx.strokeRect(x + 4, y - 16, tw + 8, 14);
      ctx.fillStyle = "#1f1a12";
      ctx.fillText(tag, x + 8, y - 5);
    }
  }

  // 0 lies flat. 1 stands on the mount. The raise is the only climb from flat to vertical.
  const NOSE_UP = -Math.PI / 2;
  function vehPose(v) {
    const m = motionFor(v.id);
    if (m && m.kind === "raise") return clamp(m.t / m.duration, 0, 1);
    if (m && m.kind === "lower") return 1 - clamp(m.t / m.duration, 0, 1);
    if (m && (m.kind === "fire" || m.kind === "fill" || m.kind === "fly")) return 1;
    if (v.status === "on_pad" || v.status === "inspect" || v.status === "ready" || v.status === "flying" || v.status === "needs_return") return 1;
    return 0;
  }
  function angleDelta(from, to) {
    let d = to - from;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    return d;
  }
  function pathHeading(pts) {
    for (let i = 0; i < pts.length - 1; i++) {
      const dx = pts[i + 1].x - pts[i].x;
      const dy = pts[i + 1].y - pts[i].y;
      if (dx * dx + dy * dy > 16) return Math.atan2(dy, dx);
    }
    return 0;
  }
  function segmentHeading(r) {
    if (!r.pts || r.pts.length < 2 || !r.segLens) return r.flatHeading || 0;
    let dist = clamp((r.t || 0) / (r.duration || 1), 0, 1) * (r.totalLen || 0);
    let i = 0;
    for (; i < r.segLens.length; i++) {
      if (dist <= r.segLens[i] || i === r.segLens.length - 1) break;
      dist -= r.segLens[i];
    }
    while (i < r.segLens.length - 1 && r.segLens[i] < 4) i++;
    const a = r.pts[i], b = r.pts[i + 1];
    return Math.atan2(b.y - a.y, b.x - a.x);
  }
  function vehAngle(v) {
    const m = motionFor(v.id);
    if (m && m.kind === "roll") return segmentHeading(m);
    if (m && m.kind === "raise") {
      const pose = clamp(m.t / m.duration, 0, 1);
      const flat = m.flatHeading || 0;
      return flat + angleDelta(flat, NOSE_UP) * pose;
    }
    if (m && m.kind === "lower") {
      const pose = clamp(m.t / m.duration, 0, 1);
      const flat = m.flatHeading == null ? Math.PI : m.flatHeading;
      return NOSE_UP + angleDelta(NOSE_UP, flat) * pose;
    }
    if (m && m.kind === "fly") return -((m.pitchDeg == null ? 90 : m.pitchDeg) * Math.PI / 180);
    if ((m && (m.kind === "fire" || m.kind === "fill")) || v.status === "on_pad" || v.status === "inspect" || v.status === "ready" || v.status === "flying" || v.status === "needs_return") return NOSE_UP;
    return 0;
  }

  function drawRocketBody(x, y, color, engines, scale, angle, lengthScale) {
    const s = scale || 1;
    const grow = lengthScale == null ? 1 : lengthScale;
    const len = 32 * s * grow;
    const thick = (engines === 9 ? 11 : 8) * s;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.fillStyle = color;
    ctx.fillRect(0, -thick / 2, Math.max(4, len), thick);
    if (grow > 0.35) {
      ctx.beginPath();
      ctx.moveTo(len, -thick / 2);
      ctx.lineTo(len + 8 * s, 0);
      ctx.lineTo(len, thick / 2);
      ctx.closePath();
      ctx.fill();
    }
    ctx.fillStyle = "#3a4048";
    ctx.fillRect(-3 * s, -thick * 0.28, 3 * s, thick * 0.56);
    ctx.restore();
  }

  function drawVeh(x, y, v) {
    const r = rocketOf(v.rocketId);
    const s = r.mapScale || 1;
    const pose = vehPose(v);
    const m = motionFor(v.id);
    const onTransporter = (m && m.kind === "roll") || (m && m.kind === "lower") || (m && m.kind === "raise" && pose < 0.9);
    const len = 32 * s;
    const thick = (r.engines === 9 ? 11 : 8) * s;
    const ang = vehAngle(v);
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(ang);
    if (onTransporter) {
      ctx.globalAlpha = m && m.kind === "raise" ? Math.max(0, 1 - pose) : 1;
      ctx.fillStyle = "#3a342c";
      ctx.fillRect(-4, thick * 0.45, len + 14, 8 * s);
      ctx.globalAlpha = 1;
    }
    if (v.status === "refurb") {
      ctx.strokeStyle = "#d4a84b";
      ctx.strokeRect(-4, -thick / 2 - 4, len + 14, thick + 8);
    }
    if (v.id === G.selectedVehicleId) {
      ctx.strokeStyle = "#d4a84b";
      ctx.lineWidth = 1.5;
      ctx.strokeRect(-5, -thick / 2 - 4, len + 16, thick + 8);
    }
    ctx.restore();
    drawRocketBody(x, y, r.color, r.engines, s, ang, 1);
    ctx.font = "bold 9px system-ui";
    ctx.fillStyle = "rgba(255,248,220,0.92)";
    ctx.fillText(v.name, x - 10, y - (16 + pose * (len - 6)));
  }

  // Screen pixels, so the bars stay readable when the map is zoomed out.
  function drawFillBars(x, y, u) {
    const bars = [
      { name: "RP-1", color: "#d4a84b" },
      { name: "LOX", color: "#8ec8e8" },
    ];
    const w = 14;
    const h = 64;
    const gap = 8;
    let bx = x - (w * 2 + gap + 18);
    ctx.save();
    ctx.font = "11px system-ui";
    bars.forEach((bar) => {
      ctx.fillStyle = "rgba(0,0,0,0.72)";
      ctx.fillRect(bx, y - h, w, h);
      const fh = h * clamp(u, 0, 1);
      ctx.fillStyle = bar.color;
      ctx.fillRect(bx, y - fh, w, fh);
      ctx.fillStyle = "#f2f2f2";
      ctx.fillText(bar.name, bx - 2, y + 14);
      bx += w + gap;
    });
    ctx.restore();
  }

  function drawFlyFlame(x, y, t, pitchDeg) {
    const ang = -((pitchDeg == null ? 90 : pitchDeg) * Math.PI / 180);
    const n = 11;
    const reach = 36;
    for (let i = 0; i < n; i++) {
      const side = Math.sin(t * 11 + i * 1.7) * 4;
      const len = reach * (0.45 + (i % 5) * 0.14);
      const ox = Math.cos(ang + Math.PI / 2) * side;
      const oy = Math.sin(ang + Math.PI / 2) * side;
      const bx = x - Math.cos(ang) * 3 + ox;
      const by = y - Math.sin(ang) * 3 + oy;
      ctx.fillStyle = i % 2 ? "rgba(255,120,30,0.9)" : "rgba(255,210,90,0.8)";
      ctx.beginPath();
      ctx.moveTo(bx, by - 2);
      ctx.lineTo(bx - Math.cos(ang) * len, by - Math.sin(ang) * len);
      ctx.lineTo(bx, by + 2);
      ctx.fill();
    }
  }

  // The flame leaves the base and runs east. The clock is the fire's own time, so Pause holds it.
  function drawFlame(x, y, t, pid) {
    const n = pid === "shutdown" ? 4 : pid === "ignition" ? 7 : 11;
    const reach = pid === "shutdown" ? 18 : pid === "ignition" ? 28 : pid === "anomaly" ? 52 : 40;
    for (let i = 0; i < n; i++) {
      const oy = Math.sin(t * 11 + i * 1.7) * 4;
      const len = reach * (0.45 + (i % 5) * 0.14);
      ctx.fillStyle = i % 2 ? "rgba(255,120,30,0.9)" : "rgba(255,210,90,0.8)";
      ctx.beginPath();
      ctx.moveTo(x, y + oy - 3);
      ctx.lineTo(x + len, y + oy);
      ctx.lineTo(x, y + oy + 3);
      ctx.fill();
    }
  }

  function burnStarted(ev) {
    const phase = ev.phases && ev.phases[ev.phaseIdx];
    const pid = phase ? phase.id : "";
    return pid === "ignition" || pid === "burn" || pid === "shutdown" || pid === "anomaly" || pid === "debrief" || pid === "fail";
  }
  function drawFireWord(x, y, ev) {
    if (!burnStarted(ev)) return;
    const word = ev.success ? "Held" : (ev.limiter === "pad" ? "Pad" : "Engine");
    ctx.font = "bold 12px system-ui";
    ctx.fillStyle = ev.success ? "#c8e2a8" : "#e09080";
    ctx.fillText(word, x - 8, y - 54);
  }

  // ── Input ──
  function canvasPos(ev) {
    const r = canvas.getBoundingClientRect();
    return { x: ev.clientX - r.left, y: ev.clientY - r.top };
  }
  function hitBldg(wx, wy) {
    for (let i = G.buildings.length - 1; i >= 0; i--) {
      const b = G.buildings[i], d = defOf(b.type);
      const x0 = b.gx * CELL, y0 = b.gy * CELL;
      if (wx >= x0 && wx < x0 + d.footprint.w * CELL && wy >= y0 && wy < y0 + d.footprint.h * CELL) return b;
    }
    return null;
  }
  function hitVeh(wx, wy) {
    for (let i = liveFleet().length - 1; i >= 0; i--) {
      const v = liveFleet()[i];
      if (Math.hypot(wx - v.wx, wy - v.wy) < 18) return v;
    }
    return null;
  }

  const pointers = new Map();
  let pinch = null;
  function setSpan(next) {
    G.span = clamp(next, 0.008, 1200);
    G.lat = clamp(G.lat, -70, 78);
    if (G.lon > 180) G.lon -= 360;
    if (G.lon < -180) G.lon += 360;
    syncCamFromGeo();
  }
  canvas.addEventListener("pointerdown", (ev) => {
    canvas.setPointerCapture(ev.pointerId);
    const p = canvasPos(ev);
    pointers.set(ev.pointerId, p);
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      pinch = { dist: Math.max(12, Math.hypot(a.x - b.x, a.y - b.y)), span: G.span };
      G.drag = null;
      return;
    }
    syncCamFromGeo();
    const w = screenToWorld(p.x, p.y);
    if (G.span < 1.2 && G.placeType) {
      placeBuilding(G.placeType, Math.floor(w.x / CELL), Math.floor(w.y / CELL));
      return;
    }
    if (G.span < 1.2) {
      const hv = hitVeh(w.x, w.y);
      if (hv) {
        G.selectedVehicleId = hv.id;
        if (hv.buildingId) G.selectedId = hv.buildingId;
        renderChrome();
        return;
      }
      const hb = hitBldg(w.x, w.y);
      if (hb) {
        G.selectedId = hb.id;
        renderChrome();
        return;
      }
    }
    G.selectedId = null;
    renderInspector();
    renderPalette();
    G.drag = { sx: p.x, sy: p.y, lon: G.lon, lat: G.lat };
    canvas.classList.add("panning");
  });
  canvas.addEventListener("pointermove", (ev) => {
    const p = canvasPos(ev);
    if (pointers.has(ev.pointerId)) pointers.set(ev.pointerId, p);
    if (pointers.size >= 2 && pinch) {
      const [a, b] = [...pointers.values()];
      const dist = Math.max(12, Math.hypot(a.x - b.x, a.y - b.y));
      setSpan(pinch.span * (pinch.dist / dist));
      return;
    }
    syncCamFromGeo();
    const w = screenToWorld(p.x, p.y);
    if (G.placeType) G._hover = { gx: Math.floor(w.x / CELL), gy: Math.floor(w.y / CELL) };
    if (G.drag) {
      G.lon = G.drag.lon - (p.x - G.drag.sx) / W * G.span;
      G.lat = G.drag.lat + (p.y - G.drag.sy) / W * G.span;
      setSpan(G.span);
    }
  });
  function endPointer(ev) {
    pointers.delete(ev.pointerId);
    if (pointers.size < 2) pinch = null;
    if (pointers.size === 0) {
      G.drag = null;
      canvas.classList.remove("panning");
    }
  }
  canvas.addEventListener("pointerup", endPointer);
  canvas.addEventListener("pointercancel", endPointer);
  canvas.addEventListener("wheel", (ev) => {
    if (ev.ctrlKey) return;
    ev.preventDefault();
    setSpan(G.span * (ev.deltaY > 0 ? 1.25 : 0.8));
  }, { passive: false });
  window.addEventListener("wheel", (ev) => {
    if (!ev.ctrlKey) return;
    ev.preventDefault();
    setSpan(G.span * Math.exp(ev.deltaY * 0.01));
  }, { passive: false });

  window.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape") {
      if (motionKind("fire")) { skipEvent(); return; }
      if (G.wikiSheet) { G.wikiSheet = false; renderWiki(); return; }
      if (G.fleetSheet) { G.fleetSheet = false; renderFleetList(); return; }
      if (G.goalSheet) { G.goalSheet = false; renderObjectives(); return; }
      if (G.rocketSheet) { G.rocketSheet = null; renderRocketSheet(); return; }
      G.placeType = null; canvas.classList.remove("placing");
      renderPalette(); renderInspector();
    }
  });
  document.getElementById("wiki-open").addEventListener("click", () => {
    G.wikiSheet = !G.wikiSheet;
    renderWiki();
  });
  document.getElementById("wiki-sheet").addEventListener("click", (ev) => {
    if (ev.target.id !== "wiki-sheet") return;
    G.wikiSheet = false;
    renderWiki();
  });
  el.log.addEventListener("click", (ev) => {
    const btn = ev.target.closest(".log-roll");
    if (btn) stageToBay(Number(btn.getAttribute("data-roll")));
  });
  document.getElementById("day-pause").addEventListener("click", () => {
    G.paused = !G.paused;
    renderResources();
  });
  document.getElementById("fleet-open").addEventListener("click", () => {
    G.fleetSheet = !G.fleetSheet;
    renderFleetList();
  });
  document.getElementById("fleet-sheet").addEventListener("click", (ev) => {
    if (ev.target.id !== "fleet-sheet") return;
    G.fleetSheet = false;
    renderFleetList();
  });
  document.getElementById("next-goal").addEventListener("click", () => {
    G.goalSheet = !G.goalSheet;
    renderObjectives();
  });
  document.getElementById("goal-sheet").addEventListener("click", (ev) => {
    if (ev.target.id !== "goal-sheet") return;
    G.goalSheet = false;
    renderObjectives();
  });
  document.getElementById("rocket-sheet").addEventListener("click", (ev) => {
    if (ev.target.id !== "rocket-sheet") return;
    G.rocketSheet = null;
    renderRocketSheet();
  });
  document.querySelectorAll("#map-chips button").forEach((b) => {
    b.addEventListener("click", () => {
      G.lon = -97.178;
      G.lat = 26.002;
      setSpan(spanForMpp(Number(b.dataset.mpp)));
    });
  });
  document.getElementById("zoom-in").addEventListener("click", () => setSpan(G.span / 1.25));
  document.getElementById("zoom-out").addEventListener("click", () => setSpan(G.span * 1.25));

  let last = performance.now(), inspAcc = 0;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!G.paused) {
      // Days keep moving during a fill, a fire, and a flight. Pause still holds both clocks.
      G.dayAcc += dt * 1000;
      while (G.dayAcc >= MS_PER_DAY) { G.dayAcc -= MS_PER_DAY; dayTick(); }
      updateRollout(dt);
    }
    if (!G.paused && (G.rollouts.length || G.factoryJob)) {
      inspAcc += dt;
      if (inspAcc > 0.3) { inspAcc = 0; renderInspector(); renderResources(); renderFleetList(); renderJobNote(); }
    }
    if (motionKind("fly")) renderFlightPanel();
    draw();
    requestAnimationFrame(frame);
  }

  window.addEventListener("resize", () => { resize(); });
  document.getElementById("ver-label").textContent = TEST ? `${VERSION}. Test start.` : VERSION;
  resize();
  G.cam.x = (MAP_W * CELL) / 2 - W / 2;
  G.cam.y = (MAP_H * CELL) / 2 - H / 2;
  if (TEST) {
    window.__sb = {
      selectBuilding(type) {
        const b = buildingOfType(type);
        if (!b) return;
        G.selectedId = b.id;
        renderChrome();
      },
      startBuild() { startBuildRocket("falcon1"); },
      startRoll(name, dest) {
        const v = G.fleet.find((item) => item.name === name);
        if (!v) return;
        G.selectedVehicleId = v.id;
        startRoll(v.id, dest);
      },
      stage(name) {
        const v = G.fleet.find((item) => item.name === name);
        if (v) stageToBay(v.id);
      },
      staticFire,
      startLaunch,
      upgradeBay,
      snap() {
        return {
          day: G.day,
          paused: G.paused,
          rp1: G.rp1,
          lox: G.lox,
          money: G.money,
          steel: G.steel,
          factoryDays: G.factoryJob ? G.factoryJob.daysLeft : null,
          motions: G.rollouts.map((r) => ({
            kind: r.kind,
            t: r.t,
            simT: r.simT || 0,
            maxH: r.maxH || 0,
            maxSpeed: r.maxSpeed || 0,
            maxQ: r.maxQ || 0,
            maxQTime: r.maxQTime || 0,
          })),
          fleet: G.fleet.map((v) => ({
            id: v.id, name: v.name, status: v.status,
            merlinLifeS: v.merlinLifeS, fittingLifeS: v.fittingLifeS, stageLife: v.stageLife,
            refurbPart: v.refurbPart || null, refurbLeft: v.refurbLeft || 0,
          })),
          rangeClosed: rangeClosed(),
          padBusy: padBusy(),
          log: G.log.map((row) => row.msg).slice(0, 8),
        };
      },
      lockSky(sky) {
        G.skyLock = sky;
        renderChrome();
      },
    };
  }
  renderChrome();
  log("The purse starts at 150 money. The day adds none. Investors pay when a goal is finished.", "info");
  log("The bay refurbs one part at a time. Open the rocket and pick Structure, Fuel lines, or Engine (Merlin).", "info");
  log("Two rockets can roll at the same time. The pad still holds one.", "info");
  if (TEST) log("A day here lasts half a second.", "info");
  requestAnimationFrame(frame);
})();
  </script>
</body>
</html>
