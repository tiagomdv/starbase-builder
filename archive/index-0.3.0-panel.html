  // ── Map ──
  let W = 0, H = 0, dpr = 1;
  function resize() {
    const wrap = document.getElementById("map-wrap");
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = wrap.clientWidth; H = wrap.clientHeight;
    canvas.width = Math.max(1, W * dpr); canvas.height = Math.max(1, H * dpr);
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function screenToWorld(sx, sy) {
    return { x: sx / G.cam.zoom + G.cam.x, y: sy / G.cam.zoom + G.cam.y };
  }

  const GEO_W = -97.215, GEO_E = -97.140, GEO_N = 26.015, GEO_S = 25.975;
  const PLOTS = {
    production: { name: "Build site", cost: 90, line: "Starfactory and Mega Bay arrive on this ground.",
      west: -97.199, east: -97.173, south: 25.9952, north: 26.0016,
      buildings: [{ type: "starfactory", gx: 10, gy: 11 }, { type: "mega_bay", gx: 16, gy: 11 }] },
    launch: { name: "Pad site", cost: 50, line: "The Orbital Pad arrives on this ground.",
      west: -97.163, east: -97.152, south: 25.9938, north: 26.0018,
      buildings: [{ type: "pad_orbital", gx: 29, gy: 11 }] },
  };

  function syncCamFromGeo() {
    if (!W) return;
    const MW = MAP_W * CELL, MH = MAP_H * CELL;
    const cx = (G.lon - GEO_W) / (GEO_E - GEO_W) * MW;
    const cy = (GEO_N - G.lat) / (GEO_N - GEO_S) * MH;
    const worldW = G.span / (GEO_E - GEO_W) * MW;
    G.cam.zoom = W / worldW;
    G.cam.x = cx - (W * 0.5) / G.cam.zoom;
    G.cam.y = cy - (H * 0.5) / G.cam.zoom;
  }

  function draw() {
    if (!W) return;
    syncCamFromGeo();
    ctx.clearRect(0, 0, W, H);
    const band = viewBand();
    if (band === "World") {
      drawGlobe();
      drawCountryBorders("globe");
      drawCountryNames("globe");
      drawSiteDots("globe");
      drawGeoReadout();
      updateFieldChrome(band);
      return;
    }
    drawFlatLand();
    if (band === "Region") {
      drawCountryBorders("flat");
      drawCountryNames("flat");
      drawSiteDots("flat");
    }
    ctx.save();
    ctx.scale(G.cam.zoom, G.cam.zoom);
    ctx.translate(-G.cam.x, -G.cam.y);

    if (band !== "Region") drawSiteRoad();
    drawCoast();

    if (G.placeType && G._hover) {
      const def = defOf(G.placeType);
      const ok = canPlace(G.placeType, G._hover.gx, G._hover.gy).ok;
      drawBldg(G._hover.gx, G._hover.gy, def, 1, ok ? "ok" : "bad", false);
    }

    for (const b of G.buildings) {
      drawBldg(b.gx, b.gy, defOf(b.type), b.level, b.id === G.selectedId ? "sel" : "n", true);
      if (b.type === "pad_orbital" && performance.now() < G.flameUntil) drawFlame(b);
    }

    // vehicles
    for (const v of liveFleet()) {
      if (v.status === "rolling" && G.rollout && G.rollout.vehicleId === v.id) {
        ctx.strokeStyle = "rgba(232,200,100,0.4)";
        ctx.lineWidth = 2; ctx.setLineDash([6, 6]);
        ctx.beginPath();
        G.rollout.pts.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
        ctx.stroke(); ctx.setLineDash([]);
        drawVeh(v.wx, v.wy, v, true);
      } else if (v.buildingId) {
        drawVeh(v.wx, v.wy, v, false);
      }
    }

    drawSurvey();
    ctx.restore();
    drawGeoReadout();
    updateFieldChrome(band);
  }

  function lonToX(lon) {
    return (lon - GEO_W) / (GEO_E - GEO_W) * MAP_W * CELL;
  }
  function latToY(lat) {
    return (GEO_N - lat) / (GEO_N - GEO_S) * MAP_H * CELL;
  }
  function traceRing(ring, move) {
    let started = false;
    for (const p of ring) {
      const x = lonToX(p[0]), y = latToY(p[1]);
      if (!started) { move(true, x, y); started = true; }
      else move(false, x, y);
    }
  }
  function fillRings(rings, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    for (const ring of rings) traceRing(ring, (start, x, y) => start ? ctx.moveTo(x, y) : ctx.lineTo(x, y));
    ctx.fill();
  }
  function strokeRings(rings, color, width) {
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.beginPath();
    for (const ring of rings) traceRing(ring, (start, x, y) => start ? ctx.moveTo(x, y) : ctx.lineTo(x, y));
    ctx.stroke();
  }

  function strokeScreen(rings) {
    ctx.beginPath();
    const limit = Math.min(W, H) * 0.35;
    for (const ring of rings) {
      let prev = null;
      for (const p of ring) {
        const q = projectFlat(p[0], p[1]);
        if (prev && Math.hypot(q[0] - prev[0], q[1] - prev[1]) > limit) {
          prev = null;
          continue;
        }
        if (!prev) ctx.moveTo(q[0], q[1]);
        else ctx.lineTo(q[0], q[1]);
        prev = q;
      }
    }
    ctx.stroke();
  }

  function fillProjected(rings) {
    ctx.fillStyle = "#2f6a3c";
    ctx.beginPath();
    for (const ring of rings) {
      ring.forEach((p, i) => {
        const q = projectFlat(p[0], p[1]);
        if (i) ctx.lineTo(q[0], q[1]);
        else ctx.moveTo(q[0], q[1]);
      });
      ctx.closePath();
    }
    ctx.fill();
  }

  function metersPerPx() {
    return G.span * 111320 * Math.cos(PAD_LAT * Math.PI / 180) / Math.max(1, W);
  }
  function viewBand() {
    const m = metersPerPx();
    if (m >= 8000) return "World";
    if (m >= 600) return "Region";
    if (m >= 24) return "Site";
    return "Work";
  }
  function spanForMpp(mpp) {
    return mpp * Math.max(1, W) / (111320 * Math.cos(PAD_LAT * Math.PI / 180));
  }
  function hash(n) {
    const x = Math.sin(n * 127.1) * 43758.5453;
    return x - Math.floor(x);
  }
  function meterScreen(mx, my) {
    const lon = PAD_LON + mx / (111320 * Math.cos(PAD_LAT * Math.PI / 180));
    const lat = PAD_LAT + my / 110540;
    return projectFlat(lon, lat);
  }
  function landRings() {
    if (metersPerPx() >= 600 && GEO_RINGS.americas) return GEO_RINGS.americas;
    if (GEO_RINGS.gulfLand) return [GEO_RINGS.gulfLand];
    if (GEO_RINGS.boca) return [GEO_RINGS.boca];
    return [];
  }
  function traceLandPath() {
    ctx.beginPath();
    for (const ring of landRings()) {
      ring.forEach((p, i) => {
        const q = projectFlat(p[0], p[1]);
        if (i) ctx.lineTo(q[0], q[1]);

  function drawFlatLand() {
    const mpp = metersPerPx();
    ctx.fillStyle = "#0e4e5c";
    ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < 18; i++) {
      const mx = (hash(i + 3) - 0.4) * 1800000;
      const my = (hash(i + 19) - 0.5) * 1400000;
      const rx = 80000 + hash(i + 40) * 260000;
      const ry = 60000 + hash(i + 60) * 180000;
      const p = meterScreen(mx, my);
      ctx.fillStyle = i % 2 ? "rgba(8, 60, 74, 0.45)" : "rgba(40, 130, 140, 0.18)";
      ctx.beginPath();
      ctx.ellipse(p[0], p[1], rx / mpp, ry / mpp, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    traceLandPath();
    ctx.fillStyle = "#e0c99a";
    ctx.fill();
    ctx.save();
    traceLandPath();
    ctx.clip();

      const mx = (hash(i + 2) - 0.72) * 900000;
      const my = (hash(i + 80) - 0.45) * 700000;
      const rx = 6000 + hash(i + 11) * 42000;
      const ry = 2000 + hash(i + 21) * 9000;
      const p = meterScreen(mx, my);
      ctx.fillStyle = patches[i % patches.length][0];
      ctx.globalAlpha = patches[i % patches.length][1];

      ctx.ellipse(p[0], p[1], Math.max(8, rx / mpp), Math.max(3, ry / mpp), hash(i) * 2.2, 0, 0, Math.PI * 2);

      ctx.globalAlpha = 0.55;
      ctx.strokeStyle = "#6d5a38";
      ctx.lineWidth = 1;
      for (let i = 0; i < 80; i++) {
        const mx = (hash(i + 200) - 0.7) * 40000;
        const my = (hash(i + 260) - 0.4) * 30000;
        const len = 12 + hash(i + 9) * 28;
        const a = meterScreen(mx, my);
        const bpt = meterScreen(mx + len, my + len * 0.3);
        ctx.beginPath();
        ctx.moveTo(a[0], a[1]);
        ctx.lineTo(bpt[0], bpt[1]);
        ctx.stroke();
      }
    }
    ctx.restore();
    ctx.globalAlpha = 1;

  function countryPoint(mode, lon, lat) {
    if (mode === "globe") return projectGlobe(lon, lat);

  function drawCountryBorders(mode) {

  const FAR_SITES = [

  function smoothRoad(pts) {
    let cur = pts;
    for (let pass = 0; pass < 3; pass++) {
      const next = [cur[0]];
      for (let i = 0; i < cur.length - 1; i++) {
        const a = cur[i], b = cur[i + 1];
        next.push([a[0] * 0.75 + b[0] * 0.25, a[1] * 0.75 + b[1] * 0.25]);
        next.push([a[0] * 0.25 + b[0] * 0.75, a[1] * 0.25 + b[1] * 0.75]);
      }
      next.push(cur[cur.length - 1]);
      cur = next;
    }
    return cur;
  }
  function edgePoint(b, edge) {
    const d = defOf(b.type);
    const x0 = b.gx * CELL, y0 = b.gy * CELL;
    const w = d.footprint.w * CELL, h = d.footprint.h * CELL;
    if (edge === "east") return [x0 + w, y0 + h / 2];
    return [x0, y0 + h / 2];
  }
  function drawSiteRoad() {
    const placed = ["starfactory", "mega_bay", "pad_orbital"].map((t) => buildingOfType(t)).filter(Boolean);
    if (placed.length < 2) return;
    const metersX = 111320 * Math.cos(PAD_LAT * Math.PI / 180) * (GEO_E - GEO_W) / (MAP_W * CELL);
    const northPx = 80 / (110540 * (GEO_N - GEO_S) / (MAP_H * CELL));
    const segs = [];
    for (let i = 0; i < placed.length - 1; i++) {
      const a = edgePoint(placed[i], "east");
      const b = edgePoint(placed[i + 1], "west");
      const mid = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2 - northPx];
      segs.push(smoothRoad([a, mid, b]));
    }
    function stroke(widthM, color) {
      ctx.strokeStyle = color;
      ctx.lineWidth = widthM / metersX;
      ctx.lineCap = "butt";
      ctx.lineJoin = "round";
      for (const pts of segs) {
        ctx.beginPath();
        pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
        ctx.stroke();

    }
    stroke(16, "#c4a06a");
    stroke(9, "#8d7a62");
  }
  function updateFieldChrome(band) {

  function projectFlat(lon, lat) {
    const x = W * 0.5 + (lon - G.lon) / G.span * W;
    const y = H * 0.5 - (lat - G.lat) / G.span * W;
    return [x, y];
  }
  function projectGlobe(lon, lat) {
    const λ = (lon - G.lon) * Math.PI / 180;
    const φ = lat * Math.PI / 180;
    const φ0 = G.lat * Math.PI / 180;
    const cosφ = Math.cos(φ);
    const x = cosφ * Math.sin(λ);
    const y = Math.sin(φ) * Math.cos(φ0) - cosφ * Math.sin(φ0) * Math.cos(λ);
    const z = Math.sin(φ) * Math.sin(φ0) + cosφ * Math.cos(φ0) * Math.cos(λ);
    if (z < 0) return null;
    const R = Math.min(W, H) * 0.42;
    return [W * 0.5 + x * R, H * 0.5 - y * R];
  }
  function frontPoint(lon, lat) {
    const λ = (lon - G.lon) * Math.PI / 180;
    const φ = lat * Math.PI / 180;
    const φ0 = G.lat * Math.PI / 180;
    const cosφ = Math.cos(φ);
    const z = Math.sin(φ) * Math.sin(φ0) + cosφ * Math.cos(φ0) * Math.cos(λ);
    const x = cosφ * Math.sin(λ);
    const y = Math.sin(φ) * Math.cos(φ0) - cosφ * Math.sin(φ0) * Math.cos(λ);
    const R = Math.min(W, H) * 0.42;
    return { x: W * 0.5 + x * R, y: H * 0.5 - y * R, z };
  }

  let landMask = null;
  function buildLandMask() {
    const mw = 720, mh = 360;
    const c = document.createElement("canvas");
    c.width = mw; c.height = mh;
    const g = c.getContext("2d");
    g.beginPath();
    for (const ring of GEO_RINGS.world) {
      let prev = null;
      let open = false;
      for (const p of ring) {
        if (prev && Math.abs(p[0] - prev[0]) > 180) open = false;
        const x = ((p[0] + 180) / 360) * mw;
        const y = ((90 - p[1]) / 180) * mh;
        if (!open) { g.moveTo(x, y); open = true; }
        else g.lineTo(x, y);
        prev = p;
      }
      g.closePath();
    }
    g.fillStyle = "#000";
    g.fill();
    landMask = { data: g.getImageData(0, 0, mw, mh).data, mw, mh };
  }
  function maskLand(lon, lat) {
    if (!landMask) buildLandMask();
    let x = Math.floor(((lon + 180) % 360) / 360 * landMask.mw);
    if (x < 0) x += landMask.mw;
    const y = Math.floor((90 - lat) / 180 * landMask.mh);
    if (y < 0 || y >= landMask.mh || x >= landMask.mw) return false;
    return landMask.data[(y * landMask.mw + x) * 4 + 3] > 10;
  }

  function drawGlobe() {
    ctx.fillStyle = "#071018";
    ctx.fillRect(0, 0, W, H);
    const R = Math.min(W, H) * 0.42;
    const S = Math.max(160, Math.floor(R * 2));
    const c = document.createElement("canvas");
    c.width = S; c.height = S;
    const g = c.getContext("2d");
    const img = g.createImageData(S, S);
    const d = img.data;
    const φ0 = G.lat * Math.PI / 180;
    const λ0 = G.lon * Math.PI / 180;
    const sinφ = Math.sin(φ0), cosφ = Math.cos(φ0);
    for (let py = 0; py < S; py++) {
      for (let px = 0; px < S; px++) {
        const dx = (px + 0.5) / S * 2 - 1;
        const dy = 1 - (py + 0.5) / S * 2;
        const r2 = dx * dx + dy * dy;
        const i = (py * S + px) * 4;
        if (r2 > 1) continue;
        const z = Math.sqrt(1 - r2);
        const lat = Math.asin(Math.max(-1, Math.min(1, z * sinφ + dy * cosφ))) * 180 / Math.PI;
        const lon = (λ0 + Math.atan2(dx, z * cosφ - dy * sinφ)) * 180 / Math.PI;
        const land = maskLand(lon, lat);
        d[i] = land ? 47 : 11;
        d[i + 1] = land ? 106 : 58;
        d[i + 2] = land ? 60 : 74;
        d[i + 3] = 255;
      }
    }
    g.putImageData(img, 0, 0);
    ctx.drawImage(c, W * 0.5 - R, H * 0.5 - R, R * 2, R * 2);
  }

  function toScreen(lon, lat) {

  function drawSurvey() {
    const z = Math.max(G.cam.zoom, 0.001);
    const pad = 18;
    function cellBox(plot, owned) {
      let x0 = lonToX(plot.west), x1 = lonToX(plot.east);
      let y0 = latToY(plot.north), y1 = latToY(plot.south);
      if (!owned) return [x0, y0, x1, y1];
      for (const b of G.buildings) {
        const d = defOf(b.type);
        const bx0 = b.gx * CELL, by0 = b.gy * CELL;
        const bx1 = bx0 + d.footprint.w * CELL, by1 = by0 + d.footprint.h * CELL;
        const cx = (bx0 + bx1) / 2, cy = (by0 + by1) / 2;
        if (cx < x0 - 80 || cx > x1 + 80 || cy < y0 - 80 || cy > y1 + 80) continue;
        x0 = Math.min(x0, bx0 - pad);
        x1 = Math.max(x1, bx1 + pad);
        y0 = Math.min(y0, by0 - pad);
        y1 = Math.max(y1, by1 + pad);
      }
      return [x0, y0, x1, y1];
    }

      const [x0, y0, x1, y1] = box;
      if ((x1 - x0) * z < 8) return;
      ctx.beginPath();
      ctx.rect(x0, y0, x1 - x0, y1 - y0);
      ctx.setLineDash(dashPx.map((n) => n / z));
      ctx.strokeStyle = color;
      ctx.lineWidth = widthPx / z;
      ctx.stroke();
      ctx.setLineDash([]);
    }
    for (const id of Object.keys(PLOTS)) {
      if (!G.plots[id]) continue;
      const box = cellBox(PLOTS[id], true);
      strokeBox(box, "rgba(244, 234, 216, 0.9)", 5, []);
      strokeBox(box, "#8a3e24", 1.75, []);
      if (metersPerPx() < 600 && (box[2] - box[0]) * z >= 8) {
        const [x0, y0, x1, y1] = box;
        for (const p of [[x0, y0], [x1, y0], [x1, y1], [x0, y1]]) {
          ctx.beginPath();
          ctx.arc(p[0], p[1], 3.5 / z, 0, Math.PI * 2);
          ctx.fillStyle = "#f4ead8";
          ctx.fill();
          ctx.lineWidth = 1.5 / z;
          ctx.strokeStyle = "#8a3e24";
          ctx.stroke();
        }
      }
    }
  }

  const pointers = new Map();

    G.span = clamp(next, 0.008, 1200);
    G.lat = clamp(G.lat, -70, 78);
    if (G.lon > 180) G.lon -= 360;
    if (G.lon < -180) G.lon += 360;
    syncCamFromGeo();
  }
  canvas.addEventListener("pointerdown", (ev) => {
    canvas.setPointerCapture(ev.pointerId);
    const p = canvasPos(ev);
    pointers.set(ev.pointerId, p);
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      pinch = { dist: Math.max(12, Math.hypot(a.x - b.x, a.y - b.y)), span: G.span };
      G.drag = null;
      return;
    }
    syncCamFromGeo();
    const w = screenToWorld(p.x, p.y);
    if (G.span < 1.2 && G.placeType) {
      placeBuilding(G.placeType, Math.floor(w.x / CELL), Math.floor(w.y / CELL));
      return;
    }
    if (G.span < 1.2) {
      const hv = hitVeh(w.x, w.y);
      if (hv) {
        G.selectedVehicleId = hv.id;
        if (hv.buildingId) G.selectedId = hv.buildingId;
        renderChrome();
        return;
      }
      const hb = hitBldg(w.x, w.y);
      if (hb) {
        G.selectedId = hb.id;
        renderChrome();
        return;
      }
    }
    G.selectedId = null;
    renderInspector();
    G.drag = { sx: p.x, sy: p.y, lon: G.lon, lat: G.lat };
    canvas.classList.add("panning");
  });
  canvas.addEventListener("pointermove", (ev) => {
    const p = canvasPos(ev);
    if (pointers.has(ev.pointerId)) pointers.set(ev.pointerId, p);
    if (pointers.size >= 2 && pinch) {
      const [a, b] = [...pointers.values()];
      const dist = Math.max(12, Math.hypot(a.x - b.x, a.y - b.y));
      setSpan(pinch.span * (pinch.dist / dist));
      return;
    }
    syncCamFromGeo();
    const w = screenToWorld(p.x, p.y);
    if (G.placeType) G._hover = { gx: Math.floor(w.x / CELL), gy: Math.floor(w.y / CELL) };
    if (G.drag) {
      G.lon = G.drag.lon - (p.x - G.drag.sx) / W * G.span;
      G.lat = G.drag.lat + (p.y - G.drag.sy) / W * G.span;
      setSpan(G.span);
    }
  });
  function endPointer(ev) {
    pointers.delete(ev.pointerId);
    if (pointers.size < 2) pinch = null;
    if (pointers.size === 0) {
      G.drag = null;
      canvas.classList.remove("panning");
    }
  }
  canvas.addEventListener("pointerup", endPointer);
  canvas.addEventListener("pointercancel", endPointer);
  canvas.addEventListener("wheel", (ev) => {
    if (ev.ctrlKey) return;
    ev.preventDefault();
    setSpan(G.span * (ev.deltaY > 0 ? 1.25 : 0.8));
  }, { passive: false });
  window.addEventListener("wheel", (ev) => {
    if (!ev.ctrlKey) return;
    ev.preventDefault();
    setSpan(G.span * Math.exp(ev.deltaY * 0.01));
  }, { passive: false });

  window.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape") {
      if (G.event) { skipEvent(); return; }
      if (G.wikiSheet) { G.wikiSheet = false; renderWiki(); return; }
      if (G.fleetSheet) { G.fleetSheet = false; renderFleetList(); return; }
      if (G.goalSheet) { G.goalSheet = false; renderObjectives(); return; }
      if (G.rocketSheet) { G.rocketSheet = null; renderRocketSheet(); return; }
      G.placeType = null; canvas.classList.remove("placing");
      renderPalette(); renderInspector();
    }
  });
  document.getElementById("wiki-open").addEventListener("click", () => {
    G.wikiSheet = !G.wikiSheet;
    renderWiki();
  });
  document.getElementById("wiki-sheet").addEventListener("click", (ev) => {
    if (ev.target.id !== "wiki-sheet") return;
    G.wikiSheet = false;
    renderWiki();
  });
  document.getElementById("fleet-open").addEventListener("click", () => {
    G.fleetSheet = !G.fleetSheet;
    renderFleetList();
  });
  document.getElementById("fleet-sheet").addEventListener("click", (ev) => {
    if (ev.target.id !== "fleet-sheet") return;
    G.fleetSheet = false;
    renderFleetList();
  });
  document.getElementById("next-goal").addEventListener("click", () => {
    G.goalSheet = !G.goalSheet;
    renderObjectives();
  });
  document.getElementById("goal-sheet").addEventListener("click", (ev) => {
    if (ev.target.id !== "goal-sheet") return;
    G.goalSheet = false;
    renderObjectives();
  });
  document.getElementById("rocket-sheet").addEventListener("click", (ev) => {
    if (ev.target.id !== "rocket-sheet") return;
    G.rocketSheet = null;
    renderRocketSheet();
  });
  document.querySelectorAll("#map-chips button").forEach((b) => {
    b.addEventListener("click", () => {
      G.lon = PAD_LON;
      G.lat = PAD_LAT;
      setSpan(spanForMpp(Number(b.dataset.mpp)));
    });
  });
  document.getElementById("zoom-in").addEventListener("click", () => setSpan(G.span / 1.25));
  document.getElementById("zoom-out").addEventListener("click", () => setSpan(G.span * 1.25));

  let last = performance.now(), inspAcc = 0;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!G.event) {
      G.dayAcc += dt * 1000;
      while (G.dayAcc >= MS_PER_DAY) { G.dayAcc -= MS_PER_DAY; dayTick(); }
      updateRollout(dt);
      if (G.rollout || G.factoryJob) {
        inspAcc += dt;
        if (inspAcc > 0.3) { inspAcc = 0; renderInspector(); renderResources(); renderFleetList(); renderJobNote(); }
      }
    } else updateEvent(dt);
    draw();
    requestAnimationFrame(frame);
  }

  window.addEventListener("resize", () => { resize(); if (G.event) resizeEventCanvas(); });
  document.getElementById("ver-label").textContent = VERSION;
  resize();
  G.cam.x = (MAP_W * CELL) / 2 - W / 2;
  G.cam.y = (MAP_H * CELL) / 2 - H / 2;
  renderChrome();
  log("Foundation: Factory · Mega Bay · Pad. Resources from environment.", "info");
  log("Bay houses multiple vehicles & refurbs after static fire. SF can fail.", "info");
  requestAnimationFrame(frame);
})();
  </script>
</body>
</html>
