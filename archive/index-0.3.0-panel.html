<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Starbase Builder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="geo-land.js"></script>
  <script src="design-docs/countries.js"></script>
  <style>
    :root {
      --bg: #050505; --panel: #0a0a0a; --border: #2a2a2a;
      --text: #f2f2f2; --muted: #9a9a9a; --accent: #e10600;
      --good: #3dd68c; --bad: #e10600;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; touch-action: none; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      background: var(--bg); color: var(--text);
    }
    .resource-bar {
      background: #050505;
      border-bottom: 1px solid #222;
      color: #f2f2f2;
      font-family: ui-monospace, Menlo, monospace;
    }
    #sky-label { font-size: 22px; line-height: 1; font-weight: 650; }
    #wind-label { font-size: 15px; color: #c8c8c8; margin-top: 4px; }
    .stat-k { font-size: 12px; color: #9a9a9a; }
    .stat-n { font-size: 32px; line-height: 0.9; font-weight: 650; }
    .resource-bar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: end;
    }
    .bar-left { display: flex; align-items: flex-end; gap: 14px; }
    .bar-mid { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .bar-stats { display: flex; align-items: flex-end; gap: 22px; }
    #ver-label { font-size: 11px; line-height: 1; color: #9a9a9a; }
    .range-lamp {
      width: 14px; height: 14px; border-radius: 50%; flex: none; margin-bottom: 6px;
      background: var(--good); box-shadow: 0 0 8px var(--good); display: inline-block;
    }
    .range-lamp.closed { background: var(--bad); box-shadow: 0 0 8px var(--bad); }
    .ui-panel { background: var(--panel); border: 1px solid var(--border); }
    .ui-panel.hold { box-shadow: inset 3px 0 0 var(--bad); }
    .ui-btn {
      background: #000; border: 1px solid #333; color: #f2f2f2;
      transition: background 0.12s, border-color 0.12s, opacity 0.12s;
    }
    .ui-btn:hover:not(:disabled) { background: #161616; border-color: #666; }
    .ui-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .ui-btn.active { background: #140404; border-color: var(--accent); }
    [class*="text-amber"] { color: #f2f2f2 !important; }
    .ui-btn.good { background: #1a2e14; border-color: #3d6e34; color: var(--good); }
    .ui-btn.danger { background: #2a1414; border-color: #8a4040; color: #e8a0a0; }
    .plot-owned { font-size: 11px; color: #c8c8c8; margin-bottom: 8px; }
    .plot-owned b { display: block; color: #f2f2f2; font-size: 13px; font-weight: 650; }
    .plot-card {
      display: block; width: 100%; text-align: left; cursor: pointer;
      background: #0e0e0e; border: 1px solid #f2f2f2; color: #f2f2f2;
      padding: 10px 10px 12px; margin-bottom: 8px;
    }
    .plot-card:hover { background: #161616; }
    .plot-card .name { font-size: 15px; font-weight: 650; }
    .plot-card .price { font-size: 28px; line-height: 1; font-weight: 650; margin-top: 6px; }
    .plot-card .unit { font-size: 11px; color: #9a9a9a; letter-spacing: 0.08em; text-transform: uppercase; }
    .plot-card .line { font-size: 12px; color: #c8c8c8; margin-top: 8px; }
    .bldg .title { font-size: 16px; font-weight: 650; color: #f2f2f2; }
    .bldg .blurb { font-size: 12px; color: #c8c8c8; margin-top: 4px; }
    .bldg .stat { margin-top: 12px; }
    .bldg .stat .k { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #9a9a9a; }
    .bldg .stat .n { font-size: 32px; line-height: 0.95; font-weight: 650; color: #f2f2f2; }
    .bldg .stat .s { font-size: 12px; color: #c8c8c8; margin-top: 4px; }
    .bldg .wait { font-size: 12px; color: #c8c8c8; margin-top: 8px; }
    .bay-slot {
      display: block; width: 100%; text-align: left; margin-top: 8px; cursor: pointer;
      background: #0e0e0e; border: 1px solid #333; color: #f2f2f2; padding: 8px 10px 10px;
    }
    .bay-slot.sel { border-color: #f2f2f2; }
    .bay-slot.empty { cursor: default; }
    .bay-slot.empty .n { color: #444; }
    .bay-slot .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .bay-slot .name { font-size: 14px; font-weight: 650; }
    .bay-slot .where { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: #9a9a9a; }
    .bay-slot .n { font-size: 26px; line-height: 1; font-weight: 650; margin-top: 6px; }
    .bay-slot .meter { height: 3px; background: #2a2a2a; margin-top: 8px; }
    .bay-slot .meter i { display: block; height: 100%; background: #f2f2f2; }
    .act {
      display: block; width: 100%; text-align: left; cursor: pointer; margin-top: 10px;
      background: #0e0e0e; border: 1px solid #f2f2f2; color: #f2f2f2; padding: 10px;
    }
    .act:hover:not(:disabled) { background: #161616; }
    .act:disabled { opacity: 0.4; cursor: not-allowed; }
    .act.quiet { border-color: #444; }
    .act.stop { border-color: #444; border-left: 3px solid #e10600; }
    .act.build { border-color: #6a8ab0; background: #101418; }
    .act.up { border-color: #c4a15a; background: #16140e; }
    .act.fire { border-color: #e07030; background: #160e0a; }
    .act.roll { border-color: #6a9a8a; background: #0e1412; }
    .sec { margin-top: 16px; }
    .sec .k { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #9a9a9a; }
    .facts { display: flex; gap: 16px; margin-top: 8px; }
    .facts b { display: block; font-size: 22px; line-height: 1; font-weight: 650; color: #f2f2f2; }
    .facts span { font-size: 11px; color: #9a9a9a; }
    .act .name { font-size: 14px; font-weight: 650; }
    .act .price { font-size: 26px; line-height: 1; font-weight: 650; margin-top: 6px; }
    .act .unit { font-size: 11px; color: #9a9a9a; letter-spacing: 0.08em; text-transform: uppercase; }
    .act .line { font-size: 12px; color: #c8c8c8; margin-top: 8px; }
    #rocket-sheet {
      position: fixed; inset: 0; z-index: 40; display: none;
      background: rgba(0, 0, 0, 0.72); align-items: center; justify-content: center; padding: 16px;
    }
    #rocket-sheet.open { display: flex; }
    .rocket-panel { width: min(640px, 100%); background: #0a0a0a; border: 1px solid #333; color: #f2f2f2; padding: 16px; }
    .rocket-panel .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
    .rocket-panel .top b { font-size: 18px; }
    .rocket-panel .place { font-size: 12px; color: #9a9a9a; margin-top: 4px; }
    .rocket-sheet { display: grid; grid-template-columns: 1fr 72px 1fr; gap: 12px; align-items: center; margin-top: 14px; }
    .rocket-sheet .side { font-size: 12px; color: #c8c8c8; }
    .rocket-sheet .side b { display: block; color: #f2f2f2; font-size: 22px; line-height: 1.1; font-weight: 650; margin-bottom: 10px; }
    .rocket-body {
      height: 220px; width: 36px; margin: 0 auto;
      background: linear-gradient(#f2f2f2, #c8c8c8 70%, #8a3e24);
      clip-path: polygon(50% 0, 100% 18%, 100% 100%, 0 100%, 0 18%);
    }
    #map-wrap { position: relative; min-width: 0; min-height: 0; background: #07141c; }
    #map { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
    #map-chips, #map-zoom { position: absolute; z-index: 2; display: flex; gap: 6px; }
    #map-corner { position: absolute; left: 10px; top: 10px; z-index: 2; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
    #map-chips { position: static; }
    #job-note { pointer-events: none; display: flex; flex-direction: column; gap: 4px; }
    #job-note:empty { display: none; }
    #job-note span { font-size: 12px; color: #f2f2f2; background: rgba(0,0,0,0.55); padding: 4px 8px; }
    #next-goal {
      margin-top: auto; background: transparent; border: 0; outline: none;
      color: #9a9a9a; cursor: pointer; padding: 12px 14px;
      font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase;
    }
    #next-goal:hover, #next-goal:focus { color: #f2f2f2; outline: none; }
    #fleet-open {
      margin-top: auto; background: transparent; border: 0; outline: none;
      color: #9a9a9a; cursor: pointer; padding: 12px 14px; text-align: center;
      font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase;
    }
    #fleet-open:hover, #fleet-open:focus { color: #f2f2f2; outline: none; }
    #wiki-open {
      background: transparent; border: 0; outline: none; color: #9a9a9a; cursor: pointer;
      padding: 0 16px; font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase;
    }
    #wiki-open:hover, #wiki-open:focus { color: #f2f2f2; outline: none; }
    #wiki-sheet {
      position: fixed; inset: 0; z-index: 40; display: none;
      background: rgba(0, 0, 0, 0.72); align-items: center; justify-content: center; padding: 16px;
    }
    #wiki-sheet.open { display: flex; }
    .wiki-panel { width: min(760px, 100%); max-height: min(78vh, 640px); overflow: auto; background: #0a0a0a; color: #f2f2f2; padding: 28px; }
    .wiki-panel .top { display: flex; justify-content: space-between; align-items: flex-start; }
    .wiki-panel .left { font-size: 28px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 650; }
    #wiki-close { background: transparent; border: 0; color: #9a9a9a; cursor: pointer; letter-spacing: 0.16em; text-transform: uppercase; font-size: 11px; }
    .wiki-grid { display: grid; grid-template-columns: 180px 1fr; gap: 18px; margin-top: 18px; }
    .wiki-topic { display: block; width: 100%; text-align: left; background: transparent; color: #f2f2f2; cursor: pointer; border: 1px solid rgba(242,242,242,0.55); padding: 8px 10px; margin-bottom: 8px; font-size: 13px; }
    .wiki-topic.on { border-color: #f2f2f2; }
    .wiki-body p { font-size: 14px; color: #c8c8c8; margin: 0 0 10px; }
    .wiki-body h3 { margin: 0 0 8px; font-size: 20px; font-weight: 650; }
    #fleet-sheet {
      position: fixed; inset: 0; z-index: 40; display: none;
      background: rgba(0, 0, 0, 0.72); align-items: center; justify-content: center; padding: 16px;
    }
    #fleet-sheet.open { display: flex; }
    .fleet-panel { width: min(440px, 100%); max-height: min(70vh, 560px); overflow-y: auto; background: #0a0a0a; color: #f2f2f2; padding: 28px 28px 22px; }
    .fleet-panel .top { display: flex; justify-content: space-between; align-items: flex-start; }
    .fleet-panel .left { font-size: 42px; line-height: 0.9; font-weight: 650; }
    .fleet-panel .left span { display: block; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #9a9a9a; font-weight: 500; margin-top: 6px; }
    #fleet-close { background: transparent; border: 0; color: #9a9a9a; cursor: pointer; letter-spacing: 0.16em; text-transform: uppercase; font-size: 11px; }
    #fleet-close:hover { color: #f2f2f2; }
    .fleet-row { display: block; width: 100%; text-align: left; background: transparent; border: 1px solid rgba(242, 242, 242, 0.55); color: #f2f2f2; cursor: pointer; margin-top: 10px; padding: 10px 12px; }
    .fleet-row .name { font-size: 18px; font-weight: 650; }
    .fleet-row .meta { font-size: 12px; color: #9a9a9a; margin-top: 2px; }
    .fleet-row.sel { border-color: #f2f2f2; }
    .fleet-row.sel .name { color: #f2f2f2; }
    .fleet-empty { margin-top: 18px; font-size: 14px; color: #c8c8c8; }
    #goal-sheet {
      position: fixed; inset: 0; z-index: 40; display: none;
      background: rgba(0, 0, 0, 0.72); align-items: center; justify-content: center; padding: 16px;
    }
    #goal-sheet.open { display: flex; }
    .goal-panel { width: min(440px, 100%); background: #0a0a0a; border: 0; color: #f2f2f2; padding: 28px 28px 22px; }
    .goal-panel .top { display: flex; justify-content: space-between; align-items: flex-start; }
    .goal-panel .left { font-size: 42px; line-height: 0.9; font-weight: 650; }
    .goal-panel .left span { display: block; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #9a9a9a; font-weight: 500; margin-top: 6px; }
    #goal-close { background: transparent; border: 0; color: #9a9a9a; cursor: pointer; letter-spacing: 0.16em; text-transform: uppercase; font-size: 11px; }
    #goal-close:hover { color: #f2f2f2; }
    .goal-row { display: flex; gap: 14px; align-items: baseline; margin-top: 10px; padding: 10px 12px; border: 1px solid rgba(242, 242, 242, 0.55); }
    .goal-row .idx { font-size: 12px; color: #9a9a9a; width: 22px; }
    .goal-row .name { font-size: 14px; color: #c8c8c8; }
    .goal-row .line { font-size: 11px; color: #9a9a9a; letter-spacing: 0.08em; text-transform: uppercase; margin-top: 2px; }
    .goal-row.now { border-color: #f2f2f2; }
    .goal-row.now .name { font-size: 22px; font-weight: 650; color: #f2f2f2; }
    .goal-row.done { opacity: 0.4; }
    .goal-row.done .name { text-decoration: line-through; }
    #map-zoom { right: 10px; top: 10px; }
    #map-scale {
      position: absolute; left: 12px; bottom: 72px; z-index: 2; display: none;
      align-items: flex-end; gap: 8px; pointer-events: none;
      font: 12px ui-monospace, monospace; color: #f4ead8;
    }
    #map-scale .bar {
      height: 8px;
      border-left: 2px solid #f4ead8;
      border-right: 2px solid #f4ead8;
      border-bottom: 2px solid #f4ead8;
    }
    #map.placing { cursor: crosshair; }
    #map.panning { cursor: grabbing; }
    #log { font-family: ui-monospace, Menlo, monospace; font-size: 11px; line-height: 1.35; }
    #log .good { color: var(--good); }
    #log .warn { color: var(--accent); }
    #log .bad { color: var(--bad); }
    #log .info { color: var(--muted); }
    .swatch {
      width: 0.85rem; height: 0.85rem; border-radius: 2px;
      border: 1px solid rgba(0,0,0,0.35); display: inline-block;
    }
    .obj-done { color: var(--good); text-decoration: line-through; opacity: 0.85; }
    .bar-track {
      height: 6px; background: #1a1510; border-radius: 3px; overflow: hidden; margin-top: 4px;
    }
    .bar-track > i { display: block; height: 100%; background: linear-gradient(90deg, #6a8a40, #a8c86a); }
    .bar-track.bad > i { background: linear-gradient(90deg, #8a4040, #d07060); }
    #event-stage {
      position: fixed; inset: 0; z-index: 80; display: none; flex-direction: column;
      background: rgba(8, 10, 12, 0.9); backdrop-filter: blur(4px);
    }
    #event-stage.open { display: flex; }
    #event-stage .event-head {
      flex-shrink: 0; display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;
      padding: 0.65rem 1rem; border-bottom: 1px solid var(--border);
      background: #050505;
    }
    #event-stage .event-head h2 {
      margin: 0; font-size: 0.95rem; letter-spacing: 0.08em;
      text-transform: uppercase; color: #f5edd8;
    }
    #event-stage .event-phase {
      font-family: ui-monospace, Menlo, monospace; font-size: 0.8rem; color: var(--accent);
    }
    #event-stage .event-phase.fail { color: var(--bad); }
    #event-stage .event-body {
      flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 0.5rem;
    }
    #event-canvas {
      width: min(920px, 96vw); height: min(520px, 70vh); max-width: 100%;
      border: 1px solid var(--border); border-radius: 8px; background: #0a0e14;
      box-shadow: 0 12px 48px rgba(0,0,0,0.55);
    }
    #event-stage .event-foot {
      flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; gap: 0.75rem;
      padding: 0.55rem 1rem 0.75rem; border-top: 1px solid var(--border);
      background: #050505; font-size: 0.78rem; color: var(--muted);
    }
  </style>
</head>
<body class="flex flex-col h-full">

  <header class="resource-bar px-3 py-3 shrink-0 z-20">
    <div class="bar-left">
      <span id="range-lamp" class="range-lamp" title="Green when the sky is inside the pad limit."></span>
      <div>
        <div id="sky-label">Range open</div>
        <div id="wind-label">clear 8 kn</div>
      </div>
    </div>
    <div class="bar-mid">
      <div class="bar-stats">
        <div><div class="stat-k">Steel</div><div id="res-steel" class="stat-n tabular-nums">200</div></div>
        <div><div class="stat-k">Propellant</div><div id="res-prop" class="stat-n tabular-nums">40</div></div>
        <div><div class="stat-k">Fleet</div><div id="res-fleet" class="stat-n tabular-nums">0</div></div>
        <div><div class="stat-k">Day</div><div id="day-label" class="stat-n tabular-nums">1</div></div>
      </div>
      <div id="ver-label">0.3.0-panel</div>
    </div>
  </header>

  <div class="flex flex-1 min-h-0">
    <aside class="w-44 ui-panel flex flex-col shrink-0 border-y-0 border-l-0">
      <div class="p-2.5 border-b border-amber-900/40">
        <div class="text-[10px] uppercase tracking-wider text-amber-600 mb-2">Land</div>
        <div class="grid grid-cols-1 gap-1.5" id="build-palette"></div>
      </div>
      <button type="button" id="next-goal">Goals</button>
    </aside>

    <div id="map-wrap" class="flex-1">
      <canvas id="map"></canvas>
      <div id="map-corner">
        <div id="map-chips">
          <button type="button" class="ui-btn rounded px-2 py-1 text-xs" data-band="World" data-mpp="18000">World</button>
          <button type="button" class="ui-btn rounded px-2 py-1 text-xs" data-band="Region" data-mpp="1600">Region</button>
          <button type="button" class="ui-btn rounded px-2 py-1 text-xs" data-band="Site" data-mpp="100">Site</button>
          <button type="button" class="ui-btn rounded px-2 py-1 text-xs" data-band="Work" data-mpp="1.25">Work</button>
        </div>
        <div id="job-note"></div>
      </div>
      <div id="map-zoom">
        <button type="button" class="ui-btn rounded px-2 py-1 text-xs" id="zoom-in">Zoom in</button>
        <button type="button" class="ui-btn rounded px-2 py-1 text-xs" id="zoom-out">Zoom out</button>
      </div>
      <div id="map-scale"><span class="bar" id="map-scale-bar"></span><span id="map-scale-label"></span></div>
    </div>

    <aside id="readout" class="w-64 ui-panel flex flex-col shrink-0 border-y-0 border-r-0 min-h-0">
      <div class="p-2.5 flex-1 overflow-y-auto min-h-0">
        <div class="text-[10px] uppercase tracking-wider text-amber-600 mb-1">Inspector</div>
        <div id="inspector" class="text-xs text-amber-100/85 space-y-2"></div>
      </div>
      <button type="button" id="fleet-open">Fleet</button>
    </aside>
  </div>

  <footer class="ui-panel border-x-0 border-b-0 shrink-0" style="display:flex; align-items:stretch;">
    <button type="button" id="wiki-open">Wiki</button>
    <div id="log" class="px-3 py-1.5 h-14 overflow-y-auto flex-1"></div>
  </footer>

  <div id="wiki-sheet" aria-hidden="true">
    <div class="wiki-panel" id="wiki-panel"></div>
  </div>
  <div id="fleet-sheet" aria-hidden="true">
    <div class="fleet-panel" id="fleet-panel"></div>
  </div>
  <div id="goal-sheet" aria-hidden="true">
    <div class="goal-panel" id="goal-panel"></div>
  </div>
  <div id="rocket-sheet" aria-hidden="true">
    <div class="rocket-panel" id="rocket-panel"></div>
  </div>

  <div id="event-stage" aria-hidden="true">
    <div class="event-head">
      <h2 id="event-title">Ops</h2>
      <span class="event-phase" id="event-phase">—</span>
      <div class="ml-auto">
        <button type="button" class="ui-btn rounded px-3 py-1 text-xs" id="event-skip">Skip</button>
      </div>
    </div>
    <div class="event-body"><canvas id="event-canvas" width="900" height="500"></canvas></div>
    <div class="event-foot">
      <span id="event-caption">Static fire · success is not guaranteed</span>
      <span>Failure → anomaly animation · return to bay for refurb / scrap</span>
    </div>
  </div>

  <script>
(() => {
  "use strict";

  const VERSION = "0.3.0-panel";
  const CELL = 32, MAP_W = 40, MAP_H = 30, MS_PER_DAY = 4000;
  const ZOOM_MIN = 0.22, ZOOM_MAX = 2.4;
  const PAD_LAT = 25.997, PAD_LON = -97.157;

  const TUNING = {
    START_STEEL: 200,
    START_PROP: 40,
    /** Environment: materials + propellant without tank farm */
    ENV_STEEL_PER_DAY: 6,
    ENV_PROP_PER_DAY: 8,
    PROP_CAP: 120,
    PAD_L2_COST: 40,
    MERLIN_THRUST_KN: 340,
    MERLIN_ISP_S: 260,
    MERLIN_MASS_KG: 630,
    MERLIN_RESTARTS: 1,
    MERLIN_UP_COST: 36,
    MERLIN_UP_DAYS: 1,
    MERLIN_UP_MULT: 1.12,
    SF_THRUST_BAR_KN: 300,
    SF_WEAR_PER_FIRE: 0.08,
    SF_MISS_CONDITION: 40,
    SF_OK_CONDITION: 12,
    SCRAP_FLOOR: 20,
    WIND_LIMIT_L1: 20,
    WIND_LIMIT_L2: 28,
    PAD_THRUST_L1: 400,
    PAD_THRUST_L2: 900,
    BAY_MAX: 4,
    BAY_SLOT_COST: 30,
    ROLLOUT_PX_PER_SEC: 52,
    ROLLOUT_MIN_SEC: 2.0,
    ROLLOUT_MAX_SEC: 14,
    RETURN_PX_PER_SEC: 56,
  };

  /**
   * SpaceX-ish roadmap. Static fire can fail (RUD / engine anomaly).
   * Post-fire vehicles need hangar/bay inspection & refurb — not left “hot” on the pad.
   */
  const ROCKET_DEFS = {

  const BUILDING_DEFS = {
    starfactory: {
      id: "starfactory",
      name: "Starfactory",
      short: "Factory",
      cost: 40,
      footprint: { w: 4, h: 3 },

  const BUILD_ORDER = ["starfactory", "mega_bay", "pad_orbital"];

  // ── State ──
  // vehicle: { id, name, rocketId, buildingId|null, status, condition, refurbLeft, wx, wy, baySlot }
  // status: at_factory | in_bay | rolling | on_pad | refurb | destroyed
  const G = {
    day: 1, dayAcc: 0,
    merlinTier: 1,
    steel: TUNING.START_STEEL,
    prop: TUNING.START_PROP,
    buildings: [],
    fleet: [],
    factoryJob: null,
    rollout: null, // { vehicleId, pts, segLens, totalLen, t, duration, destKind: 'pad'|'bay', destId }
    event: null,
    nextId: 1,
    selectedId: null,
    selectedVehicleId: null,
    rocketSheet: null,
    goalSheet: false,
    fleetSheet: false,
    wikiSheet: false,
    wikiPage: "factory",
    placeType: null,
    cam: { x: 80, y: 40, zoom: 1 },
    lon: PAD_LON, lat: PAD_LAT, span: 0.045,
    plots: { production: false, launch: false },
    drag: null,
    flameUntil: 0,
    log: [],
    objectives: {
      place_all: false,
      build_rocket: false,

  const canvas = document.getElementById("map");
  const ctx = canvas.getContext("2d");
  const el = {
    steel: document.getElementById("res-steel"),
    prop: document.getElementById("res-prop"),
    fleet: document.getElementById("res-fleet"),
    day: document.getElementById("day-label"),
    log: document.getElementById("log"),

  function log(msg, kind = "info") {
    G.log.unshift({ msg, kind });
    if (G.log.length > 45) G.log.pop();
    el.log.innerHTML = G.log.slice(0, 12).map((e) => `<div class="${e.kind}">${esc(e.msg)}</div>`).join("");
  }
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function defOf(t) { return BUILDING_DEFS[t]; }
  function rocketOf(id) { return ROCKET_DEFS[id] || ROCKET_DEFS.falcon1; }
  function buildingById(id) { return G.buildings.find((b) => b.id === id) || null; }
  function buildingOfType(t) { return G.buildings.find((b) => b.type === t) || null; }
  function countType(t) { return G.buildings.filter((b) => b.type === t).length; }
  function vehicleById(id) { return G.fleet.find((v) => v.id === id) || null; }
  function selectedVehicle() { return vehicleById(G.selectedVehicleId); }
  function liveFleet() { return G.fleet.filter((v) => v.status !== "destroyed"); }
  function vehiclesAt(buildingId) { return liveFleet().filter((v) => v.buildingId === buildingId); }
  function bayCount() {
    const bay = buildingOfType("mega_bay");
    return bay ? vehiclesAt(bay.id).length : 0;
  }
  function bayCapacity(bay) {
    const b = bay || buildingOfType("mega_bay");
    return Math.max(1, Math.min(TUNING.BAY_MAX, (b && b.level) || 1));
  }
  function factoryHold() {
    const f = buildingOfType("starfactory");
    return f ? vehiclesAt(f.id)[0] || null : null;
  }
  function padHold() {
    const p = buildingOfType("pad_orbital");
    return p ? vehiclesAt(p.id)[0] || null : null;
  }
  function cellZone(gx, gy) {
    if (gx >= 28 && gy >= 20) return "water";
    if (gy < 12) return "production";
    if (gy < 16) return "corridor";
    if (gx < 22) return "launch";
    return "propellant";
  }
  function isWater() { return false; }
  function buildingAnchor(b, slot = 0) {
    const d = defOf(b.type);
    const baseX = (b.gx + d.footprint.w / 2) * CELL;
    const baseY = (b.gy + d.footprint.h * 0.42) * CELL;
    if (b.type === "mega_bay") {
      const spread = 22;
      const n = bayCapacity(b);
      const i = slot % n;
      return { x: baseX + (i - (n - 1) / 2) * spread, y: baseY };
    }
    return { x: baseX, y: baseY };
  }

  function canPlace(type, gx, gy) {
    const def = defOf(type);
    if (!def) return { ok: false, why: "Unknown" };
    if (countType(type) >= def.maxCount) return { ok: false, why: `Only one ${def.name}` };
    const { w, h } = def.footprint;
    if (gx < 0 || gy < 0 || gx + w > MAP_W || gy + h > MAP_H) return { ok: false, why: "Off map" };
    for (let y = gy; y < gy + h; y++)
      for (let x = gx; x < gx + w; x++)
        if (isWater(x, y)) return { ok: false, why: "Water" };
    for (const b of G.buildings) {
      const d = defOf(b.type);
      if (b.gx < gx + w && b.gx + d.footprint.w > gx && b.gy < gy + h && b.gy + d.footprint.h > gy)
        return { ok: false, why: "Overlap" };
    }
    if (G.steel < def.cost) return { ok: false, why: `Need ${def.cost} steel` };
    return { ok: true };
  }

  function buyPlot(id) {
    const plot = PLOTS[id];
    if (!plot || G.plots[id]) return;
    if (G.steel < plot.cost) { log(`Need ${plot.cost} steel.`, "bad"); return; }
    for (const b of plot.buildings) {
      const check = canPlace(b.type, b.gx, b.gy);
      if (!check.ok && check.why !== `Need ${defOf(b.type).cost} steel`) {
        log(check.why, "bad"); return;
      }
    }
    G.steel -= plot.cost;
    G.plots[id] = true;
    for (const b of plot.buildings) {
      G.buildings.push({ id: G.nextId++, type: b.type, gx: b.gx, gy: b.gy, level: 1 });
      G.selectedId = G.buildings[G.buildings.length - 1].id;
    }
    log(`${plot.name} bought. The buildings sit on the real Starbase layout.`, "good");
    updateObjectives();
    renderChrome();
  }

  function placeBuilding(type, gx, gy) {
    const check = canPlace(type, gx, gy);
    if (!check.ok) { log(check.why, "bad"); return; }
    const def = defOf(type);
    G.steel -= def.cost;
    G.buildings.push({ id: G.nextId++, type, gx, gy, level: 1 });
    G.selectedId = G.buildings[G.buildings.length - 1].id;
    G.placeType = null;
    canvas.classList.remove("placing");
    log(`Built ${def.name} (−${def.cost} steel)`, "good");
    updateObjectives();
    renderChrome();
  }

  function dayTick() {
    G.day++;
    G.steel += TUNING.ENV_STEEL_PER_DAY;
    G.prop = Math.min(TUNING.PROP_CAP, G.prop + TUNING.ENV_PROP_PER_DAY);

    if (G.factoryJob) {
      G.factoryJob.daysLeft--;
      if (G.factoryJob.daysLeft <= 0) finishFactoryJob();
      else if (G.factoryJob.kind === "merlin") log(`Merlin thrust · ${G.factoryJob.daysLeft} days left`, "info");
      else log(`Factory: ${rocketOf(G.factoryJob.rocketId).name} — ${G.factoryJob.daysLeft}d left`, "info");
    }

    for (const v of liveFleet()) {
      if (v.status === "refurb" && v.refurbLeft > 0) {
        v.refurbLeft--;
        if (v.refurbLeft <= 0) {
          v.status = "in_bay";
          v.condition = Math.min(100, v.condition + 25);
          log(`${v.name} refurb complete in Mega Bay — ready`, "good");
          G.objectives.refurb = true;
        }
      }
    }
    renderChrome();
  }

  function finishFactoryJob() {
    const job = G.factoryJob;
    const factory = buildingOfType("starfactory");
    G.factoryJob = null;
    if (!job || !factory) return;
    if (job.kind === "merlin") {
      const v = vehicleById(job.vehicleId);
      if (v) {
        v.merlinTier = 2;
        log(`Merlin thrust on ${v.name} is now ${Math.round(TUNING.MERLIN_THRUST_KN * TUNING.MERLIN_UP_MULT)} kN.`, "good");
      }
      renderChrome();
      return;
    }
    if (factoryHold()) {
      log("Factory hold full — job lost (should not happen)", "bad");
      return;
    }
    const r = rocketOf(job.rocketId);
    const n = liveFleet().filter((v) => v.rocketId === r.id).length + 1;
    const a = buildingAnchor(factory);
    const v = {
      id: G.nextId++,
      name: `${r.short}-${n}`,
      rocketId: r.id,
      buildingId: factory.id,
      status: "at_factory",
      condition: 100,
      merlinTier: 1,
      fires: 0,
      refurbLeft: 0,
      baySlot: 0,
      wx: a.x, wy: a.y,
    };
    G.fleet.push(v);
    G.selectedVehicleId = v.id;
    log(`${v.name} complete at Starfactory — stage into Mega Bay`, "good");
    G.objectives.build_rocket = true;
    updateObjectives();
    renderChrome();
  }

  function startBuildRocket(rocketId) {
    const r = rocketOf(rocketId);
    if (!r.unlocked) { log("Not on roadmap yet", "warn"); return; }
    const factory = buildingById(G.selectedId);
    if (!factory || factory.type !== "starfactory") { log("Select Starfactory", "warn"); return; }
    if (G.factoryJob) { log("Factory already building", "warn"); return; }
    if (factoryHold()) { log("Move finished vehicle to Mega Bay first (factory hold is 1)", "warn"); return; }
    if (G.event || G.rollout) { log("Ops busy", "warn"); return; }
    if (G.steel < r.steelCost) { log(`Need ${r.steelCost} steel`, "bad"); return; }
    G.steel -= r.steelCost;
    G.factoryJob = { kind: "rocket", rocketId: r.id, daysLeft: r.buildDays, totalDays: r.buildDays };
    log(`Factory: ${r.name} started (−${r.steelCost} steel · ${r.buildDays} days)`, "good");
    renderChrome();
  }

  function stageToBay(vehicleId) {
    const bay = buildingOfType("mega_bay");
    if (!bay) { log("Need Mega Bay", "bad"); return; }
    const v = vehicleById(vehicleId || G.selectedVehicleId);
    if (!v || v.status !== "at_factory") { log("Select a finished vehicle at the factory", "warn"); return; }
    const cap = bayCapacity(bay);
    if (bayCount() >= cap) {
      log(`Mega Bay is full. It holds ${cap}.`, "bad");
      return;
    }
    if (G.event || G.rollout) { log("Ops busy", "warn"); return; }
    const used = new Set(vehiclesAt(bay.id).map((x) => x.baySlot));
    let slot = 0;
    while (used.has(slot) && slot < cap) slot++;
    v.buildingId = bay.id;
    v.status = "in_bay";
    v.baySlot = slot;
    const a = buildingAnchor(bay, slot);
    v.wx = a.x; v.wy = a.y;
    G.selectedVehicleId = v.id;
    log(`${v.name} staged in Mega Bay, slot ${slot + 1} of ${cap}.`, "good");
    if (bayCount() >= 2) G.objectives.multi_bay = true;
    updateObjectives();
    renderChrome();
  }

  function pathMetrics(pts) {
    const segLens = [];
    let total = 0;
    for (let i = 0; i < pts.length - 1; i++) {
      const len = Math.hypot(pts[i + 1].x - pts[i].x, pts[i + 1].y - pts[i].y);
      segLens.push(len); total += len;
    }
    return { segLens, totalLen: Math.max(total, 1) };
  }
  function pointAlong(pts, segLens, totalLen, u) {
    let dist = clamp(u, 0, 1) * totalLen;
    for (let i = 0; i < segLens.length; i++) {
      if (dist <= segLens[i] || i === segLens.length - 1) {
        const t = segLens[i] < 1e-6 ? 1 : dist / segLens[i];
        return {
          x: pts[i].x + (pts[i + 1].x - pts[i].x) * t,
          y: pts[i].y + (pts[i + 1].y - pts[i].y) * t,
        };
      }
      dist -= segLens[i];
    }
    return pts[pts.length - 1];
  }
  function roadPath(from, to) {
    const roadY = 14 * CELL;
    const pts = [{ x: from.x, y: from.y }];
    if (Math.abs(from.y - roadY) > 8) pts.push({ x: from.x, y: roadY });
    if (Math.abs(from.x - to.x) > 8) pts.push({ x: to.x, y: roadY });
    pts.push({ x: to.x, y: to.y });
    const clean = [pts[0]];
    for (let i = 1; i < pts.length; i++) {
      const p = pts[i], q = clean[clean.length - 1];
      if (Math.hypot(p.x - q.x, p.y - q.y) > 1) clean.push(p);
    }
    return clean;
  }

  function startRoll(vehicleId, destKind) {
    const v = vehicleById(vehicleId || G.selectedVehicleId);
    if (!v) { log("Select a vehicle", "warn"); return; }
    if (G.rollout || G.event) { log("Transport busy", "warn"); return; }
    const pad = buildingOfType("pad_orbital");
    const bay = buildingOfType("mega_bay");
    if (!pad || !bay) { log("Need bay and pad", "bad"); return; }

    let fromB, toB, destStatus, speed;
    if (destKind === "pad") {
      if (v.status !== "in_bay") { log("Only bay-ready vehicles roll to pad", "warn"); return; }
      if (padHold()) { log("Pad occupied — one stack on OLM", "warn"); return; }
      fromB = bay; toB = pad; destStatus = "on_pad"; speed = TUNING.ROLLOUT_PX_PER_SEC;
    } else if (destKind === "bay") {
      if (v.status !== "on_pad" && v.status !== "needs_return") {
        log("Return to bay from pad after fire", "warn"); return;
      }
      if (bayCount() >= bayCapacity(bay) && v.buildingId !== bay.id) {
        log("Mega Bay is full.", "bad"); return;
      }
      fromB = pad; toB = bay; destStatus = "refurb"; speed = TUNING.RETURN_PX_PER_SEC;
    } else return;

    const fromA = v.buildingId === fromB.id
      ? { x: v.wx, y: v.wy }
      : buildingAnchor(fromB, v.baySlot || 0);
    let slot = v.baySlot || 0;
    if (destKind === "bay") {
      const used = new Set(vehiclesAt(bay.id).filter((x) => x.id !== v.id).map((x) => x.baySlot));
      slot = 0;
      while (used.has(slot) && slot < bayCapacity(bay)) slot++;
      v.baySlot = slot;
    }
    const toA = buildingAnchor(toB, destKind === "bay" ? slot : 0);
    const pts = roadPath(fromA, toA);
    const { segLens, totalLen } = pathMetrics(pts);
    let duration = totalLen / speed;
    duration = clamp(duration, TUNING.ROLLOUT_MIN_SEC, TUNING.ROLLOUT_MAX_SEC);

    v.buildingId = null;
    v.status = "rolling";
    v.wx = pts[0].x; v.wy = pts[0].y;
    G.rollout = {
      vehicleId: v.id, pts, segLens, totalLen, t: 0, duration,
      destKind, destId: toB.id, destStatus, baySlot: slot,
    };
    log(
      `${v.name} ${destKind === "pad" ? "rollout to pad" : "return to bay"} · ${duration.toFixed(1)}s`,
      "info"
    );
    renderChrome();
  }

  function updateRollout(dt) {
    if (!G.rollout) return;
    const r = G.rollout;
    const v = vehicleById(r.vehicleId);
    if (!v) { G.rollout = null; return; }
    r.t += dt;
    const u = clamp(r.t / r.duration, 0, 1);
    const p = pointAlong(r.pts, r.segLens, r.totalLen, u);
    v.wx = p.x; v.wy = p.y;
    if (u >= 1) {
      v.buildingId = r.destId;
      v.status = r.destStatus;
      v.baySlot = r.baySlot || 0;
      const b = buildingById(r.destId);
      const a = buildingAnchor(b, v.baySlot);
      v.wx = a.x; v.wy = a.y;
      if (r.destStatus === "refurb") {
        // refurb days already set at end of SF
        if (v.refurbLeft <= 0) {
          v.status = "in_bay";
        }
        log(`${v.name} in Mega Bay for post-fire refurb (${v.refurbLeft}d)`, "warn");
      } else {
        log(`${v.name} on pad — static fire when ready`, "good");
      }
      G.rollout = null;
      updateObjectives();
      renderChrome();
    }
  }

  function weatherOn(day) {
    const table = [
      { sky: "Clear", wind: 8, storm: false },
      { sky: "Clear", wind: 12, storm: false },
      { sky: "Wind", wind: 24, storm: false },
      { sky: "Clear", wind: 10, storm: false },
      { sky: "Storm", wind: 36, storm: true },
      { sky: "Wind", wind: 22, storm: false },
      { sky: "Clear", wind: 6, storm: false },
      { sky: "Clear", wind: 14, storm: false },
      { sky: "Wind", wind: 26, storm: false },
      { sky: "Storm", wind: 32, storm: true },
    ];
    return table[((day - 1) % table.length + table.length) % table.length];
  }

  function merlinFreshKn(v) {
    const tier = v && v.merlinTier >= 2 ? 2 : 1;
    return Math.round(TUNING.MERLIN_THRUST_KN * (tier >= 2 ? TUNING.MERLIN_UP_MULT : 1));
  }

  function merlinNowKn(v) {
    const fires = v && v.fires ? v.fires : 0;
    return Math.round(merlinFreshKn(v) * (1 - TUNING.SF_WEAR_PER_FIRE * fires));
  }

  function padLimits(pad) {
    const l2 = pad && pad.level >= 2;
    return {
      thrust: l2 ? TUNING.PAD_THRUST_L2 : TUNING.PAD_THRUST_L1,
      wind: l2 ? TUNING.WIND_LIMIT_L2 : TUNING.WIND_LIMIT_L1,
    };
  }

  // The range lamp and the fire share this check so the two cannot drift.
  function rangeShut(storm, wind, windLimit) {
    return !!(storm || wind > windLimit);
  }

  // Numbers in, one word out. Same inputs always return the same word.
  // fireVerdict(340, 400, 80, 8, 12, 20, false) is "hold".
  // fireVerdict(340, 400, 80, 8, 24, 20, false) is "weather".
  function fireVerdict(thrust, padThrust, prop, need, wind, windLimit, storm) {
    if (rangeShut(storm, wind, windLimit)) return "weather";
    if (prop < need) return "propellant";
    if (thrust > padThrust) return "pad";
    if (thrust < TUNING.SF_THRUST_BAR_KN) return "engine";
    return "hold";
  }

  // Condition and refurb days after a fire. The caller writes the vehicle.
  function sfNext(success, condition, refurbDaysOk, refurbDaysFail, padLevel) {
    if (success) {
      const cut = padLevel >= 2 ? 1 : 0;
      return {
        scrap: false,
        status: "needs_return",
        condition: Math.max(0, condition - TUNING.SF_OK_CONDITION),
        refurbLeft: Math.max(1, refurbDaysOk - cut),
      };
    }
    const next = condition - TUNING.SF_MISS_CONDITION;
    if (next < TUNING.SCRAP_FLOOR) {
      return { scrap: true, status: "destroyed", condition: 0, refurbLeft: 0 };
    }
    return {
      scrap: false,
      status: "needs_return",
      condition: next,
      refurbLeft: refurbDaysFail,
    };
  }

  function fireCheck(v, pad) {
    const sky = weatherOn(G.day);
    const limits = padLimits(pad);
    const thrust = merlinNowKn(v);
    const need = rocketOf(v.rocketId).sfProp;
    const word = fireVerdict(thrust, limits.thrust, G.prop, need, sky.wind, limits.wind, sky.storm);
    const lines = [
      `Thrust is ${thrust} kN. The fire needs ${TUNING.SF_THRUST_BAR_KN} kN.`,
      `The pad accepts ${limits.thrust} kN and wind up to ${limits.wind} knots.`,
      `Propellant is ${Math.floor(G.prop)}. This fire draws ${need}.`,
      `${sky.sky[0].toUpperCase()}${sky.sky.slice(1)}, ${sky.wind} knots.`,
    ];
    return {
      ok: word === "hold",
      limiter: word === "hold" ? null : word,
      lines, thrust, need, sky, limits,
    };
  }

  function staticFire() {
    const pad = buildingOfType("pad_orbital");
    if (!pad) { log("Need pad", "bad"); return; }
    const v = padHold();
    if (!v || v.status !== "on_pad") { log("Need a vehicle on the pad", "bad"); return; }
    if (G.event || G.rollout) { log("Busy", "warn"); return; }
    const r = rocketOf(v.rocketId);
    const check = fireCheck(v, pad);
    check.lines.forEach((line) => log(line, "info"));
    if (!check.ok && (check.limiter === "weather" || check.limiter === "propellant")) {
      log(check.limiter === "weather"
        ? "Range is closed. Wait for a calmer day."
        : `Need ${check.need} propellant.`, "bad");
      renderChrome();
      return;
    }
    G.prop -= check.need;
    log(check.ok
      ? `STATIC FIRE · ${v.name} · thrust holds · −${check.need} prop`
      : `STATIC FIRE · ${v.name} · ${check.limiter} is short · −${check.need} prop`, check.ok ? "good" : "bad");
    startEventSF(v, pad, r, check.need, check.ok, check);
    renderChrome();
  }

  // ── Close-up event ──
  const eventStage = document.getElementById("event-stage");
  const eventCanvas = document.getElementById("event-canvas");
  const ectx = eventCanvas.getContext("2d");
  const elEvent = {
    title: document.getElementById("event-title"),
    phase: document.getElementById("event-phase"),
    caption: document.getElementById("event-caption"),
    skip: document.getElementById("event-skip"),
  };

  function startEventSF(v, pad, r, spent, success, check) {
    const ph = r.sfPhases;
    const phases = success
      ? [
          { id: "approach", label: "Camera · approach", dur: ph.approach },
          { id: "chill", label: "Engine chill", dur: ph.chill },
          { id: "ignition", label: r.engines === 9 ? "9-engine ignition" : "Ignition", dur: ph.ignition },
          { id: "burn", label: "Full burn", dur: ph.burn },
          { id: "shutdown", label: "Shutdown", dur: ph.shutdown },
          { id: "debrief", label: "Stable · hold-downs OK", dur: ph.debrief },
        ]
      : [
          { id: "approach", label: "Camera · approach", dur: ph.approach * 0.9 },
          { id: "chill", label: "Engine chill", dur: ph.chill * 0.85 },
          { id: "ignition", label: "Ignition", dur: ph.ignition },
          { id: "anomaly", label: "ANOMALY · RUD / engine fail", dur: 1.6 },
          { id: "fail", label: "Range safe · vehicle compromised", dur: 1.4 },
        ];
    G.event = {
      kind: "static_fire",
      vehicleId: v.id,
      rocketId: r.id,
      sfStyle: r.sfStyle,
      padLevel: pad.level,
      success,
      limiter: success ? null : check.limiter,
      spent,
      t: 0, phaseIdx: 0, phaseT: 0,
      phases,
      done: false,
      particles: [],
      _failShown: false,
    };
    G.flameUntil = performance.now() + (success ? 1000 : 1600);
    elEvent.phase.classList.remove("fail");
    openEvent(
      `Static fire · ${v.name}`,
      phases[0].label,
      success
        ? `${r.name} · thrust ${check.thrust} kN holds · ${check.sky.sky}`
        : `${r.name} · the ${check.limiter} is short`
    );
  }

  function openEvent(title, phase, cap) {
    elEvent.title.textContent = title;
    elEvent.phase.textContent = phase;
    elEvent.caption.textContent = cap;
    eventStage.classList.add("open");
    eventStage.setAttribute("aria-hidden", "false");
    resizeEventCanvas();
  }
  function closeEvent() {
    eventStage.classList.remove("open");
    eventStage.setAttribute("aria-hidden", "true");
  }

  function applySfOutcome() {
    const ev = G.event;
    if (!ev) return;
    const v = vehicleById(ev.vehicleId);
    const r = rocketOf(ev.rocketId);
    if (!v) return;
    G.objectives.static_fire = true;
    v.fires = (v.fires || 0) + 1;
    const pad = buildingOfType("pad_orbital");
    const next = sfNext(ev.success, v.condition, r.refurbDaysOk, r.refurbDaysFail, pad ? pad.level : 1);
    v.status = next.status;
    v.condition = next.condition;
    if (next.scrap) {
      v.buildingId = null;
      log(`${v.name} is below the condition floor of ${TUNING.SCRAP_FLOOR}. The core is scrap. The ${ev.limiter} was short.`, "bad");
    } else if (ev.success) {
      v.refurbLeft = next.refurbLeft;
      log(`${v.name} held. Return it to the Mega Bay for ${v.refurbLeft} days of refurb. Thrust next fire ${merlinNowKn(v)} kN.`, "good");
    } else {
      v.refurbLeft = next.refurbLeft;
      log(`${v.name} failed because the ${ev.limiter} was short. Condition ${v.condition}. Refurb ${v.refurbLeft} days. Scrap floor is ${TUNING.SCRAP_FLOOR}.`, "bad");
    }
  }

  function finishEvent() {
    if (!G.event) return;
    applySfOutcome();
    G.event = null;
    closeEvent();
    updateObjectives();
    renderChrome();
  }

  function skipEvent() {
    if (!G.event) { closeEvent(); return; }
    G.event.done = true;
    finishEvent();
  }
  elEvent.skip.addEventListener("click", skipEvent);

  function resizeEventCanvas() {
    const d = Math.min(window.devicePixelRatio || 1, 2);
    const rect = eventCanvas.getBoundingClientRect();
    const w = Math.max(320, Math.floor(rect.width));
    const h = Math.max(200, Math.floor(rect.height));
    eventCanvas.width = w * d; eventCanvas.height = h * d;
    ectx.setTransform(d, 0, 0, d, 0, 0);
    G._ew = w; G._eh = h;
  }

  function updateEvent(dt) {
    const ev = G.event;
    if (!ev) return;
    ev.t += dt; ev.phaseT += dt;
    const phase = ev.phases[ev.phaseIdx];
    const pid = phase ? phase.id : "debrief";

    if ((pid === "anomaly" || pid === "fail") && !ev._failShown) {
      ev._failShown = true;
      elEvent.phase.classList.add("fail");
    }

    if (!ev.done && phase && ev.phaseT >= phase.dur) {
      ev.phaseT = 0;
      ev.phaseIdx++;
      if (ev.phaseIdx >= ev.phases.length) {
        ev.done = true;
        ev.phaseIdx = ev.phases.length - 1;
        elEvent.phase.textContent = ev.phases[ev.phaseIdx].label;
        const snap = ev;
        setTimeout(() => { if (G.event === snap) finishEvent(); }, 450);
      } else {
        elEvent.phase.textContent = ev.phases[ev.phaseIdx].label;
        if (ev.phases[ev.phaseIdx].id === "anomaly" || ev.phases[ev.phaseIdx].id === "fail")
          elEvent.phase.classList.add("fail");
      }
    }

    const rate = pid === "anomaly" ? 14 : (ev.sfStyle === "merlin_nine" ? 5 : 2);
    if (pid === "ignition" || pid === "burn" || pid === "anomaly") {
      for (let i = 0; i < rate; i++) {
        ev.particles.push({
          x: (Math.random() - 0.5) * (pid === "anomaly" ? 90 : 50),
          y: pid === "anomaly" ? -20 - Math.random() * 40 : 0,
          vx: (Math.random() - 0.5) * (pid === "anomaly" ? 120 : 40),
          vy: pid === "anomaly" ? -40 - Math.random() * 80 : 50 + Math.random() * 80,
          life: 0.25 + Math.random() * 0.5,
          r: 3 + Math.random() * 8,
          hot: Math.random() > 0.3,
        });
      }
    }
    for (const p of ev.particles) {
      p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (pid === "anomaly" ? 20 : 50) * dt;
    }
    ev.particles = ev.particles.filter((p) => p.life > 0);
    drawEvent();
  }

  function drawEvent() {
    const ev = G.event;
    if (!ev) return;
    const W = G._ew || 900, H = G._eh || 500;
    const r = rocketOf(ev.rocketId);
    ectx.clearRect(0, 0, W, H);
    const g = ectx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#152030"); g.addColorStop(0.55, "#2a3848"); g.addColorStop(1, "#3a4840");
    ectx.fillStyle = g; ectx.fillRect(0, 0, W, H);

    const cx = W * 0.5, groundY = H * 0.78;
    const phase = ev.phases[ev.phaseIdx];
    const pid = phase ? phase.id : "debrief";
    const zoom = pid === "approach" ? 0.85 + 0.15 * clamp(ev.phaseT / 1, 0, 1) : 1;

    ectx.fillStyle = "#4a453c"; ectx.fillRect(0, groundY, W, H - groundY);
    const trenchW = (ev.padLevel >= 2 ? 150 : 95) * zoom;
    ectx.fillStyle = "#1a1a20";
    ectx.fillRect(cx - trenchW / 2, groundY + 6, trenchW, 28 * zoom);
    const olmH = (ev.padLevel >= 2 ? 70 : 48) * zoom;
    ectx.fillStyle = "#9aa0a8";
    ectx.fillRect(cx - 18 * zoom, groundY - olmH, 36 * zoom, olmH);

    const base = groundY - olmH;
    const broken = pid === "anomaly" || pid === "fail" || (!ev.success && ev.done);
    drawCloseupRocket(ectx, cx, base, zoom, r, pid, broken, ev);

    if (pid === "chill" || pid === "ignition" || pid === "burn" || pid === "shutdown") {
      drawPlume(ectx, cx, base + 4, zoom, r, pid, ev, 1);
    }
    if (pid === "anomaly") {
      drawPlume(ectx, cx, base + 4, zoom, r, pid, ev, 1.4);
      // fireball
      ectx.fillStyle = "rgba(255,120,40,0.55)";
      ectx.beginPath();
      ectx.arc(cx + Math.sin(ev.t * 20) * 8, base - 40, 50 + Math.sin(ev.t * 15) * 10, 0, Math.PI * 2);
      ectx.fill();
      ectx.fillStyle = "rgba(255,200,80,0.4)";
      ectx.beginPath();
      ectx.arc(cx, base - 55, 28, 0, Math.PI * 2);
      ectx.fill();
    }

    for (const p of ev.particles) {
      ectx.globalAlpha = clamp(p.life * 2, 0, 1);
      ectx.fillStyle = p.hot ? "#ff9a3a" : "#ffcc66";
      ectx.beginPath();
      ectx.arc(cx + p.x, base + 10 + p.y, p.r, 0, Math.PI * 2);
      ectx.fill();
      ectx.globalAlpha = 1;
    }

    ectx.fillStyle = "rgba(0,0,0,0.5)";
    ectx.fillRect(12, 12, 260, 58);
    ectx.fillStyle = "#e8d9b0";
    ectx.font = "600 13px system-ui";
    ectx.fillText(rocketOf(ev.rocketId).name.toUpperCase(), 22, 32);
    ectx.font = "11px ui-monospace, monospace";
    ectx.fillStyle = ev.success || pid === "approach" || pid === "chill" ? "#d4a84b" : "#e08070";
    ectx.fillText(ev.success ? `Thrust holds · ${pid.toUpperCase()}` : `${ev.limiter || "short"} · ${pid.toUpperCase()}`, 22, 50);

    ectx.fillStyle = "rgba(0,0,0,0.5)";
    ectx.fillRect(W - 160, 12, 148, 40);
    ectx.fillStyle = "#8fbc6a";
    ectx.font = "11px ui-monospace, monospace";
    ectx.fillText(`PROP −${ev.spent}`, W - 148, 36);

    if (pid === "debrief" && ev.success) {
      ectx.fillStyle = "rgba(20,40,24,0.8)";
      ectx.fillRect(W / 2 - 120, 22, 240, 36);
      ectx.fillStyle = "#8fbc6a"; ectx.font = "600 14px system-ui"; ectx.textAlign = "center";
      ectx.fillText("ENGINES STABLE", W / 2, 46); ectx.textAlign = "left";
    }
    if (pid === "fail" || (broken && pid === "anomaly" && ev.phaseT > 0.8)) {
      ectx.fillStyle = "rgba(50,16,16,0.85)";
      ectx.fillRect(W / 2 - 130, 22, 260, 36);
      ectx.fillStyle = "#e07070"; ectx.font = "600 14px system-ui"; ectx.textAlign = "center";
      ectx.fillText("STATIC FIRE FAILURE", W / 2, 46); ectx.textAlign = "left";
    }
    drawEventRange(W, H);
  }

  function drawEventRange(W, H) {
    const x = 16, y = H - 78, w = 220, h = 62;
    ectx.fillStyle = "rgba(0,0,0,0.72)";
    ectx.fillRect(x, y, w, h);
    ectx.strokeStyle = "#e10600";
    ectx.strokeRect(x, y, w, h);
    ectx.beginPath();
    ectx.moveTo(x + 18, y + 48);
    ectx.quadraticCurveTo(x + 90, y + 36, x + 190, y + 14);
    ectx.stroke();
    const pitch = G.event ? Math.max(26, 90 - G.event.t * 14) : 90;
    const endLon = PAD_LON + 50 / (111.32 * Math.cos(PAD_LAT * Math.PI / 180));
    ectx.fillStyle = "#f2f2f2";
    ectx.font = "11px ui-monospace, monospace";
    ectx.fillText(`${PAD_LAT.toFixed(3)}° N  heading 90°  pitch ${pitch.toFixed(0)}°`, x + 8, y + 14);
    ectx.fillText(`Gulf track to ${Math.abs(endLon).toFixed(2)}° W`, x + 8, y + 28);
  }

  function drawCloseupRocket(c, cx, baseY, zoom, r, pid, broken, ev) {
    const nine = r.sfStyle === "merlin_nine";
    const scale = (nine ? 1.18 : 0.95) * zoom;
    const bw = (nine ? 32 : 22) * scale;
    const bh = (nine ? 120 : 85) * scale;
    const shipH = (nine ? 95 : 68) * scale;
    const tilt = broken ? Math.sin(ev.t * 8) * 0.15 + 0.2 : 0;
    c.save();
    c.translate(cx, baseY);
    c.rotate(tilt);
    c.translate(-cx, -baseY);
    const x = cx - bw / 2;
    const yBoost = baseY - bh;
    const yShip = yBoost - shipH;
    if (broken && pid === "fail") {
      // debris-ish short stack
      c.fillStyle = "#666";
      c.fillRect(x + 4, yBoost + bh * 0.4, bw - 8, bh * 0.35);
    } else {
      c.fillStyle = r.color;
      c.fillRect(x + 3, yShip, bw - 6, shipH);
      c.beginPath();
      c.moveTo(cx, yShip - 20 * scale);
      c.lineTo(x + 3, yShip); c.lineTo(x + bw - 3, yShip); c.closePath();
      c.fill();
      c.fillStyle = nine ? "#e4eaf0" : "#c5ccd4";
      c.fillRect(x, yBoost, bw, bh);
      c.fillStyle = "#3a4048";
      if (nine) {
        for (let row = 0; row < 3; row++)
          for (let col = 0; col < 3; col++) {
            c.beginPath();
            c.arc(cx + (col - 1) * 11 * scale, baseY - 2, 4 * scale, 0, Math.PI * 2);
            c.fill();
          }
      } else {
        c.beginPath(); c.arc(cx, baseY - 2, 6 * scale, 0, Math.PI * 2); c.fill();
      }
    }
    c.restore();
  }

  function drawPlume(c, cx, baseY, zoom, r, pid, ev, mult) {
    const nine = r.sfStyle === "merlin_nine";
    const intensity = pid === "chill" ? 0.2 : pid === "ignition" ? 0.7 : pid === "shutdown" ? 0.3 : 1;
    const n = Math.floor((nine ? 14 : 7) * intensity * mult) + 2;
    for (let i = 0; i < n; i++) {
      const ox = Math.sin(ev.t * 11 + i) * (nine ? 26 : 12) * zoom * intensity;
      const h = (18 + (i % 5) * 10) * zoom * intensity * mult;
      const grad = c.createLinearGradient(cx, baseY, cx, baseY + h + 40);
      grad.addColorStop(0, `rgba(255,220,120,${0.9 * intensity})`);
      grad.addColorStop(0.4, `rgba(255,100,30,${0.75 * intensity})`);
      grad.addColorStop(1, "rgba(40,40,40,0)");
      c.fillStyle = grad;
      c.beginPath();
      c.moveTo(cx + ox - 7 * zoom, baseY);
      c.lineTo(cx + ox, baseY + h + 20);
      c.lineTo(cx + ox + 7 * zoom, baseY);
      c.fill();
    }
  }

  function upgradePad() {
    const pad = buildingById(G.selectedId);
    if (!pad || pad.type !== "pad_orbital") return;
    if (pad.level >= 2) { log("Pad already L2", "info"); return; }
    if (G.steel < TUNING.PAD_L2_COST) { log(`Need ${TUNING.PAD_L2_COST} steel`, "bad"); return; }
    G.steel -= TUNING.PAD_L2_COST;
    pad.level = 2;
    log("Pad level 2. The trench is wider.", "good");
    updateObjectives();
    renderChrome();
  }

  function upgradeBay() {
    const bay = buildingById(G.selectedId);
    if (!bay || bay.type !== "mega_bay") return;
    if (bay.level >= TUNING.BAY_MAX) return;
    if (G.steel < TUNING.BAY_SLOT_COST) { log(`Need ${TUNING.BAY_SLOT_COST} steel.`, "bad"); return; }
    G.steel -= TUNING.BAY_SLOT_COST;
    bay.level += 1;
    log(`Mega Bay holds ${bay.level} vehicles.`, "good");
    updateObjectives();
    renderChrome();
  }

  function updateObjectives() {
    G.objectives.place_all = BUILD_ORDER.every((t) => countType(t) >= 1);
    if (liveFleet().length) G.objectives.build_rocket = true;
    if (bayCount() >= 2) G.objectives.multi_bay = true;
    const pad = buildingOfType("pad_orbital");
    G.objectives.pad_l2 = !!(pad && pad.level >= 2);
    renderObjectives();
  }

  // ── Chrome ──
  function renderResources() {
    el.steel.textContent = Math.floor(G.steel);
    el.prop.textContent = Math.floor(G.prop);
    el.fleet.textContent = liveFleet().length;
    el.day.textContent = String(G.day);
  }

  function plotSqft(plot) {
    const mid = (plot.north + plot.south) / 2 * Math.PI / 180;
    const metersH = (plot.north - plot.south) * 110540;
    const metersW = (plot.east - plot.west) * 111320 * Math.cos(mid);
    return metersH * metersW * 10.76391041671;
  }
  function fmtAcres(n) {
    const acres = n / 43560;
    const acresLabel = acres >= 100 ? Math.round(acres).toLocaleString("en-US") : acres.toFixed(1);
    return acresLabel + " acres";
  }
  function renderPalette() {
    const ownedSq = Object.keys(PLOTS).reduce((sum, id) => sum + (G.plots[id] ? plotSqft(PLOTS[id]) : 0), 0);
    const offers = Object.keys(PLOTS).filter((id) => !G.plots[id]).map((id) => {
      const plot = PLOTS[id];
      return `<button type="button" class="plot-card" data-plot="${id}">
        <div class="name">${esc(plot.name)}</div>
        <div class="price">${plot.cost}</div>
        <div class="unit">steel</div>
        <div class="line">${esc(plot.line)}</div>
      </button>`;
    }).join("");
    el.palette.innerHTML = `<div class="plot-owned">Owned<b>${fmtAcres(ownedSq)}</b></div>` + offers;
    el.palette.querySelectorAll("[data-plot]").forEach((btn) => {
      btn.addEventListener("click", () => buyPlot(btn.getAttribute("data-plot")));
    });
  }

    return [
      { id: "factory", name: "Starfactory", title: "Starfactory", lines: [
        "Builds one vehicle from steel. The finished vehicle stays here until you stage it to Mega Bay.",

      ]},
      { id: "bay", name: "Mega Bay", title: "Mega Bay", lines: [
        "Houses the fleet. A vehicle comes back here after a fire, and the refurb happens in the bay.",
        `The bay starts with 1 slot. Another slot costs ${TUNING.BAY_SLOT_COST} steel and adds one vehicle, up to ${TUNING.BAY_MAX}.`,
        `A clean fire takes ${ROCKET_DEFS.falcon1.refurbDaysOk} day of refurb. A miss takes ${ROCKET_DEFS.falcon1.refurbDaysFail} day.`,
      ]},
      { id: "pad", name: "Orbital Pad", title: "Orbital Pad", lines: [
        "Holds one vehicle for a static fire.",
        `The pad accepts ${TUNING.PAD_THRUST_L1} kN. That is the most thrust this pad will hold. A rocket above that fails the pad check.`,
        `Pad level 2 costs ${TUNING.PAD_L2_COST} steel. The trench widens. The pad then accepts ${TUNING.PAD_THRUST_L2} kN.`,
        `The pad allows wind up to ${TUNING.WIND_LIMIT_L1} knots, then ${TUNING.WIND_LIMIT_L2} knots at level 2. The lamp in the header is the sky.`,

      { id: "falcon", name: "Falcon 1", title: "Falcon 1", lines: [

        `Thrust is the push. A fresh Merlin makes ${TUNING.MERLIN_THRUST_KN} kN. Raise Merlin thrust costs ${TUNING.MERLIN_UP_COST} steel and ${TUNING.MERLIN_UP_DAYS} days. That rocket then makes ${merlinNext} kN. Each fire wears the thrust by ${Math.round(TUNING.SF_WEAR_PER_FIRE * 100)}%.`,
        `Impulse is ${TUNING.MERLIN_ISP_S} s. That is how long one mass of propellant lasts in the burn. Mass is ${TUNING.MERLIN_MASS_KG} kg. Restarts: ${TUNING.MERLIN_RESTARTS}.`,
      ]},
      { id: "fire", name: "Static fire", title: "Static fire", lines: [

        "If the thrust is higher than the pad accepts, the pad fails the check. If the tanks are short, the fire does not start. If the range lamp is closed, the fire does not start.",
        `A good fire takes ${TUNING.SF_OK_CONDITION} condition. A miss takes ${TUNING.SF_MISS_CONDITION} condition. Condition under ${TUNING.SCRAP_FLOOR} scraps the vehicle.`,

  }

  function renderWiki() {
    const panel = document.getElementById("wiki-panel");
    const sheet = document.getElementById("wiki-sheet");
    if (!panel || !sheet) return;
    const pages = wikiPages();
    const page = pages.find((p) => p.id === G.wikiPage) || pages[0];
    const topics = pages.map((p) => `<button type="button" class="wiki-topic${p.id === page.id ? " on" : ""}" data-wiki="${p.id}">${esc(p.name)}</button>`).join("");
    const body = page.lines.map((line) => `<p>${esc(line)}</p>`).join("");
    panel.innerHTML = `<div class="top"><div class="left">Wiki</div><button type="button" id="wiki-close">Close</button></div>
      <div class="wiki-grid"><div>${topics}</div><div class="wiki-body"><h3>${esc(page.title)}</h3>${body}</div></div>`;
    sheet.classList.toggle("open", G.wikiSheet);
    sheet.setAttribute("aria-hidden", G.wikiSheet ? "false" : "true");
    const close = panel.querySelector("#wiki-close");
    if (close) close.onclick = () => { G.wikiSheet = false; renderWiki(); };
    panel.querySelectorAll("[data-wiki]").forEach((btn) => {
      btn.onclick = () => { G.wikiPage = btn.getAttribute("data-wiki"); renderWiki(); };
    });
  }

  function renderFleetList() {
    const panel = document.getElementById("fleet-panel");
    const sheet = document.getElementById("fleet-sheet");
    if (!panel || !sheet) return;
    const list = liveFleet();
    const rows = list.length
      ? list.map((v) => {
        const sel = v.id === G.selectedVehicleId ? " sel" : "";
        return `<button type="button" class="fleet-row${sel}" data-vid="${v.id}">
          <div class="name">${esc(v.name)}</div>
          <div class="meta">${esc(placeLabel(v))} · condition ${Math.round(v.condition)}</div>
        </button>`;
      }).join("")
      : `<p class="fleet-empty">No vehicles yet. Build one at Starfactory.</p>`;
    panel.innerHTML = `<div class="top"><div class="left">${list.length}<span>${list.length === 1 ? "vehicle" : "vehicles"}</span></div>
      <button type="button" id="fleet-close">Close</button></div>${rows}`;
    sheet.classList.toggle("open", G.fleetSheet);
    sheet.setAttribute("aria-hidden", G.fleetSheet ? "false" : "true");
    const close = panel.querySelector("#fleet-close");
    if (close) close.onclick = () => { G.fleetSheet = false; renderFleetList(); };
    panel.querySelectorAll("[data-vid]").forEach((row) => {
      row.onclick = () => {
        G.selectedVehicleId = +row.getAttribute("data-vid");
        G.fleetSheet = false;
        G.rocketSheet = G.selectedVehicleId;
        const v = selectedVehicle();
        if (v && v.buildingId) G.selectedId = v.buildingId;
        renderChrome();
      };
    });
  }

  function placeLabel(v) {
    if (v.status === "in_bay") return `Bay slot ${(v.baySlot || 0) + 1}`;
    if (v.status === "at_factory") return "At the factory";
    if (v.status === "on_pad" || v.status === "needs_return") return "On the pad";
    if (v.status === "refurb") return `Refurb · ${v.refurbLeft} days left`;
    if (v.status === "rolling") return "On the road";
    return v.status;
  }

  function actCard(cls, id, extra, name, price, unit, line) {
    const idAttr = id ? ` id="${id}"` : "";
    const priceHtml = price == null ? "" : `<div class="price">${price}</div><div class="unit">${unit}</div>`;
    const lineHtml = line ? `<div class="line">${line}</div>` : "";
    return `<button type="button" class="act ${cls}"${idAttr}${extra || ""}>
      <div class="name">${name}</div>${priceHtml}${lineHtml}
    </button>`;
  }

  function renderInspector() {
    const box = el.inspector;
    if (G.placeType) {
      const d = defOf(G.placeType);
      box.innerHTML = `<div class="text-amber-200 font-semibold">Placing: ${esc(d.name)}</div>
        <p class="text-amber-200/60">${esc(d.blurb)}</p>
        <button type="button" class="ui-btn rounded px-2 py-1 text-[11px]" id="btn-x">Cancel</button>`;
      box.querySelector("#btn-x").onclick = () => {
        G.placeType = null; canvas.classList.remove("placing"); renderPalette(); renderInspector();
      };
      return;
    }

    const b = buildingById(G.selectedId);
    if (!b) {
      box.innerHTML = `<p class="text-amber-200/55">Select Starfactory, Mega Bay, or the Orbital Pad.</p>`;
      return;
    }
    const d = defOf(b.type);
    let html = `<div class="bldg"><div class="title">${esc(d.name)}</div><p class="blurb">${esc(d.blurb)}</p>`;

    if (b.type === "starfactory") {
      const hold = factoryHold();
      html += `<div class="stat"><div class="k">Holding</div><div class="n">${hold ? 1 : 0}</div><div class="s">of 1 finished vehicle</div></div>`;
      if (G.factoryJob) {
        const pct = 1 - G.factoryJob.daysLeft / G.factoryJob.totalDays;
        const label = G.factoryJob.kind === "merlin" ? "Merlin thrust" : rocketOf(G.factoryJob.rocketId).name;
        html += `<p class="wait">${esc(label)} · ${G.factoryJob.daysLeft} days left</p>
          <div class="bar-track"><i style="width:${Math.round(pct * 100)}%"></i></div>`;
      } else {
        const r = rocketOf("falcon1");
        const busy = !!(factoryHold() || G.event || G.rollout);
        html += actCard("build", "", ` data-rocket="falcon1"${busy || G.steel < r.steelCost ? " disabled" : ""}`,
          "Build Falcon 1", r.steelCost, "steel", `${r.buildDays} days. A static fire draws ${r.sfProp} propellant.`);
        html += `<p class="wait">Falcon 9, Falcon Heavy, and Starship come later.</p>`;
      }
      if (hold) {
        html += `<p class="wait">${esc(hold.name)} is ready.</p>`;
        html += actCard("roll", "btn-stage", "", "Stage to Mega Bay", null, "", "The vehicle leaves the factory.");
      }
    }

    if (b.type === "mega_bay") {
      const n = bayCount();
      const cap = bayCapacity(b);
      html += `<div class="stat"><div class="k">Housed</div><div class="n">${n}</div><div class="s">of ${cap} ${cap === 1 ? "vehicle" : "vehicles"}</div></div>`;
      const here = vehiclesAt(b.id);
      for (let slot = 0; slot < cap; slot++) {
        const v = here.find((item) => (item.baySlot || 0) === slot);
        if (!v) {
          html += `<div class="bay-slot empty"><div class="top"><span class="name">Bay ${slot + 1}</span></div><div class="n">—</div></div>`;
          continue;
        }
        const refurb = v.status === "refurb";
        const sel = v.id === G.selectedVehicleId ? " sel" : "";
        const cond = Math.round(v.condition);
        html += `<button type="button" class="bay-slot${sel}" data-bay="${v.id}">
          <div class="top"><span class="name">${esc(v.name)}</span><span class="where">${refurb ? "Refurb" : "In the bay"}</span></div>
          <div class="n">${refurb ? v.refurbLeft : cond}</div>
          <div class="where">${refurb ? "days left" : "condition"}</div>
          <div class="meter"><i style="width:${cond}%"></i></div>
        </button>`;
      }
      const v = selectedVehicle();
      if (v && v.status === "in_bay") {
        html += actCard("roll", "btn-topad", "", `Roll ${esc(v.name)} to the pad`, null, "", "The vehicle leaves the bay.");
      } else {
        html += `<p class="wait">Select a vehicle in the bay to roll it out.</p>`;
      }
      html += `<div class="sec"><div class="k">Upgrade</div>`;
      if (cap < TUNING.BAY_MAX) {
        html += actCard("up", "btn-bay", "", "Another slot", TUNING.BAY_SLOT_COST, "steel", `The bay then holds ${cap + 1} vehicles.`);
      } else {
        html += `<p class="wait">The bay holds ${TUNING.BAY_MAX} vehicles.</p>`;
      }
      html += `</div>`;
    }

    if (b.type === "pad_orbital") {
      const limits = padLimits(b);
      html += `<div class="stat"><div class="k">Pad accepts</div><div class="n">${limits.thrust}</div><div class="s">kN</div></div>`;
      html += `<div class="sec"><div class="k">Fire</div>`;
      const on = padHold();
      if (on && on.status === "on_pad") {
        const r = rocketOf(on.rocketId);
        const check = fireCheck(on, b);
        html += `<div class="facts"><div><b>${esc(on.name)}</b><span>condition ${Math.round(on.condition)} · ${on.fires || 0} fires</span></div><div><b>${check.thrust}</b><span>kN · needs ${TUNING.SF_THRUST_BAR_KN}</span></div></div>`;
        html += `<p class="wait">Condition under ${TUNING.SCRAP_FLOOR} scraps the vehicle. A miss takes ${TUNING.SF_MISS_CONDITION} condition.</p>`;
        const fireLine = check.ok ? "Thrust holds." : check.limiter === "weather" ? "The range is closed." : "A check is short.";
        html += actCard("fire", "btn-sf", "", check.ok ? "Static fire" : "Try static fire", r.sfProp, "propellant", fireLine);
      } else if (on && on.status === "needs_return") {
        html += `<div class="facts"><div><b>${esc(on.name)}</b><span>condition ${Math.round(on.condition)} · ${on.fires || 0} fires</span></div></div>`;
        html += actCard("roll", "btn-return", "", "Return to Mega Bay", null, "", "Refurb happens in the bay.");
      } else {
        html += `<p class="wait">The pad is empty. Roll a vehicle here from the bay.</p>`;
      }
      html += `</div>`;
      if (G.rollout) {
        const rv = vehicleById(G.rollout.vehicleId);
        const dest = G.rollout.destKind === "pad" ? "the pad" : "Mega Bay";
        const left = Math.max(0, G.rollout.duration - G.rollout.t).toFixed(0);
        html += `<div class="sec"><div class="k">Roll</div><p class="wait">${rv ? esc(rv.name) : "Vehicle"} is rolling to ${dest} · ${left} s left</p></div>`;
      }
      html += `<div class="sec"><div class="k">Upgrade</div>`;
      if (b.level < 2) {
        html += actCard("up", "btn-up", "", "Pad level 2", TUNING.PAD_L2_COST, "steel", `The trench widens. The pad then accepts ${TUNING.PAD_THRUST_L2} kN.`);
      } else {
        html += `<p class="wait">The trench is wide. The pad accepts ${TUNING.PAD_THRUST_L2} kN.</p>`;
      }
      html += `</div>`;
    }
    html += `</div>`;

    box.innerHTML = html;
    box.querySelectorAll("[data-rocket]").forEach((btn) => {
      btn.onclick = () => startBuildRocket(btn.getAttribute("data-rocket"));
    });
    const st = box.querySelector("#btn-stage");
    if (st) st.onclick = () => stageToBay(factoryHold() && factoryHold().id);
    box.querySelectorAll("[data-bay]").forEach((btn) => {
      btn.onclick = () => {
        G.selectedVehicleId = +btn.getAttribute("data-bay");
        G.rocketSheet = G.selectedVehicleId;
        renderChrome();
      };
    });
    const tp = box.querySelector("#btn-topad");
    if (tp) tp.onclick = () => startRoll(G.selectedVehicleId, "pad");
    const sf = box.querySelector("#btn-sf");
    if (sf) sf.onclick = staticFire;
    const ret = box.querySelector("#btn-return");
    if (ret) ret.onclick = () => startRoll(padHold() && padHold().id, "bay");
    const up = box.querySelector("#btn-up");
    if (up) up.onclick = upgradePad;
    const bayUp = box.querySelector("#btn-bay");
    if (bayUp) bayUp.onclick = upgradeBay;
  }

  function renderObjectives() {
    const items = [
      ["place_all", "Buy both sites"],
      ["build_rocket", "Build a rocket at Starfactory"],
      ["multi_bay", "House 2 vehicles in Mega Bay"],
      ["static_fire", "Finish a static fire"],
      ["refurb", "Finish a refurb in the bay"],
      ["pad_l2", "Raise the pad to level 2"],
    ];
    const open = items.filter(([k]) => !G.objectives[k]).length;
    const panel = document.getElementById("goal-panel");
    const sheet = document.getElementById("goal-sheet");
    if (!panel || !sheet) return;
    const next = items.find(([k]) => !G.objectives[k]);
    const rows = items.map(([k, label], i) => {
      const done = G.objectives[k];
      const now = next && next[0] === k;
      const cls = done ? "done" : now ? "now" : "";
      const mark = done ? "Done" : now ? "Next" : "";
      return `<div class="goal-row ${cls}"><div class="idx">${String(i + 1).padStart(2, "0")}</div><div><div class="name">${esc(label)}</div>${mark ? `<div class="line">${mark}</div>` : ""}</div></div>`;
    }).join("");
    panel.innerHTML = `<div class="top"><div class="left">${open}<span>${open ? "still open" : "all done"}</span></div>
      <button type="button" id="goal-close">Close</button></div>${rows}`;
    sheet.classList.toggle("open", G.goalSheet);
    sheet.setAttribute("aria-hidden", G.goalSheet ? "false" : "true");
    const close = panel.querySelector("#goal-close");
    if (close) close.onclick = () => { G.goalSheet = false; renderObjectives(); };
  }

  function renderJobNote() {
    const note = document.getElementById("job-note");
    if (!note) return;
    const lines = [];
    const days = (n) => (n === 1 ? "1 day left" : `${n} days left`);
    if (G.factoryJob) {
      const job = G.factoryJob;
      if (job.kind === "merlin") {
        const v = vehicleById(job.vehicleId);
        lines.push(`${v ? v.name : "Rocket"} · Merlin thrust to ${Math.round(TUNING.MERLIN_THRUST_KN * TUNING.MERLIN_UP_MULT)} kN · ${days(job.daysLeft)}`);
      } else {
        lines.push(`Starfactory · building ${rocketOf(job.rocketId).name} · ${days(job.daysLeft)}`);
      }
    }
    if (G.rollout) {
      const v = vehicleById(G.rollout.vehicleId);
      const dest = G.rollout.destKind === "pad" ? "the Orbital Pad" : "Mega Bay";
      const left = Math.max(0, G.rollout.duration - G.rollout.t);
      lines.push(`${v ? v.name : "Vehicle"} · rolling to ${dest} · ${left.toFixed(0)} s left`);
    }
    for (const v of liveFleet()) {
      if (v.status === "refurb" && v.refurbLeft > 0) {
        lines.push(`${v.name} · refurb in Mega Bay · ${days(v.refurbLeft)}`);
      }
    }
    note.innerHTML = lines.map((line) => `<span>${esc(line)}</span>`).join("");
  }

  function rangeClosed() {
    const sky = weatherOn(G.day);
    const lim = padLimits(buildingOfType("pad_orbital"));
    return rangeShut(sky.storm, sky.wind, lim.wind);
  }

  function renderWeather() {
    const sky = document.getElementById("sky-label");
    const lamp = document.getElementById("range-lamp");
    if (!sky) return;
    const now = weatherOn(G.day);
    const closed = rangeClosed();
    if (lamp) lamp.classList.toggle("closed", closed);
    sky.textContent = closed ? "Range closed" : "Range open";
    const wind = document.getElementById("wind-label");
    if (wind) wind.textContent = `${now.sky} ${now.wind} kn`;
    const readout = document.getElementById("readout");
    if (readout) {
      const pad = buildingOfType("pad_orbital");
      const v = pad && padHold();
      const hold = !!(v && v.status === "on_pad" && !fireCheck(v, pad).ok);
      readout.classList.toggle("hold", closed || hold);
    }
  }

  function startMerlinUpgrade(vehicleId) {
    const v = vehicleById(vehicleId);
    if (!v || v.merlinTier >= 2) return;
    if (G.factoryJob) { log("The factory is already busy.", "warn"); return; }
    if (G.steel < TUNING.MERLIN_UP_COST) { log(`Need ${TUNING.MERLIN_UP_COST} steel.`, "bad"); return; }
    G.steel -= TUNING.MERLIN_UP_COST;
    G.factoryJob = { kind: "merlin", vehicleId: v.id, daysLeft: TUNING.MERLIN_UP_DAYS, totalDays: TUNING.MERLIN_UP_DAYS };
    log(`Merlin thrust on ${v.name} rises in ${TUNING.MERLIN_UP_DAYS} days.`, "good");
    renderChrome();
  }

  function renderRocketSheet() {
    const sheet = document.getElementById("rocket-sheet");
    const panel = document.getElementById("rocket-panel");
    const v = G.rocketSheet ? vehicleById(G.rocketSheet) : null;
    if (!sheet || !panel || !v) {
      if (sheet) { sheet.classList.remove("open"); sheet.setAttribute("aria-hidden", "true"); }
      G.rocketSheet = null;
      return;
    }
    const job = G.factoryJob && G.factoryJob.kind === "merlin" && G.factoryJob.vehicleId === v.id ? G.factoryJob : null;
    const nextKn = Math.round(TUNING.MERLIN_THRUST_KN * TUNING.MERLIN_UP_MULT);
    let action = "";
    if (job) action = `<p class="wait">Merlin thrust · ${job.daysLeft} days left</p>`;
    else if ((v.merlinTier || 1) < 2) {
      action = actCard("up", "btn-merlin", G.steel < TUNING.MERLIN_UP_COST ? " disabled" : "",
        "Raise Merlin thrust", TUNING.MERLIN_UP_COST, "steel", `${TUNING.MERLIN_UP_DAYS} day. Thrust on this rocket rises to ${nextKn} kN.`);
    }
    panel.innerHTML = `<div class="top"><div><b>${esc(v.name)}</b><div class="place">${esc(placeLabel(v))} · condition ${Math.round(v.condition)}</div></div>
        <button type="button" class="ui-btn rounded px-2 py-1 text-xs" id="rocket-close">Close</button></div>
      <div class="rocket-sheet">
        <div class="side">Thrust<b>${merlinNowKn(v)} kN</b>Impulse<b>${TUNING.MERLIN_ISP_S} s</b></div>
        <div class="rocket-body"></div>
        <div class="side">Mass<b>${TUNING.MERLIN_MASS_KG} kg</b>Restarts<b>${TUNING.MERLIN_RESTARTS}</b></div>
      </div>${action}`;
    sheet.classList.add("open");
    sheet.setAttribute("aria-hidden", "false");
    panel.querySelector("#rocket-close").onclick = () => { G.rocketSheet = null; renderRocketSheet(); };
    const mer = panel.querySelector("#btn-merlin");
    if (mer) mer.onclick = () => startMerlinUpgrade(v.id);
  }

  function renderChrome() {
    renderWeather();
    renderResources();
    renderPalette();
    renderFleetList();
    renderInspector();
    renderRocketSheet();
    renderJobNote();
    renderWiki();
    updateObjectives();
