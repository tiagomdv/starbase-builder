<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Starbase Builder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="geo-land.js"></script>
  <script src="design-docs/countries.js"></script>
  <style>
    :root {
      --bg: #050505; --panel: #0a0a0a; --border: #2a2a2a;
      --text: #f2f2f2; --muted: #9a9a9a; --accent: #e10600;
      --good: #3dd68c; --bad: #e10600;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; touch-action: none; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      background: var(--bg); color: var(--text);
    }
    .resource-bar {
      background: #050505;
      border-bottom: 1px solid #222;
      color: #f2f2f2;
    }
    .range-lamp {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--good); box-shadow: 0 0 8px var(--good); display: inline-block;
    }
    .range-lamp.closed { background: var(--bad); box-shadow: 0 0 8px var(--bad); }
    .ui-panel { background: var(--panel); border: 1px solid var(--border); }
    .ui-panel.hold { box-shadow: inset 3px 0 0 var(--bad); }
    .ui-btn {
      background: #000; border: 1px solid #333; color: #f2f2f2;
      transition: background 0.12s, border-color 0.12s, opacity 0.12s;
    }
    .ui-btn:hover:not(:disabled) { background: #161616; border-color: #666; }
    .ui-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .ui-btn.active { background: #140404; border-color: var(--accent); }
    [class*="text-amber"] { color: #f2f2f2 !important; }
    .ui-btn.good { background: #1a2e14; border-color: #3d6e34; color: var(--good); }
    .ui-btn.danger { background: #2a1414; border-color: #8a4040; color: #e8a0a0; }
    #map-wrap { position: relative; min-width: 0; min-height: 0; background: #07141c; }
    #map { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
    #map-chips, #map-zoom { position: absolute; z-index: 2; display: flex; gap: 6px; }
    #map-chips { left: 10px; top: 10px; }
    #map-zoom { right: 10px; top: 10px; }
    #map-scale {
      position: absolute; left: 12px; bottom: 72px; z-index: 2; display: none;
      align-items: flex-end; gap: 8px; pointer-events: none;
      font: 12px ui-monospace, monospace; color: #f4ead8;
    }
    #map-scale .bar {
      height: 8px;
      border-left: 2px solid #f4ead8;
      border-right: 2px solid #f4ead8;
      border-bottom: 2px solid #f4ead8;
    }
    #map.placing { cursor: crosshair; }
    #map.panning { cursor: grabbing; }
    #log { font-family: ui-monospace, Menlo, monospace; font-size: 11px; line-height: 1.35; }
    #log .good { color: var(--good); }
    #log .warn { color: var(--accent); }
    #log .bad { color: var(--bad); }
    #log .info { color: var(--muted); }
    .swatch {
      width: 0.85rem; height: 0.85rem; border-radius: 2px;
      border: 1px solid rgba(0,0,0,0.35); display: inline-block;
    }
    .obj-done { color: var(--good); text-decoration: line-through; opacity: 0.85; }
    .fleet-row {
      border: 1px solid #333; border-radius: 2px; padding: 0.4rem 0.45rem;
      margin-bottom: 0.35rem; cursor: pointer; background: #000;
    }
    .fleet-row:hover { border-color: #666; }
    .fleet-row.sel { border-color: var(--accent); border-left-width: 3px; background: #120404; }
    .fleet-row .meta { color: var(--muted); font-size: 10px; }
    .bar-track {
      height: 6px; background: #1a1510; border-radius: 3px; overflow: hidden; margin-top: 4px;
    }
    .bar-track > i { display: block; height: 100%; background: linear-gradient(90deg, #6a8a40, #a8c86a); }
    .bar-track.bad > i { background: linear-gradient(90deg, #8a4040, #d07060); }
    #event-stage {
      position: fixed; inset: 0; z-index: 80; display: none; flex-direction: column;
      background: rgba(8, 10, 12, 0.9); backdrop-filter: blur(4px);
    }
    #event-stage.open { display: flex; }
    #event-stage .event-head {
      flex-shrink: 0; display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;
      padding: 0.65rem 1rem; border-bottom: 1px solid var(--border);
      background: #050505;
    }
    #event-stage .event-head h2 {
      margin: 0; font-size: 0.95rem; letter-spacing: 0.08em;
      text-transform: uppercase; color: #f5edd8;
    }
    #event-stage .event-phase {
      font-family: ui-monospace, Menlo, monospace; font-size: 0.8rem; color: var(--accent);
    }
    #event-stage .event-phase.fail { color: var(--bad); }
    #event-stage .event-body {
      flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 0.5rem;
    }
    #event-canvas {
      width: min(920px, 96vw); height: min(520px, 70vh); max-width: 100%;
      border: 1px solid var(--border); border-radius: 8px; background: #0a0e14;
      box-shadow: 0 12px 48px rgba(0,0,0,0.55);
    }
    #event-stage .event-foot {
      flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; gap: 0.75rem;
      padding: 0.55rem 1rem 0.75rem; border-top: 1px solid var(--border);
      background: #050505; font-size: 0.78rem; color: var(--muted);
    }
  </style>
</head>
<body class="flex flex-col h-full">

  <header class="resource-bar px-3 py-2 flex items-center gap-3 text-sm shrink-0 flex-wrap z-20">
    <span id="range-lamp" class="range-lamp" title="Green when the sky is inside the pad limit."></span>
    <span id="sky-label">Range open</span>
    <div class="ml-auto flex items-center gap-3 text-xs">
      <span>Steel <b id="res-steel" class="tabular-nums">200</b></span>
      <span>Propellant <b id="res-prop" class="tabular-nums">40</b></span>
      <span>Fleet <b id="res-fleet" class="tabular-nums">0</b></span>
      <span id="day-label">Day 1</span>
      <button type="button" class="ui-btn rounded px-2 py-0.5 text-xs" id="btn-mute" title="Toggle sound">🔊</button>
      <span id="ver-label" class="opacity-70">0.2.1-field</span>
    </div>
  </header>

  <div class="flex flex-1 min-h-0">
    <aside class="w-44 ui-panel flex flex-col shrink-0 border-y-0 border-l-0">
      <div class="p-2.5 border-b border-amber-900/40">
        <div class="text-[10px] uppercase tracking-wider text-amber-600 mb-2">Land</div>
        <div class="grid grid-cols-1 gap-1.5" id="build-palette"></div>
      </div>
    </aside>

    <div id="map-wrap" class="flex-1">
      <canvas id="map"></canvas>
      <div id="map-chips">
        <button type="button" class="ui-btn rounded px-2 py-1 text-xs" data-band="World" data-mpp="18000">World</button>
        <button type="button" class="ui-btn rounded px-2 py-1 text-xs" data-band="Region" data-mpp="1600">Region</button>
        <button type="button" class="ui-btn rounded px-2 py-1 text-xs" data-band="Site" data-mpp="100">Site</button>
        <button type="button" class="ui-btn rounded px-2 py-1 text-xs" data-band="Work" data-mpp="1.25">Work</button>
      </div>
      <div id="map-zoom">
        <button type="button" class="ui-btn rounded px-2 py-1 text-xs" id="zoom-in">Zoom in</button>
        <button type="button" class="ui-btn rounded px-2 py-1 text-xs" id="zoom-out">Zoom out</button>
      </div>
      <div id="map-scale"><span class="bar" id="map-scale-bar"></span><span id="map-scale-label"></span></div>
    </div>

    <aside id="readout" class="w-64 ui-panel flex flex-col shrink-0 border-y-0 border-r-0 min-h-0">
      <div class="p-2.5 border-b border-amber-900/40 flex-1 overflow-y-auto min-h-0">
        <div class="text-[10px] uppercase tracking-wider text-amber-600 mb-1">Inspector</div>
        <div id="inspector" class="text-xs text-amber-100/85 space-y-2"></div>
      </div>
      <div class="p-2.5 border-b border-amber-900/40 max-h-40 overflow-y-auto">
        <div class="text-[10px] uppercase tracking-wider text-amber-600 mb-1.5">Fleet</div>
        <div id="fleet-list" class="text-[11px]"></div>
      </div>
      <div class="p-2.5 border-b border-amber-900/40">
        <div class="text-[10px] uppercase tracking-wider text-amber-600 mb-1.5">Goals</div>
        <ul id="objectives" class="text-[11px] space-y-1 text-amber-100/80"></ul>
      </div>
      <div class="p-2 text-[10px] text-amber-200/40">Drag · scroll · pinch · Esc · 🔊</div>
    </aside>
  </div>

  <footer class="ui-panel border-x-0 border-b-0 shrink-0">
    <div id="log" class="px-3 py-1.5 h-14 overflow-y-auto"></div>
  </footer>

  <div id="event-stage" aria-hidden="true">
    <div class="event-head">
      <h2 id="event-title">Ops</h2>
      <span class="event-phase" id="event-phase">—</span>
      <div class="ml-auto">
        <button type="button" class="ui-btn rounded px-3 py-1 text-xs" id="event-skip">Skip</button>
      </div>
    </div>
    <div class="event-body"><canvas id="event-canvas" width="900" height="500"></canvas></div>
    <div class="event-foot">
      <span id="event-caption">Static fire · success is not guaranteed</span>
      <span>Failure → anomaly animation · return to bay for refurb / scrap</span>
    </div>
  </div>

  <script>
(() => {
  "use strict";

  const VERSION = "0.2.1-field";
  const CELL = 32, MAP_W = 40, MAP_H = 30, MS_PER_DAY = 4000;
  const ZOOM_MIN = 0.22, ZOOM_MAX = 2.4;
  const PAD_LAT = 25.997, PAD_LON = -97.157;

  const TUNING = {
    START_STEEL: 200,
    START_PROP: 40,
    /** Environment: materials + propellant without tank farm */
    ENV_STEEL_PER_DAY: 6,
    ENV_PROP_PER_DAY: 8,
    PROP_CAP: 120,
    PAD_L2_COST: 40,
    MERLIN_THRUST_KN: 340,
    MERLIN_ISP_S: 260,
    MERLIN_MASS_KG: 630,
    MERLIN_RESTARTS: 1,
    MERLIN_UP_COST: 36,
    MERLIN_UP_DAYS: 2,
    MERLIN_UP_MULT: 1.12,
    SF_THRUST_BAR_KN: 300,
    SF_WEAR_PER_FIRE: 0.08,
    SF_MISS_CONDITION: 40,
    SF_OK_CONDITION: 12,
    SCRAP_FLOOR: 20,
    WIND_LIMIT_L1: 20,
    WIND_LIMIT_L2: 28,
    PAD_THRUST_L1: 400,
    PAD_THRUST_L2: 900,
    BAY_CAPACITY: 4,
    ROLLOUT_PX_PER_SEC: 52,
    ROLLOUT_MIN_SEC: 2.0,
    ROLLOUT_MAX_SEC: 14,
    RETURN_PX_PER_SEC: 56,
  };

  /**
   * SpaceX-ish roadmap. Static fire can fail (RUD / engine anomaly).
   * Post-fire vehicles need hangar/bay inspection & refurb — not left “hot” on the pad.
   */
  const ROCKET_DEFS = {
    falcon1: {
      id: "falcon1",
      name: "Falcon 1",
      short: "F1",
      era: "2006–2009",
      steelCost: 28,
      buildDays: 3,
      sfProp: 8,
      engines: 1,
      sfStyle: "merlin_single",
      mapScale: 0.82,
      color: "#c8d0d8",
      /** Base P(success) on a green pad with fresh vehicle */
      sfSuccess: 0.72,
      refurbDaysOk: 2,
      refurbDaysFail: 4,
      scrapOnFailChance: 0.35,
      blurb: "One Merlin. The fire follows thrust, the pad, the tanks, and the sky.",
      sfPhases: { approach: 1.0, chill: 1.0, ignition: 0.85, burn: 1.9, shutdown: 0.75, debrief: 1.0 },
      unlocked: true,
    },
    falcon9: {
      id: "falcon9",
      name: "Falcon 9",
      short: "F9",
      era: "2010+",
      steelCost: 52,
      buildDays: 5,
      sfProp: 16,
      engines: 9,
      sfStyle: "merlin_nine",
      mapScale: 1.12,
      color: "#e8eef4",
      sfSuccess: 0.82,
      refurbDaysOk: 2,
      refurbDaysFail: 5,
      scrapOnFailChance: 0.22,
      blurb: "Nine-engine first stage. Heavier fire, higher base reliability.",
      sfPhases: { approach: 1.15, chill: 1.4, ignition: 1.2, burn: 3.2, shutdown: 1.0, debrief: 1.2 },
      unlocked: false,
    },
    falcon_heavy: { id: "falcon_heavy", name: "Falcon Heavy", short: "FH", unlocked: false, blurb: "Later." },
    starship: { id: "starship", name: "Starship", short: "SS", unlocked: false, blurb: "Later." },
  };

  const BUILDING_DEFS = {
    starfactory: {
      id: "starfactory",
      name: "Starfactory",
      short: "Factory",
      cost: 40,
      footprint: { w: 4, h: 3 },
      maxCount: 1,
      zoneHint: "production",
      blurb: "Manufactures flight vehicles from steel. Not a steel mill. Holds one vehicle until staged to the bay.",
    },
    mega_bay: {
      id: "mega_bay",
      name: "Mega Bay",
      short: "Bay",
      cost: 50,
      footprint: { w: 5, h: 3 },
      maxCount: 1,
      zoneHint: "production",
      blurb: "High bay / hangar: house the fleet, stage for pad, and perform post-fire refurb. Real ops keep articles indoors between pad tests.",
    },
    pad_orbital: {
      id: "pad_orbital",
      name: "Orbital Pad",
      short: "Pad",
      cost: 40,
      footprint: { w: 3, h: 4 },
      maxCount: 1,
      zoneHint: "launch",
      maxLevel: 2,
      upgradeVisual: { 2: "Widen flame trench and raise the mount" },
      blurb: "Static fire only. Level 2 accepts more thrust, allows more wind, and shortens a clean refurb by one day.",
    },
  };

  const BUILD_ORDER = ["starfactory", "mega_bay", "pad_orbital"];

  // ── Audio (compact) ──
  const SFX = { ctx: null, master: null, muted: false, lastUi: 0, engine: null };
  function audioInit() {
    if (SFX.ctx) { if (SFX.ctx.state === "suspended") SFX.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    SFX.ctx = new AC();
    SFX.master = SFX.ctx.createGain();
    SFX.master.gain.value = SFX.muted ? 0 : 0.32;
    SFX.master.connect(SFX.ctx.destination);
  }
  function setMuted(m) {
    SFX.muted = m;
    if (SFX.master) SFX.master.gain.value = m ? 0 : 0.32;
    const btn = document.getElementById("btn-mute");
    if (btn) btn.textContent = m ? "🔇" : "🔊";
    try { localStorage.setItem("starbase-mute", m ? "1" : "0"); } catch (_) {}
  }
  function tone(freq, dur, type = "sine", vol = 0.12, when = 0, slideTo = null) {
    if (!SFX.ctx || SFX.muted) return;
    const t0 = SFX.ctx.currentTime + when;
    const o = SFX.ctx.createOscillator(), g = SFX.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo != null) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(SFX.master); o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function noiseBurst(dur, vol = 0.1, when = 0, filterFreq = 800, type = "bandpass") {
    if (!SFX.ctx || SFX.muted) return;
    const t0 = SFX.ctx.currentTime + when;
    const len = Math.max(1, Math.floor(SFX.ctx.sampleRate * dur));
    const buf = SFX.ctx.createBuffer(1, len, SFX.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    const src = SFX.ctx.createBufferSource(); src.buffer = buf;
    const filter = SFX.ctx.createBiquadFilter();
    filter.type = type; filter.frequency.value = filterFreq;
    const g = SFX.ctx.createGain();
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(filter); filter.connect(g); g.connect(SFX.master);
    src.start(t0); src.stop(t0 + dur + 0.02);
  }
  function sfxUi() {
    if (!SFX.ctx || SFX.muted) return;
    if (performance.now() - SFX.lastUi < 45) return;
    SFX.lastUi = performance.now();
    tone(520, 0.04, "square", 0.03);
  }
  function sfxBuild() { audioInit(); tone(180, 0.1, "sawtooth", 0.05); noiseBurst(0.08, 0.04, 0.04, 400, "lowpass"); }
  function sfxReady() { audioInit(); tone(523, 0.08, "sine", 0.05); tone(659, 0.1, "sine", 0.05, 0.07); }
  function sfxRoll() { audioInit(); noiseBurst(0.3, 0.05, 0, 200, "lowpass"); }
  function sfxUp() { audioInit(); tone(330, 0.07, "sine", 0.05); tone(440, 0.1, "sine", 0.05, 0.06); }
  function sfxOk() { audioInit(); tone(523, 0.1, "sine", 0.05); tone(784, 0.16, "sine", 0.06, 0.12); }
  function sfxFail() { audioInit(); noiseBurst(0.55, 0.2, 0, 300, "lowpass"); tone(90, 0.4, "sawtooth", 0.08, 0, 40); tone(60, 0.5, "square", 0.05, 0.1, 30); }
  function sfxErr() { audioInit(); tone(150, 0.12, "sawtooth", 0.05); }
  function sfxSF(style) {
    audioInit();
    const h = style === "merlin_nine";
    noiseBurst(h ? 0.5 : 0.3, h ? 0.15 : 0.1, 0, 160, "lowpass");
    tone(h ? 48 : 70, h ? 0.8 : 0.5, "sawtooth", h ? 0.07 : 0.05, 0, 32);
  }
  function sfxIgn(style) {
    audioInit();
    const h = style === "merlin_nine";
    noiseBurst(h ? 0.65 : 0.35, h ? 0.17 : 0.1, 0, 140, "lowpass");
  }
  function startRumble(style) {
    stopRumble();
    if (!SFX.ctx || SFX.muted) return;
    audioInit();
    const h = style === "merlin_nine";
    const len = SFX.ctx.sampleRate * 2;
    const buf = SFX.ctx.createBuffer(1, len, SFX.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = SFX.ctx.createBufferSource(); src.buffer = buf; src.loop = true;
    const f = SFX.ctx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = h ? 170 : 260;
    const g = SFX.ctx.createGain(); g.gain.value = 0.0001;
    g.gain.exponentialRampToValueAtTime(h ? 0.1 : 0.06, SFX.ctx.currentTime + 0.35);
    src.connect(f); f.connect(g); g.connect(SFX.master); src.start();
    SFX.engine = { src, g };
  }
  function stopRumble() {
    if (!SFX.engine || !SFX.ctx) return;
    try {
      const t = SFX.ctx.currentTime;
      SFX.engine.g.gain.cancelScheduledValues(t);
      SFX.engine.g.gain.setValueAtTime(Math.max(SFX.engine.g.gain.value, 0.0001), t);
      SFX.engine.g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
      const e = SFX.engine; SFX.engine = null;
      setTimeout(() => { try { e.src.stop(); } catch (_) {} }, 350);
    } catch (_) { SFX.engine = null; }
  }

  // ── State ──
  // vehicle: { id, name, rocketId, buildingId|null, status, condition, refurbLeft, wx, wy, baySlot }
  // status: at_factory | in_bay | rolling | on_pad | refurb | destroyed
  const G = {
    day: 1, dayAcc: 0,
    merlinTier: 1,
    steel: TUNING.START_STEEL,
    prop: TUNING.START_PROP,
    buildings: [],
    fleet: [],
    factoryJob: null,
    rollout: null, // { vehicleId, pts, segLens, totalLen, t, duration, destKind: 'pad'|'bay', destId }
    event: null,
    nextId: 1,
    selectedId: null,
    selectedVehicleId: null,
    placeType: null,
    cam: { x: 80, y: 40, zoom: 1 },
    lon: PAD_LON, lat: PAD_LAT, span: 0.045,
    plots: { production: false, launch: false },
    drag: null,
    flameUntil: 0,
    log: [],
    objectives: {
      place_all: false,
      build_rocket: false,
      multi_bay: false,
      static_fire: false,
      refurb: false,
      pad_l2: false,
    },
  };

  const canvas = document.getElementById("map");
  const ctx = canvas.getContext("2d");
  const el = {
    steel: document.getElementById("res-steel"),
    prop: document.getElementById("res-prop"),
    fleet: document.getElementById("res-fleet"),
    day: document.getElementById("day-label"),
    log: document.getElementById("log"),
    inspector: document.getElementById("inspector"),
    objectives: document.getElementById("objectives"),
    palette: document.getElementById("build-palette"),
    fleetList: document.getElementById("fleet-list"),
  };

  function log(msg, kind = "info") {
    G.log.unshift({ msg, kind });
    if (G.log.length > 45) G.log.pop();
    el.log.innerHTML = G.log.slice(0, 12).map((e) => `<div class="${e.kind}">${esc(e.msg)}</div>`).join("");
  }
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function defOf(t) { return BUILDING_DEFS[t]; }
  function rocketOf(id) { return ROCKET_DEFS[id] || ROCKET_DEFS.falcon1; }
  function buildingById(id) { return G.buildings.find((b) => b.id === id) || null; }
  function buildingOfType(t) { return G.buildings.find((b) => b.type === t) || null; }
  function countType(t) { return G.buildings.filter((b) => b.type === t).length; }
  function vehicleById(id) { return G.fleet.find((v) => v.id === id) || null; }
  function selectedVehicle() { return vehicleById(G.selectedVehicleId); }
  function liveFleet() { return G.fleet.filter((v) => v.status !== "destroyed"); }
  function vehiclesAt(buildingId) { return liveFleet().filter((v) => v.buildingId === buildingId); }
  function bayCount() {
    const bay = buildingOfType("mega_bay");
    return bay ? vehiclesAt(bay.id).length : 0;
  }
  function factoryHold() {
    const f = buildingOfType("starfactory");
    return f ? vehiclesAt(f.id)[0] || null : null;
  }
  function padHold() {
    const p = buildingOfType("pad_orbital");
    return p ? vehiclesAt(p.id)[0] || null : null;
  }
  function cellZone(gx, gy) {
    if (gx >= 28 && gy >= 20) return "water";
    if (gy < 12) return "production";
    if (gy < 16) return "corridor";
    if (gx < 22) return "launch";
    return "propellant";
  }
  function isWater() { return false; }
  function buildingAnchor(b, slot = 0) {
    const d = defOf(b.type);
    const baseX = (b.gx + d.footprint.w / 2) * CELL;
    const baseY = (b.gy + d.footprint.h * 0.42) * CELL;
    if (b.type === "mega_bay") {
      const spread = 22;
      const n = TUNING.BAY_CAPACITY;
      const i = slot % n;
      return { x: baseX + (i - (n - 1) / 2) * spread, y: baseY };
    }
    return { x: baseX, y: baseY };
  }

  function canPlace(type, gx, gy) {
    const def = defOf(type);
    if (!def) return { ok: false, why: "Unknown" };
    if (countType(type) >= def.maxCount) return { ok: false, why: `Only one ${def.name}` };
    const { w, h } = def.footprint;
    if (gx < 0 || gy < 0 || gx + w > MAP_W || gy + h > MAP_H) return { ok: false, why: "Off map" };
    for (let y = gy; y < gy + h; y++)
      for (let x = gx; x < gx + w; x++)
        if (isWater(x, y)) return { ok: false, why: "Water" };
    for (const b of G.buildings) {
      const d = defOf(b.type);
      if (b.gx < gx + w && b.gx + d.footprint.w > gx && b.gy < gy + h && b.gy + d.footprint.h > gy)
        return { ok: false, why: "Overlap" };
    }
    if (G.steel < def.cost) return { ok: false, why: `Need ${def.cost} steel` };
    return { ok: true };
  }

  function buyPlot(id) {
    audioInit();
    const plot = PLOTS[id];
    if (!plot || G.plots[id]) return;
    if (G.steel < plot.cost) { sfxErr(); log(`Need ${plot.cost} steel.`, "bad"); return; }
    for (const b of plot.buildings) {
      const check = canPlace(b.type, b.gx, b.gy);
      if (!check.ok && check.why !== `Need ${defOf(b.type).cost} steel`) {
        sfxErr(); log(check.why, "bad"); return;
      }
    }
    G.steel -= plot.cost;
    G.plots[id] = true;
    for (const b of plot.buildings) {
      G.buildings.push({ id: G.nextId++, type: b.type, gx: b.gx, gy: b.gy, level: 1 });
      G.selectedId = G.buildings[G.buildings.length - 1].id;
    }
    sfxBuild();
    log(`${plot.name} bought. The buildings sit on the real Starbase layout.`, "good");
    updateObjectives();
    renderChrome();
  }

  function placeBuilding(type, gx, gy) {
    audioInit();
    const check = canPlace(type, gx, gy);
    if (!check.ok) { sfxErr(); log(check.why, "bad"); return; }
    const def = defOf(type);
    G.steel -= def.cost;
    G.buildings.push({ id: G.nextId++, type, gx, gy, level: 1 });
    G.selectedId = G.buildings[G.buildings.length - 1].id;
    G.placeType = null;
    canvas.classList.remove("placing");
    sfxBuild();
    log(`Built ${def.name} (−${def.cost} steel)`, "good");
    updateObjectives();
    renderChrome();
  }

  function dayTick() {
    G.day++;
    G.steel += TUNING.ENV_STEEL_PER_DAY;
    G.prop = Math.min(TUNING.PROP_CAP, G.prop + TUNING.ENV_PROP_PER_DAY);

    if (G.factoryJob) {
      G.factoryJob.daysLeft--;
      if (G.factoryJob.daysLeft <= 0) finishFactoryJob();
      else if (G.factoryJob.kind === "merlin") log(`Engine lab: Merlin thrust upgrade — ${G.factoryJob.daysLeft}d left`, "info");
      else log(`Factory: ${rocketOf(G.factoryJob.rocketId).name} — ${G.factoryJob.daysLeft}d left`, "info");
    }

    for (const v of liveFleet()) {
      if (v.status === "refurb" && v.refurbLeft > 0) {
        v.refurbLeft--;
        if (v.refurbLeft <= 0) {
          v.status = "in_bay";
          v.condition = Math.min(100, v.condition + 25);
          sfxReady();
          log(`${v.name} refurb complete in Mega Bay — ready`, "good");
          G.objectives.refurb = true;
        }
      }
    }
    renderChrome();
  }

  function finishFactoryJob() {
    const job = G.factoryJob;
    const factory = buildingOfType("starfactory");
    G.factoryJob = null;
    if (!job || !factory) return;
    if (job.kind === "merlin") {
      G.merlinTier = 2;
      sfxUp();
      log("Merlin thrust is now 12% higher on every Falcon 1.", "good");
      renderChrome();
      return;
    }
    if (factoryHold()) {
      log("Factory hold full — job lost (should not happen)", "bad");
      return;
    }
    const r = rocketOf(job.rocketId);
    const n = liveFleet().filter((v) => v.rocketId === r.id).length + 1;
    const a = buildingAnchor(factory);
    const v = {
      id: G.nextId++,
      name: `${r.short}-${n}`,
      rocketId: r.id,
      buildingId: factory.id,
      status: "at_factory",
      condition: 100,
      fires: 0,
      refurbLeft: 0,
      baySlot: 0,
      wx: a.x, wy: a.y,
    };
    G.fleet.push(v);
    G.selectedVehicleId = v.id;
    sfxReady();
    log(`${v.name} complete at Starfactory — stage into Mega Bay`, "good");
    G.objectives.build_rocket = true;
    updateObjectives();
    renderChrome();
  }

  function startBuildRocket(rocketId) {
    audioInit();
    const r = rocketOf(rocketId);
    if (!r.unlocked) { sfxErr(); log("Not on roadmap yet", "warn"); return; }
    const factory = buildingById(G.selectedId);
    if (!factory || factory.type !== "starfactory") { log("Select Starfactory", "warn"); return; }
    if (G.factoryJob) { sfxErr(); log("Factory already building", "warn"); return; }
    if (factoryHold()) { sfxErr(); log("Move finished vehicle to Mega Bay first (factory hold is 1)", "warn"); return; }
    if (G.event || G.rollout) { log("Ops busy", "warn"); return; }
    if (G.steel < r.steelCost) { sfxErr(); log(`Need ${r.steelCost} steel`, "bad"); return; }
    G.steel -= r.steelCost;
    G.factoryJob = { kind: "rocket", rocketId: r.id, daysLeft: r.buildDays, totalDays: r.buildDays };
    sfxBuild();
    log(`Factory: ${r.name} started (−${r.steelCost} steel · ${r.buildDays} days)`, "good");
    renderChrome();
  }

  function stageToBay(vehicleId) {
    audioInit();
    const bay = buildingOfType("mega_bay");
    if (!bay) { sfxErr(); log("Need Mega Bay", "bad"); return; }
    const v = vehicleById(vehicleId || G.selectedVehicleId);
    if (!v || v.status !== "at_factory") { sfxErr(); log("Select a finished vehicle at the factory", "warn"); return; }
    if (bayCount() >= TUNING.BAY_CAPACITY) {
      sfxErr();
      log(`Mega Bay full (${TUNING.BAY_CAPACITY} articles). Real hangars are capacity-limited.`, "bad");
      return;
    }
    if (G.event || G.rollout) { log("Ops busy", "warn"); return; }
    // assign bay slot
    const used = new Set(vehiclesAt(bay.id).map((x) => x.baySlot));
    let slot = 0;
    while (used.has(slot) && slot < TUNING.BAY_CAPACITY) slot++;
    v.buildingId = bay.id;
    v.status = "in_bay";
    v.baySlot = slot;
    const a = buildingAnchor(bay, slot);
    v.wx = a.x; v.wy = a.y;
    G.selectedVehicleId = v.id;
    sfxBuild();
    log(`${v.name} staged in Mega Bay (slot ${slot + 1}/${TUNING.BAY_CAPACITY})`, "good");
    if (bayCount() >= 2) G.objectives.multi_bay = true;
    updateObjectives();
    renderChrome();
  }

  function pathMetrics(pts) {
    const segLens = [];
    let total = 0;
    for (let i = 0; i < pts.length - 1; i++) {
      const len = Math.hypot(pts[i + 1].x - pts[i].x, pts[i + 1].y - pts[i].y);
      segLens.push(len); total += len;
    }
    return { segLens, totalLen: Math.max(total, 1) };
  }
  function pointAlong(pts, segLens, totalLen, u) {
    let dist = clamp(u, 0, 1) * totalLen;
    for (let i = 0; i < segLens.length; i++) {
      if (dist <= segLens[i] || i === segLens.length - 1) {
        const t = segLens[i] < 1e-6 ? 1 : dist / segLens[i];
        return {
          x: pts[i].x + (pts[i + 1].x - pts[i].x) * t,
          y: pts[i].y + (pts[i + 1].y - pts[i].y) * t,
        };
      }
      dist -= segLens[i];
    }
    return pts[pts.length - 1];
  }
  function roadPath(from, to) {
    const roadY = 14 * CELL;
    const pts = [{ x: from.x, y: from.y }];
    if (Math.abs(from.y - roadY) > 8) pts.push({ x: from.x, y: roadY });
    if (Math.abs(from.x - to.x) > 8) pts.push({ x: to.x, y: roadY });
    pts.push({ x: to.x, y: to.y });
    const clean = [pts[0]];
    for (let i = 1; i < pts.length; i++) {
      const p = pts[i], q = clean[clean.length - 1];
      if (Math.hypot(p.x - q.x, p.y - q.y) > 1) clean.push(p);
    }
    return clean;
  }

  function startRoll(vehicleId, destKind) {
    audioInit();
    const v = vehicleById(vehicleId || G.selectedVehicleId);
    if (!v) { sfxErr(); log("Select a vehicle", "warn"); return; }
    if (G.rollout || G.event) { log("Transport busy", "warn"); return; }
    const pad = buildingOfType("pad_orbital");
    const bay = buildingOfType("mega_bay");
    if (!pad || !bay) { sfxErr(); log("Need bay and pad", "bad"); return; }

    let fromB, toB, destStatus, speed;
    if (destKind === "pad") {
      if (v.status !== "in_bay") { sfxErr(); log("Only bay-ready vehicles roll to pad", "warn"); return; }
      if (padHold()) { sfxErr(); log("Pad occupied — one stack on OLM", "warn"); return; }
      fromB = bay; toB = pad; destStatus = "on_pad"; speed = TUNING.ROLLOUT_PX_PER_SEC;
    } else if (destKind === "bay") {
      if (v.status !== "on_pad" && v.status !== "needs_return") {
        sfxErr(); log("Return to bay from pad after fire", "warn"); return;
      }
      if (bayCount() >= TUNING.BAY_CAPACITY && v.buildingId !== bay.id) {
        sfxErr(); log("Bay full — cannot return yet", "bad"); return;
      }
      fromB = pad; toB = bay; destStatus = "refurb"; speed = TUNING.RETURN_PX_PER_SEC;
    } else return;

    const fromA = v.buildingId === fromB.id
      ? { x: v.wx, y: v.wy }
      : buildingAnchor(fromB, v.baySlot || 0);
    let slot = v.baySlot || 0;
    if (destKind === "bay") {
      const used = new Set(vehiclesAt(bay.id).filter((x) => x.id !== v.id).map((x) => x.baySlot));
      slot = 0;
      while (used.has(slot) && slot < TUNING.BAY_CAPACITY) slot++;
      v.baySlot = slot;
    }
    const toA = buildingAnchor(toB, destKind === "bay" ? slot : 0);
    const pts = roadPath(fromA, toA);
    const { segLens, totalLen } = pathMetrics(pts);
    let duration = totalLen / speed;
    duration = clamp(duration, TUNING.ROLLOUT_MIN_SEC, TUNING.ROLLOUT_MAX_SEC);

    v.buildingId = null;
    v.status = "rolling";
    v.wx = pts[0].x; v.wy = pts[0].y;
    G.rollout = {
      vehicleId: v.id, pts, segLens, totalLen, t: 0, duration,
      destKind, destId: toB.id, destStatus, baySlot: slot,
    };
    sfxRoll();
    log(
      `${v.name} ${destKind === "pad" ? "rollout to pad" : "return to bay"} · ${duration.toFixed(1)}s`,
      "info"
    );
    renderChrome();
  }

  function updateRollout(dt) {
    if (!G.rollout) return;
    const r = G.rollout;
    const v = vehicleById(r.vehicleId);
    if (!v) { G.rollout = null; return; }
    r.t += dt;
    const u = clamp(r.t / r.duration, 0, 1);
    const p = pointAlong(r.pts, r.segLens, r.totalLen, u);
    v.wx = p.x; v.wy = p.y;
    if (u >= 1) {
      v.buildingId = r.destId;
      v.status = r.destStatus;
      v.baySlot = r.baySlot || 0;
      const b = buildingById(r.destId);
      const a = buildingAnchor(b, v.baySlot);
      v.wx = a.x; v.wy = a.y;
      if (r.destStatus === "refurb") {
        // refurb days already set at end of SF
        if (v.refurbLeft <= 0) {
          v.status = "in_bay";
        }
        log(`${v.name} in Mega Bay for post-fire refurb (${v.refurbLeft}d)`, "warn");
      } else {
        log(`${v.name} on pad — static fire when ready`, "good");
      }
      G.rollout = null;
      sfxReady();
      updateObjectives();
      renderChrome();
    }
  }

  function weatherOn(day) {
    const table = [
      { sky: "Clear", wind: 8, storm: false },
      { sky: "Clear", wind: 12, storm: false },
      { sky: "Wind", wind: 24, storm: false },
      { sky: "Clear", wind: 10, storm: false },
      { sky: "Storm", wind: 36, storm: true },
      { sky: "Wind", wind: 22, storm: false },
      { sky: "Clear", wind: 6, storm: false },
      { sky: "Clear", wind: 14, storm: false },
      { sky: "Wind", wind: 26, storm: false },
      { sky: "Storm", wind: 32, storm: true },
    ];
    return table[((day - 1) % table.length + table.length) % table.length];
  }

  function merlinFreshKn() {
    return Math.round(TUNING.MERLIN_THRUST_KN * (G.merlinTier >= 2 ? TUNING.MERLIN_UP_MULT : 1));
  }

  function merlinNowKn(v) {
    const fires = v && v.fires ? v.fires : 0;
    return Math.round(merlinFreshKn() * (1 - TUNING.SF_WEAR_PER_FIRE * fires));
  }

  function padLimits(pad) {
    const l2 = pad && pad.level >= 2;
    return {
      thrust: l2 ? TUNING.PAD_THRUST_L2 : TUNING.PAD_THRUST_L1,
      wind: l2 ? TUNING.WIND_LIMIT_L2 : TUNING.WIND_LIMIT_L1,
    };
  }

  // The range lamp and the fire share this check so the two cannot drift.
  function rangeShut(storm, wind, windLimit) {
    return !!(storm || wind > windLimit);
  }

  // Numbers in, one word out. Same inputs always return the same word.
  // fireVerdict(340, 400, 80, 8, 12, 20, false) is "hold".
  // fireVerdict(340, 400, 80, 8, 24, 20, false) is "weather".
  function fireVerdict(thrust, padThrust, prop, need, wind, windLimit, storm) {
    if (rangeShut(storm, wind, windLimit)) return "weather";
    if (prop < need) return "propellant";
    if (thrust > padThrust) return "pad";
    if (thrust < TUNING.SF_THRUST_BAR_KN) return "engine";
    return "hold";
  }

  // Condition and refurb days after a fire. The caller writes the vehicle.
  function sfNext(success, condition, refurbDaysOk, refurbDaysFail, padLevel) {
    if (success) {
      const cut = padLevel >= 2 ? 1 : 0;
      return {
        scrap: false,
        status: "needs_return",
        condition: Math.max(0, condition - TUNING.SF_OK_CONDITION),
        refurbLeft: Math.max(1, refurbDaysOk - cut),
      };
    }
    const next = condition - TUNING.SF_MISS_CONDITION;
    if (next < TUNING.SCRAP_FLOOR) {
      return { scrap: true, status: "destroyed", condition: 0, refurbLeft: 0 };
    }
    return {
      scrap: false,
      status: "needs_return",
      condition: next,
      refurbLeft: refurbDaysFail,
    };
  }

  function fireCheck(v, pad) {
    const sky = weatherOn(G.day);
    const limits = padLimits(pad);
    const thrust = merlinNowKn(v);
    const need = rocketOf(v.rocketId).sfProp;
    const word = fireVerdict(thrust, limits.thrust, G.prop, need, sky.wind, limits.wind, sky.storm);
    const lines = [
      `Thrust today ${thrust} kN. The fire needs ${TUNING.SF_THRUST_BAR_KN} kN.`,
      `Pad accepts ${limits.thrust} kN and wind up to ${limits.wind} knots.`,
      `Propellant ${G.prop}. This fire draws ${need}.`,
      `${sky.sky}, ${sky.wind} knots.`,
    ];
    return {
      ok: word === "hold",
      limiter: word === "hold" ? null : word,
      lines, thrust, need, sky, limits,
    };
  }

  function staticFire() {
    audioInit();
    const pad = buildingOfType("pad_orbital");
    if (!pad) { sfxErr(); log("Need pad", "bad"); return; }
    const v = padHold();
    if (!v || v.status !== "on_pad") { sfxErr(); log("Need a vehicle on the pad", "bad"); return; }
    if (G.event || G.rollout) { log("Busy", "warn"); return; }
    const r = rocketOf(v.rocketId);
    const check = fireCheck(v, pad);
    check.lines.forEach((line) => log(line, "info"));
    if (!check.ok && (check.limiter === "weather" || check.limiter === "propellant")) {
      sfxErr();
      log(check.limiter === "weather"
        ? "Range is closed. Wait for a calmer day."
        : `Need ${check.need} propellant.`, "bad");
      renderChrome();
      return;
    }
    G.prop -= check.need;
    log(check.ok
      ? `STATIC FIRE · ${v.name} · thrust holds · −${check.need} prop`
      : `STATIC FIRE · ${v.name} · ${check.limiter} is short · −${check.need} prop`, check.ok ? "good" : "bad");
    startEventSF(v, pad, r, check.need, check.ok, check);
    renderChrome();
  }

  // ── Close-up event ──
  const eventStage = document.getElementById("event-stage");
  const eventCanvas = document.getElementById("event-canvas");
  const ectx = eventCanvas.getContext("2d");
  const elEvent = {
    title: document.getElementById("event-title"),
    phase: document.getElementById("event-phase"),
    caption: document.getElementById("event-caption"),
    skip: document.getElementById("event-skip"),
  };

  function startEventSF(v, pad, r, spent, success, check) {
    const ph = r.sfPhases;
    const phases = success
      ? [
          { id: "approach", label: "Camera · approach", dur: ph.approach },
          { id: "chill", label: "Engine chill", dur: ph.chill },
          { id: "ignition", label: r.engines === 9 ? "9-engine ignition" : "Ignition", dur: ph.ignition },
          { id: "burn", label: "Full burn", dur: ph.burn },
          { id: "shutdown", label: "Shutdown", dur: ph.shutdown },
          { id: "debrief", label: "Stable · hold-downs OK", dur: ph.debrief },
        ]
      : [
          { id: "approach", label: "Camera · approach", dur: ph.approach * 0.9 },
          { id: "chill", label: "Engine chill", dur: ph.chill * 0.85 },
          { id: "ignition", label: "Ignition", dur: ph.ignition },
          { id: "anomaly", label: "ANOMALY · RUD / engine fail", dur: 1.6 },
          { id: "fail", label: "Range safe · vehicle compromised", dur: 1.4 },
        ];
    G.event = {
      kind: "static_fire",
      vehicleId: v.id,
      rocketId: r.id,
      sfStyle: r.sfStyle,
      padLevel: pad.level,
      success,
      limiter: success ? null : check.limiter,
      spent,
      t: 0, phaseIdx: 0, phaseT: 0,
      phases,
      done: false,
      particles: [],
      _ign: false, _rumble: false, _failSfx: false,
    };
    G.flameUntil = performance.now() + (success ? 1000 : 1600);
    sfxSF(r.sfStyle);
    elEvent.phase.classList.remove("fail");
    openEvent(
      `Static fire · ${v.name}`,
      phases[0].label,
      success
        ? `${r.name} · thrust ${check.thrust} kN holds · ${check.sky.sky}`
        : `${r.name} · the ${check.limiter} is short`
    );
  }

  function openEvent(title, phase, cap) {
    elEvent.title.textContent = title;
    elEvent.phase.textContent = phase;
    elEvent.caption.textContent = cap;
    eventStage.classList.add("open");
    eventStage.setAttribute("aria-hidden", "false");
    resizeEventCanvas();
  }
  function closeEvent() {
    eventStage.classList.remove("open");
    eventStage.setAttribute("aria-hidden", "true");
    stopRumble();
  }

  function applySfOutcome() {
    const ev = G.event;
    if (!ev) return;
    const v = vehicleById(ev.vehicleId);
    const r = rocketOf(ev.rocketId);
    if (!v) return;
    G.objectives.static_fire = true;
    v.fires = (v.fires || 0) + 1;
    const pad = buildingOfType("pad_orbital");
    const next = sfNext(ev.success, v.condition, r.refurbDaysOk, r.refurbDaysFail, pad ? pad.level : 1);
    v.status = next.status;
    v.condition = next.condition;
    if (next.scrap) {
      v.buildingId = null;
      sfxFail();
      log(`${v.name} is below the condition floor of ${TUNING.SCRAP_FLOOR}. The core is scrap. The ${ev.limiter} was short.`, "bad");
    } else if (ev.success) {
      v.refurbLeft = next.refurbLeft;
      sfxOk();
      log(`${v.name} held. Return it to the Mega Bay for ${v.refurbLeft} days of refurb. Thrust next fire ${merlinNowKn(v)} kN.`, "good");
    } else {
      v.refurbLeft = next.refurbLeft;
      sfxFail();
      log(`${v.name} failed because the ${ev.limiter} was short. Condition ${v.condition}. Refurb ${v.refurbLeft} days. Scrap floor is ${TUNING.SCRAP_FLOOR}.`, "bad");
    }
  }

  function finishEvent() {
    if (!G.event) return;
    applySfOutcome();
    G.event = null;
    closeEvent();
    updateObjectives();
    renderChrome();
  }

  function skipEvent() {
    if (!G.event) { closeEvent(); return; }
    stopRumble();
    G.event.done = true;
    finishEvent();
  }
  elEvent.skip.addEventListener("click", skipEvent);

  function resizeEventCanvas() {
    const d = Math.min(window.devicePixelRatio || 1, 2);
    const rect = eventCanvas.getBoundingClientRect();
    const w = Math.max(320, Math.floor(rect.width));
    const h = Math.max(200, Math.floor(rect.height));
    eventCanvas.width = w * d; eventCanvas.height = h * d;
    ectx.setTransform(d, 0, 0, d, 0, 0);
    G._ew = w; G._eh = h;
  }

  function updateEvent(dt) {
    const ev = G.event;
    if (!ev) return;
    ev.t += dt; ev.phaseT += dt;
    const phase = ev.phases[ev.phaseIdx];
    const pid = phase ? phase.id : "debrief";

    if ((pid === "ignition" || pid === "burn") && !ev._ign) {
      ev._ign = true; sfxIgn(ev.sfStyle);
    }
    if ((pid === "ignition" || pid === "burn") && !ev._rumble) {
      ev._rumble = true; startRumble(ev.sfStyle);
    }
    if ((pid === "anomaly" || pid === "fail" || pid === "shutdown" || pid === "debrief") && ev._rumble) {
      stopRumble(); ev._rumble = false;
    }
    if ((pid === "anomaly" || pid === "fail") && !ev._failSfx) {
      ev._failSfx = true; sfxFail();
      elEvent.phase.classList.add("fail");
    }

    if (!ev.done && phase && ev.phaseT >= phase.dur) {
      ev.phaseT = 0;
      ev.phaseIdx++;
      if (ev.phaseIdx >= ev.phases.length) {
        ev.done = true;
        ev.phaseIdx = ev.phases.length - 1;
        elEvent.phase.textContent = ev.phases[ev.phaseIdx].label;
        const snap = ev;
        setTimeout(() => { if (G.event === snap) finishEvent(); }, 450);
      } else {
        elEvent.phase.textContent = ev.phases[ev.phaseIdx].label;
        if (ev.phases[ev.phaseIdx].id === "anomaly" || ev.phases[ev.phaseIdx].id === "fail")
          elEvent.phase.classList.add("fail");
      }
    }

    const rate = pid === "anomaly" ? 14 : (ev.sfStyle === "merlin_nine" ? 5 : 2);
    if (pid === "ignition" || pid === "burn" || pid === "anomaly") {
      for (let i = 0; i < rate; i++) {
        ev.particles.push({
          x: (Math.random() - 0.5) * (pid === "anomaly" ? 90 : 50),
          y: pid === "anomaly" ? -20 - Math.random() * 40 : 0,
          vx: (Math.random() - 0.5) * (pid === "anomaly" ? 120 : 40),
          vy: pid === "anomaly" ? -40 - Math.random() * 80 : 50 + Math.random() * 80,
          life: 0.25 + Math.random() * 0.5,
          r: 3 + Math.random() * 8,
          hot: Math.random() > 0.3,
        });
      }
    }
    for (const p of ev.particles) {
      p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (pid === "anomaly" ? 20 : 50) * dt;
    }
    ev.particles = ev.particles.filter((p) => p.life > 0);
    drawEvent();
  }

  function drawEvent() {
    const ev = G.event;
    if (!ev) return;
    const W = G._ew || 900, H = G._eh || 500;
    const r = rocketOf(ev.rocketId);
    ectx.clearRect(0, 0, W, H);
    const g = ectx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#152030"); g.addColorStop(0.55, "#2a3848"); g.addColorStop(1, "#3a4840");
    ectx.fillStyle = g; ectx.fillRect(0, 0, W, H);

    const cx = W * 0.5, groundY = H * 0.78;
    const phase = ev.phases[ev.phaseIdx];
    const pid = phase ? phase.id : "debrief";
    const zoom = pid === "approach" ? 0.85 + 0.15 * clamp(ev.phaseT / 1, 0, 1) : 1;

    ectx.fillStyle = "#4a453c"; ectx.fillRect(0, groundY, W, H - groundY);
    const trenchW = (ev.padLevel >= 2 ? 150 : 95) * zoom;
    ectx.fillStyle = "#1a1a20";
    ectx.fillRect(cx - trenchW / 2, groundY + 6, trenchW, 28 * zoom);
    const olmH = (ev.padLevel >= 2 ? 70 : 48) * zoom;
    ectx.fillStyle = "#9aa0a8";
    ectx.fillRect(cx - 18 * zoom, groundY - olmH, 36 * zoom, olmH);

    const base = groundY - olmH;
    const broken = pid === "anomaly" || pid === "fail" || (!ev.success && ev.done);
    drawCloseupRocket(ectx, cx, base, zoom, r, pid, broken, ev);

    if (pid === "chill" || pid === "ignition" || pid === "burn" || pid === "shutdown") {
      drawPlume(ectx, cx, base + 4, zoom, r, pid, ev, 1);
    }
    if (pid === "anomaly") {
      drawPlume(ectx, cx, base + 4, zoom, r, pid, ev, 1.4);
      // fireball
      ectx.fillStyle = "rgba(255,120,40,0.55)";
      ectx.beginPath();
      ectx.arc(cx + Math.sin(ev.t * 20) * 8, base - 40, 50 + Math.sin(ev.t * 15) * 10, 0, Math.PI * 2);
      ectx.fill();
      ectx.fillStyle = "rgba(255,200,80,0.4)";
      ectx.beginPath();
      ectx.arc(cx, base - 55, 28, 0, Math.PI * 2);
      ectx.fill();
    }

    for (const p of ev.particles) {
      ectx.globalAlpha = clamp(p.life * 2, 0, 1);
      ectx.fillStyle = p.hot ? "#ff9a3a" : "#ffcc66";
      ectx.beginPath();
      ectx.arc(cx + p.x, base + 10 + p.y, p.r, 0, Math.PI * 2);
      ectx.fill();
      ectx.globalAlpha = 1;
    }

    ectx.fillStyle = "rgba(0,0,0,0.5)";
    ectx.fillRect(12, 12, 260, 58);
    ectx.fillStyle = "#e8d9b0";
    ectx.font = "600 13px system-ui";
    ectx.fillText(rocketOf(ev.rocketId).name.toUpperCase(), 22, 32);
    ectx.font = "11px ui-monospace, monospace";
    ectx.fillStyle = ev.success || pid === "approach" || pid === "chill" ? "#d4a84b" : "#e08070";
    ectx.fillText(ev.success ? `Thrust holds · ${pid.toUpperCase()}` : `${ev.limiter || "short"} · ${pid.toUpperCase()}`, 22, 50);

    ectx.fillStyle = "rgba(0,0,0,0.5)";
    ectx.fillRect(W - 160, 12, 148, 40);
    ectx.fillStyle = "#8fbc6a";
    ectx.font = "11px ui-monospace, monospace";
    ectx.fillText(`PROP −${ev.spent}`, W - 148, 36);

    if (pid === "debrief" && ev.success) {
      ectx.fillStyle = "rgba(20,40,24,0.8)";
      ectx.fillRect(W / 2 - 120, 22, 240, 36);
      ectx.fillStyle = "#8fbc6a"; ectx.font = "600 14px system-ui"; ectx.textAlign = "center";
      ectx.fillText("ENGINES STABLE", W / 2, 46); ectx.textAlign = "left";
    }
    if (pid === "fail" || (broken && pid === "anomaly" && ev.phaseT > 0.8)) {
      ectx.fillStyle = "rgba(50,16,16,0.85)";
      ectx.fillRect(W / 2 - 130, 22, 260, 36);
      ectx.fillStyle = "#e07070"; ectx.font = "600 14px system-ui"; ectx.textAlign = "center";
      ectx.fillText("STATIC FIRE FAILURE", W / 2, 46); ectx.textAlign = "left";
    }
    drawEventRange(W, H);
  }

  function drawEventRange(W, H) {
    const x = 16, y = H - 78, w = 220, h = 62;
    ectx.fillStyle = "rgba(0,0,0,0.72)";
    ectx.fillRect(x, y, w, h);
    ectx.strokeStyle = "#e10600";
    ectx.strokeRect(x, y, w, h);
    ectx.beginPath();
    ectx.moveTo(x + 18, y + 48);
    ectx.quadraticCurveTo(x + 90, y + 36, x + 190, y + 14);
    ectx.stroke();
    const pitch = G.event ? Math.max(26, 90 - G.event.t * 14) : 90;
    const endLon = PAD_LON + 50 / (111.32 * Math.cos(PAD_LAT * Math.PI / 180));
    ectx.fillStyle = "#f2f2f2";
    ectx.font = "11px ui-monospace, monospace";
    ectx.fillText(`${PAD_LAT.toFixed(3)}° N  heading 90°  pitch ${pitch.toFixed(0)}°`, x + 8, y + 14);
    ectx.fillText(`Gulf track to ${Math.abs(endLon).toFixed(2)}° W`, x + 8, y + 28);
  }

  function drawCloseupRocket(c, cx, baseY, zoom, r, pid, broken, ev) {
    const nine = r.sfStyle === "merlin_nine";
    const scale = (nine ? 1.18 : 0.95) * zoom;
    const bw = (nine ? 32 : 22) * scale;
    const bh = (nine ? 120 : 85) * scale;
    const shipH = (nine ? 95 : 68) * scale;
    const tilt = broken ? Math.sin(ev.t * 8) * 0.15 + 0.2 : 0;
    c.save();
    c.translate(cx, baseY);
    c.rotate(tilt);
    c.translate(-cx, -baseY);
    const x = cx - bw / 2;
    const yBoost = baseY - bh;
    const yShip = yBoost - shipH;
    if (broken && pid === "fail") {
      // debris-ish short stack
      c.fillStyle = "#666";
      c.fillRect(x + 4, yBoost + bh * 0.4, bw - 8, bh * 0.35);
    } else {
      c.fillStyle = r.color;
      c.fillRect(x + 3, yShip, bw - 6, shipH);
      c.beginPath();
      c.moveTo(cx, yShip - 20 * scale);
      c.lineTo(x + 3, yShip); c.lineTo(x + bw - 3, yShip); c.closePath();
      c.fill();
      c.fillStyle = nine ? "#e4eaf0" : "#c5ccd4";
      c.fillRect(x, yBoost, bw, bh);
      c.fillStyle = "#3a4048";
      if (nine) {
        for (let row = 0; row < 3; row++)
          for (let col = 0; col < 3; col++) {
            c.beginPath();
            c.arc(cx + (col - 1) * 11 * scale, baseY - 2, 4 * scale, 0, Math.PI * 2);
            c.fill();
          }
      } else {
        c.beginPath(); c.arc(cx, baseY - 2, 6 * scale, 0, Math.PI * 2); c.fill();
      }
    }
    c.restore();
  }

  function drawPlume(c, cx, baseY, zoom, r, pid, ev, mult) {
    const nine = r.sfStyle === "merlin_nine";
    const intensity = pid === "chill" ? 0.2 : pid === "ignition" ? 0.7 : pid === "shutdown" ? 0.3 : 1;
    const n = Math.floor((nine ? 14 : 7) * intensity * mult) + 2;
    for (let i = 0; i < n; i++) {
      const ox = Math.sin(ev.t * 11 + i) * (nine ? 26 : 12) * zoom * intensity;
      const h = (18 + (i % 5) * 10) * zoom * intensity * mult;
      const grad = c.createLinearGradient(cx, baseY, cx, baseY + h + 40);
      grad.addColorStop(0, `rgba(255,220,120,${0.9 * intensity})`);
      grad.addColorStop(0.4, `rgba(255,100,30,${0.75 * intensity})`);
      grad.addColorStop(1, "rgba(40,40,40,0)");
      c.fillStyle = grad;
      c.beginPath();
      c.moveTo(cx + ox - 7 * zoom, baseY);
      c.lineTo(cx + ox, baseY + h + 20);
      c.lineTo(cx + ox + 7 * zoom, baseY);
      c.fill();
    }
  }

  function upgradePad() {
    audioInit();
    const pad = buildingById(G.selectedId);
    if (!pad || pad.type !== "pad_orbital") return;
    if (pad.level >= 2) { log("Pad already L2", "info"); return; }
    if (G.steel < TUNING.PAD_L2_COST) { sfxErr(); log(`Need ${TUNING.PAD_L2_COST} steel`, "bad"); return; }
    G.steel -= TUNING.PAD_L2_COST;
    pad.level = 2;
    sfxUp();
    log("Pad L2 — wider trench, taller OLM, +SF reliability", "good");
    updateObjectives();
    renderChrome();
  }

  function updateObjectives() {
    G.objectives.place_all = BUILD_ORDER.every((t) => countType(t) >= 1);
    if (liveFleet().length) G.objectives.build_rocket = true;
    if (bayCount() >= 2) G.objectives.multi_bay = true;
    const pad = buildingOfType("pad_orbital");
    G.objectives.pad_l2 = !!(pad && pad.level >= 2);
    renderObjectives();
  }

  // ── Chrome ──
  function renderResources() {
    el.steel.textContent = Math.floor(G.steel);
    el.prop.textContent = Math.floor(G.prop);
    el.fleet.textContent = liveFleet().length;
    el.day.textContent = "Day " + G.day;
  }

  function plotSqft(plot) {
    const mid = (plot.north + plot.south) / 2 * Math.PI / 180;
    const metersH = (plot.north - plot.south) * 110540;
    const metersW = (plot.east - plot.west) * 111320 * Math.cos(mid);
    return metersH * metersW * 10.76391041671;
  }
  function fmtSqft(n) {
    const acres = n / 43560;
    const acresLabel = acres >= 100 ? Math.round(acres).toLocaleString("en-US") : acres.toFixed(1);
    return acresLabel + " acres · " + Math.round(n).toLocaleString("en-US") + " sq ft";
  }
  function renderPalette() {
    const ownedSq = Object.keys(PLOTS).reduce((sum, id) => sum + (G.plots[id] ? plotSqft(PLOTS[id]) : 0), 0);
    const offers = Object.keys(PLOTS).filter((id) => !G.plots[id]).map((id) => {
      const plot = PLOTS[id];
      return `<button type="button" class="ui-btn rounded p-2 text-left text-[11px] w-full" data-plot="${id}">
        <div class="font-semibold">${esc(plot.name)}</div>
        <div>${fmtSqft(plotSqft(plot))}</div>
        <div>${plot.cost} steel</div>
      </button>`;
    }).join("");
    el.palette.innerHTML = `<div class="px-1 pb-2 text-[11px]">Owned<br><b>${fmtSqft(ownedSq)}</b></div>` + offers;
    el.palette.querySelectorAll("[data-plot]").forEach((btn) => {
      btn.addEventListener("click", () => buyPlot(btn.getAttribute("data-plot")));
    });
  }

  function renderFleetList() {
    const list = liveFleet();
    if (!list.length) {
      el.fleetList.innerHTML = `<p class="text-amber-200/45">No vehicles yet. Build at Starfactory.</p>`;
      return;
    }
    el.fleetList.innerHTML = list.map((v) => {
      const r = rocketOf(v.rocketId);
      const sel = v.id === G.selectedVehicleId ? "sel" : "";
      let loc = v.status;
      if (v.status === "in_bay") loc = `bay slot ${(v.baySlot || 0) + 1}`;
      if (v.status === "at_factory") loc = "factory hold";
      if (v.status === "on_pad" || v.status === "needs_return") loc = "pad";
      if (v.status === "refurb") loc = `bay refurb ${v.refurbLeft}d`;
      if (v.status === "rolling") loc = "on road";
      return `<div class="fleet-row ${sel}" data-vid="${v.id}">
        <div class="font-semibold text-amber-100">${esc(v.name)} <span class="text-amber-200/50">${esc(r.short)}</span></div>
        <div class="meta">${esc(loc)} · cond ${Math.round(v.condition)}%</div>
      </div>`;
    }).join("");
    el.fleetList.querySelectorAll("[data-vid]").forEach((row) => {
      row.addEventListener("click", () => {
        sfxUi();
        G.selectedVehicleId = +row.getAttribute("data-vid");
        const v = selectedVehicle();
        if (v && v.buildingId) G.selectedId = v.buildingId;
        renderChrome();
      });
    });
  }

  function renderInspector() {
    const box = el.inspector;
    if (G.placeType) {
      const d = defOf(G.placeType);
      box.innerHTML = `<div class="text-amber-200 font-semibold">Placing: ${esc(d.name)}</div>
        <p class="text-amber-200/60">${esc(d.blurb)}</p>
        <button type="button" class="ui-btn rounded px-2 py-1 text-[11px]" id="btn-x">Cancel</button>`;
      box.querySelector("#btn-x").onclick = () => {
        G.placeType = null; canvas.classList.remove("placing"); renderPalette(); renderInspector();
      };
      return;
    }

    const b = buildingById(G.selectedId);
    if (!b) {
      box.innerHTML = `<p class="text-amber-200/55">Select the factory, the bay, or the pad.</p>
        <p class="text-amber-200/40 mt-2">Falcon 1 only. The fire holds when thrust, the pad, propellant, and the sky all clear.</p>`;
      return;
    }
    const d = defOf(b.type);
    let html = `<div class="text-amber-100 font-semibold">${esc(d.name)} <span class="text-amber-200/50">L${b.level}</span></div>
      <p class="text-amber-200/55">${esc(d.blurb)}</p>`;

    if (b.type === "starfactory") {
      html += `<p class="text-amber-200/45 mt-1">Hold: 1 finished vehicle max until staged to bay.</p>`;
      html += `<p class="text-amber-100/90 mt-1">Merlin tier ${G.merlinTier}. Thrust ${merlinFreshKn()} kN fresh. Impulse ${TUNING.MERLIN_ISP_S} s. Mass ${TUNING.MERLIN_MASS_KG} kg. Restarts ${TUNING.MERLIN_RESTARTS}.</p>
        <p class="text-amber-200/45">Impulse and mass are on the card. This test uses thrust.</p>`;
      if (G.factoryJob) {
        const pct = 1 - G.factoryJob.daysLeft / G.factoryJob.totalDays;
        const label = G.factoryJob.kind === "merlin" ? "Merlin thrust upgrade" : rocketOf(G.factoryJob.rocketId).name;
        html += `<p class="mt-2">Building <b>${esc(label)}</b> · ${G.factoryJob.daysLeft}d</p>
          <div class="bar-track"><i style="width:${Math.round(pct * 100)}%"></i></div>`;
      } else {
        const r = rocketOf("falcon1");
        const busy = !!(G.factoryJob || factoryHold() || G.event || G.rollout);
        html += `<button type="button" class="ui-btn good rounded px-2 py-1.5 text-[11px] w-full mt-1 text-left" data-rocket="falcon1" ${busy || G.steel < r.steelCost ? "disabled" : ""}>
            <div class="font-semibold">Build Falcon 1 · ${r.steelCost} steel</div>
            <div class="text-amber-200/50">${r.buildDays} days · fire draws ${r.sfProp} propellant</div>
          </button>`;
        if (G.merlinTier < 2) {
          html += `<button type="button" class="ui-btn rounded px-2 py-1.5 text-[11px] w-full mt-1 text-left" id="btn-merlin" ${busy || G.steel < TUNING.MERLIN_UP_COST ? "disabled" : ""}>
            <div class="font-semibold">Raise Merlin thrust · ${TUNING.MERLIN_UP_COST} steel</div>
            <div class="text-amber-200/50">${TUNING.MERLIN_UP_DAYS} days · thrust becomes ${Math.round(TUNING.MERLIN_THRUST_KN * TUNING.MERLIN_UP_MULT)} kN</div>
          </button>`;
        }
        html += `<p class="text-amber-200/40 mt-2 text-[10px]">Later: Falcon 9, Falcon Heavy, Starship.</p>`;
      }
      const hold = factoryHold();
      if (hold) {
        html += `<p class="mt-2 text-amber-100">● ${esc(hold.name)} ready</p>
          <button type="button" class="ui-btn good rounded px-2 py-1.5 text-[11px] w-full mt-1" id="btn-stage">Stage to Mega Bay</button>`;
      }
    }

    if (b.type === "mega_bay") {
      const n = bayCount();
      html += `<p class="text-amber-200/70 mt-1">Housed: <b>${n}/${TUNING.BAY_CAPACITY}</b> articles (hangar capacity)</p>
        <p class="text-amber-200/45">Vehicles park in bay slots (visual). Post-fire refurb happens here — not on the pad.</p>`;
      const here = vehiclesAt(b.id);
      if (here.length) {
        html += `<div class="mt-2 space-y-1">`;
        for (const v of here) {
          const r = rocketOf(v.rocketId);
          html += `<div class="text-amber-100/90">· ${esc(v.name)} (${esc(r.short)}) · ${v.status}${v.status === "refurb" ? ` ${v.refurbLeft}d` : ""} · ${Math.round(v.condition)}%</div>`;
        }
        html += `</div>`;
      }
      const v = selectedVehicle();
      if (v && v.status === "in_bay") {
        html += `<button type="button" class="ui-btn good rounded px-2 py-1.5 text-[11px] w-full mt-2" id="btn-topad">Roll ${esc(v.name)} to pad</button>`;
      } else {
        html += `<p class="text-amber-200/40 mt-2">Select a ready vehicle in Fleet (in bay) to roll out.</p>`;
      }
    }

    if (b.type === "pad_orbital") {
      const on = padHold();
      if (on) {
        const r = rocketOf(on.rocketId);
        html += `<p class="mt-2 text-amber-100">● ${esc(on.name)} on pad · condition ${Math.round(on.condition)} · fires ${on.fires || 0}</p>`;
        if (on.status === "on_pad") {
          const check = fireCheck(on, b);
          html += check.lines.map((line) => `<p class="text-amber-200/70">${esc(line)}</p>`).join("");
          html += `<p class="text-amber-200/50">Scrap floor ${TUNING.SCRAP_FLOOR}. A miss costs ${TUNING.SF_MISS_CONDITION} condition.</p>
            <button type="button" class="ui-btn good rounded px-2 py-1.5 text-[11px] w-full mt-1" id="btn-sf">${check.ok ? "Static fire" : "Try static fire"} · ${r.sfProp} propellant</button>`;
        }
        if (on.status === "needs_return") {
          html += `<button type="button" class="ui-btn danger rounded px-2 py-1.5 text-[11px] w-full mt-1" id="btn-return">Return to Mega Bay (refurb)</button>
            <p class="text-amber-200/45 mt-1">Pad is not a hangar. Move indoors for inspection.</p>`;
        }
      } else {
        html += `<p class="text-amber-200/50 mt-2">Pad empty. Roll a bay-ready vehicle here.</p>`;
      }
      if (b.level < 2) {
        html += `<button type="button" class="ui-btn rounded px-2 py-1.5 text-[11px] w-full mt-2" id="btn-up">Upgrade pad level 2 · wider trench · ${TUNING.PAD_L2_COST} steel</button>`;
      } else {
        html += `<p class="text-amber-200/45 mt-2">Pad level 2 accepts ${TUNING.PAD_THRUST_L2} kN and wind up to ${TUNING.WIND_LIMIT_L2} knots. A clean refurb is one day shorter.</p>`;
      }
      if (G.rollout) {
        html += `<p class="text-amber-200/55 mt-1">Transport ETA ${(G.rollout.duration - G.rollout.t).toFixed(1)}s</p>`;
      }
    }

    box.innerHTML = html;
    box.querySelectorAll("[data-rocket]").forEach((btn) => {
      btn.onclick = () => startBuildRocket(btn.getAttribute("data-rocket"));
    });
    const mer = box.querySelector("#btn-merlin");
    if (mer) mer.onclick = startMerlinUpgrade;
    const st = box.querySelector("#btn-stage");
    if (st) st.onclick = () => stageToBay(factoryHold() && factoryHold().id);
    const tp = box.querySelector("#btn-topad");
    if (tp) tp.onclick = () => startRoll(G.selectedVehicleId, "pad");
    const sf = box.querySelector("#btn-sf");
    if (sf) sf.onclick = staticFire;
    const ret = box.querySelector("#btn-return");
    if (ret) ret.onclick = () => startRoll(padHold() && padHold().id, "bay");
    const up = box.querySelector("#btn-up");
    if (up) up.onclick = upgradePad;
  }

      ["pad_l2", "Upgrade the pad"],
    ];
    el.objectives.innerHTML = items.map(([k, label]) => {
      const done = G.objectives[k];
      return `<li class="${done ? "obj-done" : ""}">${done ? "✓" : "○"} ${esc(label)}</li>`;
    }).join("");
